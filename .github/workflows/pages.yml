name: Build & deploy the dojos to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The shared runtime is unit-tested before any course is built, because a
      # bug here breaks all three at once.
      - name: Test the shared engine
        run: node --test engine/test/engine.test.js

      # Every course is gated on their own content-integrity check before
      # anything is published. A failure here fails the deploy.
      - name: Verify DevDojo content
        run: node scripts/verify.js
      # Run the ROOT verifier for every course, passing the course directory as
      # an argument. Using working-directory instead resolved to a course-local
      # COPY of verify.js, and those copies were stale: they tested each regex
      # against the raw e.solution, with none of the comment-stripping, inert-code
      # or t.raw handling the real grader has. Two of three courses were graded by
      # a verifier that no longer matched production.
      - name: Verify IdentityDojo content
        run: node scripts/verify.js identity-dojo
      - name: Verify JSDojo content
        run: node scripts/verify.js js-dojo

      # Third gate: every exercise that ships a run spec is EXECUTED against its
      # own reference solution, exactly as the in-browser worker would. The two
      # gates above cannot see an executed exercise whose cases disagree with its
      # own solution — this one found four that had shipped.
      - name: Execute every graded exercise against its own solution
        run: node scripts/verify-exec.js

      # Fourth gate: COMPILE every self-contained Java reference solution. The
      # other three never compile Java at all — 331 exercises are graded by
      # regex, so a model answer with a syntax error would ship as the answer.
      # Pinned to 21 so records, sealed types and text blocks parse.
      - name: Set up a JDK for the Java compile gate
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile every Java reference solution
        run: node scripts/verify-java.js

      # Fifth gate: is any lesson too thin for the course it sits in? The floor
      # is half the course MEDIAN — see the header of the script for why the
      # mean was the wrong middle.
      - name: Check lesson depth
        run: node scripts/verify-depth.js

      # Sixth gate: the cloud-native path. The five crash courses build with
      # their own pipeline (markdown -> one interactive HTML file); this gate
      # checks the structure the builds depend on — every page file exists,
      # every page has quiz entries and every quiz entry is well-formed, and
      # the markdown Next-links agree with the built sidebar order.
      - name: Verify the cloud-native path
        run: node scripts/verify-cloudnative.js

      # Seventh gate: colour contrast. Two of the brand hues are unusable as
      # text (violet #8b5cf6 is 4.23:1 on white, teal #0d9488 is 3.74:1), so the
      # token set carries a darker -ink twin for every hue and the rule is: raw
      # hue for fills and borders, -ink for text. This reads the tokens straight
      # out of engine/styles.css and fails the build if any declared pairing
      # drops under WCAG AA, so a palette edit can never make text unreadable.
      - name: Check colour contrast
        run: node scripts/verify-contrast.js

      - name: Build DevDojo
        run: node build.js
      - name: Build IdentityDojo
        run: node build.js
        working-directory: identity-dojo
      - name: Build JSDojo
        run: node build.js
        working-directory: js-dojo
      - name: Build the cloud-native courses
        run: |
          python3 fundamentals-crash-course/web/build.py
          python3 docker-crash-course/web/build.py
          python3 kubernetes-crash-course/web/build.py
          python3 envoy-crash-course/web/build.py
          python3 istio-crash-course/web/build.py

      # Gate 10. A correct answer that is conspicuously the longest option is
      # answerable without knowing the material. The budget only ever comes down.
      - name: Verify quiz options are not length-biased
        run: node scripts/verify-quiz-balance.js

      # Gate 11. Same failure from a different angle: if the right answer is
      # almost always slot B, the quiz measures pattern-spotting, not learning.
      - name: Verify correct answers are spread across the options
        run: node scripts/verify-quiz-answer-spread.js

      # Gate 12. The stat block on the home page is a claim about the work. It
      # said 420 lessons while the dojos held 529, which is the kind of detail a
      # reader checks. Recompute from the content and fail on drift.
      - name: Verify the home page stats match the content
        run: node scripts/verify-stats.js

      # Gate 13. The published surface is written under Ron's name, so it holds
      # to the same rules as a blog post: no em dashes, no British spellings, no
      # LLM filler, no leftover placeholders. Prose only, code is exempt.
      - name: Verify the published prose reads like Ron wrote it
        run: |
          python3 scripts/verify-voice-content.py \
            docs/home.html docs/landing.html skills-rubric.html \
            content/streams/*.js identity-dojo/content/streams/*.js \
            js-dojo/content/streams/*.js posts/*.md \
            fundamentals-crash-course/web/*.md docker-crash-course/web/*.md \
            kubernetes-crash-course/web/*.md envoy-crash-course/web/*.md \
            istio-crash-course/web/*.md

      # One Pages site. The root is the roniam.dev portfolio home plus the blog
      # (both emitted by scripts/build-blog.js from blog/*.md and docs/home.html);
      # each course keeps its own path, and the old course landing survives at
      # /courses/. Adding a course = one build step + one copy line.
      - name: Assemble the site
        run: |
          mkdir -p _site/dev _site/identity _site/js _site/courses _site/ml _site/authlint \
                   _site/fundamentals _site/docker _site/kubernetes _site/envoy _site/istio
          node scripts/build-blog.js _site
          cp docs/landing.html                       _site/courses/index.html
          cp dist/index.html                         _site/dev/index.html
          cp identity-dojo/dist/index.html           _site/identity/index.html
          cp js-dojo/dist/index.html                 _site/js/index.html
          cp fundamentals-crash-course/index.html    _site/fundamentals/index.html
          cp docker-crash-course/index.html          _site/docker/index.html
          cp kubernetes-crash-course/index.html      _site/kubernetes/index.html
          cp envoy-crash-course/index.html           _site/envoy/index.html
          cp istio-crash-course/index.html           _site/istio/index.html
          # ML Dojo lives in its own repo; this is a tracked snapshot of its build
          cp ml-dojo/dist/index.html                 _site/ml/index.html
          # authlint likewise: github.com/rcbart/authlint, snapshot of its build
          cp authlint/dist/index.html                _site/authlint/index.html
          cp authlint/authlint-og.png                _site/authlint/authlint-og.png
          cp skills-rubric.html                      _site/skills-rubric.html
          # og:image referenced by the home page and every blog post
          mkdir -p _site/img
          cp docs/img/og.png                         _site/img/og.png
          test -s _site/index.html
          test -s _site/img/og.png
          test -s _site/skills-rubric.html
          test -s _site/blog/index.html
          test -s _site/courses/index.html
          test -s _site/dev/index.html
          test -s _site/identity/index.html
          test -s _site/js/index.html
          test -s _site/fundamentals/index.html
          test -s _site/docker/index.html
          test -s _site/kubernetes/index.html
          test -s _site/envoy/index.html
          test -s _site/istio/index.html
          test -s _site/ml/index.html
          test -s _site/authlint/index.html
          test -s _site/authlint/authlint-og.png
          ls -lh _site _site/blog _site/dev _site/identity _site/js

      # Gate 9. Content gates check what the source says. This one checks that
      # what we ship can actually run: every inline <script> in every built page
      # must parse. One invalid escape in a quiz option once shipped a page that
      # returned 200, weighed the right size, passed all eight gates, and
      # rendered a header with nothing under it.
      #
      # It runs AFTER assembly on purpose. Before, it only saw the pre-assembly
      # course builds - never the substituted home page and never a single built
      # blog page, all of which carry inline script and are what actually ships.
      - name: Verify every built page can run
        run: node scripts/verify-built.js

      # Gate 8. Every <loc> the sitemap advertises has to exist in the assembled
      # site, and the feed and robots.txt have to be there. A link the build
      # cannot resolve should break the build, not 404 quietly in production.
      - name: Verify the sitemap, feed and robots resolve
        run: node scripts/verify-sitemap.js _site

      # Gate 14. The sitemap gate proves the URLs we advertise exist. It says
      # nothing about the links inside the pages, which is the half that broke:
      # a section renamed, an id changed, a path that quietly stopped being
      # copied. This resolves every internal href in the assembled site,
      # fragments included, against the files actually about to ship.
      - name: Verify every internal link resolves
        run: python3 scripts/verify-links.py _site

      # Gate 17. verify-links.py above only sees the assembled site. The
      # crash-course markdown cross-links, README's relative links and the
      # image assets are read on GitHub and never deploy, so nothing checked
      # them. This resolves every repo-relative reference against the files
      # that are actually there.
      - name: Verify every repo-relative reference resolves
        run: node scripts/verify-internal-refs.js

      # Gate 15. authlint lives in its own repository; what is tracked here is
      # only the built artifact this workflow copies to /authlint/. That can
      # drift: fix a check over there, forget to refresh the snapshot here, and
      # the live tool quietly stays on the old build with nothing looking wrong.
      # So rebuild authlint from its own source and compare.
      - name: Verify the authlint snapshot matches its source
        run: node scripts/verify-authlint-snapshot.js

      # Gate 16. The home page says what you are reading has been through more
      # than ten revisions. That is a claim about the work, and a claim about
      # the work gets checked here rather than asserted. Every post recording a
      # revision count has to clear the floor, and the home page has to still be
      # making the claim, so it cannot be quietly dropped to make this pass.
      - name: Verify the revision claim is backed by the posts
        run: node scripts/verify-revisions.js

      # Gate 18. Publishing here is a git mv from blog/ into posts/, and the
      # drafts carry HTML comment blocks: open [ASK] markers, rulings on which
      # sentences are the author's, notes on what a named third party has
      # agreed to, and facts marked never-to-be-published. The builder strips
      # comments so none of it can reach a rendered page, but a silent strip
      # would mean a dirty file publishes and nobody finds out. This is the
      # half that tells you.
      - name: Verify no editorial apparatus reached a published post
        run: node scripts/verify-no-editorial.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
