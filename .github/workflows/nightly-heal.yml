# Nightly self-healing run.
#
# Runs the E2E suite; when it finds GENUINE failures (known-bug guards excluded),
# the agent tries to repair broken selectors with Claude, re-runs the affected
# specs, and either opens a PR with the fix or files a GitHub issue for failures
# it can't safely auto-heal. A healing report lands in the run summary.
#
# Without the ANTHROPIC_API_KEY secret the agent runs in dry-run (plan only).
name: nightly-heal

on:
  schedule:
    - cron: '23 9 * * *' # 02:23 Pacific, after any overnight deploy
  workflow_dispatch:

permissions:
  contents: write # to push a heal branch
  issues: write # to escalate un-healable failures
  pull-requests: write # to open the heal PR

jobs:
  heal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Capture failures instead of stopping the job — the agent needs the report.
      - name: Run E2E suite
        id: e2e
        continue-on-error: true
        run: npx playwright test

      - name: Self-heal
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx tsx agents/self-heal/heal.ts

      # If the agent rewrote a selector, open a PR with the change.
      - name: Open heal PR if selectors changed
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet -- tests/e2e/selectors.ts; then
            branch="heal/selectors-$(date +%Y%m%d-%H%M%S)"
            git config user.name  "dev-dojo-heal-bot"
            git config user.email "actions@github.com"
            git checkout -b "$branch"
            git add tests/e2e/selectors.ts
            git commit -m "test(e2e): self-heal drifted selector(s)

Auto-generated by the nightly self-healing agent. Review the selector
change against test-results/healing-report.md before merging.

Co-Authored-By: Claude <noreply@anthropic.com>"
            git push origin "$branch"
            gh pr create --fill --base main --head "$branch" \
              --title "test(e2e): self-heal drifted selectors" \
              --body-file test-results/healing-report.md
          else
            echo "No selector changes to propose."
          fi

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: heal-run
          path: |
            playwright-report/
            test-results/healing-report.md
          retention-days: 14
