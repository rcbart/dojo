# End-to-end (Playwright) gate.
#
# Builds the site, serves dist/ locally, and runs the browser suite against the
# code in the PR — so a change that breaks the grader UI or a core flow fails
# here before it can be deployed by pages.yml.
name: e2e

on:
  pull_request:
  push:
    branches-ignore: [main] # main is covered by the deploy workflow's gates
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The suite builds + serves the site itself (see playwright.config.ts).
      - name: Run E2E suite
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
