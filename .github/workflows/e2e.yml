# End-to-end (Playwright) suite.
#
# Builds the site, serves dist/ locally, and runs the browser suite against the
# code in the PR. Browser tests are the flakiest thing in any suite, so this
# lands ADVISORY (non-blocking): the run reports its results to the job summary
# and as annotations, but does not fail the check. Watch it be stable, then
# promote it to a gate.
#
# To promote to a hard gate: delete `continue-on-error: true` and the "Flag
# result" step below, then add this job to the branch's required status checks.
name: e2e

on:
  pull_request:
  push:
    branches-ignore: [main] # main is covered by the deploy workflow's gates
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The suite builds + serves the site itself (see playwright.config.ts).
      # The dojo reporter writes the findings dashboard to $GITHUB_STEP_SUMMARY,
      # so every run shows the live/fixed status of each tracked finding inline.
      # continue-on-error keeps this advisory until it's promoted to a gate.
      - name: Run E2E suite
        id: e2e
        continue-on-error: true
        run: npx playwright test

      - name: Flag result (advisory)
        if: ${{ steps.e2e.outcome == 'failure' }}
        run: echo "::warning title=E2E advisory::The E2E suite reported failures — see the run summary. This check is non-blocking until promoted to a gate."

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload findings report (dashboard, JUnit, trends)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: findings-report
          path: |
            test-results/report.md
            test-results/findings.json
            test-results/junit.xml
          retention-days: 30
