<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envoy Crash Course</title>
<style>
  :root{
    /* Aligned with the site and the dojo engine. Raw hues are for fills and
       borders; the darker values are the ones safe to put text in. The night
       palette lives on #sidebar below, so the shell reads as one system with
       roniam.dev: dark rail, light page. */
    --bg:#f6f6fa; --panel:#ffffff; --panel2:#f5f3ff; --ink:#191530; --muted:#5b5872;
    --teal:#115e59; --teal-dim:#99f6e4; --line:#e4e4f0; --code:#0f172a;
    --good:#166534; --good-bg:#f0fdf4; --bad:#9f1239; --bad-bg:#fff1f2; --accent:#6d28d9;
    --night:#130f26; --night2:#221a44;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  /* The rail keeps the night palette by re-declaring the tokens on itself, so
     every descendant inherits the dark variants without a second stylesheet. */
  #sidebar{
    --panel:#130f26; --panel2:#2a2150; --ink:#ffffff; --muted:#c9c2e8;
    --line:#2c2350; --teal:#c4b5fd; --teal-dim:#4c1d95; --code:#0b1017;
    background:linear-gradient(180deg,#130f26,#221a44) !important; color:#fff;
  }
  #sidebar .brand h1{font-family:var(--serif);font-weight:600;font-size:18px}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--teal);text-decoration:none} a:hover{text-decoration:underline}
  #app{display:flex;min-height:100vh}
  /* sidebar */
  #sidebar{width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 0}
  .brand{padding:0 20px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .brand h1{font-size:17px;margin:0;color:#fff;letter-spacing:.2px}
  .brand .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .progwrap{padding:12px 20px}
  .progbar{height:7px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .progfill{height:100%;width:0;background:linear-gradient(90deg,var(--teal-dim),var(--teal));transition:width .4s}
  .progtxt{font-size:11px;color:var(--muted);margin-top:6px}
  .searchwrap{padding:6px 20px 4px}
  #search{width:100%;background:var(--code);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:9px 11px;font-size:13.5px;outline:none}
  #search:focus{border-color:var(--teal)}
  .searchinfo{font-size:11px;color:var(--muted);padding:4px 20px 0}
  .result{padding:9px 20px;cursor:pointer;border-left:3px solid transparent}
  .result:hover{background:var(--panel2);border-left-color:var(--teal)}
  .result .rt{font-size:13.5px;color:#fff;font-weight:600}
  .result .rs{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
  .result .rs mark{background:var(--teal-dim);color:#d7fff6;border-radius:3px;padding:0 2px}
  .noresult{padding:12px 20px;font-size:13px;color:var(--muted)}
  .pathlinks{padding:14px 20px 4px;border-top:1px solid var(--line);margin-top:12px;
    font-size:12px;color:var(--muted);line-height:1.9}
  .pathlinks a{color:var(--muted)} .pathlinks a:hover{color:var(--teal)}
  .pathlinks .pl-here{color:var(--teal);font-weight:700}
  .pathlinks .pl-head{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;
    font-weight:800;color:var(--muted);margin-bottom:2px}
  .navgroup{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);
    padding:14px 20px 6px;font-weight:700}
  .navitem{display:flex;align-items:center;gap:9px;padding:8px 20px;cursor:pointer;
    font-size:14px;color:var(--ink);border-left:3px solid transparent}
  .navitem:hover{background:var(--panel2)}
  .navitem.active{background:var(--panel2);border-left-color:var(--teal);color:#fff}
  .navitem .dot{width:16px;height:16px;flex:0 0 16px;border-radius:50%;border:2px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;font-size:10px}
  .navitem.done .dot{background:var(--teal);border-color:var(--teal);color:#04211f}
  .navitem .t{flex:1}
  /* main */
  #main{flex:1;min-width:0;display:flex;justify-content:center;padding:38px 40px 90px}
  #content{max-width:820px;width:100%}
  #content h2{font-size:26px;margin:.2em 0 .5em;color:var(--ink);font-family:var(--serif);font-weight:600}
  #content h3{font-size:19px;margin:1.5em 0 .4em;color:var(--teal)}
  #content h4{font-size:16px;margin:1.2em 0 .3em;color:var(--ink)}
  #content p{margin:.7em 0}
  #content p.dd{margin:.2em 0 .8em 1.2em;color:var(--muted)}
  #content ul,#content ol{margin:.6em 0;padding-left:1.4em}
  #content li{margin:.3em 0}
  #content strong{color:var(--ink)}
  #content code{background:var(--code);border:1px solid var(--line);border-radius:5px;
    padding:.08em .38em;font:13.5px/1.4 "SF Mono",Menlo,Consolas,monospace;color:#8be9c9}
  #content hr{border:0;border-top:1px solid var(--line);margin:1.8em 0}
  blockquote{margin:1em 0;padding:.5em 1em;background:var(--panel);border-left:3px solid var(--accent);
    border-radius:0 6px 6px 0;color:var(--ink)}
  blockquote p{margin:.3em 0}
  pre.code{position:relative;background:var(--code);border:1px solid var(--line);border-radius:9px;
    padding:14px 16px;overflow-x:auto;margin:1em 0}
  pre.code code{background:none;border:0;padding:0;color:#d7e2ea;
    font:13px/1.55 "SF Mono",Menlo,Consolas,monospace;white-space:pre}
  pre.code .copy{position:absolute;top:8px;right:8px;background:var(--panel2);color:var(--muted);
    border:1px solid var(--line);border-radius:6px;font-size:11px;padding:3px 9px;cursor:pointer}
  pre.code .copy:hover{color:var(--teal);border-color:var(--teal)}
  pre.code .explain{position:absolute;top:8px;right:58px;width:22px;height:22px;line-height:1;
    background:var(--panel2);color:var(--teal);border:1px solid var(--line);border-radius:50%;
    font-size:12px;font-weight:700;cursor:pointer;padding:0}
  pre.code .explain:hover{color:#fff;border-color:var(--accent);background:var(--accent)}
  .explanation{background:var(--panel);border:1px solid var(--teal-dim);border-left:3px solid var(--teal);
    border-radius:0 8px 8px 0;padding:12px 14px;margin:-4px 0 14px;font-size:13.5px;line-height:1.55}
  .explanation .eh{color:var(--teal);font-weight:700;font-size:12px;text-transform:uppercase;
    letter-spacing:.6px;margin-bottom:6px}
  .explanation ul{margin:6px 0 0;padding-left:18px}
  .explanation li{margin:3px 0}
  .explanation code{background:var(--code);border:1px solid var(--line);border-radius:4px;padding:.05em .3em;
    font:12.5px/1.4 "SF Mono",Menlo,Consolas,monospace;color:#8be9c9}
  .tablewrap{overflow-x:auto;margin:1em 0}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  th{background:var(--panel2);color:var(--ink)}
  tr:nth-child(even) td{background:rgba(255,255,255,.02)}
  .pagehdr{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:2px}
  /* quiz */
  .quiz{margin:34px 0 10px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .quiz h3{margin-top:0;color:var(--ink)}
  .quiz .qmeta{font-size:13px;color:var(--muted);margin-bottom:14px}
  .qcard{margin:16px 0;padding:16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
  .qtext{font-weight:600;margin-bottom:12px}
  .opt{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:11px 13px;margin:8px 0;cursor:pointer;font-size:14.5px;
    transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--accent);background:#ede9fe}
  .opt.correct{border-color:var(--good);background:var(--good-bg)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.disabled{cursor:default;opacity:.85}
  .why{margin-top:10px;font-size:13.5px;color:var(--ink);background:var(--code);
    border-left:3px solid var(--teal);border-radius:0 6px 6px 0;padding:9px 12px;display:none}
  .why.show{display:block}
  .why.ok{border-left-color:var(--good)} .why.no{border-left-color:var(--bad)}
  .qscore{margin-top:16px;font-size:14px;color:var(--muted)}
  .navbtns{display:flex;justify-content:space-between;margin-top:40px;gap:12px}
  .navbtns button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:11px 18px;font-size:14px;cursor:pointer}
  .navbtns button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .navbtns button:disabled{opacity:.35;cursor:default}
  .navbtns .next{background:var(--teal-dim);border-color:var(--teal)}
  .mobtog{display:none}
  @media(max-width:860px){
    #sidebar{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .25s}
    #sidebar.open{transform:none}
    #main{padding:64px 18px 80px}
    .mobtog{display:inline-flex;position:fixed;top:12px;left:12px;z-index:40;background:var(--panel);
      border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
  }
</style>
</head>
<body>
<button class="mobtog" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <h1>Envoy Crash Course</h1>
      <div class="sub">From zero to service mesh · interactive</div>
    </div>
    <div class="progwrap">
      <div class="progbar"><div class="progfill" id="progfill"></div></div>
      <div class="progtxt" id="progtxt">0% complete</div>

    <div class="searchwrap">
      <input id="search" type="search" placeholder="Search the course…" autocomplete="off">

    <div id="results"></div>
    <nav id="nav"></nav>
    <div class="pathlinks">
      <span class="pl-head">The cloud-native path</span>
      <a href="/fundamentals/">Fundamentals</a> · <a href="/docker/">Docker</a> · <a href="/kubernetes/">Kubernetes</a> · <span class="pl-here">Envoy</span> · <a href="/istio/">Istio</a>

      <a href="https://roniam.dev/">roniam.dev</a>
    </div>
  </aside>
  <main id="main"><div id="content"></div></main>
</div>

<script>
/* Minimal, dependency-free Markdown -> HTML renderer.
   Supports the subset used by the course: headings, bold, inline code, links,
   fenced code blocks, tables, blockquotes, ordered/unordered lists, hr,
   definition-style ": " lines, and paragraphs. Works in Node and the browser. */
(function (global) {
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(text) {
    // protect inline code spans
    var codes = [];
    text = text.replace(/`([^`]+)`/g, function (_, c) {
      codes.push("<code>" + escapeHtml(c) + "</code>");
      return "" + (codes.length - 1) + "";
    });
    text = escapeHtml(text);
    // bold (non-greedy so it can span inner single-* italics)
    text = text.replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>");
    // italics (remaining single *)
    text = text.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    // links [text](url)
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, t, u) {
      var safe = u.replace(/"/g, "%22");
      var ext = /^https?:\/\//.test(u) ? ' target="_blank" rel="noopener"' : "";
      return '<a href="' + safe + '"' + ext + ">" + t + "</a>";
    });
    // restore code spans
    text = text.replace(/(\d+)/g, function (_, i) {
      return codes[+i];
    });
    return text;
  }

  function renderTable(rows) {
    // rows: array of raw '| a | b |' lines (header, sep, ...body)
    function cells(line) {
      var t = line.trim().replace(/^\|/, "").replace(/\|$/, "");
      return t.split("|").map(function (c) { return c.trim(); });
    }
    var header = cells(rows[0]);
    var body = rows.slice(2).map(cells);
    var html = '<div class="tablewrap"><table><thead><tr>';
    header.forEach(function (h) { html += "<th>" + inline(h) + "</th>"; });
    html += "</tr></thead><tbody>";
    body.forEach(function (r) {
      html += "<tr>";
      r.forEach(function (c) { html += "<td>" + inline(c) + "</td>"; });
      html += "</tr>";
    });
    html += "</tbody></table></div>";
    return html;
  }

  function mdToHtml(md) {
    md = md.replace(/\r\n/g, "\n");
    var lines = md.split("\n");
    var out = [];
    var i = 0;

    function isTableSep(line) {
      return /^\s*\|?[\s:-]*-[\s:|-]*\|?\s*$/.test(line) && line.indexOf("-") !== -1;
    }

    // collect a whole list (spanning blank lines between items and indented
    // block content such as fenced code) starting at index `start`.
    function collectList(start, ordered) {
      var markerRe = ordered ? /^(\s*)\d+\.\s+(.*)$/ : /^(\s*)[-*]\s+(.*)$/;
      var base = lines[start].match(markerRe)[1].length;
      var offset = base + (ordered ? 3 : 2);
      var items = [], cur = null, k = start;
      while (k < lines.length) {
        var ln = lines[k], m = ln.match(markerRe);
        if (m && m[1].length === base) { if (cur) items.push(cur); cur = [m[2]]; k++; continue; }
        if (ln.trim() === "") {
          var j = k + 1; while (j < lines.length && lines[j].trim() === "") j++;
          if (j < lines.length && cur) {
            var mn = lines[j].match(markerRe), ind = lines[j].match(/^\s*/)[0].length;
            if ((mn && mn[1].length === base) || ind > base) { cur.push(""); k = j; continue; }
          }
          break;
        }
        var ind2 = ln.match(/^\s*/)[0].length;
        if (cur && ind2 > base) { cur.push(ln.slice(Math.min(ind2, offset))); k++; continue; }
        break;
      }
      if (cur) items.push(cur);
      return { items: items, next: k };
    }
    // render one item's body: recurse so nested code/paragraphs/sublists become
    // real blocks; unwrap a lone <p> so simple items stay tight.
    function renderItem(body) {
      while (body.length && body[0].trim() === "") body.shift();
      while (body.length && body[body.length - 1].trim() === "") body.pop();
      var inner = mdToHtml(body.join("\n"));
      var mm = inner.match(/^<p>([\s\S]*)<\/p>$/);
      if (mm && !/<(p|ul|ol|pre|table|blockquote|h[1-6])[ >]/.test(mm[1])) return mm[1];
      return inner;
    }

    while (i < lines.length) {
      var line = lines[i];

      // fenced code block
      var fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        var lang = fence[1] || "";
        var buf = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++; // skip closing fence
        out.push('<pre class="code" data-lang="' + lang + '"><button class="explain" type="button" title="What does this do?">?</button><button class="copy" type="button">Copy</button><code>' +
          escapeHtml(buf.join("\n")) + "</code></pre>");
        continue;
      }

      // horizontal rule
      if (/^\s*---\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

      // heading
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        var lvl = h[1].length;
        out.push("<h" + lvl + ">" + inline(h[2].trim()) + "</h" + lvl + ">");
        i++;
        continue;
      }

      // blockquote (may span lines)
      if (/^\s*>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        out.push('<blockquote>' + mdToHtml(q.join("\n")) + "</blockquote>");
        continue;
      }

      // table
      if (line.indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var trows = [];
        while (i < lines.length && lines[i].indexOf("|") !== -1 && lines[i].trim() !== "") {
          trows.push(lines[i]);
          i++;
        }
        out.push(renderTable(trows));
        continue;
      }

      // unordered list
      if (/^\s*[-*]\s+/.test(line)) {
        var ul = collectList(i, false);
        out.push("<ul>" + ul.items.map(function (b) { return "<li>" + renderItem(b) + "</li>"; }).join("") + "</ul>");
        i = ul.next;
        continue;
      }

      // ordered list
      if (/^\s*\d+\.\s+/.test(line)) {
        var ol = collectList(i, true);
        out.push("<ol>" + ol.items.map(function (b) { return "<li>" + renderItem(b) + "</li>"; }).join("") + "</ol>");
        i = ol.next;
        continue;
      }

      // definition-style ": " line -> indented note paragraph
      if (/^:\s+/.test(line)) {
        out.push('<p class="dd">' + inline(line.replace(/^:\s+/, "")) + "</p>");
        i++;
        continue;
      }

      // blank line
      if (line.trim() === "") { i++; continue; }

      // paragraph (gather until blank / block start)
      var para = [line];
      i++;
      while (i < lines.length && lines[i].trim() !== "" &&
             !/^(#{1,6})\s/.test(lines[i]) &&
             !/^```/.test(lines[i]) &&
             !/^\s*>\s?/.test(lines[i]) &&
             !/^\s*[-*]\s+/.test(lines[i]) &&
             !/^\s*\d+\.\s+/.test(lines[i]) &&
             !/^:\s+/.test(lines[i]) &&
             !/^\s*---\s*$/.test(lines[i]) &&
             !(lines[i].indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1]))) {
        para.push(lines[i]);
        i++;
      }
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }

    return out.join("\n");
  }

  if (typeof module !== "undefined" && module.exports) module.exports = mdToHtml;
  else global.mdToHtml = mdToHtml;
})(typeof window !== "undefined" ? window : this);

</script>
<script>
const DATA = {"pages": [{"id": "setup-local-envoy", "title": "Setup, run Envoy locally", "group": "Get started", "md": "*Do this once. In ~10 minutes you'll have Envoy running on your own machine and a request flowing\nthrough it. No prior setup assumed: every step spelled out for macOS, Windows, and Linux.*\n\n> **This course is hands-on, on your own machine.** The site you're reading gives you the lessons\n> and quizzes, but the real work happens in your own terminal: installing tools, running\n> containers, and breaking things you can then fix. This setup page gets your machine ready; do it\n> before the first lab.\n> The labs also use ready-made config files from the repo; grab them once with\n> `git clone https://github.com/rcbart/dojo.git && cd dojo/envoy-crash-course`.\n\nYou don't install Envoy directly. You run it as a **Docker container**, which means you install one\ntool (Docker) and everything else (Envoy itself, the practice backend) is pulled automatically.\n\n---\n\n## Step 1: Install Docker\n\nDocker runs Envoy in a small, isolated container so nothing touches your system.\n\n**macOS**\n: Download **Docker Desktop** from <https://www.docker.com/products/docker-desktop/>, open the\n`.dmg`, drag Docker to Applications, and launch it. Wait for the whale icon in the menu bar to stop\nanimating (that means the engine is running). Apple Silicon and Intel are both supported.\n\n**Windows**\n: Download **Docker Desktop** from the same link and run the installer. If prompted, allow it to\nenable **WSL 2** (the Windows Subsystem for Linux); accept and reboot if asked. Launch Docker\nDesktop and wait for it to say \"Engine running.\" Run all commands in this course from **PowerShell**\nor **Windows Terminal**.\n\n**Linux**\n: Install **Docker Engine** for your distro following <https://docs.docker.com/engine/install/>. On\nDebian/Ubuntu the quick path is Docker's convenience script:\n\n```bash\ncurl -fsSL https://get.docker.com | sh\nsudo usermod -aG docker $USER   # so you can run docker without sudo, log out/in afterward\n```\n\n## Step 2: Verify Docker works\n\nOpen a terminal and run:\n\n```bash\ndocker --version\ndocker compose version\n```\n\nYou should see version numbers for both (Compose is bundled with modern Docker). Then confirm the\nengine can actually run a container:\n\n```bash\ndocker run --rm hello-world\n```\n\nIf you see \"Hello from Docker!\", you're ready. If it errors, Docker Desktop probably isn't started\nyet; launch it and wait for the running indicator, then retry.\n\n> **`curl` too.** The course tests requests with `curl`. It's preinstalled on macOS, modern\n> Windows 10/11, and most Linux. Check with `curl --version`; on Linux install via\n> `sudo apt install curl` (Debian/Ubuntu) if missing.\n\n## Step 3: Get the lab files\n\nThe course ships small lab folders (an `envoy.yaml` and a `docker-compose.yaml` each). Open a\nterminal **in the course folder**, the one that contains this guide and a `labs/` directory. If\nyou're not sure where you are:\n\n```bash\n# macOS / Linux\ncd /path/to/envoy-crash-course\nls labs        # you should see 02-static, 03-tls, 04-routing, ...\n```\n\n```powershell\n# Windows PowerShell\ncd C:\\path\\to\\envoy-crash-course\ndir labs\n```\n\nEverything below runs from inside one of those `labs/` subfolders.\n\n## Step 4: Start Envoy (the first lab)\n\nMove into the first lab and bring it up:\n\n```bash\ncd labs/02-static\ndocker compose up\n```\n\nWhat happens: Docker downloads the Envoy image (`envoyproxy/envoy:v1.38-latest`) and a tiny echo\nbackend the first time (a few seconds to a minute), then starts both. You'll see Envoy's logs\nstreaming in this terminal. **Leave this terminal running**; it's Envoy. The logs here are also\nwhere you'll watch requests arrive.\n\n## Step 5: Send a request through Envoy\n\nOpen a **second** terminal (leave the first running Envoy) and run:\n\n```bash\ncurl localhost:10000\n```\n\nYou should get back:\n\n```\nhello from the backend\n```\n\nThat response came *from the backend, through Envoy*. You just proxied your first request. Watch\nthe first terminal; you'll see a log line appear for the request you just made.\n\n## Step 6: Peek at Envoy's admin interface\n\nEnvoy exposes a built-in dashboard/API on port 9901. Try:\n\n```bash\ncurl -s localhost:9901/ready          # → LIVE   (Envoy is healthy)\ncurl -s localhost:9901/server_info | head    # version, uptime, state\n```\n\nOr open <http://localhost:9901> in your browser to click around. (This admin port is safe here\nbecause it's local; never expose it publicly in production.)\n\n## Step 7: Stop and clean up\n\nIn the Envoy terminal press **Ctrl-C** to stop it. Then remove the containers:\n\n```bash\ndocker compose down\n```\n\nThat's the full loop: `docker compose up` to start a lab, `curl` to test it, `Ctrl-C` +\n`docker compose down` to stop. **Every lab in this course works exactly this way**: only the\nconfig inside changes.\n\n> **⚠️ Run only one lab at a time; bring the previous lab down before starting the next.** Every\n> lab uses the same ports (`10000` and `9901`), so a still-running lab will collide with the next\n> one. Before moving on, go to the lab you were in and run `docker compose down`. If you forget,\n> you'll see tell-tale errors like `port is already allocated` when starting, or\n> `curl: (35) ... wrong version number` when testing (you're hitting the *old* lab's server). The\n> safe habit between labs:\n> ```bash\n> docker compose down        # in the lab you're leaving\n> cd ../<next-lab> && docker compose up\n> ```\n> `docker ps` shows what's currently running if you're unsure.\n\n---\n\n## Troubleshooting\n\n**\"Cannot connect to the Docker daemon\" / \"docker: command not found\"**\n: Docker Desktop isn't running (or isn't installed). Start it and wait for the running indicator,\nthen retry. On Linux, make sure the `docker` service is up (`sudo systemctl start docker`).\n\n**`curl localhost:10000` hangs or says \"connection refused\"**\n: Envoy isn't up yet or isn't listening. Check the first terminal; wait until logs stop scrolling\nand you see it's serving. Make sure `docker compose up` didn't exit with an error.\n\n**\"port is already allocated\" / \"address already in use\"**\n: Something else is using port 10000 or 9901. Stop it, or edit the lab's `docker-compose.yaml` to\nmap a different host port (e.g. `\"20000:10000\"`) and curl that port instead.\n\n**Envoy exits immediately with a config error**\n: It printed why: usually a typo in `envoy.yaml`. The message names the field. Envoy refuses to\nstart on invalid config (a feature, not a bug). Re-check recent edits.\n\n**Windows: `curl` behaves oddly in PowerShell**\n: Older PowerShell aliases `curl` to a different command. Use `curl.exe localhost:10000` explicitly,\nor run inside WSL.\n\n**The image download is slow the first time**\n: Normal: Docker caches it. Subsequent `up`s are instant."}, {"id": "primer-what-is-a-proxy", "title": "Primer: What is a proxy?", "group": "Get started", "md": "*The single idea the whole course rests on, explained from scratch. No jargon assumed. ~10 min.\nEnvoy is a proxy, so once this clicks, everything else is \"what kind of proxy, doing what.\"*\n\n---\n\n## The plain-English version\n\nA **proxy** is a **middleman**. It's a program that sits *between* you and the thing you're trying\nto reach, passing messages back and forth on your behalf.\n\nThink of ordering food at a hotel. You don't walk into the kitchen and talk to the chef; you tell\nthe **waiter** what you want. The waiter carries your order to the kitchen, brings the food back,\nand you never deal with the kitchen directly. The waiter is a proxy: a go-between that stands\nbetween the customer (you) and the service (the kitchen).\n\nOn a network it looks like this:\n\n```\n   you  ──►  the waiter  ──►  the kitchen\n   (client)   (PROXY)         (the real server)\n        ◄──               ◄──\n```\n\nYou talk to the proxy. The proxy talks to the real server for you, gets the answer, and hands it\nback. As far as you're concerned, you're just talking to \"the thing\"; you often don't even know a\nmiddleman is there.\n\n## Okay, but how does it actually work?\n\nNormally, when your computer wants a web page, it connects **directly** to the server that has it\nand asks: \"give me this page.\" The server answers, and you're done.\n\nWith a proxy in the middle, that one hop becomes two:\n\n1. **You connect to the proxy** instead of the real server, and make your request.\n2. **The proxy connects to the real server** on your behalf and makes the *same* request (or a\n   slightly modified one).\n3. **The real server replies to the proxy.**\n4. **The proxy replies to you**, passing the answer back (again, possibly tweaked).\n\nTwo separate conversations (you↔proxy and proxy↔server) stitched together so it *feels* like one.\nThat's the entire mechanism. Everything fancy a proxy does happens in that middle spot, in between\nsteps 2 and 3.\n\n## Why on earth add a middleman?\n\nBecause the middle is a *fantastic place to do useful work*: work you'd otherwise have to build\ninto every server or every client. Sitting in the middle, a proxy can:\n\n- **Direct traffic**: look at what you asked for and decide which server should handle it (this is\n  *routing*).\n- **Share the load**: spread requests across many identical servers so no single one gets\n  overwhelmed (*load balancing*).\n- **Handle failures**: if a server is down or slow, quietly retry a different one, so you never\n  see the hiccup.\n- **Do the security**: handle the encryption (HTTPS) and check that you're allowed in\n  (*authentication*), so each server doesn't have to.\n- **Speed things up**: remember (*cache*) a popular answer and hand it back instantly next time.\n- **Watch everything**: since every request flows through it, it's the perfect place to count\n  traffic, measure speed, and log what happened.\n- **Shield the servers**: the outside world talks only to the proxy, so the real servers can stay\n  hidden and protected.\n\nOne well-placed middleman does all of that *once*, instead of every server reinventing it.\n\n## Two flavors: \"for the client\" vs \"for the server\"\n\nProxies come in two directions, and the difference is just *whose side the middleman is on*.\n\n**Forward proxy: a middleman for the *client*.** It sits in front of *you* and reaches out to the\nwider internet on your behalf. Your company or school might route all web traffic through one to\nfilter sites, cache pages, or hide who's really browsing. The servers on the internet just see \"a\nrequest from the proxy.\"\n\n```\n  you + coworkers ──►  FORWARD PROXY  ──►  the whole internet\n```\n\n**Reverse proxy: a middleman for the *server*.** It sits in front of *the servers* and takes\nrequests from the outside world, then hands them to whichever internal server should answer. Anyone\non the internet talks to the reverse proxy thinking it's \"the website,\" never seeing the real\nmachines behind it.\n\n```\n  the whole internet ──►  REVERSE PROXY  ──►  your fleet of servers\n```\n\n**This second kind, the reverse proxy, is the one that matters for this course.** Routing\nincoming traffic to a fleet of backend services, balancing load, terminating HTTPS, retrying\nfailures, collecting metrics: that's exactly the reverse-proxy job.\n\n## And this is where Envoy comes in\n\n**Envoy is a reverse proxy**, a programmable one with everything above built in. Everything above (routing,\nload balancing, retries, TLS, metrics, shielding your servers) is precisely what Envoy does, and\nthe rest of this course is really just:\n\n- *what kinds of decisions* it can make in that middle spot (routing, filtering; Modules 04–05),\n- *how you tell it* what to do (its config; Modules 02–03, 07),\n- and *where you place it*: at your front door (an **API gateway**) or next to every service (a\n  **service mesh**, the next primer).\n\nSo whenever you feel lost later, come back to the one picture: **a middleman between a client and a\nserver, doing helpful work in between.** That's all a proxy is, and Envoy is the best-in-class\nversion of it."}, {"id": "primer-service-mesh", "title": "Primer: Service meshes", "group": "Get started", "md": "*Context before you meet Envoy. No lab, no jargon assumed. ~10 min. If you finish this and think\n\"so a service mesh needs some kind of smart proxy\"; that proxy is Envoy, and the rest of the\ncourse is about it.*\n\n---\n\n## Start with the problem, not the buzzword\n\nImagine a simple app: a website that calls a \"users\" service, which calls a \"database\" service.\nThree programs talking over the network. Now grow it into a real company: **hundreds** of small\nservices (\"microservices\"), all calling each other constantly.\n\nSuddenly every team faces the *same* networking problems, over and over:\n\n- **\"Is this connection secure?\"** Traffic between services should be encrypted, and each service\n  should be able to prove who it is.\n- **\"What if the service I'm calling is down or slow?\"** You want automatic retries, timeouts, and\n  a way to stop hammering a failing service.\n- **\"Where did this request actually go, and why is it slow?\"** You want metrics and traces for\n  every call.\n- **\"Can I send 5% of traffic to the new version?\"** You want smart routing and canary releases.\n\nThe naive fix is to write this logic **inside every service**, but then every team re-implements\nit, in every programming language, slightly differently, forever. That's the pain a service mesh\nremoves.\n\n## The core idea: move networking OUT of the app\n\nA **service mesh** takes all that cross-cutting network logic *out* of your application code and\nputs it into a dedicated piece of infrastructure that sits beside each service.\n\nThe trick is the **sidecar proxy**: next to every copy of every service, you run a small proxy.\nYour service no longer talks to other services directly; it talks to its local proxy, and the\nproxy handles the real network:\n\n```\n   WITHOUT a mesh                          WITH a mesh\n   ─────────────                           ───────────\n   [ Service A ] ──────► [ Service B ]     [ Service A ]        [ Service B ]\n     (does its own                             │  ▲                 ▲  │\n      encryption,                              ▼  │                 │  ▼\n      retries, metrics,                    [ proxy ] ───────────► [ proxy ]\n      routing...)                          (encryption, retries, metrics, routing)\n```\n\nBecause a proxy sits on **both ends of every call**, the mesh can provide (uniformly, for every\nservice, with **zero application code**) the exact list of things every team kept re-inventing:\nencryption + identity between services (**mTLS**), retries/timeouts/circuit-breaking, metrics and\ntraces for every request, and smart routing like canaries. Your app just makes a normal network\ncall; the mesh does the rest around it.\n\n## Data plane vs control plane (the one distinction to keep)\n\nA mesh has two halves, and this split shows up everywhere in this course:\n\n- **Data plane**: the fleet of proxies that actually carry your traffic and enforce the rules.\n  This is the part that touches every packet.\n- **Control plane**: the \"brain.\" You don't configure hundreds of proxies by hand. You tell the\n  control plane your intent (\"all traffic must be encrypted,\" \"send 5% to v2\"), and it computes the\n  right config and **pushes it to every proxy**, updating them live as services come and go.\n\nYou state policy once, centrally; the control plane programs the whole data plane to match.\n\n## Where Envoy fits\n\nHere's the punchline that makes this whole course worthwhile:\n\n> **Envoy is the proxy that most service meshes use as their data plane.**\n\nIstio, Consul, Gloo Mesh, AWS App Mesh, and the Kubernetes gateway world (Envoy Gateway, Contour)\nall drive **Envoy** as the thing on the wire. They differ mainly in their *control plane* (the\nbrain), but the muscle carrying traffic is the same Envoy. There's a standard API, called **xDS**,\nthat a control plane uses to program Envoy (you'll meet it in Module 07).\n\nThat's why learning Envoy pays off so widely: **understand this one proxy and you understand the\nengine inside nearly every mesh and gateway.** A mesh, from Envoy's point of view, is just \"lots of\nEnvoys, each configured by a control plane instead of a static file.\"\n\n## Do you always need a mesh? (a straight answer)\n\nNo. A mesh earns its complexity when you have **many** services that all need uniform security,\nresilience, and observability without touching each one. For a handful of services, a single Envoy\nat the edge (an API gateway) plus a few retries is often plenty. The newest meshes (like Istio's\n**ambient mode**, Module 09) exist specifically to lower the cost of running one. The point of this\ncourse is to teach you the engine first; then a mesh is just that engine, everywhere.\n\n## How this connects to the rest of the course\n\n- **Modules 00–07** teach Envoy as a *single* proxy you run and configure yourself: the data\n  plane, up close. Everything a mesh does to your traffic (routing, TLS, resilience, observability,\n  dynamic config) you'll do by hand first, so it isn't magic.\n- **Module 08** shows Envoy as a Kubernetes gateway.\n- **Module 09** returns to *this* primer with real tools: Istio, sidecars, mTLS, ambient mode,\n  now that you know exactly what the proxy underneath is doing."}, {"id": "00-what-is-envoy", "title": "0 · What Envoy is", "group": "Fundamentals", "md": "*No lab in this module; it builds the mental model everything else hangs on. ~10 min read.*\n\n---\n\n## The one-line answer\n\n**Envoy is a proxy.** A proxy is a program that sits *between* a client and a server: the client\ntalks to the proxy, and the proxy talks to the real server on the client's behalf, then relays\nthe answer back.\n\n```\nclient  ─────►  ENVOY  ─────►  your backend service\n        ◄─────         ◄─────\n```\n\nWhy put something in the middle? Because that middle spot is a fantastic place to do work that\n*every* request needs but that you don't want baked into every service: routing, load balancing,\nretries, timeouts, TLS encryption, authentication, rate limiting, and collecting metrics. Envoy\ndoes all of that, and it is configured entirely by data (YAML/JSON), not code.\n\n## \"L7 proxy\", what the L7 means\n\nNetworks are described in layers. Two matter here:\n\n- **Layer 4 (L4)**, the *transport* layer: raw TCP/UDP connections. An L4 proxy sees \"bytes\n  flowing between IP:port and IP:port.\" It can forward a connection but doesn't understand what's\n  inside it.\n- **Layer 7 (L7)**, the *application* layer: the actual protocol, like HTTP, gRPC, or Kafka. An\n  L7 proxy *parses* the request (it can read the URL path, the headers, the method) and make\n  decisions based on them.\n\nEnvoy does **both**, but its superpower is **L7**: because it understands HTTP/gRPC, it can say\n\"send `POST /checkout` to the payments service, retry it up to 3 times, and add a request-id\nheader\", decisions impossible for something that only sees bytes.\n\n## The phrase you'll hear: \"the universal data plane\"\n\nEnvoy was built at Lyft (2016) and is now a graduated CNCF project. Its designers coined a useful\nsplit:\n\n- The **data plane** is the thing that actually touches your traffic: moves the bytes, applies\n  the rules. **Envoy is a data plane.**\n- The **control plane** is the brain that *tells* the data plane what to do: it computes config\n  and pushes it to the proxies. Envoy is *not* a control plane; it consumes config from one (or\n  from a static file).\n\n\"Universal data plane\" means: Envoy is designed to be driven by *any* control plane through a\nstandard API (**xDS**, Module 07). That is exactly why so many different products (Istio,\nConsul, Envoy Gateway, Contour, AWS App Mesh) all use Envoy as their data plane and just supply\ntheir own control plane. **Learn Envoy once, and you understand the engine inside all of them.**\n\n## Where Envoy shows up (the three classic roles)\n\nThe same Envoy binary plays different roles depending on *where you put it*:\n\n1. **Edge / API gateway**: one (or a few) Envoys at the front door of your system, taking traffic\n   from the internet and routing it to internal services. This is the \"reverse proxy / ingress\"\n   role, competing with nginx and HAProxy.\n2. **Sidecar**: one Envoy deployed right next to *each* instance of *each* service (in the same\n   pod/host). Every bit of traffic in and out of that service goes through its personal Envoy.\n   Thousands of Envoys, all identical, programmed by a control plane. This is the **service\n   mesh** pattern (Module 09).\n3. **Middle proxy**: an internal shared proxy between tiers of services.\n\nIt's the *same tool*. The roles differ only in topology and who configures it.\n\n## Envoy vs nginx / HAProxy, why teams pick Envoy\n\nnginx and HAProxy are excellent, battle-tested proxies. Envoy's distinguishing traits, especially\nfor modern microservice/cloud-native systems:\n\n- **Dynamic configuration without restarts.** Envoy can be reconfigured *live* over its xDS API\n  (add a route, change a backend, rotate a cert) with **zero dropped connections**. Traditional\n  proxies historically reloaded config by restarting/forking. This is *the* reason meshes chose\n  Envoy: a control plane can reprogram thousands of proxies continuously.\n- **First-class L7 for modern protocols**: native HTTP/2, HTTP/3 (QUIC), and gRPC support,\n  including gRPC-specific features.\n- **Deep observability out of the box**: hundreds of metrics, structured access logs, and\n  distributed tracing built in, not bolted on.\n- **An extensible filter architecture**: its request-processing pipeline is a chain of pluggable\n  \"filters\" (auth, rate limit, transformation, WASM…), so behavior is composable (Module 04).\n- **Advanced resilience primitives**: outlier detection, circuit breaking, sophisticated retry\n  and load-balancing policies as configuration (Module 05).\n\nThe trade-off: Envoy's configuration is **larger and more verbose** than an nginx config,\nbecause it exposes so much control. This course's job is to make that verbosity feel logical.\n\n## A tiny taste of the config (don't worry about details yet)\n\nEverything Envoy does is expressed in structured config like this. Skim it; you'll write and\nrun exactly this in Module 02:\n\n```yaml\nstatic_resources:\n  listeners:\n  - name: my_first_listener\n    address:\n      socket_address: { address: 0.0.0.0, port_value: 10000 }   # accept traffic here\n    # ... filters that parse HTTP and decide where the request goes ...\n  clusters:\n  - name: some_backend\n    # ... where the real backend actually lives ...\n```\n\nTwo of the words in there, **listener** (where Envoy accepts traffic) and **cluster** (a group\nof backend servers Envoy sends traffic to), are the two nouns you'll meet first in the next\nmodule. Everything else is what happens *between* them."}, {"id": "01-architecture-and-request-lifecycle", "title": "1 · Architecture & request flow", "group": "Fundamentals", "md": "*No lab: this is the map. Once you can trace one request through Envoy's objects, the config in\nevery later module reads itself. ~15 min.*\n\n---\n\n## The five nouns\n\nEnvoy's entire behavior is built from a small set of objects. Learn these five and you can read\nany Envoy config:\n\n| Object | One-line job | Real-world analogy |\n|--------|--------------|--------------------|\n| **Listener** | A port Envoy listens on for incoming connections | The front door(s) of the building |\n| **Filter chain** | The ordered pipeline that processes what comes through a listener | The assembly line inside the door |\n| **Filter** | One step in that pipeline (parse HTTP, check auth, rate-limit, route…) | One worker on the line |\n| **Route** | A rule: \"requests matching X go to cluster Y\" | The signpost / dispatcher |\n| **Cluster** | A named group of identical backend servers Envoy can send traffic to | A team of workers who all do the same job |\n| **Endpoint** | One actual backend instance (an IP:port) inside a cluster | One specific worker |\n\n> Mnemonic for the happy path: **a connection arrives at a *listener*, flows through a *filter\n> chain*, the last HTTP filter (the *router*) reads the *route* table to pick a *cluster*, and the\n> cluster load-balances to one *endpoint*.** That sentence is Envoy.\n\n## How one HTTP request flows through Envoy (step by step)\n\nFollow a single `GET /api/users` from a browser to a backend:\n\n```\n                          ┌─────────────────────────  ENVOY  ─────────────────────────┐\n                          │                                                            │\nbrowser ──GET /api/users──►  LISTENER :10000                                           │\n                          │      │                                                     │\n                          │      ▼                                                     │\n                          │   FILTER CHAIN                                             │\n                          │      │  (network filters)                                  │\n                          │      ▼                                                     │\n                          │   HTTP CONNECTION MANAGER  ── parses the HTTP request      │\n                          │      │                                                     │\n                          │      ▼  (HTTP filters, in order)                           │\n                          │   [ cors ] → [ jwt_authn ] → [ router ]                    │\n                          │                                │                           │\n                          │                                ▼   reads the ROUTE table   │\n                          │                       match: /api/*  → cluster \"users_svc\" │\n                          │                                │                           │\n                          │                                ▼                           │\n                          │                       CLUSTER \"users_svc\"                  │\n                          │                         load-balance across endpoints ─────┼──► 10.0.0.7:8080\n                          │                                                            │    10.0.0.8:8080\n                          └────────────────────────────────────────────────────────────┘    10.0.0.9:8080\n```\n\nNarrated:\n\n1. **The listener accepts the TCP connection** on `0.0.0.0:10000`. A listener is bound to an\n   address+port and owns one or more filter chains.\n2. **The filter chain runs its network (L4) filters.** For HTTP traffic the one that matters is the\n   **HTTP Connection Manager (HCM)**, a network filter that turns the raw byte stream into\n   structured HTTP requests (handling HTTP/1.1, HTTP/2, HTTP/3). Everything HTTP happens *inside*\n   the HCM.\n3. **Inside the HCM, the HTTP filters run in order.** This is a second, HTTP-level pipeline:\n   e.g. `cors`, then `jwt_authn` (verify a token), then finally the **router** filter. Each\n   filter can inspect or modify the request, or short-circuit it (e.g. auth rejects with 401).\n4. **The router filter consults the route configuration.** The route table is a set of\n   **virtual hosts** and **routes**; the router finds the first route whose match (path prefix,\n   headers, method…) fits (say `prefix: /api/` → `cluster: users_svc`), possibly rewriting the\n   path, adding headers, or applying a timeout/retry policy.\n5. **The chosen cluster load-balances to one endpoint.** The cluster `users_svc` knows its\n   endpoints (either from static config or discovered dynamically). It picks one per its\n   load-balancing policy (round-robin, least-request…), respecting health checks and circuit\n   breakers, and forwards the request.\n6. **The response flows back** up through the same filters (they get a crack at the response too)\n   and out to the browser.\n\nTwo independent pipelines are the key insight: the **network filter chain** (L4, operates on the\nconnection) and, inside the HCM, the **HTTP filter chain** (L7, operates on each request). Most of\nyour day-to-day config lives in the HTTP filters and the route table.\n\n## Downstream vs upstream, learn this vocabulary now\n\nEnvoy's docs and stats use two words constantly:\n\n- **Downstream** = the side facing the **client** (whoever connected *to* Envoy). The browser is\n  downstream.\n- **Upstream** = the side facing the **backend** (whoever Envoy connects *to*). `users_svc` is\n  upstream.\n\nSo \"a downstream connection\" is a client's connection *to* Envoy; \"an upstream request\" is\nEnvoy's request *to* a backend. Stats like `downstream_rq_total` and `upstream_cx_active` read\nnaturally once this clicks: requests received from clients vs connections open to backends.\n\n## Static vs dynamic configuration (the big fork)\n\nThere are two ways Envoy gets its listeners/routes/clusters:\n\n- **Static**: you write it all in a YAML file (`static_resources:`) and Envoy loads it at\n  startup. Simple, great for learning and small setups. **This is what Modules 02–06 use.**\n- **Dynamic (xDS)**: Envoy asks a **control plane** over a gRPC/REST API (\"give me my\n  listeners… my clusters… my endpoints…\") and receives updates live, with no restart. This is\n  how meshes and gateways manage fleets. **Module 07** covers it.\n\nThe key fact: the *objects are the same* either way: a cluster is a cluster whether it came from a\nfile or a control-plane push. Master the static objects first and dynamic config is just \"the\nsame objects, delivered over the network.\"\n\n## The threading model (why Envoy is fast)\n\nNot essential for using Envoy, but it explains its performance and some behaviors:\n\n- Envoy runs a small number of **worker threads** (by default, one per CPU core). Each worker has\n  its own **event loop** (built on libevent) and handles connections with **non-blocking,\n  asynchronous I/O**: one thread juggles thousands of connections without blocking on any.\n- Connections are **not shared** between workers (a \"share nothing\" design), which avoids locks\n  on the hot path and scales linearly with cores.\n- A separate **main thread** handles the admin interface, xDS updates, and stats flushing, so\n  config changes don't stall request processing.\n\nPractical consequence: some stats and connection-pool behaviors are *per worker*, which\noccasionally surprises people (e.g. a tiny backend may see connections from each worker).\n\n## The mental checklist for reading any Envoy config\n\nWhen you open an Envoy YAML, find these in order and you'll understand it:\n\n1. **What listeners are defined?** → what ports does it accept traffic on?\n2. **For each listener, what's the filter chain?** → almost always an HCM for HTTP.\n3. **Inside the HCM: what HTTP filters, and what route config?** → what gets checked, and where do\n   requests go?\n4. **What clusters exist, and how do they find endpoints?** → the backends and how they're\n   discovered/balanced.\n\nThat's the whole game. Everything else is options on these four questions."}, {"id": "02-lab-first-static-config", "title": "2 · Lab: your first Envoy", "group": "Fundamentals", "md": "*Hands-on. You'll run Envoy in Docker, proxy a real request through it, and understand every line\nof the config. ~20 min. Requires Docker.*\n\nThe files for this lab live in [`labs/02-static/`](https://github.com/rcbart/dojo/tree/main/envoy-crash-course/labs/02-static): `envoy.yaml` and\n`docker-compose.yaml`. You can run them as-is; below we build the same config up piece by piece\nso nothing is a black box.\n\n---\n\n## What we're building\n\nThe smallest config that does something real: one **listener** on port `10000` that speaks HTTP\nand forwards every request to one **cluster** (a backend that just echoes a string).\n\n```\ncurl ──►  Envoy :10000  ──►  backend :5678  (\"hello from the backend\")\n```\n\n## Run it (30 seconds)\n\nFrom `labs/02-static/`:\n\n```bash\ndocker compose up\n```\n\nDocker pulls Envoy `v1.38-latest` and the tiny echo backend, then starts both. In another\nterminal:\n\n```bash\ncurl localhost:10000\n# → hello from the backend\n```\n\nThat response came **from the backend, through Envoy**. You now have a working proxy. When done,\n`Ctrl-C` and `docker compose down`.\n\n## The config, line by line\n\nOpen [`envoy.yaml`](https://github.com/rcbart/dojo/blob/main/envoy-crash-course/labs/02-static/envoy.yaml). It has three top-level sections: `admin`,\n`static_resources.listeners`, and `static_resources.clusters`. Recall the mental checklist from\nModule 01: listeners, filter chains, HTTP filters + routes, clusters. Here they are for real.\n\n### 1. The admin interface\n\n```yaml\nadmin:\n  address:\n    socket_address: { address: 0.0.0.0, port_value: 9901 }\n```\n\nEnvoy exposes a built-in management server. It's how you inspect a running Envoy: stats, the\nlive config, health. We'll use it heavily in Module 06. **It has full control of the process and no authentication;\nnever bind it to a public interface in production** (here it's fine; it's local).\n\nTry it now while the lab runs:\n\n```bash\ncurl -s localhost:9901/ready          # → LIVE\ncurl -s localhost:9901/server_info | head          # version, state, uptime\ncurl -s \"localhost:9901/stats?filter=http.ingress_http.downstream_rq_total\"\n```\n\nThat last one shows how many requests your listener has handled; run a few `curl localhost:10000`\nfirst and watch it climb.\n\n### 2. The listener\n\n```yaml\nlisteners:\n- name: main_listener\n  address:\n    socket_address: { address: 0.0.0.0, port_value: 10000 }\n  filter_chains:\n  - filters:\n    - name: envoy.filters.network.http_connection_manager\n      typed_config:\n        \"@type\": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager\n        ...\n```\n\n- **`address`**: bind to all interfaces on port 10000; this is where clients connect.\n- **`filter_chains[].filters`**: the L4 pipeline. Here there's exactly one network filter, the\n  **HTTP Connection Manager** (HCM). Everything HTTP happens inside it.\n- **`\"@type\": type.googleapis.com/…v3.HttpConnectionManager`**: Envoy config is strongly typed;\n  this URL names the exact message type. You'll copy these `@type` lines a lot; you don't\n  memorize them, you look them up in the docs. The `v3` is Envoy's stable API version.\n- **`stat_prefix: ingress_http`**: labels this listener's metrics (that's the\n  `http.ingress_http.*` you saw in the admin stats).\n- **`access_log` → StdoutAccessLog**: log each request to stdout. Watch the `docker compose up`\n  terminal as you curl: you'll see a line per request.\n\n### 3. The route config (inside the HCM)\n\n```yaml\nroute_config:\n  virtual_hosts:\n  - name: all_hosts\n    domains: [\"*\"]\n    routes:\n    - match: { prefix: \"/\" }\n      route: { cluster: echo_service }\n```\n\n- **`virtual_hosts`**: a group of routes selected by the request's `Host` header.\n  `domains: [\"*\"]` matches any host. (A real gateway might have one virtual host for\n  `api.example.com` and another for `www.example.com`.)\n- **`routes`**: ordered match rules. `match: { prefix: \"/\" }` matches every path; `route:\n  { cluster: echo_service }` sends it to our cluster. Routes are the dispatcher from Module 01.\n\n### 4. The HTTP filters\n\n```yaml\nhttp_filters:\n- name: envoy.filters.http.router\n  typed_config:\n    \"@type\": type.googleapis.com/…v3.Router\n```\n\nThe L7 pipeline. Here it's just the **router**, the filter that actually applies the route\ndecision and forwards upstream. **The router is always last.** In Module 04 we'll add filters\n*before* it (CORS, auth, fault injection); each gets to inspect/modify the request on its way to\nthe router.\n\n### 5. The cluster\n\n```yaml\nclusters:\n- name: echo_service\n  type: STRICT_DNS\n  lb_policy: ROUND_ROBIN\n  load_assignment:\n    cluster_name: echo_service\n    endpoints:\n    - lb_endpoints:\n      - endpoint:\n          address:\n            socket_address: { address: backend, port_value: 5678 }\n```\n\n- **`type: STRICT_DNS`**: how Envoy finds endpoints. `STRICT_DNS` means \"resolve this hostname\n  (`backend`) via DNS and use every IP it returns.\" (Docker's internal DNS resolves `backend` to\n  the echo container.) Other discovery types (STATIC, LOGICAL_DNS, EDS) are Module 05.\n- **`lb_policy: ROUND_ROBIN`**: spread requests across the cluster's endpoints. With one\n  endpoint it doesn't matter yet; in Module 05 you'll add a second and watch it alternate.\n- **`load_assignment.endpoints`**: the actual backend address(es). This is the `endpoint` noun\n  from Module 01.\n\n## Experiments (do these, they cement the model)\n\n1. **Watch the request flow.** Keep `docker compose up` in view and run `curl localhost:10000` a\n   few times. Each produces an access-log line in Envoy's output. That's step 6 of the lifecycle\n   you learned.\n\n2. **Break the backend, watch Envoy report it.** Stop just the backend:\n   `docker compose stop backend`, then `curl -v localhost:10000`. Envoy responds **503** with a\n   header `x-envoy-upstream-service-time` absent and a body like `no healthy upstream`: Envoy is\n   up, but it has nowhere to route. Restart it: `docker compose start backend`.\n\n3. **Add a second route.** In `envoy.yaml`, add a more specific route *above* the `prefix: \"/\"`\n   route that answers directly without touching the backend. Edit the whole `routes:` block so it\n   reads exactly like this; the two new lines must line up with the existing route:\n   ```yaml\n              routes:\n              - match: { prefix: \"/healthz\" }\n                direct_response: { status: 200, body: { inline_string: \"ok\\n\" } }\n              - match: { prefix: \"/\" }\n                route: { cluster: echo_service }\n   ```\n   Two things matter, or Envoy won't start:\n   - **Indentation:** each route is a list item beginning with `- ` at the *same* column; `match`\n     and its partner key (`direct_response` or `route`) sit two spaces further in, aligned under\n     each other.\n   - **One key per line:** `match:` and `direct_response:` are separate keys; never put them on the\n     same line. (Pasting them onto one line causes `yaml-cpp: error ... end of map not found`.)\n\n   Restart (`Ctrl-C`, then `docker compose up` again) and `curl localhost:10000/healthz` → `ok`,\n   while `curl localhost:10000/` still hits the backend. **Route order matters**: Envoy uses the\n   first match, so specific routes go above the catch-all.\n\n4. **See the whole running config.** `curl -s localhost:9901/config_dump | less`. This is the\n   *effective* config Envoy is running, invaluable for debugging (Module 10). Notice it's the\n   same objects you wrote, expanded with defaults.\n\n## What you now understand\n\nYou have run Envoy, traced a request through a listener → HCM → route → cluster → endpoint, met\nthe admin interface, and seen route ordering and the 503-on-no-backend behavior. Every later\nmodule adds capability to *these same objects*."}, {"id": "03-listeners-filter-chains-tls", "title": "3 · Listeners, filter chains & TLS", "group": "Fundamentals", "md": "*Concepts + a TLS lab. You'll make Envoy speak HTTPS. ~20 min. Requires Docker + `openssl`.*\n\nLab files: [`labs/03-tls/`](https://github.com/rcbart/dojo/tree/main/envoy-crash-course/labs/03-tls).\n\n---\n\n## Listeners, in depth\n\nA **listener** is a bound socket (address + port) plus the pipeline that processes what arrives\nthere. You can have many listeners, e.g. `:80` (HTTP), `:443` (HTTPS), `:15001` (a mesh\nsidecar's intercept port). Key parts:\n\n- **`address.socket_address`**: the IP and port to bind. `0.0.0.0` = all interfaces.\n- **`filter_chains`**: one or more processing pipelines. A listener with several filter chains\n  chooses *which one* to use per connection via **`filter_chain_match`** (below).\n- **`listener_filters`**: a special early stage that runs *before* the filter chain is chosen,\n  used to peek at the connection (e.g. read the TLS SNI or the original destination) so Envoy can\n  match the right chain.\n\n### TCP proxy vs HTTP proxy, the filter chain decides\n\nThe listener itself is protocol-agnostic; what makes it \"an HTTP listener\" is that its filter\nchain's network filter is the **HTTP Connection Manager**. Swap that for the **TCP proxy** filter\n(`envoy.filters.network.tcp_proxy`) and the same listener becomes a dumb-but-fast L4 forwarder\n(great for databases, raw TCP, or passing TLS through untouched). So:\n\n- **L7 / HTTP** → filter chain uses `http_connection_manager` (parses HTTP, has routes + HTTP\n  filters). *This is 90% of what you'll write.*\n- **L4 / TCP** → filter chain uses `tcp_proxy` (just pipes bytes to a cluster; no HTTP awareness).\n\n## Filter-chain matching (one listener, many behaviors)\n\nA single listener can host multiple filter chains and pick one per connection using\n`filter_chain_match`. The most common match key is **SNI**, the hostname the client requested\ninside the TLS handshake (Server Name Indication). This is how one `:443` listener serves\ndifferent certs/backends for `api.example.com` vs `www.example.com`:\n\n```yaml\nfilter_chains:\n- filter_chain_match: { server_names: [\"api.example.com\"] }\n  transport_socket: { ...api cert... }\n  filters: [ ...route to api backends... ]\n- filter_chain_match: { server_names: [\"www.example.com\"] }\n  transport_socket: { ...www cert... }\n  filters: [ ...route to web backends... ]\n```\n\nOther match keys: destination port, source IP ranges, ALPN protocols. You don't need these yet;\njust know that \"how does one port serve many sites?\" is answered by filter-chain matching on SNI.\n\n## TLS: the `transport_socket`\n\nWhere a filter chain *processes* the decoded stream, the **`transport_socket`** controls how\nbytes are *encrypted on the wire*. Two directions:\n\n- **`DownstreamTlsContext`**: TLS toward **clients** (Envoy is the TLS *server*; it presents a\n  cert). This is **TLS termination**: HTTPS in, decrypted, then plain HTTP to the backend.\n- **`UpstreamTlsContext`**: TLS toward **backends** (Envoy is the TLS *client*; it verifies the\n  backend's cert). This is **TLS origination**, used when the backend requires HTTPS, and it's\n  the basis of mesh **mTLS** (Module 09), where both directions use certs.\n\nDefault (no transport socket) is plaintext, which is what Lab 02 used.\n\n## Lab: terminate TLS at Envoy\n\nWe'll turn the Lab 02 setup into HTTPS: clients speak TLS to Envoy on `:10000`; Envoy decrypts and\nproxies plain HTTP to the echo backend.\n\n### 1. Make a self-signed certificate\n\nFirst move into this lab's folder (each lab has its own). From the course root:\n\n```bash\ncd labs/03-tls          # if you're in another lab, e.g. labs/02-static, use: cd ../03-tls\nls                      # you should see gen-certs.sh, envoy.yaml, docker-compose.yaml\nchmod +x gen-certs.sh\n./gen-certs.sh          # writes cert.pem and key.pem (CN=localhost, valid 1 year)\n```\n\n> If `chmod` says `No such file or directory`, you're not in `labs/03-tls/`; the `ls` above\n> should list `gen-certs.sh`. `cd` into the right folder and try again.\n\nSelf-signed certs are perfect for learning; real deployments use a CA (Let's Encrypt, an internal\nPKI, or, in a mesh, the mesh's own CA).\n\n### 2. Read the TLS bit of the config\n\nThe only new thing vs Lab 02 is the **`transport_socket`** on the filter chain\n([`envoy.yaml`](https://github.com/rcbart/dojo/blob/main/envoy-crash-course/labs/03-tls/envoy.yaml)):\n\n```yaml\nfilter_chains:\n- transport_socket:\n    name: envoy.transport_sockets.tls\n    typed_config:\n      \"@type\": type.googleapis.com/…v3.DownstreamTlsContext\n      common_tls_context:\n        tls_certificates:\n        - certificate_chain: { filename: /etc/envoy/certs/cert.pem }\n          private_key:       { filename: /etc/envoy/certs/key.pem }\n  filters:\n  - name: envoy.filters.network.http_connection_manager\n    ...\n```\n\nEverything under `filters:` (the HCM, routes, router) is *identical* to Lab 02; TLS is a\nseparate concern layered *under* the HTTP processing. That separation (transport vs application)\nis a recurring Envoy theme.\n\n### 3. Run and test\n\nFirst make sure no earlier lab is still holding port 10000 (only one can use it at a time):\n\n```bash\ndocker ps                     # if another lab's Envoy is on :10000, stop it first:\n# cd ../02-static && docker compose down     # then come back: cd ../03-tls\n```\n\nNow start this lab:\n\n```bash\ndocker compose up\n```\n\nIf you see `port is already allocated`, another lab is still running; `docker compose down` it,\nthen `docker compose up` here again.\n\n> **Seeing `curl: (35) ... wrong version number`?** That means you're hitting a *plaintext* server\n> on :10000 (usually a previous lab still running) with an `https://` request. Stop the other lab as\n> above so this TLS lab owns the port.\n\nThen:\n\n```bash\ncurl -k https://localhost:10000\n# → hello over TLS\n```\n\nThe `-k` tells curl to accept the self-signed cert (it isn't signed by a trusted CA).\n\n> **macOS gotcha.** Apple's built-in `curl` is built on **LibreSSL**, which can fail the handshake\n> with `curl: (35) ... tlsv1 alert protocol version`. That's a client quirk, not an Envoy problem.\n> Force TLS 1.2 and it works:\n> ```bash\n> curl -k --tlsv1.2 --tls-max 1.2 https://localhost:10000\n> ```\n> Simplest of all is to just open <https://localhost:10000> in a browser and click past the\n> self-signed warning.\n>\n> Installing a modern curl works too, but note Homebrew's curl is **keg-only**: after\n> `brew install curl` the plain `curl` command still runs Apple's LibreSSL one (`curl -V` shows\n> which). Call the Homebrew build by full path, or put it first on your PATH:\n> ```bash\n> /opt/homebrew/opt/curl/bin/curl -k https://localhost:10000     # Apple Silicon (Intel: /usr/local/opt/curl/bin)\n> # or, for the session:\n> export PATH=\"/opt/homebrew/opt/curl/bin:$PATH\"\n> curl -V   # should now say OpenSSL, then:  curl -k https://localhost:10000\n> ```\n\nInspect the certificate Envoy presents (this works regardless of the curl quirk):\n\n```bash\ncurl -kv https://localhost:10000 2>&1 | grep -Ei \"subject|issuer|SSL connection\"\nopenssl s_client -connect localhost:10000 -servername localhost </dev/null 2>/dev/null | openssl x509 -noout -subject -dates\n```\n\nYou'll see the `CN=localhost` cert and that Envoy negotiated TLS. The **backend never saw TLS**:\nEnvoy terminated it and spoke plain HTTP inward. Confirm in the `docker compose` logs: the backend\nlogs a normal HTTP request.\n\n### Experiments\n\n1. **Prove termination.** The backend (`hashicorp/http-echo`) only speaks HTTP; yet clients got\n   HTTPS. Envoy did the crypto. This is exactly the edge-gateway job: one place holds the certs.\n2. **A plaintext request to a TLS port fails cleanly.** `curl http://localhost:10000` (note:\n   `http`, not `https`) → curl errors / the connection resets, because the listener expects a TLS\n   handshake. Try it to see the difference.\n3. **(Optional) HTTP→HTTPS redirect.** Real gateways run a second listener on `:80` whose route\n   is a `redirect: { https_redirect: true }`, bouncing plain requests to HTTPS. Skim the routing\n   options in Module 04, then you could add it."}, {"id": "04-http-routing-and-filters", "title": "4 · HTTP routing & filters", "group": "Fundamentals", "md": "*The heart of everyday Envoy work. Concepts + a lab exercising real routing rules and an HTTP\nfilter. ~25 min. Requires Docker.*\n\nLab files: [`labs/04-routing/`](https://github.com/rcbart/dojo/tree/main/envoy-crash-course/labs/04-routing).\n\n---\n\nAlmost all the config you'll ever write lives in two places inside the HTTP Connection Manager:\nthe **route configuration** (where requests go) and the **HTTP filter chain** (what happens to\nthem on the way). This module covers both.\n\n## Route configuration structure\n\n```\nroute_config\n└── virtual_hosts[]        ← selected by the request's Host header (domains)\n    └── routes[]           ← ordered match rules; FIRST match wins\n        ├── match          ← what makes this route apply\n        └── route / redirect / direct_response   ← what to do\n```\n\n### Matching a route (`match`)\n\nA route's `match` can test, in increasing specificity:\n\n- **`prefix: \"/api/\"`**: path starts with this. The workhorse.\n- **`path: \"/healthz\"`**: exact path.\n- **`safe_regex: {...}`**: regex on the path (use sparingly; slower).\n- **`headers: [...]`**: require header values (exact, prefix, regex, presence). Great for\n  canaries (`x-canary: yes`), API versions, auth gating.\n- **`query_parameters: [...]`**: match on `?foo=bar`.\n\n**Order matters: Envoy takes the first route that matches.** So specific routes go above the\ncatch-all `prefix: \"/\"`. Getting a \"wrong backend\" is nearly always a route-order bug.\n\n### What to do when it matches\n\n- **`route: { cluster: X }`**: forward to a cluster. Plus options:\n  - **`prefix_rewrite` / `regex_rewrite`**: change the path before sending upstream\n    (e.g. strip `/api`).\n  - **`host_rewrite_literal`**: change the `Host` header sent upstream.\n  - **`timeout`, `retry_policy`**: per-route resilience (Module 05).\n  - **`request_headers_to_add`, `response_headers_to_add`**: header manipulation (also settable\n    at the virtual-host and route-config levels).\n- **`redirect: {...}`**: send a 301/302 (change scheme to https, rewrite path/host).\n- **`direct_response: {...}`**: Envoy answers itself without any backend (health checks, canned\n  errors, maintenance pages).\n\n## HTTP filters, the request pipeline\n\nInside the HCM, `http_filters` is an **ordered** list; each request passes through them before\nthe **router** (which must be last). A filter can read, modify, delay, or reject a request. The\nones you'll actually meet:\n\n| Filter | Job |\n|--------|-----|\n| `router` | Applies the route and forwards upstream. **Always last.** |\n| `cors` | Cross-Origin Resource Sharing headers/preflight handling |\n| `jwt_authn` | Verify a JWT (auth) and reject invalid tokens |\n| `ext_authz` | Call an **external** authorization service (allow/deny per request) |\n| `ratelimit` / `local_ratelimit` | Global (via a service) or local request rate limiting |\n| `fault` | Inject latency or aborts, for **resilience testing** (chaos) |\n| `compressor` | gzip/brotli response compression |\n| `lua` / `wasm` | Custom logic in Lua or WebAssembly |\n| `ext_proc` | Stream requests to an external processor to mutate them |\n\nYou compose behavior by stacking filters, e.g. `cors → jwt_authn → ratelimit → router`. Each is\njust another `typed_config` block.\n\n## Lab: routing rules + a fault filter\n\nThe lab config ([`envoy.yaml`](https://github.com/rcbart/dojo/blob/main/envoy-crash-course/labs/04-routing/envoy.yaml)) sets up several behaviors on one\nlistener. Run it:\n\n```bash\ncd labs/04-routing && docker compose up   # first `docker compose down` the previous lab, labs share ports 10000/9901\n```\n\nNow exercise each rule (in another terminal):\n\n**1. A direct response (no backend):**\n```bash\ncurl -i localhost:10000/healthz\n# HTTP/1.1 200 OK ... body: ok   — Envoy answered directly\n```\n\n**2. A response header added by config:**\n```bash\ncurl -i localhost:10000/ | grep -i x-served-by\n# x-served-by: envoy-crash-course   — added by response_headers_to_add\n```\n\n**3. A redirect:**\n```bash\ncurl -i localhost:10000/old\n# HTTP/1.1 301 Moved Permanently ... location: /new\n```\n\n**4. Header-based (canary) routing.** The `/` route only matches when `x-canary: yes` is present;\notherwise the request falls through to the final catch-all. Both reach the backend here, but note\nthe *matched route differs*:\n```bash\ncurl -s localhost:10000/ -H \"x-canary: yes\"     # matches the canary route (adds x-route: canary upstream)\ncurl -s localhost:10000/                        # falls through to the catch-all route\n```\n\n**5. Path rewrite:**\n```bash\ncurl -s localhost:10000/api/anything\n# reaches the backend as \"/\" because prefix_rewrite stripped /api\n```\n\n**6. Fault injection: deliberate failure.** The `fault` filter aborts `/flaky` with 503 half the\ntime. Hammer it and watch the mix:\n```bash\nfor i in $(seq 1 10); do curl -s -o /dev/null -w \"%{http_code}\\n\" localhost:10000/flaky; done\n# ~5x 200 and ~5x 503: Envoy injected the failures, the backend never saw them\n```\nThis is how teams test that *callers* handle failures (retries, fallbacks) without breaking a real\nbackend; it is chaos engineering as config.\n\n### Experiment\n\nReorder the routes: move the catch-all `prefix: \"/\"` route to the **top** of the list, restart,\nand re-test `/healthz`. It now returns the backend's echo instead of `ok`, because the catch-all\nmatched first. Put it back. This is the single most common Envoy routing mistake: **specific\nroutes above general ones.**"}, {"id": "11-rate-limiting-ext-authz", "title": "4b · Rate limiting & ext_authz", "group": "Fundamentals", "md": "*The two filters that turn Envoy from a router into a policy edge: limiting how often, and deciding who. ~12 min read.*\n\n---\n\nModule 4 showed the HTTP filter chain and name-dropped two filters that deserve their own module,\nbecause together they are how Envoy becomes the enforcement point for the fundamentals course's\n\"API gateway SHOULD list\": **rate limiting** (how often may you call) and **external\nauthorization** (may you call at all).\n\n## Local rate limiting: the circuit breaker for abuse\n\nThe simplest protection lives entirely inside one Envoy: a **token bucket** per proxy.\n\n```yaml\nhttp_filters:\n- name: envoy.filters.http.local_ratelimit\n  typed_config:\n    \"@type\": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit\n    stat_prefix: rl\n    token_bucket: { max_tokens: 100, tokens_per_fill: 100, fill_interval: 1s }\n    filter_enabled:  { default_value: { numerator: 100 } }\n    filter_enforced: { default_value: { numerator: 100 } }\n```\n\nEach request takes a token; an empty bucket means **429 Too Many Requests**. The bucket refills at\na steady rate, so bursts up to `max_tokens` pass but the *sustained* rate is capped. Two things to\nnotice: the `filter_enabled` / `filter_enforced` pair lets you run in **shadow mode**: count and\nlog what *would* be limited before you turn it on, the same observe-then-enforce habit every\nmodule of this course keeps preaching; and \"local\" means **per Envoy instance**: ten sidecars\neach allowing 100 rps allow 1,000 rps in total. Local limiting is the right tool for protecting\n*this* process (and as a backstop when fancier systems fail). It cannot express a *global* truth.\n\n## Global rate limiting: one count, many proxies\n\n\"Free tier: 1,000 requests/hour per API key\" is a promise about a **customer**, not a proxy, so\nsomewhere, one counter must exist. Envoy's answer is a **rate limit service**: each Envoy sends\nthe request's **descriptors** (key-value facts you choose: the API key, the route, the client IP)\nto a central gRPC service that keeps the counters (typically in Redis) and answers allow/deny.\n\n```yaml\n# route-level: what facts to send\nrate_limits:\n- actions:\n  - request_headers: { header_name: x-api-key, descriptor_key: api_key }\n```\n\nThe mental model: **Envoy contributes facts, the service owns arithmetic.** Your quota logic\n(tiers, overrides, spike allowances) lives in the service's config, not scattered through proxy\nYAML. The cost is a network hop on the request path, so the filter's `failure_mode_deny` choice\nmatters: deny-on-failure protects the backend even when the limiter dies, allow-on-failure\nprotects availability; pick per route, deliberately. In practice: local limits everywhere as the\ncrude backstop, global limits where a promise to a *customer* is being kept; both at once is the\nproduction configuration.\n\n## ext_authz: authentication decisions, outsourced\n\nThe **external authorization** filter pauses each request and asks another service: *may this\nproceed?* The check service sees the request's metadata (method, path, headers) and answers:\nallow (optionally adding headers) or deny (with a status and body Envoy returns verbatim).\n\n```yaml\n- name: envoy.filters.http.ext_authz\n  typed_config:\n    \"@type\": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz\n    grpc_service: { envoy_grpc: { cluster_name: authz_service } }\n    failure_mode_allow: false        # authz down => requests DENIED. For auth: yes.\n```\n\nWhy this design is the important part: the proxy **enforces**, the service **decides**. Your token\nvalidation (parse the JWT, check the signature against the IdP's keys, verify `iss`/`aud`/`exp`,\nmap scopes to permissions, all of it Identity Dojo material) lives in one small service you own,\nin a real language, tested like code. Envoy guarantees *no request skips the check*: the filter\nruns before routing, so there is no forgotten endpoint, no service that \"didn't add the\nmiddleware.\" That inversion, every service trusting a header like `x-user-id` *because ext_authz\nis the only thing that can set it* (list it in `internal_only_headers` / strip it from client\nrequests), is how \"authenticate at the edge, authorize in the service\" is actually implemented.\n\nThe pattern scales down as well as up: on the mesh's sidecars, the same filter enforces\nservice-to-service policy: Istio's `AuthorizationPolicy` (its course, module 6) compiles to\nexactly this machinery inside each sidecar's Envoy.\n\n## The order of the chain\n\nPolicy filters compose by position, and the conventional order is a security statement:\n\n```\njwt_authn / ext_authz  →  ratelimit  →  router\n   who are you?           how often?     where to?\n```\n\nAuthenticate first so limits can count *identities* rather than IPs (an attacker with a botnet has\nmany IPs; a free-tier customer has one API key). And both before the router, because policy that\nruns after routing decisions can be dodged by route quirks. When a policy filter misbehaves, the\ndebugging tools are module 6's: `/stats | grep ratelimit` (look for `over_limit` vs `ok`), access\nlogs with the response flags: `RL` marks a rate-limited request, `UAEX` an unauthorized one."}, {"id": "05-clusters-load-balancing-resilience", "title": "5 · Clusters, LB & resilience", "group": "Fundamentals", "md": "*How Envoy picks a healthy backend and survives failures. Concepts + a two-backend lab. ~25 min.\nRequires Docker.*\n\nLab files: [`labs/05-clusters/`](https://github.com/rcbart/dojo/tree/main/envoy-crash-course/labs/05-clusters).\n\n---\n\nA **cluster** is Envoy's model of an upstream service: a named group of **endpoints** (host:port)\nplus the policy for choosing among them and deciding which are healthy. If routes answer \"where\ndoes this request go?\", clusters answer \"*which instance*, and what if it's down?\"\n\n## Endpoint discovery: how Envoy learns the members\n\nThe cluster `type` sets how the endpoint list is populated:\n\n- **`STATIC`**: endpoints are literal IP:ports in the config.\n- **`STRICT_DNS`**: Envoy resolves a DNS name and uses *all* returned A records, re-resolving\n  periodically. Perfect for Docker/Kubernetes service names (what our labs use).\n- **`LOGICAL_DNS`**: like STRICT but keeps one connection, re-resolving lazily (for huge\n  fleets / a single virtual IP).\n- **`EDS`**: Endpoint Discovery Service: endpoints pushed dynamically over xDS by a control plane\n  (Module 07). This is how meshes keep up with pods coming and going.\n\n## Load balancing policies (`lb_policy`)\n\nOnce there are several healthy endpoints, `lb_policy` picks one per request:\n\n- **`ROUND_ROBIN`**: rotate evenly. Simple, predictable.\n- **`LEAST_REQUEST`**: send to the endpoint with the fewest in-flight requests. Usually the best\n  default under uneven load.\n- **`RANDOM`**: pick at random; cheap, decent at scale.\n- **`RING_HASH` / `MAGLEV`**: consistent hashing on a key (e.g. a header or cookie) for **session\n  affinity** (\"sticky\" routing to the same backend).\n\n## Resilience: three layers that keep bad backends out\n\n**1. Active health checks**: Envoy proactively probes each endpoint (`http_health_check` hits a\npath on an interval). Fail enough probes → the endpoint is marked unhealthy and gets no traffic\nuntil it recovers. Proactive: catches a sick backend *before* a user hits it.\n\n**2. Outlier detection (passive health checking)**: Envoy watches *real* traffic and **ejects**\nan endpoint that returns too many consecutive 5xx / connection errors, for a cooldown\n(`base_ejection_time`), then tentatively returns it. Reactive: catches failures the health check\npath doesn't.\n\n**3. Timeouts & retries (per route)**: a `timeout` caps how long Envoy waits; a `retry_policy`\nre-sends a failed idempotent request to *another* endpoint (`retry_on: 5xx,reset,\nconnect-failure`). Retries + multiple endpoints = a single bad instance becomes invisible to the\ncaller.\n\nTogether with **circuit breakers** (caps on concurrent connections/requests so one overloaded\ncluster can't exhaust Envoy), these are the reason Envoy is described as a *resilience* layer, not\njust a router.\n\n## Lab: load-balance and survive a failure\n\nTwo identical-ish backends (A and B) sit behind one cluster. Run it:\n\n```bash\ncd labs/05-clusters && docker compose up   # first `docker compose down` the prev
