ious lab, labs share ports 10000/9901\n```\n\n**1. Watch round-robin spread the load:**\n```bash\nfor i in $(seq 1 6); do curl -s localhost:10000; done\n# alternates: response from backend A / backend B / A / B ...\n```\n\n**2. Kill a backend and watch Envoy route around it.** In another terminal:\n```bash\ndocker compose stop backend_b\nfor i in $(seq 1 6); do curl -s localhost:10000; done\n# now every response is \"backend A\": B was health-checked out, no client errors\n```\nBring it back and traffic rebalances:\n```bash\ndocker compose start backend_b\n```\n\n**3. See health in the admin API:**\n```bash\ncurl -s localhost:9901/clusters | grep -E \"health_flags|::cx_\"\n# endpoints show healthy / failed_active_hc / ejected state\n```\n\n### Experiments\n\n1. **Change the policy.** Set `lb_policy: LEAST_REQUEST` (or `RANDOM`), restart, re-run the loop.\n   With two idle backends the visible behavior is similar; the difference shows under uneven load.\n2. **Trip outlier detection.** Point one endpoint at a backend that returns 503 (e.g. add a route\n   in that backend, or reuse Lab 04's `/flaky`) and watch `consecutive_5xx` eject it in\n   `/clusters`.\n3. **Turn off retries.** Remove the `retry_policy`, stop a backend *mid-loop*, and you'll see the\n   occasional 503 slip through that retries would have hidden."}, {"id": "06-observability-and-admin", "title": "6 · Observability & admin", "group": "Fundamentals", "md": "*Envoy's superpower is that it sees every request. This module is how you look. Concepts +\nhands-on using the admin API of any lab you already have running. ~20 min.*\n\nNo new lab: start any earlier stack (`labs/02-static/`, `labs/04-routing/`, or\n`labs/05-clusters/`) with `docker compose up` and follow along.\n\n---\n\nBecause every request passes through Envoy, it's a natural place to emit telemetry. Envoy gives\nyou the classic **three pillars** (logs, metrics, traces) plus a live **admin interface** for\nintrospection.\n\n## The admin interface (port 9901)\n\nEvery lab config has an `admin:` block on `:9901`. It exposes dozens of endpoints; the ones you'll\nuse constantly:\n\n| Endpoint | What it gives you |\n|----------|-------------------|\n| `GET /ready` | Liveness/health of Envoy itself (200 = serving) |\n| `GET /stats` | **All** metrics, in Prometheus-ish text |\n| `GET /stats/prometheus` | Metrics in Prometheus exposition format (for scraping) |\n| `GET /clusters` | Every endpoint's health, in-flight requests, ejection state |\n| `GET /config_dump` | The **entire effective config** as JSON, invaluable for xDS debugging |\n| `GET /listeners` | Bound listeners and their addresses |\n| `GET /server_info` | Version, uptime, state, hot-restart epoch |\n| `POST /logging?level=debug` | Change log level live, no restart |\n| `POST /quitquitquit` | Graceful shutdown |\n\n> ⚠️ **The admin interface exposes secrets-adjacent data and control endpoints. Never bind it to a\n> public address.** In production, bind it to `127.0.0.1` or a localhost-only socket. In our labs\n> it's on `0.0.0.0` purely for convenience.\n\nTry it now against a running lab:\n\n```bash\ncurl -s localhost:9901/ready              # → LIVE\ncurl -s localhost:9901/server_info | head\ncurl -s localhost:9901/clusters | head\n```\n\n## Metrics (stats)\n\nEnvoy tracks **counters**, **gauges**, and **histograms** for practically everything. Names are\ndotted and namespaced by the `stat_prefix` you set on the HCM and by cluster name. Send a couple\nof requests, then:\n\n```bash\ncurl -s localhost:9901/stats | grep -E \"ingress_http\\.(downstream_rq_total|downstream_rq_2xx|downstream_rq_5xx)\"\ncurl -s localhost:9901/stats | grep -E \"cluster\\.echo_service\\.(upstream_rq_total|upstream_cx_active|upstream_rq_pending)\"\n```\n\nKey families to know:\n\n- **`http.<stat_prefix>.downstream_rq_*`**: requests *from clients*: totals and by response class\n  (`_2xx`, `_4xx`, `_5xx`), active connections, request time histograms.\n- **`cluster.<name>.upstream_rq_*` / `upstream_cx_*`**: requests/connections *to backends*,\n  including `upstream_rq_retry`, `_pending_overflow` (circuit breaker trips), and per-endpoint\n  health.\n- **`server.*`**: memory, uptime, live connections.\n\nThe **RED method** (Rate, Errors, Duration) maps directly: rate = `downstream_rq_total`, errors =\n`downstream_rq_5xx`, duration = the `downstream_rq_time` histogram. In production you scrape\n`/stats/prometheus` into Prometheus and graph these in Grafana.\n\n## Access logs\n\nEach lab enables the **stdout access logger** on the HCM, so `docker compose` logs show one line\nper request. The default format includes method, path, response code, bytes, durations, upstream\nhost, and more. You can set a **custom format** with **command operators** like `%RESPONSE_CODE%`,\n`%DURATION%`, `%UPSTREAM_HOST%`, `%REQ(:PATH)%`, `%RESPONSE_FLAGS%`:\n\n```yaml\naccess_log:\n- name: envoy.access_loggers.stdout\n  typed_config:\n    \"@type\": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog\n    log_format:\n      text_format_source:\n        inline_string: \"%START_TIME% %REQ(:METHOD)% %REQ(:PATH)% %RESPONSE_CODE% %RESPONSE_FLAGS% %DURATION%ms upstream=%UPSTREAM_HOST%\\n\"\n```\n\n**`%RESPONSE_FLAGS%` is the debugging goldmine**: short codes explain *why* a request ended a\ncertain way: `UH` (no healthy upstream), `UF` (upstream connection failure), `UT` (upstream\ntimeout), `NR` (no route configured), `URX` (retry limit hit), `DC` (downstream disconnect). When\nsomething's wrong, read the flag first.\n\n## Distributed tracing (brief)\n\nEnvoy can generate/propagate trace spans (B3 / W3C `traceparent` headers) and report them to\nJaeger, Zipkin, or an OpenTelemetry collector. Enable it with a `tracing:` block on the HCM and\nset a sampling percentage. Because the sidecar sits on every hop, an Envoy mesh gives you\nend-to-end traces across services with no app code changes, a major reason teams adopt it. Full\nsetup (running a collector) is beyond this crash course, but know that it's config, not code.\n\n## Lab tasks\n\n1. Send 10 requests to a running lab, then diff `downstream_rq_total` before/after via `/stats`.\n2. Break a backend (Lab 05: `docker compose stop backend_b`) and watch `upstream_rq_retry` and the\n   `%RESPONSE_FLAGS%` in the access log change.\n3. Flip log level live: `curl -s -X POST localhost:9901/logging?level=debug`, send a request, see\n   the verbose logs, then set it back to `info`."}, {"id": "07-dynamic-config-xds", "title": "7 · Dynamic config (xDS)", "group": "Fundamentals", "md": "*The idea that makes Envoy a platform, not just a proxy. Concepts + a hot-reload lab. ~25 min.\nRequires Docker.*\n\nLab files: [`labs/07-xds/`](https://github.com/rcbart/dojo/tree/main/envoy-crash-course/labs/07-xds).\n\n---\n\nSo far every config has been **static**: listeners and clusters written in the file, changed only\nby editing and restarting. That's fine for a single edge proxy. But a fleet of hundreds of\nsidecars, with pods appearing and disappearing every second, can't be managed by editing files by\nhand. **xDS** is Envoy's answer.\n\n## What xDS is\n\n**xDS** = the \"**x** Discovery Service\" APIs: a family of APIs by which Envoy *fetches its\nconfiguration from an external source at runtime* and updates **without restarting**. Each config\nobject type has its own discovery service:\n\n| API | Discovers | \"x\" stands for |\n|-----|-----------|----------------|\n| **LDS** | Listeners | Listener |\n| **RDS** | Routes (route configs) | Route |\n| **CDS** | Clusters | Cluster |\n| **EDS** | Endpoints (per cluster) | Endpoint |\n| **SDS** | Secrets (TLS certs) | Secret |\n| **ADS** | *All of the above over one stream, ordered* | Aggregated |\n\nThe thing serving these APIs is a **control plane** (Module 08/09): Istio, Gloo, Contour,\nKuma/Consul, or a custom one built on Envoy's `go-control-plane`. Envoy is the **data plane** that\nsubscribes; the control plane **pushes** updates. This split is the whole architecture from Module\n00 made concrete.\n\n### Where the config can come from\n\nAn xDS `ConfigSource` can be:\n\n- **A gRPC stream** to a control plane (`api_config_source`/ADS): the real-world production path;\n  the control plane streams updates as the world changes.\n- **A watched file** (`path_config_source`): Envoy watches a file/dir and reloads on change. No\n  control plane needed. This is what our lab uses, because it demonstrates the *dynamic* behavior\n  with nothing but a text editor.\n\nBoth deliver the same typed resources; only the transport differs.\n\n## The bootstrap\n\nA dynamic Envoy still needs a tiny **bootstrap** config to start: its `node` identity, the `admin`\nblock, and, instead of `static_resources`, a **`dynamic_resources`** block pointing LDS and CDS\nat their sources. See [`bootstrap.yaml`](https://github.com/rcbart/dojo/blob/main/envoy-crash-course/labs/07-xds/bootstrap.yaml):\n\n```yaml\ndynamic_resources:\n  lds_config: { path_config_source: { path: /etc/envoy/lds.yaml, watched_directory: {...} } }\n  cds_config: { path_config_source: { path: /etc/envoy/cds.yaml, watched_directory: {...} } }\n```\n\nThe listeners live in [`lds.yaml`](https://github.com/rcbart/dojo/blob/main/envoy-crash-course/labs/07-xds/lds.yaml) and clusters in\n[`cds.yaml`](https://github.com/rcbart/dojo/blob/main/envoy-crash-course/labs/07-xds/cds.yaml), each a `resources:` list of typed objects: exactly the same\nListener/Cluster shapes you've been writing, just delivered dynamically.\n\n## Lab: change config with no restart\n\n```bash\ncd labs/07-xds && docker compose up   # first `docker compose down` the previous lab, labs share ports 10000/9901\n```\n\nConfirm it works like before:\n\n```bash\ncurl -s localhost:10000            # hello from the backend  (via the dynamic cluster)\ncurl -s localhost:10000/version    # v1                      (a dynamic direct_response)\n```\n\n**Now edit `lds.yaml` on your host**: change the `/version` body from `v1` to `v2`, save. Within\na second or two, **without touching the container**:\n\n```bash\ncurl -s localhost:10000/version    # v2   ← Envoy hot-reloaded the listener\n```\n\nWatch the Envoy logs during the save; you'll see it detect the change and add/warm the updated\nlistener. Confirm via the admin API that the config is live:\n\n```bash\ncurl -s localhost:9901/config_dump | grep -A2 '\"version\"'   # dynamic resources with versions\ncurl -s localhost:9901/stats | grep -E \"listener_manager\\.(lds|listener_added|listener_modified)\"\n```\n\n### Experiments\n\n1. **Add a route live.** In `lds.yaml`, add a new `direct_response` route (e.g. `/health` → `ok`)\n   *above* the catch-all, save, and curl it; it appears with no restart.\n2. **Change a backend live.** Edit `cds.yaml` to point the cluster at a different address, save,\n   watch `/clusters` update. This is EDS-by-hand, exactly what a control plane automates when pods\n   move.\n3. **Break it and recover.** Introduce a YAML typo in `lds.yaml`, save, and watch Envoy **reject\n   the bad update and keep serving the last good config** (check the logs and\n   `listener_manager.lds.update_rejected` stat). Graceful rejection is a key safety property of\n   xDS; a bad push doesn't take you down.\n\n## Why this matters\n\nEverything in Modules 08–09 (Kubernetes ingress, service mesh) is *just a control plane feeding\nxDS to Envoys*. Istio's `istiod` watches the Kubernetes API and streams LDS/RDS/CDS/EDS to every\nsidecar. Once you've seen a file edit hot-reload a listener, you understand the mesh: replace \"you\nediting a file\" with \"a control plane reacting to the cluster state,\" and the mechanism is\nidentical."}, {"id": "08-envoy-on-kubernetes", "title": "8 · Envoy on Kubernetes", "group": "Platform", "md": "*Where Envoy actually lives in modern infra. Concepts + a real kind + Envoy Gateway lab. ~30 min.\nRequires Docker, `kind`, `kubectl`, and `helm`.*\n\nLab files: [`labs/08-k8s/`](https://github.com/rcbart/dojo/tree/main/envoy-crash-course/labs/08-k8s).\n\n---\n\nYou rarely deploy raw Envoy on Kubernetes by hand. Instead a **control plane** watches the\nKubernetes API and configures Envoy for you via xDS (Module 07). Envoy shows up on Kubernetes in\nthree shapes:\n\n1. **Ingress / API gateway**: one pool of Envoys at the cluster edge, routing outside traffic to\n   Services. Implemented by **Envoy Gateway**, **Contour**, **Gloo**, or Istio's ingress gateway.\n2. **Service-mesh sidecar**: an Envoy injected next to *every* pod, handling that pod's traffic\n   (Module 09).\n3. **Standalone Deployment**: you run Envoy as a normal Deployment with a hand-written config in a\n   ConfigMap. Rare, but shows the plumbing.\n\n## The Gateway API (the modern way)\n\nKubernetes' original `Ingress` resource was too limited (annotations everywhere, no good multi-team\nstory). The **Gateway API** replaced it and is now GA. It splits responsibilities into a few typed\nresources:\n\n| Resource | Owned by | Means |\n|----------|----------|-------|\n| **GatewayClass** | infra/platform team | \"Which controller implements gateways\" (e.g. Envoy Gateway) |\n| **Gateway** | platform team | An actual entry point: listeners, ports, protocols, TLS |\n| **HTTPRoute** | app teams | Routing rules: match paths/headers → backend Services |\n| **TLSRoute / GRPCRoute / TCPRoute** | app teams | Same idea for other protocols |\n\nThe clean separation (infra owns the Gateway, app teams own their Routes) is the main reason it\nwon. **Envoy Gateway** is the CNCF project that implements the Gateway API on top of Envoy: you\nwrite Gateway/HTTPRoute YAML, it generates Envoy xDS.\n\n## Lab: Envoy Gateway on a local kind cluster\n\nWe'll spin up a throwaway Kubernetes cluster, install Envoy Gateway, deploy an app, and route to it\nwith the Gateway API.\n\n### 1. Create the cluster\n\n```bash\ncd labs/08-k8s\nkind create cluster --name envoy-lab --config kind-cluster.yaml\nkubectl cluster-info --context kind-envoy-lab\n```\n\n### 2. Install Envoy Gateway (v1.4.x)\n\n```bash\nhelm install eg oci://docker.io/envoyproxy/gateway-helm --version v1.4.4 \\\n  -n envoy-gateway-system --create-namespace\nkubectl wait --timeout=5m -n envoy-gateway-system deployment/envoy-gateway --for=condition=Available\n```\n\n*(Check <https://gateway.envoyproxy.io> for the newest patch version; v1.4.x is current as of this\nwriting.)*\n\n### 3. Deploy the app + Gateway API resources\n\n[`app-and-route.yaml`](https://github.com/rcbart/dojo/blob/main/envoy-crash-course/labs/08-k8s/app-and-route.yaml) contains the echo Deployment/Service plus\nthe **GatewayClass**, **Gateway**, and **HTTPRoute**:\n\n```bash\nkubectl apply -f app-and-route.yaml\nkubectl get gateway eg          # wait for PROGRAMMED=True\nkubectl get httproute echo      # should show the parent Gateway accepted\n```\n\n### 4. Reach it from your laptop\n\nEnvoy Gateway created an Envoy Deployment + Service for your Gateway. The simplest way to hit it\nlocally is port-forward:\n\n```bash\n# Find the generated gateway service (name starts with envoy-):\nkubectl -n envoy-gateway-system get svc\nkubectl -n envoy-gateway-system port-forward svc/<that-envoy-service> 8888:80\n```\n\nThen, in another terminal:\n\n```bash\ncurl -s localhost:8888\n# hello from kubernetes   ← through Envoy, load-balanced across the 2 echo pods\n```\n\n### 5. See that it's really Envoy + xDS underneath\n\n```bash\n# The gateway pod IS an Envoy:\nkubectl -n envoy-gateway-system get pods\n# Envoy Gateway (the control plane) programs it via xDS, scale the app and watch endpoints update:\nkubectl scale deployment/echo --replicas=4\nkubectl get endpoints echo         # 4 endpoints; Envoy Gateway pushes them to Envoy via EDS\n```\n\nThis is Module 07 made real: you didn't edit an Envoy config; you changed a Kubernetes object, the\ncontrol plane noticed, and it streamed new endpoints to the data-plane Envoy.\n\n### Clean up\n\n```bash\nkind delete cluster --name envoy-lab\n```\n\n### Experiments\n\n1. **Header routing in Kubernetes.** Add a second HTTPRoute rule matching header `x-canary: yes` to\n   a different Service, apply, and curl with the header. Same routing power as Module 04, expressed\n   as Gateway API YAML.\n2. **Two teams, one gateway.** Add a second HTTPRoute (different path prefix, different Service) to\n   the same Gateway, demonstrating the platform-owns-Gateway / apps-own-Routes split.\n3. **Watch the generated Envoy config.** `kubectl -n envoy-gateway-system port-forward` the Envoy\n   admin port and `curl .../config_dump` to see the LDS/RDS/CDS your YAML produced."}, {"id": "09-service-mesh-sidecars", "title": "9 · Service mesh & sidecars", "group": "Platform", "md": "*The largest-scale way Envoy is deployed. Concepts + an optional hands-on with Istio. ~25 min.\nThe lab needs the Module 08 kind cluster + `istioctl` (optional; the concepts stand alone).*\n\n---\n\nModules 03–07 gave you every mechanism a mesh uses: listeners, routing, resilience, observability,\nand xDS. A **service mesh** is what you get when you apply all of that to **every service-to-service\ncall inside a cluster**, not just the edge.\n\n## The core idea: a proxy per workload\n\nGive **every** service instance its own Envoy, sitting directly beside it. The application talks\nonly to its local Envoy (localhost); the Envoy handles the real network. Because *both* ends of\nevery call are Envoys, the mesh can uniformly provide, with **zero application code**:\n\n- **mTLS everywhere**: every hop is mutually-authenticated TLS. Services get encryption + identity\n  for free (the `UpstreamTlsContext`/`DownstreamTlsContext` from Module 03, automated).\n- **Traffic policy**: retries, timeouts, circuit breaking, canary/traffic-splitting (Module 05),\n  applied by config, per route, across the whole fleet.\n- **Observability**: consistent metrics, logs, and distributed traces for *every* call (Module\n  06), since every hop passes through an Envoy.\n- **Authorization**: allow/deny which service may call which, by identity.\n\nThe mesh has the two halves you already know: the **data plane** (all those Envoys) and the\n**control plane** (which programs them via xDS). The dominant control plane is **Istio** (its\ncontrol-plane component is `istiod`); others include **Kuma/Consul** and Gloo Mesh. Linkerd is a\nmesh too, but uses its *own* Rust micro-proxy rather than Envoy.\n\n## Two data-plane modes (this is the current story)\n\nClassic meshes inject a full Envoy **sidecar** container into every pod. That model buys a lot but costs\nCPU/memory per pod and adds a hop of latency. Istio's newer **ambient mode** splits the job:\n\n- **Sidecar mode**: one Envoy per pod. Full L7 features everywhere; higher per-pod overhead.\n- **Ambient mode**: no per-pod sidecar. A per-node L4 proxy called **ztunnel** (written in Rust)\n  handles mTLS + L4 for all pods on the node cheaply; L7 features (HTTP routing, retries, L7\n  policy) are added only where needed via a **waypoint proxy**, *which is a full Envoy*, typically\n  one per namespace. So Envoy is still the L7 engine; it's just no longer in every pod.\n\nThe trade-off: ambient cuts resource use and latency dramatically and simplifies upgrades, at the\ncost of a more layered architecture. Sidecar mode remains simplest to reason about per-pod. Both\nare Envoy-powered at L7.\n\n## How a sidecar intercepts traffic\n\nIn sidecar mode, an init container programs iptables so the pod's outbound and inbound traffic is\ntransparently redirected to the Envoy's ports (commonly `:15001` outbound, `:15006` inbound). The\napp is unaware: it thinks it's talking directly to the other service; really every packet detours\nthrough the local Envoy, which applies mTLS and policy, then forwards. `istiod` streams each\nsidecar its config over xDS, keyed by the pod's identity and the mesh's routing rules.\n\n## Traffic management resources (Istio)\n\nOn top of (or alongside) the Gateway API, Istio adds CRDs that become Envoy config:\n\n- **VirtualService**: routing rules (match → destination, weighted splits, retries, faults),\n  Module 04/05 concepts as mesh YAML.\n- **DestinationRule**: per-destination policy: load-balancer choice, connection pools, outlier\n  detection, subsets (versions), all Module 05 concepts.\n- **PeerAuthentication / AuthorizationPolicy**: mTLS mode and who-may-call-whom.\n- **Gateway** (Istio's own, or the k8s Gateway API): edge ingress.\n\nA canary is then just a VirtualService weighting 95% to `v1` / 5% to `v2`; Envoy does the split on\nevery sidecar.\n\n## Optional lab: install Istio and inject a sidecar\n\nUsing the kind cluster from Module 08 (`kind create cluster --name envoy-lab` if you deleted it):\n\n```bash\n# 1. Install istioctl, then the demo profile:\nistioctl install --set profile=demo -y\n\n# 2. Turn on automatic sidecar injection for the default namespace:\nkubectl label namespace default istio-injection=enabled --overwrite\n\n# 3. Deploy the echo app from Module 08 (or any app) and watch pods get TWO containers:\nkubectl apply -f labs/08-k8s/app-and-route.yaml\nkubectl get pod -l app=echo -o jsonpath='{.items[0].spec.containers[*].name}'\n# → echo istio-proxy       ← that second container IS an Envoy sidecar\n```\n\nEvery echo pod now has an Envoy beside it. Inspect it:\n\n```bash\nistioctl proxy-config listeners deploy/echo      # the sidecar's listeners (LDS)\nistioctl proxy-config clusters  deploy/echo      # its clusters (CDS)\nistioctl proxy-config secret    deploy/echo      # its mTLS certs (SDS)\n```\n\nAdd a `VirtualService` splitting traffic between two versions and you've built a canary: all of it\njust Envoy config generated by `istiod` and pushed via xDS. Clean up with\n`kind delete cluster --name envoy-lab`.\n\n## When do you actually want a mesh?\n\nA mesh earns its complexity when you have **many** services needing uniform mTLS, traffic policy,\nand observability without touching each app. For a handful of services, an edge gateway (Module 08)\nplus per-app retries is often enough. Meshes do a lot but are not free: start at the edge, add a\nmesh when the cross-cutting needs justify it. Ambient mode exists precisely to lower that cost."}, {"id": "10-debugging-gotchas-next-steps", "title": "10 · Debugging & next steps", "group": "Platform", "md": "*The field guide you'll come back to. Concept-only. ~15 min.*\n\n---\n\nYou now know the whole model: listeners → filter chains → HTTP filters → routes → clusters →\nendpoints, delivered statically or via xDS, at the edge or as a mesh. This last module is the\npractical stuff that saves hours.\n\n## A debugging method that always works\n\nWhen something is wrong, resist guessing at YAML. Follow the request through Envoy's own eyes:\n\n1. **Is Envoy even up and healthy?** `curl localhost:9901/ready` → `LIVE`. Check `docker`/`kubectl`\n   logs for a config parse error on startup (Envoy refuses to start on invalid *bootstrap*).\n2. **Read the access log line.** It has the response code and (the field to read first) **`%RESPONSE_FLAGS%`**.\n   The flag usually tells you the answer before you look anywhere else (table below).\n3. **Did it match a route?** `curl localhost:9901/config_dump` and find your route config. Flag\n   `NR` = *no route matched* → your `match` is wrong or ordered below a catch-all.\n4. **Is the cluster healthy?** `curl localhost:9901/clusters` shows each endpoint's health and\n   ejection state. Flag `UH` = *no healthy upstream* → health checks failing, wrong address, or\n   backend down.\n5. **Turn up the volume.** `curl -X POST localhost:9901/logging?level=debug`, reproduce, read, then\n   set it back to `info`.\n\n`/config_dump` + `/clusters` + the access-log flag resolve the large majority of issues.\n\n### `%RESPONSE_FLAGS%` cheat-sheet\n\n| Flag | Meaning | Usual cause |\n|------|---------|-------------|\n| `NR` | No route configured | `match` wrong / ordered below catch-all / wrong `Host` (virtual_host domains) |\n| `UH` | No healthy upstream | all endpoints unhealthy or ejected; bad cluster address |\n| `UF` | Upstream connection failure | backend down / wrong port / DNS |\n| `UT` | Upstream request timeout | backend too slow vs route `timeout` |\n| `URX` | Upstream retry limit exceeded | retries exhausted; backend really failing |\n| `UO` | Upstream overflow | circuit breaker tripped (too many concurrent) |\n| `RL` | Rate limited | a ratelimit filter rejected it |\n| `DC` | Downstream connection termination | the *client* hung up |\n| `NC` | No cluster found | route names a cluster that doesn't exist (typo) |\n\n## The gotchas that bite everyone\n\n- **Route order.** First match wins. A `prefix: \"/\"` catch-all above a specific route silently\n  shadows it. Specific routes go **on top**. (This is the #1 mistake; see Module 04.)\n- **`typed_config` `@type` typos.** The long `type.googleapis.com/...v3....` URLs must be exact and\n  **v3** (v2 was removed years ago). A wrong type = startup failure or a silently ignored block.\n- **`virtual_hosts` domains.** If `domains` doesn't include the request's `Host` header (and isn't\n  `\"*\"`), you get `NR`. Easy to forget when adding a second host.\n- **Admin interface exposure.** Never bind `:9901` to a public address in production; it leaks\n  config and offers `/quitquitquit`. Localhost only.\n- **The router filter must be last** in `http_filters`, and every HCM needs one.\n- **`prefix_rewrite` vs expectations.** Rewrites change the path the *backend* sees; if the backend\n  404s, check what path actually arrived (access log on the backend).\n- **Container vs localhost addresses.** In Docker/K8s the cluster address is the *service name*\n  (`backend`, `echo`), not `localhost`: `localhost` inside Envoy's container is Envoy itself.\n- **STRICT_DNS caching.** Envoy re-resolves on an interval; a just-started backend may take a\n  moment to appear. Health checks + retries paper over the gap.\n- **Config precedence.** With xDS, the *file/control plane* is the source of truth; a bad push is\n  **rejected** and Envoy keeps the last good config (check `*.update_rejected` stats), so \"my\n  change did nothing\" often means \"my change was invalid.\"\n\n## Performance notes (so you're not surprised)\n\nEnvoy is fast (C++, non-blocking, worker-thread-per-core), but: regex route matches and heavy Lua/\nWasm filters cost CPU; very large `/config_dump`s indicate an over-large config that slows xDS\npushes; and each additional filter runs on every request. Prefer prefix/header matches over regex,\nand keep the filter chain lean.\n\n## Where to go next\n\n- **Official docs & API reference**: <https://www.envoyproxy.io/docs> (the v3 API reference is the\n  canonical source for every field you'll ever set).\n- **Envoy Gateway**: <https://gateway.envoyproxy.io>, the modern Kubernetes ingress path (Module\n  08).\n- **Istio docs**: <https://istio.io>, the mesh, sidecar and ambient (Module 09).\n- **Go deeper on internals**: read about the threading model, the `go-control-plane` library\n  (build your own control plane), and Wasm filters for custom logic.\n- **Practice ideas:** add JWT auth (`jwt_authn`) to Lab 04; wire Lab 06 stats into\n  Prometheus+Grafana; build a canary with weighted clusters; put TLS origination\n  (`UpstreamTlsContext`) in front of an HTTPS backend.\n\n## Course recap, the one-paragraph mental model\n\nA **listener** binds a port and hands connections to a **filter chain**; for HTTP that chain's\n**HTTP Connection Manager** runs an ordered list of **HTTP filters** ending in the **router**,\nwhich uses the **route table** to pick a **cluster**, which load-balances and health-checks across\nits **endpoints**. Encryption is a separate **transport_socket** layer. All of this is either\nwritten **statically** or delivered **dynamically via xDS** by a **control plane**, and that exact\nmechanism, applied at the edge, is an **API gateway**; applied to every workload, is a **service\nmesh**. Everything else is detail on top of these nouns."}], "quizzes": {"setup-local-envoy": [{"q": "What single tool do you actually install to run Envoy for this course?", "options": ["Docker: Envoy itself comes as a container image you don't install directly", "The Envoy binary, compiled from source", "Kubernetes", "A web browser only"], "answer": 0, "why": "You install Docker; it pulls the envoyproxy/envoy image and the practice backend automatically. Nothing else touches your system.", "whyWrong": ["", "Compiling Envoy is a heavyweight Bazel build the course never asks for: Docker pulls a prebuilt image instead.", "Kubernetes doesn't appear until Module 08, and even then the labs don't have you install it.", "A browser can't run containers; you need Docker to actually execute Envoy."]}, {"q": "What does 'docker compose up' do inside a lab folder?", "options": ["Downloads and starts Envoy plus the backend defined in that folder's files", "Deletes all containers on your machine", "Installs Docker itself", "Publishes your config to the internet"], "answer": 0, "why": "Each lab folder has a docker-compose.yaml describing Envoy and a backend. 'up' pulls the images (first time) and runs them together.", "whyWrong": ["", "Nothing is deleted, 'down' removes only that lab's containers, and 'up' just starts them.", "Docker must already be installed; compose is a feature of Docker, not its installer.", "Everything runs locally on your machine; nothing is uploaded anywhere."]}, {"q": "After Envoy is running, how do you send a test request through it?", "options": ["Run 'curl localhost:10000' from a second terminal", "Restart your computer", "Edit the envoy.yaml file", "Open port 9901 to the public internet"], "answer": 0, "why": "The listener is bound to port 10000. Keep Envoy running in one terminal and curl it from another; you'll see a matching log line appear.", "whyWrong": ["", "Restarting changes nothing: Envoy is already running and just waiting for a request.", "Editing config doesn't generate traffic; you need an actual client request like curl.", "9901 is the admin interface, not the traffic port, and it should never be exposed publicly."]}, {"q": "How do you stop a lab and clean up when you're done?", "options": ["Press Ctrl-C in the Envoy terminal, then run 'docker compose down'", "Just close the terminal window and hope for the best", "Delete Docker", "Run 'curl /quitquitquit' on every port"], "answer": 0, "why": "Ctrl-C stops the running containers; 'docker compose down' removes them. Every lab starts with 'up' and ends with 'down'.", "whyWrong": ["", "Closing the window can leave containers running in the background, still holding your ports.", "Uninstalling Docker is wildly overkill and would break every other lab.", "/quitquitquit only stops an Envoy process via its admin port; it doesn't remove the lab's containers."]}], "primer-what-is-a-proxy": [{"q": "In one sentence, what is a proxy?", "options": ["A middleman program that sits between a client and a server, passing requests and responses on their behalf", "A server that stores a website's database", "A programming language for building websites", "A physical device that boosts your wifi signal"], "answer": 0, "why": "Like a waiter between you and the kitchen, a proxy is a go-between: you talk to it, and it talks to the real server for you, relaying the answer back.", "whyWrong": ["", "Storage is a database's job; a proxy holds conversations in transit, not data at rest.", "A proxy is a running program in the network path, not a language you write code in.", "It's software in the request path, not hardware for your radio signal."]}, {"q": "When you put a proxy in the middle, one direct connection becomes how many conversations?", "options": ["Two, you-to-proxy and proxy-to-server, stitched together to feel like one", "One, the proxy just watches the existing connection", "Zero, the proxy removes the need to connect", "Four, one for each direction on each side"], "answer": 0, "why": "The proxy holds two separate conversations: it receives your request, then makes its own request to the real server, then relays the reply back to you.", "whyWrong": ["", "The proxy isn't a passive observer, it terminates your connection and opens its own to the server.", "Connections still happen; the proxy adds a hop, it doesn't remove the network.", "Each side is one two-way conversation; requests and responses share the same connection."]}, {"q": "Which of these is a useful job a proxy can do from its spot in the middle?", "options": ["Routing, load balancing, retries, TLS, caching, metrics, or shielding the servers", "Writing the application's business logic for it", "Physically cooling the server hardware", "Designing the website's visual layout"], "answer": 0, "why": "The middle is a great place to do work every request needs, so you build it once in the proxy instead of into every server or client.", "whyWrong": ["", "Business logic stays in the application; the proxy handles cross-cutting network concerns.", "A proxy is software; it has no influence on server temperature.", "Page design is frontend work; a proxy only relays and shapes traffic."]}, {"q": "What is the difference between a forward proxy and a reverse proxy?", "options": ["A forward proxy is a middleman for the client reaching out; a reverse proxy is a middleman for the servers receiving traffic", "A forward proxy is faster; a reverse proxy is slower", "A forward proxy uses HTTP; a reverse proxy uses HTTPS", "They are the same thing"], "answer": 0, "why": "Forward = sits in front of clients reaching the internet (filtering, hiding who's browsing). Reverse = sits in front of servers, taking outside traffic to the right backend.", "whyWrong": ["", "Speed doesn't define them, the difference is whose side of the conversation each one represents.", "Either kind can speak HTTP or HTTPS; the protocol isn't what distinguishes them.", "They sit on opposite sides: one fronts clients going out, the other fronts servers taking traffic in."]}, {"q": "Which kind of proxy is Envoy, and why does it fit this course?", "options": ["A reverse proxy, it fronts your backend services to route, balance, secure, and observe incoming traffic", "A forward proxy, it filters employees' web browsing", "Neither: Envoy is a database", "Both, but only when running on Windows"], "answer": 0, "why": "Envoy is a powerful, programmable reverse proxy. Routing incoming traffic to a fleet of services, load balancing, terminating HTTPS, retrying failures, that's the reverse-proxy job.", "whyWrong": ["", "Filtering outbound browsing is the classic forward-proxy job, the opposite of what this course covers.", "Envoy stores no application data; it moves requests between clients and your services.", "Envoy's role has nothing to do with the OS, and its job is reverse proxying regardless."]}], "primer-service-mesh": [{"q": "What core problem does a service mesh exist to solve?", "options": ["It moves repetitive networking concerns, security, retries, metrics, routing, out of every app and into shared infrastructure", "It makes individual services run faster on the CPU", "It replaces the need for any backend services", "It stores all of a company's data in one place"], "answer": 0, "why": "In a big microservice system, every team keeps re-implementing the same networking logic. A mesh factors it out into infrastructure so it's done once, uniformly.", "whyWrong": ["", "A mesh adds a proxy hop, so if anything it costs a little latency; the win is uniformity, not speed.", "Your services still do all the real work, the mesh only handles the traffic between them.", "Data storage is a database concern; a mesh carries requests, it doesn't keep them."]}, {"q": "What is a 'sidecar proxy'?", "options": ["A small proxy running next to each service instance that handles all traffic in and out of that service", "A backup copy of a service's database", "A second CPU dedicated to networking", "A special cable between two servers"], "answer": 0, "why": "The service talks to its local sidecar proxy, and the proxy handles the real network. Because a proxy sits on both ends of every call, the mesh can add features uniformly.", "whyWrong": ["", "It's a proxy process, not a data replica, it forwards traffic rather than storing anything.", "It's software sharing the pod's existing CPU, not extra hardware.", "No physical wiring involved; the sidecar intercepts traffic in software on the same host."]}, {"q": "In a mesh, what is the difference between the data plane and the control plane?", "options": ["Data plane = the proxies carrying traffic and enforcing rules; control plane = the brain that computes config and pushes it to them", "Data plane = the brain; control plane = the proxies", "They are the same thing under two names", "Data plane is the app; control plane is the database"], "answer": 0, "why": "You state intent to the control plane once; it programs the whole fleet of proxies (the data plane) to match, updating them live as services change.", "whyWrong": ["", "You've got it backwards: the proxies carry the data, and the control plane does the thinking.", "The split is the whole point, one part moves packets, a separate part programs it.", "Both planes are mesh infrastructure; your app and database sit outside the mesh's own layers."]}, {"q": "What is Envoy's role in a typical service mesh?", "options": ["It's the data-plane proxy that most meshes use; the meshes differ mainly in their control plane", "It is the control-plane brain that replaces Istio", "It is the database every service shares", "It has no role in a mesh"], "answer": 0, "why": "Istio, Consul, Gloo, App Mesh and others drive Envoy as the thing on the wire, via the standard xDS API. Learn Envoy and you understand the engine inside nearly all of them.", "whyWrong": ["", "Envoy is what Istio programs, not a competitor to it, istiod is the brain, Envoy is the muscle.", "Envoy carries requests between services; it stores nothing.", "Envoy is the most common mesh data plane, the engine inside Istio, Consul Connect, and others."]}, {"q": "Does every system need a full service mesh?", "options": ["No, an edge gateway plus basic retries often suffices; a mesh pays off once you have many services", "Yes, no system can run without a mesh", "Only systems written in Go can use one", "A mesh is required by Kubernetes"], "answer": 0, "why": "A mesh earns its complexity at scale. For a handful of services, a single Envoy at the edge is often plenty. Newer 'ambient' modes exist to lower a mesh's cost.", "whyWrong": ["", "Plenty of systems run fine with just an edge proxy; a mesh is a scale tool, not a prerequisite.", "Meshes are language-agnostic, that's the selling point; the proxy doesn't care what wrote the request.", "Kubernetes runs happily without any mesh; a mesh is an optional layer on top."]}], "00-what-is-envoy": [{"q": "What is a proxy, in one sentence?", "options": ["A program that sits between a client and a server, relaying requests and responses on the client's behalf", "A database that stores every request a server receives", "A programming language for writing network servers", "A physical cable that connects two computers directly"], "answer": 0, "why": "A proxy sits in the middle: the client talks to the proxy, and the proxy talks to the real server for it, then relays the answer back. That middle spot is where Envoy does routing, TLS, retries, and more.", "whyWrong": ["", "A proxy relays traffic in flight; persisting requests is a log or database's job.", "It's a running network program, not a language for writing servers.", "It's software in the path, not hardware connecting machines."]}, {"q": "What can an L7 (application-layer) proxy do that an L4 (transport-layer) proxy cannot?", "options": ["Read and act on the actual HTTP request (its path, headers, and method)", "Forward raw TCP connections faster", "Use less memory per connection", "Run without any configuration at all"], "answer": 0, "why": "L4 only sees bytes flowing between IP:port pairs. L7 parses the protocol (HTTP/gRPC), so it can make decisions based on the URL path, headers, and method: Envoy's superpower.", "whyWrong": ["", "Raw TCP forwarding speed is the L4 proxy's advantage, not something L7 adds.", "Parsing HTTP costs more memory, not less, the tradeoff buys smarts.", "Both kinds need configuration; L7 typically needs more of it, not none."]}, {"q": "Which describes the data plane vs the control plane, and which one is Envoy?", "options": ["The data plane moves the traffic; the control plane decides the config. Envoy is the data plane.", "The data plane decides config; the control plane moves traffic. Envoy is the control plane.", "They are two names for the same thing; Envoy is both.", "The control plane is the client and the data plane is the server."], "answer": 0, "why": "Envoy is the thing that actually touches your traffic (data plane). A separate 'brain' (control plane, like Istio) computes config and pushes it to Envoy. Envoy consumes config; it doesn't compute it.", "whyWrong": ["", "Reversed: config flows from the control plane down to Envoy, which moves the actual traffic.", "They're deliberately separate roles: Envoy consumes config, it never computes it.", "The planes describe infrastructure roles, not who initiates a request."]}, {"q": "Which three roles can the same Envoy binary play?", "options": ["Edge/API gateway, sidecar, and middle proxy", "Compiler, linker, and debugger", "Client, server, and database", "Firewall, router, and switch"], "answer": 0, "why": "It's the same tool in all three, only the topology and who configures it differ: at the front door (edge), next to every service (sidecar/mesh), or between internal tiers (middle proxy).", "whyWrong": ["", "Those are build-toolchain roles; Envoy is a proxy, not a development tool.", "Envoy is always the middleman, it's neither the app tiers nor the data store.", "Those are network hardware boxes; Envoy's three roles are all proxy topologies."]}, {"q": "What is Envoy's headline advantage over classic proxies like nginx for microservices?", "options": ["Live, dynamic reconfiguration with no restarts and zero dropped connections, via its xDS API", "It is written in a faster programming language", "It requires no configuration files", "It can only be used inside Kubernetes"], "answer": 0, "why": "A control plane can reprogram thousands of Envoys continuously, add a route, change a backend, rotate a cert, without restarting. That's the reason service meshes chose Envoy.", "whyWrong": ["", "C++ vs C isn't the story, nginx is plenty fast; the difference is how config gets updated.", "Envoy needs config like any proxy; the point is that config can arrive live over xDS.", "Envoy predates its Kubernetes fame and runs anywhere: VMs, bare metal, Docker."]}], "01-architecture-and-request-lifecycle": [{"q": "Put these in the order a request flows through them: cluster, listener, route, filter chain, endpoint.", "options": ["listener → filter chain → route → cluster → endpoint", "cluster → endpoint → route → listener → filter chain", "route → listener → cluster → filter chain → endpoint", "endpoint → cluster → filter chain → route → listener"], "answer": 0, "why": "A connection arrives at a listener, flows through a filter chain, the router reads the route table to pick a cluster, and the cluster load-balances to one endpoint. That sentence is Envoy.", "whyWrong": ["", "That runs backwards, clusters and endpoints are chosen last, after routing, not first.", "Routing happens inside the listener's filter chain, not before the connection is accepted.", "The endpoint is the final destination; nothing starts there."]}, {"q": "What does the HTTP Connection Manager (HCM) do, and where does it sit?", "options": ["It is a network filter that parses the raw byte stream into HTTP requests and hosts the HTTP filter chain", "It is a separate program that runs before Envoy starts", "It is the cluster that holds all the backend endpoints", "It is the admin interface on port 9901"], "answer": 0, "why": "The HCM lives inside a listener's filter chain. It turns raw bytes into structured HTTP and runs the ordered HTTP filters (ending in the router). Everything HTTP happens inside the HCM.", "whyWrong": ["", "The HCM is a filter inside Envoy's listener, not an external process.", "Clusters describe backends; the HCM parses incoming HTTP on the listener side.", "The admin interface is a separate server on 9901; the HCM processes real traffic."]}, {"q": "Is a browser connecting to Envoy considered upstream or downstream?", "options": ["Downstream, it is on the client side, the one that connected TO Envoy", "Upstream, it is on the backend side", "Neither, browsers are not part of Envoy's model", "Both at the same time"], "answer": 0, "why": "Downstream = the client side (who connected to Envoy). Upstream = the backend side (who Envoy connects to). So 'downstream_rq_total' counts requests received from clients.", "whyWrong": ["", "Upstream is the backend side, where Envoy sends requests, not where they come from.", "Anything that connects to Envoy is in the model, and a browser is a downstream client.", "A single peer sits on one side: the browser connects TO Envoy, making it downstream only."]}, {"q": "Envoy has two independent filter pipelines. What are they?", "options": ["The L4 network filter chain, and the L7 HTTP filter chain inside the HCM", "The inbound firewall and the outbound firewall", "The static pipeline and the dynamic pipeline", "The request logger and the response logger"], "answer": 0, "why": "The network (L4) filter chain operates on the connection; inside the HCM, the HTTP (L7) filter chain operates on each request. Most of your day-to-day config lives in the HTTP filters and route table.", "whyWrong": ["", "Envoy has no firewall pair; the split is by protocol layer, connection vs request.", "Static vs dynamic is about config delivery, not the filter pipelines.", "Logging is one feature, not a pipeline; the two chains are L4 network and L7 HTTP filters."]}, {"q": "Between static and dynamic (xDS) config, what actually changes, the objects or the delivery?", "options": ["Only the delivery, a cluster is a cluster whether it came from a file or a control-plane push", "Only the objects, dynamic config uses completely different resource types", "Both the objects and the delivery are entirely different", "Nothing changes; static and dynamic are just two names for the same file"], "answer": 0, "why": "The objects (listeners, routes, clusters, endpoints) are identical either way. Master the static objects first and dynamic config is just 'the same objects, delivered over the network.'", "whyWrong": ["", "The resource types are identical either way, an xDS cluster is the same object as a file cluster.", "Only delivery changes; the listener/route/cluster/endpoint objects stay the same.", "They're genuinely different delivery mechanisms, file at boot vs streamed at runtime."]}], "02-lab-first-static-config": [{"q": "In the config, which section says 'accept traffic on port 10000'?", "options": ["The listener's address block", "The cluster's load_assignment", "The admin interface", "The router HTTP filter"], "answer": 0, "why": "A listener binds an address+port (here 0.0.0.0:10000). That's where clients connect. Clusters describe backends, not the port Envoy listens on.", "whyWrong": ["", "load_assignment lists backend addresses Envoy connects OUT to, not the port it accepts on.", "The admin block binds 9901 for debugging, not the traffic port.", "The router picks a cluster for a request; it has nothing to do with binding ports."]}, {"q": "Where does the decision 'send / to the echo_service cluster' live?", "options": ["In the route config inside the HTTP Connection Manager", "In the cluster definition", "In the admin block", "In the Docker Compose file"], "answer": 0, "why": "Routes live in the route_config inside the HCM: a match (e.g. prefix: /) paired with an action (route to a cluster). The cluster just describes where the backend is.", "whyWrong": ["", "The cluster says where echo_service lives, not which requests should go to it.", "The admin block only configures the debug interface.", "Compose starts the containers; it knows nothing about Envoy's routing rules."]}, {"q": "Why must the router be the last HTTP filter?", "options": ["It forwards the request upstream, so every other filter must get to act before it", "It is the slowest filter and should run when nothing else is waiting", "Envoy sorts filters alphabetically and 'router' comes last", "It has to run first, not last, the premise is wrong"], "answer": 0, "why": "The router applies the route decision and sends the request to a backend. Any filter that wants to inspect or modify the request (auth, CORS, etc.) must run before that hand-off.", "whyWrong": ["", "Filter order is about semantics, not speed scheduling.", "Order is exactly what you write in http_filters: Envoy never sorts it.", "If it ran first, no other filter could touch the request before it left for the backend."]}, {"q": "What did 'type: STRICT_DNS' do for the echo_service cluster?", "options": ["Resolved the backend hostname via DNS and used every IP it returned as an endpoint", "Encrypted the connection to the backend with TLS", "Restricted the cluster to a single hard-coded IP address", "Turned off health checking"], "answer": 0, "why": "STRICT_DNS means 'resolve this hostname and use all returned IPs, re-resolving periodically.' Docker's internal DNS resolved 'backend' to the echo container.", "whyWrong": ["", "TLS to backends is configured on the cluster's transport_socket, not its discovery type.", "That's the opposite: STRICT_DNS follows DNS answers and can yield several endpoints.", "Health checking is a separate cluster setting; the discovery type doesn't touch it."]}, {"q": "If two routes both match a request, which one wins?", "options": ["The first one listed (route order matters)", "The most specific one, regardless of order", "The last one listed", "Envoy returns an error when two routes match"], "answer": 0, "why": "Envoy takes the first matching route. That's why specific routes (like /healthz) must go ABOVE the catch-all prefix: /, the single most common routing bug.", "whyWrong": ["", "Envoy does no specificity ranking, it's strictly top-to-bottom order.", "The last one never gets a look once an earlier route matches.", "Overlapping routes are normal and legal; the first match simply wins."]}], "03-listeners-filter-chains-tls": [{"q": "What single filter turns a listener into an HTTP listener?", "options": ["The HTTP Connection Manager, swap it for tcp_proxy and the listener becomes an L4 forwarder", "The router filter", "The transport_socket", "The admin filter"], "answer": 0, "why": "A listener is protocol-agnostic. Its filter chain's network filter decides behavior: http_connection_manager makes it L7/HTTP; tcp_proxy makes it a dumb-but-fast L4 forwarder.", "whyWrong": ["", "The router is an HTTP filter that lives INSIDE the HCM, it needs the HCM to exist first.", "The transport_socket handles TLS on the connection; it doesn't parse HTTP.", "There is no admin filter; the admin interface is a separate server entirely."]}, {"q": "How does one :443 listener serve two different sites with different certificates?", "options": ["Multiple filter chains, selected per connection by filter_chain_match on the SNI hostname", "One filter chain that guesses the site from the request body", "It cannot, you need a separate listener per site", "By running two copies of Envoy on the same port"], "answer": 0, "why": "SNI (Server Name Indication) is the hostname the client requests inside the TLS handshake. filter_chain_match on server_names picks the matching chain (and its cert/backend).", "whyWrong": ["", "The cert must be chosen during the TLS handshake, before any request body exists to read.", "One listener handles it fine; that's exactly what filter_chain_match is for.", "Two processes can't bind the same port; SNI matching within one listener is the mechanism."]}, {"q": "What is the difference between DownstreamTlsContext and UpstreamTlsContext?", "options": ["Downstream = TLS toward clients (Envoy is the server, presents a cert); Upstream = TLS toward backends (Envoy is the client, verifies a cert)", "Downstream is for HTTP/1.1 and Upstream is for HTTP/2", "Downstream encrypts, Upstream decrypts, on the same connection", "They are identical; the names are interchangeable"], "answer": 0, "why": "Downstream faces the client (Envoy acts as TLS server). Upstream faces the backend (Envoy acts as TLS client). mTLS in a mesh uses both directions at once.", "whyWrong": ["", "HTTP version negotiation is separate config; both contexts work with either version.", "Every TLS connection encrypts and decrypts on both ends; the contexts differ by which side Envoy plays.", "They're distinct types with distinct roles, presenting a cert as server vs verifying one as client."]}, {"q": "What is 'TLS termination'?", "options": ["Envoy decrypts the client's HTTPS and forwards plain HTTP to the backend", "Envoy refuses all TLS connections", "The backend decrypts TLS and Envoy only forwards bytes", "TLS is disabled entirely"], "answer": 0, "why": "Envoy holds the cert, does the crypto, and speaks plain HTTP inward. That's the classic edge-gateway job: one place holds the certificates and the backends stay simple.", "whyWrong": ["", "Termination means accepting and completing TLS, not rejecting it.", "Backend-side decryption is TLS passthrough, the opposite arrangement.", "TLS is fully active on the client side; it just ends at Envoy instead of the backend."]}, {"q": "Which part of the config handles encryption, and which handles HTTP routing?", "options": ["The transport_socket handles encryption; the HCM filters handle HTTP routing (transport vs application, kept separate)", "The route_config handles both", "The cluster handles encryption; the listener handles routing", "The admin interface handles both"], "answer": 0, "why": "TLS is a transport-layer concern (transport_socket) layered UNDER the HTTP processing (the HCM's filters and routes). That separation is a recurring Envoy theme.", "whyWrong": ["", "route_config only maps requests to clusters; it never touches crypto.", "Backwards, encryption lives in the listener's transport_socket, routing in the HCM.", "The admin interface observes Envoy; it doesn't process or encrypt traffic."]}], "04-http-routing-and-filters": [{"q": "Two routes match a request. Which is used?", "options": ["The first one listed", "The most specific one", "The last one listed", "A random one"], "answer": 0, "why": "First match wins. Put specific routes above general ones; a catch-all prefix: / at the top will silently shadow everything below it.", "whyWrong": ["", "Envoy never ranks by specificity, order in the list is the only tiebreaker.", "Later routes are shadowed the moment an earlier one matches.", "Route selection is fully deterministic: top to bottom, first hit."]}, {"q": "Besides a path prefix, what else can a route's match test?", "options": ["Exact path, a regex, headers, and query parameters", "Only the client's IP address", "Only the time of day", "Only the response status code"], "answer": 0, "why": "match can test exact path, safe_regex, headers (exact/prefix/regex/presence), and query_parameters, enabling canaries, API versioning, and auth gating.", "whyWrong": ["", "Client IP alone isn't a route matcher, and matching is far richer than any one field.", "There's no time-of-day matcher in route config.", "Routing happens before the backend answers, the response status doesn't exist yet."]}, {"q": "What is the difference between direct_response and redirect?", "options": ["direct_response makes Envoy answer with a body itself; redirect tells the client to go elsewhere with a 3xx", "They are the same thing", "direct_response is for HTTPS only; redirect is for HTTP only", "redirect answers with a body; direct_response sends a 3xx"], "answer": 0, "why": "direct_response = Envoy serves a canned body with no backend (health checks, maintenance pages). redirect = a 301/302 sending the client somewhere else.", "whyWrong": ["", "One serves content itself; the other bounces the client, different actions entirely.", "Both work regardless of protocol; HTTPS vs HTTP has nothing to do with it.", "You've swapped them: redirect sends the 3xx, direct_response serves the body."]}, {"q": "Why must the router filter be last in the http_filters list?", "options": ["It forwards the request upstream, so all filters before it must run first", "It logs the response, which must happen last", "Envoy requires filters in alphabetical order", "It must actually be first, not last"], "answer": 0, "why": "The router is the hand-off to the backend. Filters like cors, jwt_authn, and fault must run before that hand-off to inspect, modify, or reject the request.", "whyWrong": ["", "Access logging is the HCM's job, not the router's, and it isn't why the router goes last.", "You choose the order explicitly; Envoy never alphabetizes filters.", "First would ship the request upstream before auth, CORS, or fault filters ever ran."]}, {"q": "What is the fault filter for?", "options": ["Injecting latency or aborts to test resilience (chaos testing) without touching real backends", "Fixing broken YAML in the config", "Automatically retrying failed requests", "Compressing responses"], "answer": 0, "why": "The fault filter deliberately delays or aborts a percentage of matching requests, so teams can verify that CALLERS handle failures (retries, fallbacks), chaos engineering as config.", "whyWrong": ["", "Nothing repairs config at runtime, bad YAML simply fails to load.", "Retries live in the route's retry_policy; fault does the opposite, injecting failures.", "Compression is the compressor filter's job; fault only delays or aborts requests."]}], "05-clusters-load-balancing-resilience": [{"q": "What does a cluster represent?", "options": ["An upstream service: its endpoints plus how to balance across and health-check them", "A single physical server", "A port that Envoy listens on", "A TLS certificate"], "answer": 0, "why": "If routes answer 'where does this request go?', clusters answer 'which instance, and what if it's down?', a named group of endpoints plus load-balancing and health policy.", "whyWrong": ["", "One server is just an endpoint; a cluster is the named group plus its policies.", "Listening ports belong to listeners, clusters describe where traffic goes out, not in.", "Certs live in transport_sockets and SDS; a cluster may reference one but isn't one."]}, {"q": "When would you use STRICT_DNS vs EDS for endpoint discovery?", "options": ["STRICT_DNS resolves a DNS name locally; EDS receives endpoints pushed by a control plane over xDS (EDS for dynamic mesh environments)", "STRICT_DNS is for HTTPS; EDS is for HTTP", "They are identical", "STRICT_DNS is dynamic; EDS is static"], "answer": 0, "why": "STRICT_DNS is great for Docker/K8s service names Envoy can resolve itself. EDS is how a control plane keeps up with pods appearing and disappearing in a mesh.", "whyWrong": ["", "Discovery type and TLS are orthogonal, either can carry either protocol.", "They differ fundamentally: local DNS resolution vs control-plane push.", "Backwards: EDS is the dynamic, push-based one; STRICT_DNS just re-polls DNS."]}, {"q": "What is the difference between active and passive health checking?", "options": ["Active = Envoy proactively probes a path on an interval; passive (outlier detection) = ejects an endpoint after real 5xx/connection errors", "Active checks HTTP; passive checks TCP", "Active runs once at startup; passive never runs", "They are two names for the same feature"], "answer": 0, "why": "Active health checks catch a sick backend before a user hits it. Outlier detection reacts to real traffic failures. Together they keep bad endpoints out of rotation.", "whyWrong": ["", "Both styles can watch HTTP or TCP; the real split is probing vs reacting to live traffic.", "Active checks repeat on an interval forever, and passive ejection runs continuously.", "They're separate, complementary mechanisms, probe ahead vs react to real failures."]}, {"q": "Which load-balancing policy gives you session affinity (sticky routing)?", "options": ["RING_HASH or MAGLEV, consistent hashing on a key like a header or cookie", "ROUND_ROBIN", "RANDOM", "LEAST_REQUEST"], "answer": 0, "why": "Consistent-hashing policies (RING_HASH/MAGLEV) send requests with the same key to the same backend. Round-robin, random, and least-request spread traffic without affinity.", "whyWrong": ["", "Round-robin deliberately rotates through endpoints, the opposite of stickiness.", "Random picks a fresh endpoint every time; the same user lands anywhere.", "Least-request follows load, so the same key goes wherever is idle, not to one home."]}, {"q": "How do a timeout + retry_policy + multiple endpoints hide a single failing backend?", "options": ["Envoy caps how long it waits, then retries the request on a different healthy endpoint", "Envoy caches the last good response and returns it", "Envoy shuts down until the backend recovers", "Envoy returns a 503 immediately every time"], "answer": 0, "why": "A timeout bounds the wait; a retry_policy re-sends the failed idempotent request to another endpoint. With several endpoints, one bad instance becomes invisible to the caller.", "whyWrong": ["", "Envoy doesn't serve stale responses on failure; caching is a separate concern entirely.", "Envoy stays up and routes around the failure, that's the whole point of resilience config.", "A 503 is what the retry policy prevents; it only surfaces if every attempt fails."]}], "06-observability-and-admin": [{"q": "Which admin endpoint shows the full effective configuration Envoy is running?", "options": ["/config_dump", "/ready", "/quitquitquit", "/healthz"], "answer": 0, "why": "/config_dump returns the entire effective config as JSON, invaluable for confirming what Envoy actually loaded, especially when debugging xDS.", "whyWrong": ["", "/ready just says whether Envoy can serve traffic, a one-word liveness answer.", "/quitquitquit shuts Envoy down; definitely not a read-only inspection endpoint.", "/healthz is a path you'd route for app health checks, not an admin config viewer."]}, {"q": "Why must the admin port (9901) never be bound to a public address in production?", "options": ["It exposes config and secrets-adjacent data and offers control endpoints like /quitquitquit", "It is slower than the main listener", "It only works over HTTPS", "It would use too much bandwidth"], "answer": 0, "why": "The admin interface is powerful and unauthenticated. Anyone who reaches it can read your config and even shut Envoy down. Bind it to 127.0.0.1 in production.", "whyWrong": ["", "Performance isn't the issue, the danger is unauthenticated read and control access.", "It serves plain HTTP by default; the concern is exposure, not protocol.", "Traffic on 9901 is tiny; the risk is what an attacker can do with it, not bandwidth."]}, {"q": "In RED-method terms, which stats map to Rate, Errors, and Duration?", "options": ["downstream_rq_total, downstream_rq_5xx, and the downstream_rq_time histogram", "upstream_cx_active, server.memory, and server.uptime", "listener_added, listener_modified, and lds.update_rejected", "cluster.name, endpoint.address, and lb_policy"], "answer": 0, "why": "Rate = total requests, Errors = 5xx count, Duration = the request-time histogram. In production you scrape /stats/prometheus and graph exactly these.", "whyWrong": ["", "Those are resource and liveness gauges, not the request rate/error/latency trio.", "Those track listener config updates from LDS, not request traffic. te live, the foundation of managing fleets of proxies.", "whyWrong": ["", "Envoy always needs config; xDS changes where it comes from, not whether it exists.", "TLS works fine with static config; xDS is about delivery, not protocols.", "xDS adds a little overhead if anything, the win is live updates, not efficiency."]}, {"q": "Match the API to what it discovers: LDS, CDS, EDS, RDS, SDS.", "options": ["Listeners, Clusters, Endpoints, Routes, Secrets", "Logs, Certificates, Endpoints, Rules, Sessions", "Listeners, Certificates, Errors, Retries, Stats", "Load, CPU, Events, Requests, Sockets"], "answer": 0, "why": "LDS=Listeners, RDS=Routes, CDS=Clusters, EDS=Endpoints, SDS=Secrets (TLS certs). ADS aggregates them all over one ordered stream.", "whyWrong": ["", "Endpoints is right, but the other letters stand for Listeners, Clusters, Routes, and Secrets.", "Errors, retries, and stats have no discovery services, xDS delivers config resources.", "Those are machine metrics; xDS delivers Envoy config objects, not telemetry."]}, {"q": "What is ADS and why would you prefer it?", "options": ["Aggregated Discovery Service, all resources over one ordered stream, avoiding update races between separate streams", "Automatic DNS Service, it resolves hostnames faster", "Admin Debug Service, a richer version of the admin port", "Asynchronous Data Store, a database for Envoy stats"], "answer": 0, "why": "Delivering LDS/RDS/CDS/EDS over separate streams can cause ordering races (e.g. a route referencing a cluster that hasn't arrived). ADS serializes them on one stream.", "whyWrong": ["", "ADS has nothing to do with DNS, the A is 'Aggregated': one stream for all resource types.", "The admin port is unrelated; ADS is part of the xDS config protocol.", "Nothing is stored: ADS is a delivery channel, not a database."]}, {"q": "Concretely, what is the data plane vs the control plane in an xDS setup?", "options": ["Envoy subscribing to xDS is the data plane; the thing serving xDS (e.g. istiod) c policy/retries/canaries, and uniform observability", "Automatic database sharding", "Free compute capacity", "A new programming language for your services"], "answer": 0, "why": "Because both ends of every call are Envoys, the mesh uniformly provides encryption+identity, traffic management, telemetry, and authorization, all by config, not app code.", "whyWrong": ["", "Sharding is a data-layer design problem; the mesh only touches traffic between services.", "A mesh consumes extra compute for its proxies, it gives features, not capacity.", "Services keep their languages; the mesh's whole pitch is being language-agnostic."]}, {"q": "What is the key difference between sidecar mode and ambient mode?", "options": ["Sidecar = a full Envoy in every pod; ambient = a per-node Rust L4 proxy (ztunnel) plus per-namespace Envoy waypoints for L7", "Sidecar uses TCP; ambient uses UDP", "Ambient removes Envoy entirely", "They are two names for the same architecture"], "answer": 0, "why": "Ambient mode moves the proxy out of every pod: ztunnel (Rust) handles cheap per-node mTLS/L4, and Envoy waypoints add L7 only where needed. Envoy is still the L7 engine.", "whyWrong": ["", "Both modes carry ordinary TCP traffic; the difference is where the proxies live.", "Envoy remains as the L7 waypoint; only the per-pod copies go away.", "They're distinct architectures, per-pod proxies vs a shared per-node layer plus waypoints."]}, {"q": "How does a sidecar transparently intercept its app's traffic?", "options": ["iptables rules redirect the pod's inbound/outbound traffic to the local Envoy's ports; the app is unaware", "The app must be recompiled to call Envoy directly", "Envoy edits the app's source code at runtime", "The app sends traffic to a central Envoy over the internet"], "answer": 0, "why": "An init container programs iptables so every packet detours through the local Envoy (commonly :15001 outbound, :15006 inbound). The app thinks it's talking straight to the peer.", "whyWrong": ["
