# LDS resource file — a list of Listener resources Envoy discovers dynamically.
# Change the direct_response body below while Envoy runs, save, and re-curl: it updates live.
resources:
- "@type": type.googleapis.com/envoy.config.listener.v3.Listener
  name: main
  address: { socket_address: { address: 0.0.0.0, port_value: 10000 } }
  filter_chains:
  - filters:
    - name: envoy.filters.network.http_connection_manager
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
        stat_prefix: ingress_http
        access_log:
        - name: envoy.access_loggers.stdout
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
        route_config:
          name: local_route
          virtual_hosts:
          - name: all
            domains: ["*"]
            routes:
            # EDIT ME: change this body, save, re-curl localhost:10000/version — updates live.
            - match: { path: "/version" }
              direct_response: { status: 200, body: { inline_string: "v1\n" } }
            - match: { prefix: "/" }
              route: { cluster: echo_service }
        http_filters:
        - name: envoy.filters.http.router
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
