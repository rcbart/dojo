<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cloud-Native Fundamentals</title>
<style>
  :root{
    /* Aligned with the site and the dojo engine. Raw hues are for fills and
       borders; the darker values are the ones safe to put text in. The night
       palette lives on #sidebar below, so the shell reads as one system with
       roniam.dev: dark rail, light page. */
    --bg:#f6f6fa; --panel:#ffffff; --panel2:#f5f3ff; --ink:#191530; --muted:#5b5872;
    --teal:#115e59; --teal-dim:#99f6e4; --line:#e4e4f0; --code:#0f172a;
    --good:#166534; --good-bg:#f0fdf4; --bad:#9f1239; --bad-bg:#fff1f2; --accent:#6d28d9;
    --night:#130f26; --night2:#221a44;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  /* The rail keeps the night palette by re-declaring the tokens on itself, so
     every descendant inherits the dark variants without a second stylesheet. */
  #sidebar{
    --panel:#130f26; --panel2:#2a2150; --ink:#ffffff; --muted:#c9c2e8;
    --line:#2c2350; --teal:#c4b5fd; --teal-dim:#4c1d95; --code:#0b1017;
    background:linear-gradient(180deg,#130f26,#221a44) !important; color:#fff;
  }
  #sidebar .brand h1{font-family:var(--serif);font-weight:600;font-size:18px}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--teal);text-decoration:none} a:hover{text-decoration:underline}
  #app{display:flex;min-height:100vh}
  /* sidebar */
  #sidebar{width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 0}
  .brand{padding:0 20px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .brand h1{font-size:17px;margin:0;color:#fff;letter-spacing:.2px}
  .brand .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .progwrap{padding:12px 20px}
  .progbar{height:7px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .progfill{height:100%;width:0;background:linear-gradient(90deg,var(--teal-dim),var(--teal));transition:width .4s}
  .progtxt{font-size:11px;color:var(--muted);margin-top:6px}
  .searchwrap{padding:6px 20px 4px}
  #search{width:100%;background:var(--code);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:9px 11px;font-size:13.5px;outline:none}
  #search:focus{border-color:var(--teal)}
  .searchinfo{font-size:11px;color:var(--muted);padding:4px 20px 0}
  .result{padding:9px 20px;cursor:pointer;border-left:3px solid transparent}
  .result:hover{background:var(--panel2);border-left-color:var(--teal)}
  .result .rt{font-size:13.5px;color:#fff;font-weight:600}
  .result .rs{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
  .result .rs mark{background:var(--teal-dim);color:#d7fff6;border-radius:3px;padding:0 2px}
  .noresult{padding:12px 20px;font-size:13px;color:var(--muted)}
  .pathlinks{padding:14px 20px 4px;border-top:1px solid var(--line);margin-top:12px;
    font-size:12px;color:var(--muted);line-height:1.9}
  .pathlinks a{color:var(--muted)} .pathlinks a:hover{color:var(--teal)}
  .pathlinks .pl-here{color:var(--teal);font-weight:700}
  .pathlinks .pl-head{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;
    font-weight:800;color:var(--muted);margin-bottom:2px}
  .navgroup{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);
    padding:14px 20px 6px;font-weight:700}
  .navitem{display:flex;align-items:center;gap:9px;padding:8px 20px;cursor:pointer;
    font-size:14px;color:var(--ink);border-left:3px solid transparent}
  .navitem:hover{background:var(--panel2)}
  .navitem.active{background:var(--panel2);border-left-color:var(--teal);color:#fff}
  .navitem .dot{width:16px;height:16px;flex:0 0 16px;border-radius:50%;border:2px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;font-size:10px}
  .navitem.done .dot{background:var(--teal);border-color:var(--teal);color:#04211f}
  .navitem .t{flex:1}
  /* main */
  #main{flex:1;min-width:0;display:flex;justify-content:center;padding:38px 40px 90px}
  #content{max-width:820px;width:100%}
  #content h2{font-size:26px;margin:.2em 0 .5em;color:var(--ink);font-family:var(--serif);font-weight:600}
  #content h3{font-size:19px;margin:1.5em 0 .4em;color:var(--teal)}
  #content h4{font-size:16px;margin:1.2em 0 .3em;color:var(--ink)}
  #content p{margin:.7em 0}
  #content p.dd{margin:.2em 0 .8em 1.2em;color:var(--muted)}
  #content ul,#content ol{margin:.6em 0;padding-left:1.4em}
  #content li{margin:.3em 0}
  #content strong{color:var(--ink)}
  #content code{background:var(--code);border:1px solid var(--line);border-radius:5px;
    padding:.08em .38em;font:13.5px/1.4 "SF Mono",Menlo,Consolas,monospace;color:#8be9c9}
  #content hr{border:0;border-top:1px solid var(--line);margin:1.8em 0}
  blockquote{margin:1em 0;padding:.5em 1em;background:var(--panel);border-left:3px solid var(--accent);
    border-radius:0 6px 6px 0;color:var(--ink)}
  blockquote p{margin:.3em 0}
  pre.code{position:relative;background:var(--code);border:1px solid var(--line);border-radius:9px;
    padding:14px 16px;overflow-x:auto;margin:1em 0}
  pre.code code{background:none;border:0;padding:0;color:#d7e2ea;
    font:13px/1.55 "SF Mono",Menlo,Consolas,monospace;white-space:pre}
  pre.code .copy{position:absolute;top:8px;right:8px;background:var(--panel2);color:var(--muted);
    border:1px solid var(--line);border-radius:6px;font-size:11px;padding:3px 9px;cursor:pointer}
  pre.code .copy:hover{color:var(--teal);border-color:var(--teal)}
  .tablewrap{overflow-x:auto;margin:1em 0}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  th{background:var(--panel2);color:var(--ink)}
  tr:nth-child(even) td{background:rgba(255,255,255,.02)}
  .pagehdr{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:2px}
  /* quiz */
  .quiz{margin:34px 0 10px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .quiz h3{margin-top:0;color:var(--ink)}
  .quiz .qmeta{font-size:13px;color:var(--muted);margin-bottom:14px}
  .qcard{margin:16px 0;padding:16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
  .qtext{font-weight:600;margin-bottom:12px}
  .opt{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:11px 13px;margin:8px 0;cursor:pointer;font-size:14.5px;
    transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--accent);background:#ede9fe}
  .opt.correct{border-color:var(--good);background:var(--good-bg)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.disabled{cursor:default;opacity:.85}
  .why{margin-top:10px;font-size:13.5px;color:var(--ink);background:var(--code);
    border-left:3px solid var(--teal);border-radius:0 6px 6px 0;padding:9px 12px;display:none}
  .why.show{display:block}
  .why.ok{border-left-color:var(--good)} .why.no{border-left-color:var(--bad)}
  .qscore{margin-top:16px;font-size:14px;color:var(--muted)}
  .navbtns{display:flex;justify-content:space-between;margin-top:40px;gap:12px}
  .navbtns button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:11px 18px;font-size:14px;cursor:pointer}
  .navbtns button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .navbtns button:disabled{opacity:.35;cursor:default}
  .navbtns .next{background:var(--teal-dim);border-color:var(--teal)}
  .mobtog{display:none}
  @media(max-width:860px){
    #sidebar{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .25s}
    #sidebar.open{transform:none}
    #main{padding:64px 18px 80px}
    .mobtog{display:inline-flex;position:fixed;top:12px;left:12px;z-index:40;background:var(--panel);
      border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
  }
</style>
</head>

<script>
/* Minimal, dependency-free Markdown -> HTML renderer.
   Supports the subset used by the course: headings, bold, inline code, links,
   fenced code blocks, tables, blockquotes, ordered/unordered lists, hr,
   definition-style ": " lines, and paragraphs. Works in Node and the browser. */
(function (global) {
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(text) {
    // protect inline code spans
    var codes = [];
    text = text.replace(/`([^`]+)`/g, function (_, c) {
      codes.push("<code>" + escapeHtml(c) + "</code>");
      return "␀" + (codes.length - 1) + "␀";
    });
    text = escapeHtml(text);
    // bold (non-greedy so it can span inner single-* italics)
    text = text.replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>");
    // italics (remaining single *)
    text = text.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    // links [text](url)
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, t, u) {
      var safe = u.replace(/"/g, "%22");
      var ext = /^https?:\/\//.test(u) ? ' target="_blank" rel="noopener"' : "";
      return '<a href="' + safe + '"' + ext + ">" + t + "</a>";
    });
    // restore code spans
    text = text.replace(/␀(\d+)␀/g, function (_, i) {
      return codes[+i];
    });
    return text;
  }

  function renderTable(rows) {
    // rows: array of raw '| a | b |' lines (header, sep, ...body)
    function cells(line) {
      var t = line.trim().replace(/^\|/, "").replace(/\|$/, "");
      return t.split("|").map(function (c) { return c.trim(); });
    }
    var header = cells(rows[0]);
    var body = rows.slice(2).map(cells);
    var html = '<div class="tablewrap"><table><thead><tr>';
    header.forEach(function (h) { html += "<th>" + inline(h) + "</th>"; });
    html += "</tr></thead><tbody>";
    body.forEach(function (r) {
      html += "<tr>";
      r.forEach(function (c) { html += "<td>" + inline(c) + "</td>"; });
      html += "</tr>";
    });
    html += "</tbody></table></div>";
    return html;
  }

  function mdToHtml(md) {
    md = md.replace(/\r\n/g, "\n");
    var lines = md.split("\n");
    var out = [];
    var i = 0;

    function isTableSep(line) {
      return /^\s*\|?[\s:-]*-[\s:|-]*\|?\s*$/.test(line) && line.indexOf("-") !== -1;
    }

    while (i < lines.length) {
      var line = lines[i];

      // fenced code block
      var fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        var lang = fence[1] || "";
        var buf = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++; // skip closing fence
        out.push('<pre class="code" data-lang="' + lang + '"><button class="copy" type="button">Copy</button><code>' +
          escapeHtml(buf.join("\n")) + "</code></pre>");
        continue;
      }

      // horizontal rule
      if (/^\s*---\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

      // heading
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        var lvl = h[1].length;
        out.push("<h" + lvl + ">" + inline(h[2].trim()) + "</h" + lvl + ">");
        i++;
        continue;
      }

      // blockquote (may span lines)
      if (/^\s*>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        out.push('<blockquote>' + mdToHtml(q.join("\n")) + "</blockquote>");
        continue;
      }

      // table
      if (line.indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var trows = [];
        while (i < lines.length && lines[i].indexOf("|") !== -1 && lines[i].trim() !== "") {
          trows.push(lines[i]);
          i++;
        }
        out.push(renderTable(trows));
        continue;
      }

      // unordered list
      if (/^\s*[-*]\s+/.test(line)) {
        var items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          var item = lines[i].replace(/^\s*[-*]\s+/, "");
          i++;
          // continuation lines (indented, not a new list item / block)
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && lines[i].trim() !== "") {
            item += " " + lines[i].trim();
            i++;
          }
          items.push("<li>" + inline(item) + "</li>");
        }
        out.push("<ul>" + items.join("") + "</ul>");
        continue;
      }

      // ordered list
      if (/^\s*\d+\.\s+/.test(line)) {
        var oitems = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          var oitem = lines[i].replace(/^\s*\d+\.\s+/, "");
          i++;
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) && lines[i].trim() !== "") {
            oitem += " " + lines[i].trim();
            i++;
          }
          oitems.push("<li>" + inline(oitem) + "</li>");
        }
        out.push("<ol>" + oitems.join("") + "</ol>");
        continue;
      }

      // definition-style ": " line -> indented note paragraph
      if (/^:\s+/.test(line)) {
        out.push('<p class="dd">' + inline(line.replace(/^:\s+/, "")) + "</p>");
        i++;
        continue;
      }

      // blank line
      if (line.trim() === "") { i++; continue; }

      // paragraph (gather until blank / block start)
      var para = [line];
      i++;
      while (i < lines.length && lines[i].trim() !== "" &&
             !/^(#{1,6})\s/.test(lines[i]) &&
             !/^```/.test(lines[i]) &&
             !/^\s*>\s?/.test(lines[i]) &&
             !/^\s*[-*]\s+/.test(lines[i]) &&
             !/^\s*\d+\.\s+/.test(lines[i]) &&
             !/^:\s+/.test(lines[i]) &&
             !/^\s*---\s*$/.test(lines[i]) &&
             !(lines[i].indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1]))) {
        para.push(lines[i]);
        i++;
      }
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }

    return out.join("\n");
  }

  if (typeof module !== "undefined" && module.exports) module.exports = mdToHtml;
  else global.mdToHtml = mdToHtml;
})(typeof window !== "undefined" ? window : this);

</script>
<script>
const DATA = {"pages": [{"id": "00-the-path-of-a-request", "title": "0 · The path of a request", "group": "The map", "md": "*No installs, no labs: this whole course is the mental model the other four courses assume. ~10 min read.*\n\n---\n\nType a URL, press Enter, and your request crosses half a dozen pieces of infrastructure before any\ncode you wrote ever runs. Every one of those pieces exists to solve a real problem, and every one of\nthem is a thing you'll meet again in the Docker, Kubernetes, Envoy, and Istio courses. This module\ndraws the whole map once, so each later module can zoom into one box without you losing the plot.\n\n## The map\n\n```\n you (browser / app)\n   │\n   ▼\n DNS            \"where IS api.example.com?\"        → an IP address\n   │\n   ▼\n CDN            the copy shop at the edge          (static content, cached responses)\n   │\n   ▼\n Load balancer  the traffic cop                    (spreads requests across machines)\n   │\n   ▼\n API gateway    the front desk                     (auth, rate limits, routing)\n   │\n   ▼\n your services  the actual work                    (each behind its own internal LB,\n                                                    talking to queues, caches, databases)\n```\n\nNot every system has every box, and some boxes collapse into one product, but the *jobs* are\nalways there, and knowing which job lives where is what lets you debug \"the site is down\" in\nminutes instead of hours.\n\n## Each box, in one no-nonsense paragraph\n\n**DNS** answers exactly one question: what address should I talk to for this name? It's a\ndistributed phone book with aggressive caching. Because it's the *first* step, it's also a place\nto do crude but far-reaching routing (send Europeans to the Frankfurt region, fail over to the backup\nsite), all before a single packet reaches your infrastructure.\n\n**A CDN** (content delivery network) is thousands of small caches placed physically near your\nusers. If the answer to a request hasn't changed (an image, a script, yesterday's blog post), the\nCDN answers from a server 20 ms away instead of your origin 200 ms away, and your servers never\nsee the request at all. The fastest and cheapest request is the one that never arrives.\n\n**A load balancer** takes a stream of incoming requests and spreads it across many identical\nservers, checking their health and skipping the dead ones. It's the piece that turns \"a server\"\ninto \"a fleet\", and it's what makes deploys, crashes, and scaling invisible to users.\n\n**An API gateway** is the single front door for your APIs. It checks who you are, enforces how\noften you may call, routes each path to the right backend service, and gives the outside world one\nstable address while the services behind it split, merge, and move. It is a *policy* layer; the\ncourse module on it is mostly about what it should *not* do.\n\n**Your services** (the containers, pods, and meshes of the other four courses) finally do the\nwork. Inside that boundary the same patterns repeat at smaller scale: internal load balancers in\nfront of each service, internal gateways between departments, caches and queues between services.\n\n## Two directions of traffic\n\nTraffic from the outside world into your system is called **north–south**; traffic between your\nown services is **east–west**. The distinction matters because the tools differ: the CDN, the edge\nload balancer, and the external API gateway handle north–south; service meshes (Istio) and\ninternal load balancing handle east–west. When someone says \"the gateway\", asking *which\ndirection* is the fastest way to know what they mean.\n\n## Control plane vs data plane\n\nOne more pair of words the whole cloud-native world leans on. The **data plane** is whatever\ntouches each request as it flows: proxies, load balancers, caches. The **control plane** is\nwhatever *configures* the data plane: the thing you talk to when you change a route or add a\nbackend. DNS has resolvers and registrars; Envoy has proxies and xDS servers; Kubernetes has\nkubelets and an API server. Same split, every time. When requests still flow but you can't change\nanything, the control plane is down; when nothing flows, look at the data plane.\n\n## How to use this course\n\nEach of the next modules takes one box and answers the same four questions: what problem does it\nsolve, how does it actually work, what should it do and, just as important, what should it *not*\ndo. There are no labs here; the labs live in the four hands-on courses this one feeds into."}, {"id": "01-load-balancers", "title": "1 · Load balancers", "group": "The boxes", "md": "*The traffic cop: what it balances, how it decides, and why health checks are the real feature. ~12 min read.*\n\n---\n\nOne server can only do so much, and it can crash. The moment you run two servers, a new question\nappears: **who decides which request goes to which server?** That decision-maker is the load\nbalancer, and it's quietly one of the most important components you'll ever run, because it's the\npiece that makes failure invisible.\n\n## The job description\n\nA load balancer (LB) sits in front of a group of servers and does three things:\n\n1. **Spreads requests** across the servers so no single one drowns.\n2. **Health-checks** the servers and stops sending traffic to the ones that fail.\n3. **Hides the fleet** behind one stable address, so clients neither know nor care how many\n   servers exist, which just crashed, or which are mid-deploy.\n\nNumber 2 is the one that earns its keep. Balancing a healthy fleet is easy; noticing at 3 a.m.\nthat server four is returning garbage and quietly removing it. *That's* the feature.\n\n## L4 vs L7: what the balancer can see\n\nThe classic split (the Envoy course goes deep here):\n\n- An **L4 load balancer** works at the connection level. It sees \"TCP connection from this IP to\n  that port\" and forwards bytes. It cannot read URLs or headers, but it's extremely fast, protocol\n  agnostic, and hard to break.\n- An **L7 load balancer** speaks the application protocol (usually HTTP). It sees the method, the\n  path, the headers, so it can route `/api/` differently from `/images/`, retry a failed GET,\n  or send 5% of traffic to a canary build.\n\nThe rule of thumb: **L4 when you just need to spread connections; L7 when routing decisions depend\non what's *inside* the request.** Most real systems have both: an L4 balancer at the very edge,\nL7 balancers (often Envoy) behind it.\n\n## The algorithms, and how much they matter\n\nPeople expect this list to matter more than it does:\n\n| Algorithm | What it does | When it matters |\n|---|---|---|\n| **Round robin** | Next server, in order | The default; fine almost always |\n| **Least connections** | Server with fewest open connections | Long-lived or uneven requests |\n| **Weighted** | Some servers get more traffic | Mixed hardware; canary releases |\n| **Hashing / sticky** | Same client → same server | Sessions or caches on the server |\n\nIn practice, round robin or least-connections covers nearly everything, and **sticky\nsessions are usually a smell**: they mean a server holds state that should live in a shared\nstore, and they turn one server's death into some users' logout. The cloud-native courses keep\npushing state *out* of servers precisely so the balancer can treat them as interchangeable.\n\n## Health checks: the part worth configuring carefully\n\nA health check is a question the LB asks each server on repeat: *are you OK?* Three grades of\nrigor:\n\n- **TCP check**: \"does the port accept a connection?\" Cheap, and catches only total death.\n- **HTTP check**: \"does `GET /healthz` return 200?\" Catches a hung or crashing app.\n- **Deep check**: the `/healthz` handler verifies its own dependencies (database reachable,\n  cache warm). Thorough and dangerous: if every server's check fails because the *database*\n  blinked, the LB removes all of them and turns a wobble into an outage. Check what the server\n  itself controls; report dependencies as separate signals.\n\nKubernetes readiness probes (Kubernetes course, module 6) are exactly this idea, one layer down.\n\n## Global vs regional\n\nEverything above balances within one place. Balancing *across* places uses different machinery:\n\n- **DNS-based**: resolve `api.example.com` to Frankfurt for Europeans and Virginia for Americans;\n  fail the whole name over when a region dies. Coarse (DNS caching makes changes slow to\n  propagate) but universal.\n- **Anycast**: advertise the *same* IP address from many locations and let internet routing\n  deliver each user to the nearest one. This is how CDNs and big public DNS resolvers work.\n\nA global request often passes **two or three balancers**: DNS/anycast chooses the region, an L4\nbalancer at the region's edge spreads connections, an L7 balancer inside routes to services. Each\nlayer only has the one job.\n\n## What a load balancer should NOT do\n\nThe LB is a fast, dumb, reliable traffic cop, and its value comes from staying that way:\n\n- **No business logic.** The moment routing rules encode \"premium customers go to the fast\n  cluster\", you've hidden product behavior in infrastructure config nobody reviews.\n- **No request transformation** beyond headers it owns (adding `X-Forwarded-For` is fine;\n  rewriting response bodies is not; that's an application's or gateway's job).\n- **Not a substitute for capacity.** A balancer spreads load; it doesn't create it. If every\n  server is at 100%, the balancer just distributes the suffering evenly.\n\nIf you find yourself wanting the balancer to be smarter, what you usually want is the next module's\ncomponent (the API gateway) or the application itself."}, {"id": "02-api-gateways", "title": "2 · API gateways", "group": "The boxes", "md": "*The front desk: what belongs at the front door, what absolutely doesn't, and the internal vs external split. ~12 min read.*\n\n---\n\nOnce a system is more than one service, the outside world has a problem: *which* service do I talk\nto, and does every one of them really need its own authentication, its own rate limiting, its own\nTLS setup? An **API gateway** is the answer: one front door for all your APIs, where the\ncross-cutting concerns live exactly once.\n\n## What an API gateway is\n\nMechanically, a gateway is an L7 reverse proxy, the same species as the load balancer from the\nlast module and the Envoy proxy from its own course. What makes it a *gateway* is the job it's\ngiven: it is the **policy edge** of your API. Clients see one stable host; behind it, requests fan\nout to whatever services currently implement each path.\n\n```\n            api.example.com\n                  │\n           ┌──── gateway ────┐        authn, rate limits, routing, TLS\n           ▼        ▼        ▼\n        orders   billing   search      each service, free to change\n```\n\n## What a gateway SHOULD do\n\nEach of these is a thing every service would otherwise have to implement, identically, forever:\n\n- **Authentication at the edge.** Validate the token (OAuth2/OIDC/JWT, Identity Dojo territory)\n  once, reject garbage before it touches a backend, and pass verified identity inward as headers\n  or a signed token. Services still *authorize* (\"may this user delete that order?\"), but they\n  shouldn't each be parsing tokens.\n- **Rate limiting & quotas.** \"1,000 requests/hour per API key\" is meaningless if every service\n  counts separately. The front door is the only place a global count can live.\n- **Routing & API versioning.** `/v2/orders` → the new orders service; `/v1/orders` → the old one\n  until it dies. The public URL space stays stable while the service topology churns.\n- **TLS termination** for north–south traffic, with certificates managed in one place.\n- **Observability at the boundary.** One access log, one latency histogram, one request-ID stamp\n  for every API call you serve: the baseline every debugging session starts from.\n- **Basic request hygiene.** Size limits, timeout enforcement, rejecting obviously malformed\n  requests: the cheap protections, applied uniformly.\n\n## What a gateway should NOT do\n\nThis list is why gateway projects fail. The gateway is shared infrastructure on the hot path of\n*every* request; whatever you put in it, you've put in front of everything you ship:\n\n- **No business logic.** The moment the gateway knows that \"gold-tier customers skip the fraud\n  check\", product behavior lives in a config file owned by the infrastructure team, deployed on\n  its own schedule, reviewed by nobody who owns the feature. This is the #1 failure mode, and it\n  has a name from history: the ESB, the enterprise service bus that slowly ate the business\n  logic of a generation of architectures and became the thing nobody could change.\n- **No response aggregation / orchestration.** \"Call orders, then billing, then merge the JSON\" is\n  an application. If clients need a stitched view, build a thin **backend-for-frontend** service\n  that owns that stitching; it can deploy, scale, and fail on its own without taking every other\n  API with it.\n- **No data transformation** beyond protocol mechanics. Header in, header out is fine; rewriting\n  payload schemas between versions is a service's contract, not the front desk's.\n- **Not a shared database of config for everyone.** Route tables with thousands of entries edited\n  by twenty teams through tickets is the ESB again, wearing a YAML costume. Good gateway setups\n  let each team own their routes (the Kubernetes Gateway API's Gateway-vs-HTTPRoute split, Envoy\n  course module 8, is exactly this).\n\nThe test for any proposed gateway feature: **would this rule need to change when a product feature\nchanges?** If yes, it belongs in a service someone owns, not in the front door.\n\n## Internal vs external gateways\n\nBoth are \"a gateway\", but they answer different threats and serve different clients:\n\n| | **External (edge) gateway** | **Internal gateway** |\n|---|---|---|\n| Clients | The internet: browsers, mobile apps, partners | Your own teams' services |\n| Trust level | Zero: assume hostility | Low but not zero (zero-trust says: still verify) |\n| Auth job | Full authentication: OIDC, API keys, bot defense | Service identity (mTLS, service tokens), tenant isolation |\n| Rate limits | Per customer/key, protecting you from the world | Per calling service, protecting teams from each other |\n| API surface | Small, stable, versioned, documented for outsiders | Wider, faster-moving, documented for insiders |\n| Typical form | Managed edge product or Envoy-based edge fleet | Lighter proxy tier, often per-domain, or mesh policy |\n\n**When do you need an internal gateway at all?** When one department's services are consumed by\nmany other departments: a payments platform inside a big company is effectively a product with\ninternal customers, and it wants the same front-desk services: stable routes, quotas so one buggy\nconsumer can't flatten it, and an audit trail. In a small system, an internal gateway is usually\npremature: the service mesh (Istio course) already gives you mTLS, retries, and telemetry for\neast–west traffic, and a mesh plus an *external* gateway covers most architectures. The practical\nsequence: external gateway first, mesh when service-to-service concerns bite, internal gateways\nonly when a domain inside the company becomes a platform.\n\n## How this connects\n\nA gateway is often *implemented* with the pieces you already know: Envoy is the data plane of many\ngateway products, the Kubernetes Gateway API is the config model, and the token validation it does\nat the edge is the OAuth/OIDC material from Identity Dojo, deployed to production."}, {"id": "03-cdns", "title": "3 · CDNs", "group": "The boxes", "md": "*The copy shop at the edge: what caching actually buys you, cache keys, invalidation, and when a CDN is the wrong tool. ~10 min read.*\n\n---\n\nPhysics is the one scaling problem you can't code around: a request from Sydney to a server in\nVirginia spends ~200 ms just *traveling*, before your code runs at all. A **content delivery\nnetwork** attacks the problem the only way physics allows: by moving the answer closer to the\nquestion.\n\n## What a CDN is\n\nA CDN is thousands of cache servers (\"edge nodes\" or **PoPs**, points of presence) spread across\ncities worldwide, all announcing the same address via **anycast** (module 4 explains how that\nworks). Your user's request lands at the nearest node. If that node has a valid copy of the\nanswer (a **cache hit**), it responds from 20 ms away and your servers (**the origin**) never\nhear about it. If not (a **miss**), the node fetches from your origin, serves the user, and keeps\na copy for the next person.\n\nThree wins, in order of importance:\n\n1. **Latency**: answers come from nearby.\n2. **Origin offload**: your servers see a fraction of the traffic; the cheapest request is the\n   one that never arrives. This is also your DDoS shock absorber.\n3. **Availability**: many CDNs can serve stale copies while your origin is down; visitors read\n   yesterday's page instead of an error page.\n\n## What's cacheable, really\n\n- **Static assets**: images, JS, CSS, fonts, downloads. The classic case; cache aggressively.\n- **Anonymous dynamic content**: the same rendered blog post everyone sees. Cache for seconds or\n  minutes; even a 30-second TTL collapses a traffic spike into one origin request per PoP.\n- **Personalized or private responses**: *your* shopping cart, *your* account page. Do **not**\n  cache at a shared edge, and mark them so: one `Cache-Control: public` on a per-user response is\n  a data breach with your name on the commit.\n- **APIs**: GETs with common parameters often cache well; writes never do.\n\nThe control knobs are HTTP itself: `Cache-Control` (`max-age`, `s-maxage`, `public`/`private`,\n`no-store`), `ETag` revalidation, and `Vary`.\n\n## The cache key: where correctness lives\n\nThe **cache key** is what the CDN uses to decide \"same content\": typically host + path + a chosen\nsubset of query parameters and headers. Both failure directions hurt:\n\n- **Key too broad** (ignores a header that changes the response): users receive *someone else's*\n  variant: the gzip-page-served-to-a-client-that-can't-unzip class of bug, or worse, someone\n  else's data.\n- **Key too narrow** (includes irrelevant parameters): `?utm_source=twitter` makes every marketing\n  link a cache miss and your hit rate quietly dies.\n\n`Vary` is how the origin tells caches \"this header changes the answer.\" Treat cache-key design as\nAPI design: deliberate, reviewed, and tested.\n\n## Invalidation: the famous hard problem\n\nYou deployed `app.js` v2; edges hold v1 for another `max-age`. Your options, best first:\n\n1. **Versioned URLs.** Build the version into the name (`app.9f31c2.js`) and cache it for a\n   year. A new deploy is a *new URL*, so there's nothing to invalidate, and rollbacks are just the\n   old URL again. This removes the problem instead of solving it; every serious frontend build\n   does this.\n2. **Short TTL + revalidation** for things that must live at stable URLs (the HTML page itself):\n   `max-age=60` bounds staleness at a minute; `ETag` makes the refresh cheap (a 304, no body).\n3. **Purge APIs**: \"invalidate `/index.html` everywhere, now.\" Fine as a deploy step or emergency\n   brake; a design smell if your architecture *depends* on purges racing around the planet.\n\n## When a CDN is the wrong tool\n\n- **Cache hit rate near zero**: every response personalized or unique. You've added a hop and a\n  bill; the CDN's other edge services (TLS, DDoS absorption) may still justify it, but know\n  *which* product you're actually buying.\n- **Strong consistency reads**: \"balance after transfer\" must come from the system of record. A\n  cache is, by definition, allowed to be stale.\n- **As a substitute for capacity planning**: a CDN absorbs *read* spikes of *cacheable* content.\n  Checkout traffic goes straight through to origin, every time.\n- **East–west traffic**: CDNs are a north–south, edge technology. Service-to-service caching is a\n  Redis/application-cache problem (module 5), not a CDN problem.\n\n## Where it sits in the map\n\nThe CDN is the outermost ring of module 0's diagram: DNS resolves to the CDN, the CDN terminates\nTLS meters away from the user, serves what it can, and forwards the rest to your load balancer.\nThat also makes it the first suspect when \"the site shows old content\": check what the edge\ncached, and what your `Cache-Control` headers *actually said*, before blaming the app."}, {"id": "04-dns", "title": "4 · DNS in depth", "group": "The boxes", "md": "*The distributed phone book: how a name becomes an address, what every record type is actually for, and the rules (and workarounds) around CNAMEs. ~15 min read.*\n\n---\n\nDNS answers one question (*what should I talk to for this name?*) and it answers it billions of\ntimes a second, using a design from 1983 that still works: **delegate everything, cache\neverything**. Almost every DNS surprise you'll ever hit traces back to one of those two words.\n\n## The resolution walk\n\nWhen your browser needs `api.example.com`, the walk is:\n\n```\nyour app\n  → stub resolver        the tiny client in your OS: \"someone answer this\"\n  → recursive resolver   your ISP's, your company's, or 1.1.1.1 / 8.8.8.8 —\n                         does the real legwork, and CACHES what it learns\n      → root servers        \"ask the .com servers, they're over there\"\n      → .com TLD servers    \"ask example.com's own servers, over there\"\n      → example.com's       \"api.example.com is 203.0.113.7\" ← AUTHORITATIVE\n        nameservers\n```\n\nTwo roles matter forever after: the **authoritative** servers are the ones that *own* the answer:\nwhat you edit in your DNS provider's dashboard edits *them*. Everything else is a **cache** with a\ncountdown timer. When you \"change DNS\" and nothing happens, you didn't fail to change it; you\nchanged the authority, and the world's caches haven't asked again yet.\n\n## Zones, delegation, and who you're actually paying\n\nA **zone** is the chunk of the namespace you control: `example.com` and everything under it. Two\ndifferent companies are involved in yours, and confusing them causes real outages:\n\n- The **registrar** is where you *bought* the name. Its one ongoing job: tell the `.com` servers\n  which nameservers are authoritative for your zone: the **NS records**.\n- The **DNS host** *runs* those nameservers and serves your records. Often the same company as the\n  registrar; often not.\n\nMigrating DNS hosts means updating NS records *at the registrar*: the classic half-done migration\nserves old records to half the internet for days, because the old host still answers whoever\nhasn't seen the new NS delegation yet. Inside a zone you can delegate further: an NS record for\n`internal.example.com` hands that subtree to a different set of servers (this is how a platform\nteam gives each product team its own sandbox).\n\n## The records, in plain English\n\nEvery record is a line of \"for this **name**, this **type** of question has this answer, cacheable\nfor **TTL** seconds.\"\n\n**A / AAAA: \"the address is…\"** The workhorses: name → IPv4 (A) or IPv6 (AAAA) address. A name\ncan hold *several*: resolvers get the whole set, clients pick one, and you've accidentally\ninvented the crudest load balancer (more below).\n\n**CNAME: \"actually, ask about this other name.\"** A CNAME is an **alias**, and being precise\nabout what it does prevents most CNAME bugs: it does *not* redirect traffic and does *not* copy an\naddress. It tells the resolver *\"restart your question with this other name\"*:\n\n```\nwww.example.com.   CNAME   sites.hostingprovider.net.\n; resolver: \"OK, what's the A record for sites.hostingprovider.net?\"\n```\n\nWhy that indirection is worth a whole record type: **it tracks the target's changes.** The hosting\nprovider can renumber `sites.hostingprovider.net` a hundred times; your record never changes,\nbecause it names the *name*, not the address. That's why CDNs and hosting platforms tell you\n\"CNAME to us\": their addresses are theirs to shuffle.\n\nThe rules, which exist because a CNAME means \"*everything* about this name lives elsewhere\":\n\n1. **A CNAME must be alone.** No other record may coexist at the same name: if `www` is an alias,\n   `www` can't *also* have its own MX or TXT; those questions all get forwarded to the target.\n2. **No CNAME at the zone apex.** `example.com` itself *must* hold SOA and NS records (that's\n   what makes it a zone), and rule 1 says a CNAME tolerates no neighbors. Contradiction, so it's\n   forbidden. This is *the* famous DNS gotcha: your host says \"CNAME to us\" and your registrar\n   refuses to accept it on the bare domain.\n3. **Chains work but cost.** CNAME → CNAME → A resolves, each hop a potential extra lookup. Keep\n   aliases one hop deep where you can.\n\n**ALIAS / ANAME / flattened CNAME: the apex workaround.** Not a real DNS record type (no RFC\ndefines it) but a feature of your DNS *provider*: you configure \"apex → `lb.provider.net`\", and\nthe provider's authoritative servers secretly resolve the target themselves, then answer queries\nwith plain **A records**. The world sees ordinary addresses; you get CNAME-like\ntrack-the-target behavior at the apex. Two real caveats: it's provider-specific (moving DNS\nhosts means re-creating it, maybe differently), and the target gets resolved *from the provider's\nservers*, so a geo-aware target may pick an address near your DNS provider rather than near your\nuser. Good providers mitigate this; worth asking how yours does.\n\n**MX: \"mail for this domain goes to…\"** Mail servers, with priorities. Two operational notes:\nmail is the thing people forget when migrating DNS (\"email is down\" after a zone move is\npractically a tradition), and MX targets must be names with A/AAAA records: an MX pointing at a\nCNAME is against spec and breaks some mail software.\n\n**TXT: \"here's a string, make of it what you will.\"** The junk drawer that became load-bearing.\nDomain-ownership verification (\"paste this TXT record to prove control\") and the email\nauthentication trio all live here: **SPF** (which servers may send mail as this domain), **DKIM**\n(the public key mail signatures verify against), **DMARC** (what receivers should do with mail\nthat fails). If you send email at all, these three records decide whether it lands in inboxes.\n\n**CAA: \"only these authorities may issue certificates for this name.\"** A small, cheap fence\naround TLS (next module): certificate authorities are *required* to check it before issuing. Two\nlines of zone file that make a whole class of mis-issuance harder.\n\n**SRV, PTR, SOA: the supporting cast.** SRV maps a *service* to host+port (used by Kerberos and\nActive Directory; Identity Dojo's enterprise stream leans on it). PTR is reverse DNS, address →\nname (mostly a mail-server reputation requirement). SOA is the zone's cover page: serial number,\nrefresh timing, and the field that matters to you: the **negative TTL**, how long resolvers may\ncache \"that name doesn't exist\" (yes, *misses* are cached too: create a record, query it too soon,\nand the NXDOMAIN you generated can outlive your fix).\n\n## TTLs and the \"propagation\" myth\n\nEvery record carries a TTL: how long any cache may hold it. \"Waiting for DNS to propagate\" is a\ncomforting phrase, but nothing *propagates*: caches simply expire on their own schedule, one\nresolver at a time, and until then they serve the old answer. Which makes TTL strategy simple to\nstate: **low TTLs (30–300s) on records you might need to change in a hurry** (anything used for\nfailover or migration), **long TTLs (hours+) on stable records** to cut latency and load; and,\nbefore any planned change, **lower the TTL one full old-TTL in advance**, because the change to\nthe TTL itself obeys the *old* TTL. One more real-world wrinkle: some resolvers clamp or ignore very\nlow TTLs, so treat \"one minute\" as *most* of the internet, not all of it.\n\n## DNS as a routing layer\n\nBecause DNS runs before any connection, it's a place to make routing decisions:\n\n- **Round-robin**: multiple A records; clients spread across them. No health checks, no real\n  balance: a fine crude spreader, never an availability story.\n- **Weighted / geo / latency answers**: managed DNS products answer differently per query origin:\n  Europeans get Frankfurt, 5% of resolutions get the canary region. Coarse (per-resolver, not\n  per-user, and cached) but universal.\n- **Health-checked failover**: the provider probes your endpoints and drops dead ones from\n  answers. With realistic TTLs this is minutes-not-seconds failover; pair with anycast (module 0's\n  CDN trick) when seconds matter.\n- **Split-horizon**: internal resolvers answer with private addresses, public ones with public:\n  same name, different truths. A sharp tool and a debugging trap: \"it resolves differently from the\n  office\" is split-horizon until proven otherwise.\n\n## Debugging: three commands and three failures\n\n`dig api.example.com`: what does *my resolver* say. `dig @1.1.1.1`: what does a *different*\ncache say (disagreement = caching or split-horizon). `dig +trace`: walk from the roots yourself\nand see the *authoritative* truth, skipping every cache. The failures read differently and point\ndifferently: **NXDOMAIN** = the authority says this name does not exist (typo, missing record, or\nnegative-cached miss); **SERVFAIL** = the resolver couldn't get an answer (broken delegation, dead\nnameservers, DNSSEC validation failure); an **empty answer** for your type = the name exists but\nhas no record of that type (you queried A, there's only a CNAME chain to nowhere, or only AAAA).\nAsk which of the three you have before touching anything."}, {"id": "05-tls", "title": "5 · TLS & certificates", "group": "The boxes", "md": "*Trust for the pipe: what certificates actually prove, why chains break in exactly one way, and where decryption should happen. ~12 min read.*\n\n---\n\nDNS (last module) told you *where* to connect. TLS is what makes the connection worth having: it\ngives the pipe **encryption** (nobody reads it), **integrity** (nobody alters it), and\n**authentication** (you're talking to who you think you are). The first two come nearly free. The\nthird one runs on **certificates**, and certificates are where all the operational pain lives,\nso that's where this module spends its time.\n\n## What a certificate actually proves\n\nA certificate is a signed statement: *\"this public key belongs to `api.example.com`\"*, signed by\na **certificate authority (CA)** your client already trusts. The trust is transitive and forms the\n**chain**:\n\n```\nroot CA          lives in the client's trust store, offline, decades-long\n  └─ intermediate CA     does the day-to-day signing\n        └─ your certificate     \"api.example.com\", valid ~90 days\n```\n\nThe server must present **its certificate plus the intermediates**; clients only have roots\nbuilt in. Which produces *the* classic TLS bug: an incomplete chain **works in browsers and fails\neverywhere else**: browsers repair missing intermediates by fetching them, while curl, Java, and\nmost libraries validate exactly what the server sent. \"Works in Chrome, fails in the app\" is a\nmissing intermediate until proven otherwise; `openssl s_client -connect host:443` shows precisely\nwhat's being served.\n\nTwo more things a certificate is *not*: proof the site is trustworthy (only that the name is\ntheirs; phishing sites have valid certificates), and permanent (modern certs live ~90 days on\npurpose: short lifetimes make stolen keys age out fast and force the automation habit below).\n\n## SNI: many names, one address\n\nOne server IP usually hosts many names, so the client announces the name it wants *inside the TLS\nhandshake*, **SNI** (Server Name Indication), and the server picks the matching certificate.\nInfrastructure reads SNI everywhere: it's how the Envoy course's filter-chain matching routes TLS\nconnections without decrypting them, and why a misrouted certificate (\"wrong cert served for my\ndomain\") is usually an SNI/default-chain configuration bug, not a certificate bug.\n\n## ACME: certificates as automation, not ritual\n\n**Let's Encrypt** and the **ACME** protocol turned certificates from an annual purchase into free,\nautomated, 90-day issuance. The CA's problem is proving you control the name; ACME offers two\nchallenge shapes, and knowing both is practical knowledge:\n\n- **HTTP-01**: \"serve this token at `http://yourname/.well-known/acme-challenge/…`\". Simple, but\n  requires the CA to reach your web server, no good for internal hosts.\n- **DNS-01**: \"create this TXT record\". Runs entirely through last module's machinery, works for\n  internal names, and it's the only way to get **wildcard** certificates (`*.example.com`). The\n  price: your automation now needs API access to your DNS zone, credentials worth guarding.\n\nTwo DNS records from last module close the loop: **CAA** limits which CAs may issue for your name\nat all, and the TXT records DNS-01 writes are why cert automation and DNS automation end up being\nthe same project. Either way the rule is absolute: **automate issuance and renewal from day one**\n(cert-manager in Kubernetes, or your proxy's built-in ACME). \"The cert expired on a Saturday\" is\nthe single most preventable outage in this whole course.\n\n## Where TLS terminates: a real architectural decision\n\n\"Terminating TLS\" means decrypting. *Where* you do it decides where plaintext exists:\n\n```\nuser ──TLS──► CDN ──?──► LB ──?──► gateway ──?──► service\n```\n\n- **Terminate at the edge, plaintext inside.** Simple, fast, historically common, and it means\n  everything behind the edge sees plaintext. The zero-trust critique is blunt: \"inside the\n  perimeter\" is not a trust boundary; one compromised pod reads its neighbors' traffic.\n- **Re-encrypt hop by hop.** The edge terminates (it must, to route on L7 data), then opens fresh\n  TLS inward. The common serious posture for north–south traffic.\n- **mTLS service-to-service.** For east–west traffic, *mutual* TLS: both sides present\n  certificates, so every service proves its identity, both directions. Doing this by hand (a\n  cert per service, rotated, distributed) is brutal, which is exactly the service mesh's pitch:\n  Istio issues each workload a short-lived certificate and rotates it automatically (Istio\n  course, module 6), and the identity *inside* that certificate is what authorization policies\n  consume.\n\nThat last sentence closes this course's loop with the identity world: modern infrastructure\nidentity **is** certificates: SPIFFE-style workload identity, mTLS meshes, cert-bound service\naccounts. The Identity Dojo service-to-service stream picks up exactly where this module stops.\n\n## The debugging shortlist\n\n| Symptom | First suspect |\n|---|---|\n| Works in browser, fails in curl/Java/mobile | Incomplete chain: serve the intermediates |\n| \"Certificate name mismatch\" | SNI: wrong cert picked, or the name isn't on the cert (check SANs) |\n| Everything broke at once, no deploys | Expiry: yours, or an intermediate's; check the whole chain |\n| Valid cert, but clients with old devices fail | Root not in their ancient trust store (the classic old-Android problem) |\n| Renewal suddenly failing | CAA record blocking the CA, or the ACME challenge can't reach you |"}, {"id": "06-queues-caches-async", "title": "6 · Queues, caches & async", "group": "The boxes", "md": "*The technologies that take work OFF the request path: message queues, application caches, and object storage. ~12 min read.*\n\n---\n\nEverything so far (DNS, CDN, load balancer, gateway) optimizes the **synchronous path**: a user\nis waiting, milliseconds count. But a mature system moves as much work as possible *off* that\npath, and three technologies do most of the moving: queues, caches, and object storage. They\naren't strictly \"traffic\" infrastructure, but no map of a cloud-native system is complete without\nthem.\n\n## Message queues: do it later, reliably\n\nA checkout request needs to: charge the card, update inventory, send a receipt email, notify the\nwarehouse, update analytics. The user needs an answer *now*; four of those five can happen in the\nnext few seconds. A **message queue** is how: the service handling the request writes a message\n(\"order 4412 placed\") to the queue and responds. Independent **consumers** read messages and do\nthe slow work at their own pace.\n\nWhat this buys, concretely:\n\n- **Latency**: the user waits for one write, not five downstream systems.\n- **Decoupling**: the email service can be down for an hour; messages wait, nothing is lost, and\n  checkout never noticed. Compare that with a synchronous call: their outage is your outage.\n- **Load leveling**: a spike of 10,000 orders/minute becomes a queue that drains at whatever rate\n  the consumers sustain, instead of a stampede that flattens the warehouse system.\n\nThe two shapes: **work queues** (each message consumed once, by one worker: background jobs) and\n**pub/sub streams** (each message readable by *every* interested consumer: events, the Kafka\nfamily).\n\nThe fine print is that queues have rules you can't opt out of:\n\n- Delivery is **at-least-once** in practice; exactly-once is a marketing word. Sometimes a message\n  arrives twice, so consumers must be **idempotent**: processing \"order 4412 placed\" twice must\n  not charge twice. (Design the handler around a key, *have I processed 4412?*, and this is\n  manageable; ignore it and it's a production incident.)\n- Messages that repeatedly crash their consumer need a **dead-letter queue**: a sidetrack where\n  poison messages go for humans to inspect, instead of blocking everything behind them.\n- **A queue is not a database.** If a message's data matters, it also lives in the system of\n  record; the queue is transport, not truth.\n\n## Application caches: don't compute it twice\n\nThe CDN cached responses at the edge for *everyone*; an **application cache** (Redis and its\nfamily) caches *data* inside your system: session data, rendered fragments, the result of an\nexpensive query, \"the 100 hottest products.\"\n\nThe standard pattern is **cache-aside**: look in the cache; on a miss, read the database, put the\nresult in the cache with a TTL, return it. Simple, and its failure modes are famous enough to\nhave names:\n\n- **Staleness.** The database changed; the cache hasn't expired. Decide *per key* how stale is\n  acceptable, and let TTL enforce it. \"I'll invalidate on every write\" sounds better and is where\n  the famous quote about the two hard problems in computer science comes from: explicit\n  invalidation is a correctness protocol you now must maintain forever.\n- **Stampede.** A hot key expires and 5,000 concurrent requests all miss and all hit the database\n  at once: the cache was *hiding* load, and it returns as a spike. Mitigations: staggered TTLs,\n  or one request refreshes while others serve the stale value briefly.\n- **Cache as the only copy.** If restarting Redis loses data you needed, it wasn't a cache; it\n  was an accidental database, without a database's guarantees. Caches must be safe to flush at\n  any moment.\n\nThe unifying rule with the CDN module: **a cache is permission to be stale in exchange for speed.**\nEvery cache decision is choosing how much staleness the business can tolerate for that data.\n\n## Object storage: files are not your server's problem\n\nUser uploads, build artifacts, backups, logs: anything that's \"a blob of bytes with a name\"\nbelongs in **object storage** (the S3 family): effectively unlimited, cheap, replicated, and\naddressable by URL. The pattern that matters architecturally: services **pass URLs, not bytes**.\nAn upload goes *directly* from the user's browser to object storage via a **pre-signed URL** (a\nshort-lived, permission-scoped link your service issues); the service stores the object's key; the\nCDN serves the object to readers. Your application servers (the expensive, stateful-averse things\nKubernetes is scheduling) never carry file traffic at all.\n\n## The map, finished\n\n```\n                      you\n                       │\n        DNS ── CDN ── LB ── gateway ── services\n                                          │  │\n                                   cache ─┘  └─ queue ─► workers\n                                     │              │\n                                  database      object storage\n```\n\nRead it with the two questions this course keeps asking: *is a user waiting?* (sync path: spend\non latency) and *who owns the truth?* (systems of record vs the caches and queues that serve\nthem). Those two questions, asked box by box, are most of architecture review.\n\n**Where to go from here:** the four hands-on courses. Docker packages the services, Kubernetes\nruns them, Envoy is the data plane inside the LBs and gateways you now understand, and Istio is\nwhat happens when every service gets its own tiny gateway. See you there."}], "quizzes": {"00-the-path-of-a-request": [{"q": "What is the difference between north–south and east–west traffic?", "options": ["Encrypted vs unencrypted traffic", "Traffic between the outside world and your system vs traffic between your own services", "Upload vs download", "IPv4 vs IPv6"], "answer": 1, "why": "North–south crosses your edge (users, partners → your system); east–west stays inside (service to service). The tools differ: CDN/LB/gateway for north–south, service mesh for east–west.", "whyWrong": ["Both directions can and should be encrypted (encryption isn)'t what the terms describe.", "", "Direction of data transfer isn't the distinction; both kinds carry both.", "The IP version is irrelevant to the north–south/east–west split."]}, {"q": "Requests are still flowing normally, but no configuration change you make takes effect. Which half of the system is down?", "options": ["The data plane", "The control plane", "DNS", "The CDN"], "answer": 1, "why": "The data plane is whatever touches requests in flight; the control plane is whatever configures it. Flowing traffic + frozen config = data plane fine, control plane down.", "whyWrong": ["If the data plane were down, requests would not be flowing.", "", "If DNS were down, new connections would be failing, not config changes.", "A CDN outage would show as failing or slow requests, not ignored config."]}, {"q": "Why does the request path put the CDN before the load balancer?", "options": ["CDNs are older technology, so they come first historically", "The CDN's job is to answer as many requests as possible before they reach your infrastructure at all", "Load balancers can't handle TLS", "It's arbitrary; the order doesn't matter"], "answer": 1, "why": "The CDN is the outermost ring because a cache hit at the edge means your origin, including the load balancer, never sees the request. The cheapest request is the one that never arrives.", "whyWrong": ["Age has nothing to do with placement; jobs determine order.", "", "Load balancers terminate TLS routinely, that's not the reason.", "The order is the point: each ring exists to shed work from the rings behind it."]}], "01-load-balancers": [{"q": "What is the practical difference between an L4 and an L7 load balancer?", "options": ["L7 is newer and faster", "L4 sees connections (IPs and ports); L7 reads the request itself (path, headers) and can route on it", "L4 is for internal traffic only", "L7 requires special hardware"], "answer": 1, "why": "L4 forwards bytes between addresses without understanding them, fast and protocol-agnostic. L7 parses the protocol, so it can send /api/ one way and /images/ another, retry a GET, or split traffic for a canary.", "whyWrong": ["L7 does more work per request (it)'s the slower, smarter one.", "", "L4 balancers sit at the public edge of most large systems.", "Both are ordinary software; Envoy does both on any machine."]}, {"q": "Why are sticky sessions usually considered a design smell?", "options": ["They're slower than round robin", "They mean a server holds user state, so that server's death logs users out and servers stop being interchangeable", "Browsers don't support them", "They only work with IPv6"], "answer": 1, "why": "Stickiness exists to compensate for state living on one server. Move the state to a shared store and any server can answer, the balancer stays free to route anywhere, and a server dying is a non-event.", "whyWrong": ["The routing cost is trivial; the architectural coupling is the problem.", "", "Stickiness is implemented by the balancer (usually via cookie), and browsers handle cookies fine.", "IP version has nothing to do with session affinity."]}, {"q": "Your /healthz handler checks that the database is reachable. During a 30-second database blip, what does the load balancer do to your fleet?", "options": ["Nothing (health checks don)'t run that often", "It removes every server at once, because they all fail the same dependency check, turning a wobble into an outage", "It doubles the traffic to compensate", "It restarts the database"], "answer": 1, "why": "Every server reports the same dependency failure simultaneously, so the balancer drains the entire pool. Health checks should verify what the server itself controls; dependency health belongs in separate signals.", "whyWrong": ["Checks typically run every few seconds (well within a 30-second blip.)", "", "Balancers don't create capacity or traffic; they only distribute what arrives.", "A load balancer has no idea the database exists, it only sees the check fail."]}], "02-api-gateways": [{"q": "Which of these belongs IN an API gateway?", "options": ["Merging the orders and billing responses into one JSON for the mobile app", "Skipping the fraud check for gold-tier customers", "Validating tokens, enforcing rate limits, and routing /v2/ to the new service", "Recalculating cart totals"], "answer": 2, "why": "Cross-cutting policy, authn at the edge, quotas, routing, TLS, observability, is exactly the front desk's job: every service would otherwise implement it identically.", "whyWrong": ["Aggregation is an application; that's what a backend-for-frontend service is for.", "Tier-based behavior is business logic, it changes when the product changes, so it belongs in a service someone owns.", "", "Money math is core business logic; the gateway should never know what a cart is."]}, {"q": "What was the ESB, and why does it come up in gateway discussions?", "options": ["An early load balancer that couldn't do TLS", "The enterprise service bus, middleware that gradually absorbed business logic until nobody could change anything; the cautionary tale for gateways", "A Kubernetes component replaced by Ingress", "A CDN feature for APIs"], "answer": 1, "why": "The ESB ate a generation of architectures by centralizing logic in shared middleware. A gateway that accumulates orchestration and business rules is rebuilding it in YAML, which is why the should-not list exists.", "whyWrong": ["It wasn't a load balancer; it was integration middleware.", "", "It predates Kubernetes and lived at a different layer entirely.", "It has nothing to do with CDNs."]}, {"q": "When does an INTERNAL gateway earn its place?", "options": ["Always (every microservice should sit behind one)", "When a domain inside the company (say, a payments platform) is consumed by many other teams and needs stable routes, quotas, and an audit trail", "Whenever you install a service mesh", "When the external gateway is overloaded"], "answer": 1, "why": "An internal gateway makes sense when part of your system is effectively a product with internal customers. Short of that, an external gateway plus a mesh covers most architectures, an internal gateway earlier is premature machinery.", "whyWrong": ["Per-service gateways everywhere is overhead without a matching problem, the mesh already handles east–west concerns.", "", "A mesh reduces the need for internal gateways by providing mTLS, retries, and telemetry between services.", "Capacity problems are solved by scaling the gateway, not adding a differently-purposed one."]}], "03-cdns": [{"q": "A response marked Cache-Control: public contains the logged-in user's account details. What happens?", "options": ["Nothing (CDNs know not to cache personal data)", "The edge may cache it and serve one user's account page to other users: a data breach", "The response gets slower", "The CDN encrypts it extra"], "answer": 1, "why": "Shared caches do what the headers say. 'public' on a per-user response invites the edge to store it under a key other users will hit. Personal responses need private/no-store, and a review process for cache headers.", "whyWrong": ["CDNs cannot know what's personal; the headers are the contract, and they said public.", "", "Speed isn't the issue, disclosure is.", "Encryption on the wire doesn't help; the cache serves the decrypted response to the wrong person."]}, {"q": "Why do frontend builds name files like app.9f31c2.js instead of app.js?", "options": ["Shorter names load faster", "The hash hides the code from competitors", "A new deploy produces a new URL, so old cached copies never conflict, caching can be maximal and invalidation becomes unnecessary", "It's required by JavaScript modules"], "answer": 2, "why": "Versioned URLs dissolve the invalidation problem: the immutable file is cached for a year, and 'updating' is just referencing a new name. Rollback is the old name. Nothing needs purging, ever.", "whyWrong": ["The name is longer, not shorter (and length is irrelevant.)", "The content is exactly as public as before; the hash is a version stamp, not obfuscation.", "", "No module system requires hashed names; build tools add them for caching."]}, {"q": "For which of these is a CDN the WRONG tool?", "options": ["A product-image gallery served worldwide", "Absorbing a traffic spike on a viral blog post", "Reading an account balance immediately after a transfer", "Serving yesterday's leaderboard to millions"], "answer": 2, "why": "A balance-after-write is a strong-consistency read: it must come from the system of record. A cache is by definition allowed to be stale, that's the deal that makes it fast.", "whyWrong": ["Static images for a global audience are the CDN's founding use case.", "Identical cacheable content under read spike is exactly what edge caching absorbs.", "", "Slightly-stale, identical-for-everyone content is ideal CDN material."]}], "06-queues-caches-async": [{"q": "Why must a queue consumer be idempotent?", "options": ["To process messages faster", "Because delivery is at-least-once in practice: the same message can arrive twice, and processing it twice must not double the effect", "Because queues shuffle message order", "Because messages expire"], "answer": 1, "why": "Redelivery after failures is part of the contract, exactly-once is a marketing word. Handlers keyed on 'have I already processed order 4412?' make duplicates harmless; handlers that charge on every delivery make them incidents.", "whyWrong": ["Idempotence is about correctness under redelivery, not throughput.", "", "Ordering is a separate concern; duplicates arrive even in strictly-ordered streams.", "Expiry would mean fewer deliveries, not repeated ones."]}, {"q": "A hot cache key expires and 5,000 concurrent requests hit the database at once. What is this called, and what's the fix?", "options": ["A cache breach; rotate credentials", "A stampede; stagger TTLs or let one request refresh while others briefly serve the stale value", "Normal operation; databases handle it", "A memory leak; restart the cache"], "answer": 1, "why": "The cache was hiding that load; simultaneous expiry returns it as a spike. Jittered TTLs spread the refreshes, and serve-stale-while-revalidate collapses 5,000 refreshes into one.", "whyWrong": ["Nothing was breached (no attacker is involved, just an expiry.)", "", "The database sized for cached traffic meets uncached traffic, that's exactly the outage.", "Memory is fine; the pattern is about expiry timing, not leaks."]}, {"q": "Why should file uploads go directly from the browser to object storage via a pre-signed URL instead of through your application servers?", "options": ["Browsers can't send files to application servers", "It's more secure because the URL is secret forever", "Application servers then never carry file traffic, the service issues a short-lived scoped link, stores the key, and stays out of the byte path", "Object storage is the only place TLS works for files"], "answer": 2, "why": "Pass URLs, not bytes: the pre-signed link is short-lived and permission-scoped, the heavy transfer happens between the user and storage built for it, and your expensive stateless servers do what they're good at.", "whyWrong": ["Browsers upload to app servers fine (it)'s just a waste of your compute and bandwidth.", "Pre-signed URLs are deliberately short-lived; their security comes from scope and expiry, not permanent secrecy.", "", "TLS works everywhere; that's not the differentiator."]}], "04-dns": [{"q": "You updated a DNS record to point at the new server, but half your users still reach the old one hours later. Why?", "options": ["DNS servers are slow to process changes", "Resolvers cached the old answer and will keep it until its TTL expires, and some ignore TTLs entirely", "The new server rejected the record", "You need to restart the old server"], "answer": 1, "why": "DNS scales by caching at every step, and a cached answer lives for its TTL regardless of what you changed upstream. That's why migrations lower TTLs the day before, and why serious failover uses anycast instead of racing caches.", "whyWrong": ["Authoritative servers pick up the change quickly (the delay lives in everyone else)'s caches.", "", "Servers don't accept or reject DNS records; DNS is resolved by clients, not targets.", "The old server has no say in where names point."]}, {"q": "Your DNS host says “CNAME www to us”, but the same record on the bare domain example.com is rejected. Why?", "options": ["Bare domains can't be aliased for security reasons", "A CNAME must be alone, and the zone apex must hold SOA and NS records, so a CNAME there is structurally illegal; ALIAS/ANAME is the provider workaround", "The registrar needs 24 hours to enable it", "CNAMEs only work on subdomains longer than 3 characters"], "answer": 1, "why": "A CNAME says 'everything about this name lives elsewhere' and tolerates no coexisting records, but the apex can't be empty of SOA/NS, since those make it a zone. ALIAS/ANAME fakes it: the provider resolves the target and serves plain A records.", "whyWrong": ["It's a structural rule from the record's semantics, not a security policy.", "", "No waiting period exists; the record is invalid at the apex, full stop.", "Name length has nothing to do with it."]}, {"q": "What does a CNAME actually do when a resolver hits one?", "options": ["Redirects the user's browser to the target URL", "Copies the target's IP address into your zone", "Tells the resolver to restart its question with the target name, so your record keeps tracking the target's address changes automatically", "Forwards the network traffic through the target server"], "answer": 2, "why": "A CNAME names a NAME, not an address. The resolver re-asks its question about the target, which is exactly why CDNs say 'CNAME to us': they can renumber freely and your record never changes.", "whyWrong": ["Nothing HTTP happens, the browser never sees the alias; the redirect illusion is purely inside resolution.", "No copying takes place; if it did, the target's changes would strand you with stale addresses.", "", "No traffic touches the alias target's servers unless the addresses ultimately resolve there."]}, {"q": "dig returns NXDOMAIN for a record you created two minutes ago. What most likely happened?", "options": ["The record needs 24–48 hours to propagate", "You queried before creating it, and the resolver negative-cached the miss: NXDOMAIN answers are cached too, for the SOA's negative TTL", "NXDOMAIN means the DNS server is down", "New records always fail until the zone is reloaded manually"], "answer": 1, "why": "Misses are cached like hits: query a name before it exists and that resolver remembers 'does not exist' for the negative TTL. Ask a different resolver (dig @1.1.1.1) or wait it out, and next time, create before you query.", "whyWrong": ["Nothing propagates, caches expire on their own timers, and a fresh record is visible immediately to any resolver that hasn't cached a miss.", "", "A dead server yields SERVFAIL or a timeout; NXDOMAIN is an authoritative 'no such name'.", "Authoritative servers serve new records immediately; no manual reload ritual exists."]}], "05-tls": [{"q": "Your HTTPS site works in every browser but fails from curl and a Java service with certificate errors. The likely cause?", "options": ["curl doesn't support TLS", "The server sends an incomplete certificate chain; browsers repair missing intermediates, strict clients don't", "Java requires special certificates", "The certificate expired"], "answer": 1, "why": "Browsers fetch missing intermediates automatically; most other clients validate exactly the chain the server presents. Serving the full chain fixes every client at once, this is the classic asymmetric TLS bug.", "whyWrong": ["curl speaks TLS fine; it's just honest about broken chains.", "", "Java validates the same standard chains, it simply doesn't repair yours.", "An expired certificate fails everywhere, browsers included."]}, {"q": "What does it mean to choose where TLS terminates?", "options": ["Choosing when the certificate expires", "Choosing which component decrypts the traffic, and therefore where plaintext begins inside your system", "Choosing the cipher suite", "Choosing between HTTP and HTTPS"], "answer": 1, "why": "Termination is the decryption point: edge-only termination means plaintext everywhere inside; hop-by-hop re-encryption and mesh mTLS push the trust boundary inward until every service proves its identity. It's a security architecture decision, not a checkbox.", "whyWrong": ["Expiry is a certificate property, unrelated to the termination point.", "", "Cipher choice happens at every TLS hop regardless of where you terminate.", "That choice is whether to use TLS at all, termination is about where it ends."]}, {"q": "Why does serious infrastructure get certificates from ACME (e.g. Let's Encrypt) with 90-day lifetimes instead of buying multi-year certificates?", "options": ["Short certificates are cryptographically stronger", "Free certificates skip validation", "Short lifetimes bound the damage of a stolen key and force renewal to be automated, which eliminates the expired-cert-on-a-Saturday outage", "Multi-year certificates are no longer legal"], "answer": 2, "why": "The 90-day design is deliberate: a leaked key ages out fast, and no human renews certificates 4+ times a year by hand, so automation stops being optional, and automated renewal is precisely what prevents expiry outages.", "whyWrong": ["The cryptography is identical; lifetime is policy, not strength.", "ACME validates domain control exactly as paid CAs do, that's what the HTTP-01/DNS-01 challenges are.", "", "Long-lived certs still exist; browsers cap acceptance (about 13 months), but that's a trust-store policy, not law."]}]}};
