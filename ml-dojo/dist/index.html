<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MLDojo: Learn Machine Learning from zero</title>
<style>*{box-sizing:border-box}
.mark{display:inline-block;width:17px;height:17px;border-radius:5px;
  vertical-align:-.15em;margin-right:2px;
  background:linear-gradient(100deg,#f59e0b,#f43f5e 48%,#8b5cf6)}
.ic{width:1em;height:1em;vertical-align:-.12em;color:var(--accent);opacity:.9;
  display:inline-block;flex:0 0 auto}
:root{
  color-scheme:light;
  /* Aligned with the roniam.dev design system (engine/styles.css in the dojo
     repo). Rule: raw hues for fills, borders and gradients; the -ink variants
     for anything that carries text. The previous accent was #0d9488, which is
     3.74:1 on white and failed WCAG AA as body text. */
  --bg:#f6f6fa; --panel:#ffffff; --ink:#191530; --muted:#5b5872; --line:#e4e4f0;
  --accent:#6d28d9;   /* violet-ink: 7.10:1 as text, and as a fill under white text */
  --accent2:#0d9488;  /* raw teal: decorative only, one border and one gradient stop */
  --accent3:#9f1239;  /* rose-ink: used as text and as a dashed border */
  --ok:#16a34a; --bad:#dc2626; --warn:#92400e;
  --code-bg:#0f172a; --code-ink:#e2e8f0;
}
html,body{margin:0;height:100%}
body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
a{color:var(--accent)}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
header .logo{font-weight:800;font-size:18px}
header .logo span{color:var(--accent)}
header .tip{font-size:12px;color:var(--muted);max-width:640px}
.belt{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12px;color:var(--muted)}
.belt .strip{width:120px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.belt .strip i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
#layout{display:flex;flex:1;min-height:0}
nav{width:264px;min-width:264px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:12px}
.trackDivider{margin:12px 4px 6px;padding:6px 9px;font-size:10.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--accent);background:#ede9fe;border-radius:7px}
.streamHd{font-weight:700;padding:8px;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:6px}
.lessonLink{display:flex;gap:7px;align-items:center;padding:7px 9px;margin-left:8px;border-radius:7px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.lessonLink:hover{background:#e6f6f2;color:var(--ink)}
.lessonLink.active{background:#d6f2ec;color:var(--accent);font-weight:600}
main{flex:1;overflow-y:auto;padding:26px 34px;max-width:920px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:4px}
h1.lessonTitle{font-size:25px;margin:2px 0 14px;letter-spacing:-.3px}
.lessonBody{font-size:15px;line-height:1.65}
.lessonBody h3{margin:22px 0 6px;font-size:16px;color:var(--accent)}
.lessonBody p{margin:10px 0}
.lessonBody code,.prompt code{background:#e4f4f0;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.ground{border-left:4px solid var(--accent2);background:#eafaf5;border-radius:0 10px 10px 0;padding:10px 14px;margin:12px 0}
.ground .gTag{font-size:10.5px;font-weight:800;letter-spacing:.6px;color:var(--accent);text-transform:uppercase}
.demystify{border:1px dashed var(--accent3);background:#e8f6fb;border-radius:10px;padding:12px 14px;margin:14px 0}
.demystify b{color:var(--accent3)}
.hardidea{border:1px solid #f0c36d;background:#fff8e8;border-radius:10px;padding:12px 14px;margin:14px 0}
.figure{margin:16px 0;padding:12px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:center}
.figure svg{max-width:100%;height:auto}
.figCap{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.5}
.notebox{border:1px solid #b9a6e6;background:#f3effc;border-radius:10px;padding:12px 14px;margin:14px 0;font-size:13.5px}
.notebox b{color:#6d4bc4}
.notebox table{border-collapse:collapse;margin-top:8px;width:100%}
.notebox td{padding:4px 8px;border-bottom:1px solid #e0d7f5;vertical-align:top}
.notebox td:first-child{white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#4c3a86;font-weight:600}
.codeSample{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:12px 14px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;margin:10px 0;white-space:pre}
.docs{margin:16px 0;padding:10px 14px;background:#eafaf5;border:1px solid var(--line);border-radius:10px;font-size:13px}
.docs b{color:var(--accent)}
.quiz{margin-top:22px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.quizHd{padding:12px 16px;background:linear-gradient(90deg,#e6f6f2,#e8f6fb);border-bottom:1px solid var(--line);font-weight:700}
.qBlock{padding:12px 16px;border-bottom:1px solid var(--line)}
.qBlock .qq{font-weight:600;margin-bottom:8px}
.qOpt{display:block;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:6px 0;cursor:pointer;font-size:13.5px}
.qOpt:hover{border-color:var(--accent)}
.qOpt.sel{border-color:var(--accent);background:#e6f6f2}
.qOpt.correct{border-color:var(--ok);background:#e7f7ec}
.qOpt.wrong{border-color:var(--bad);background:#fdeaea}
.qWhy{margin-top:8px;font-size:13px;color:var(--muted);display:none}
.qWhy.show{display:block}
.exercise{margin-top:22px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.exHd{padding:12px 16px;background:linear-gradient(90deg,#e6f6f2,#e8f6fb);border-bottom:1px solid var(--line);font-weight:700;display:flex;align-items:center;gap:8px}
.badge{font-size:11px;background:var(--accent);color:#fff;border-radius:10px;padding:2px 8px}
.badge.done{background:var(--ok)}
.badge.adv{background:#7c3aed;font-weight:600;cursor:help}
.prompt{padding:12px 16px;font-size:14px}
.prompt ol{margin:6px 0 0 18px;padding:0}
.prompt li{margin:4px 0}
.editorWrap{margin:0 16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code-bg)}
.scroller{display:flex;overflow:auto;max-height:440px;background:var(--code-bg)}
.gutter{padding:12px 8px 12px 12px;text-align:right;color:#4e7078;user-select:none;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;border-right:1px solid #12333b;background:#081a1f;min-width:34px}
.gLine.cur{color:#2dd4bf;font-weight:700}
.edStack{position:relative;flex:1;min-width:0}
#hl{margin:0;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;color:#d7f0ea;white-space:pre;min-height:190px;tab-size:4}
#hl .k{color:#7dd3fc;font-weight:600}
#hl .b{color:#c4b5fd}
#hl .s{color:#fbbf72}
#hl .c{color:#6b8f97;font-style:italic}
#hl .n{color:#86efac}
#ed{position:absolute;inset:0;width:100%;height:100%;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;background:transparent;color:transparent;caret-color:#5eead4;border:none;resize:none;white-space:pre;overflow:hidden;outline:none;tab-size:4}
#ed::selection{background:rgba(94,234,212,.25)}
.statusBar{display:flex;justify-content:space-between;padding:6px 12px;font-size:11px;color:#6b8f97;background:#081a1f;border-top:1px solid #12333b;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px}
button{font:inherit;padding:8px 12px;border:1px solid var(--line);background:#fff;border-radius:9px;cursor:pointer;color:var(--ink)}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:#0b7d72;color:#fff}
button:disabled{opacity:.5;cursor:default}
.ioPanel{margin:0 16px 14px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ioTabs{display:flex;background:#eafaf5;border-bottom:1px solid var(--line)}
.ioTab{padding:8px 14px;font-size:12.5px;cursor:pointer;font-weight:600;color:var(--muted)}
.ioTab.active{background:#fff;color:var(--accent)}
.ioBody{padding:12px 14px;font-size:13px;min-height:44px}
.cLine{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre-wrap}
.cLine.dim{color:var(--muted)}
.cLine.err{color:var(--bad)}
.cLine.ok{color:var(--ok)}
.tcase{padding:6px 8px;border-radius:7px;margin:5px 0;font-size:13px}
.tcase.ok{background:#e7f7ec;color:#166534}
.tcase.bad{background:#fdeaea;color:#991b1b}
.aiBox{margin-top:10px;padding:10px 12px;border-radius:9px;background:#eafaf5;border:1px solid var(--line);font-size:13px}
.aiBox.hint{background:#fff8e8;border-color:#f0c36d}
.solution{margin:0 16px 16px}
.doneBanner{display:none;margin:0 16px 16px;padding:10px 14px;border-radius:9px;background:#e7f7ec;color:#166534;font-weight:600}
.fbBar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 16px 16px;font-size:12.5px;color:var(--muted)}
.fbBar button{padding:5px 10px;font-size:12.5px}
.lessonNav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:20px 0 40px;padding-top:16px;border-top:1px solid var(--line)}
.lessonNav button{padding:10px 16px}
.lessonNav .primary{font-weight:600;max-width:70%;text-align:right}
.navDone{font-size:13px;color:var(--muted)}
.homework{margin-top:22px;border:1px solid #cbb6ea;border-radius:14px;background:#faf7ff;overflow:hidden}
.hwHd{padding:12px 16px;background:linear-gradient(90deg,#efe7fb,#e8f6fb);border-bottom:1px solid #e0d3f5;font-weight:700;color:#5a3fb0}
.hwIntro{margin:0;padding:10px 16px;font-size:13px;color:var(--muted);border-bottom:1px solid #efe7fb}
.hwList{margin:0;padding:8px 16px 12px 34px}
.hwList li{margin:12px 0}
.hwQ{font-size:14px;margin-bottom:6px}
.hwSol{font-size:13.5px}
.hwSol summary{cursor:pointer;color:#6d4bc4;font-weight:600;padding:4px 0}
.hwSol summary:hover{text-decoration:underline}
.hwBody{margin-top:8px;padding:10px 14px;background:#fff;border:1px solid #e0d3f5;border-radius:9px;line-height:1.6}
.hwBody .codeSample{margin:8px 0}
.hwTry{margin:10px 16px 14px;padding:10px 14px;background:#eafaf5;border:1px solid #bfe9de;border-radius:9px;font-size:13px;line-height:1.55}
.linklike{border:none;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0;font-size:inherit;text-decoration:underline}
.linklike:hover{color:#0b7d72}
.mathblock{background:#f3effc;border:1px solid #cbb6ea;border-radius:10px;padding:12px 16px;margin:12px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;line-height:1.7;color:#3a2d63;overflow-x:auto;white-space:pre}
.mathblock b{color:#6d4bc4}
.worked{border-left:4px solid var(--accent);background:#f0faf8;border-radius:0 10px 10px 0;padding:10px 14px;margin:14px 0;font-size:14px;line-height:1.6}
.worked>b:first-child{color:var(--accent);display:block;margin-bottom:4px}
.worked .mathblock{background:#fff;border-color:#bfe4dd;color:#123b38;white-space:pre}
.pyFig{display:block;max-width:100%;margin:10px 0;border-radius:8px;background:#fff;border:1px solid var(--line)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
#tutorFab{position:fixed;right:20px;bottom:20px;background:var(--accent);color:#fff;padding:11px 16px;border-radius:24px;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(109,40,217,.35);z-index:40}
#tutorPanel{position:fixed;right:20px;bottom:20px;width:380px;max-width:calc(100vw - 40px);height:520px;max-height:calc(100vh - 40px);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;z-index:41}
#tutorPanel.hidden,#tutorFab.hidden{display:none}
.tpHd{padding:12px 14px;font-weight:700;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.tpHd button{border:none;background:none;font-size:16px;padding:2px 6px}
.tpBody{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.tMsg{padding:9px 12px;border-radius:12px;font-size:13.5px;line-height:1.5;max-width:85%;white-space:pre-wrap}
.tBot{background:#eafaf5;align-self:flex-start}
.tUser{background:var(--accent);color:#fff;align-self:flex-end}
.tpInput{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.tpInput textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:9px;padding:8px;font:inherit}
</style>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
</head>

<script>/* Monoline icon set, shared with roniam.dev and the other dojos.
   Streams keep declaring an emoji in `icon:` because that is the authoring
   shorthand; ico() maps it to a symbol at render time. Anything unmapped falls
   through to the emoji, so a new stream is never iconless. */
const ICON_MAP = {
  // ML Dojo streams
  '\u{1F9ED}':'i-layers',    // compass, orientation
  '\u{1F40D}':'i-code',      // snake, Python
  '\u{1F9EE}':'i-cpu',       // abacus, numerics
  '\u{1F4D0}':'i-layers',    // set square, linear algebra
  '\u{1F4C8}':'i-cycle',     // rising chart, calculus
  '\u{1F4C9}':'i-cycle',     // falling chart, logarithms
  '\u{1F3B2}':'i-atom',      // die, probability
  '\u{1F9F0}':'i-flask',     // toolbox
  '\u{1F916}':'i-cpu',       // robot, classic ML
  '✍':'i-book',         // writing hand, notation
  // shared with the other dojos, so a stream can move between them
  '\u{1F511}':'i-key','\u{1F512}':'i-lock','\u{1F513}':'i-lock','\u{1F6E1}':'i-shield',
  '\u{1F310}':'i-globe','\u{1F41E}':'i-bug','\u{1F50D}':'i-search','\u{1F4DA}':'i-book',
  '\u{1F4D6}':'i-book','\u{1F4BB}':'i-terminal','⚡':'i-cpu','\u{1F3E0}':'i-columns',
  '\u{1F5C4}':'i-database','\u{1F680}':'i-rocket','\u{1F4E6}':'i-package','⚙':'i-gear',
  '\u{1F527}':'i-wrench','\u{1F6E0}':'i-wrench','\u{1F9F0}':'i-flask','\u{1F9EA}':'i-flask','\u{1F3AF}':'i-flask','\u{1F9E0}':'i-cpu',
};
function ico(e, cls) {
  if (!e) return '';
  const id = ICON_MAP[e] || ICON_MAP[e.replace(/️/g, '')];
  if (!id) return e;                       // unmapped: keep the emoji rather than nothing
  return `<svg class="ic ${cls || ''}" aria-hidden="true" focusable="false"><use href="#${id}"/></svg>`;
}

/* ============================== MLDojo engine (POC) ============================== */
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function hesc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ------------------------- Python syntax highlighting ------------------------- */
const PY_KW=new Set(('def return if elif else for while in not and or import from as class try except '+
  'finally with lambda pass break continue True False None is global nonlocal yield assert raise del').split(' '));
const PY_BI=new Set(('print len range sum min max abs sorted enumerate zip map filter list dict set tuple '+
  'str int float bool type isinstance open input round any all').split(' '));
function highlight(src){
  let out='',last=0,m;
  const re=/("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|#[^\n]*|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*\b)/g;
  while((m=re.exec(src))){
    out+=hesc(src.slice(last,m.index));
    const tok=m[0];let cls=null;
    if(tok[0]==='#')cls='c';
    else if(/^("""|'''|"|')/.test(tok))cls='s';
    else if(/^\d/.test(tok))cls='n';
    else if(PY_KW.has(tok))cls='k';
    else if(PY_BI.has(tok))cls='b';
    out+=cls?'<span class="'+cls+'">'+hesc(tok)+'</span>':hesc(tok);
    last=m.index+tok.length;
  }
  return out+hesc(src.slice(last));
}
function caretPos(ed){
  const upto=ed.value.slice(0,ed.selectionStart).split('\n');
  return {line:upto.length,col:upto[upto.length-1].length+1};
}
/* Full editor: gutter + highlight overlay + auto-indent + pairing. Returns the textarea. */
function editorHTML(){
  return `<div class="editorWrap">
    <div class="scroller"><div class="gutter" id="gutter"><div class="gLine cur">1</div></div>
      <div class="edStack"><pre id="hl" aria-hidden="true"></pre><textarea id="ed" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Python editor"></textarea></div></div>
    <div class="statusBar"><span id="lnCol">Ln 1, Col 1</span><span>auto-indent · Tab / ⇧Tab · pairs () [] {} "" · ⌘/Ctrl+Enter = Run</span></div>
  </div>`;
}
function wireEditor(initial,onChange,onRun){
  const ed=document.getElementById('ed'),hl=document.getElementById('hl'),g=document.getElementById('gutter');
  const OPEN={'(':')','[':']','{':'}'};const CLOSERS=[')',']','}'];
  ed.value=initial;
  const paint=()=>{
    hl.innerHTML=highlight(ed.value)+'\n';
    const n=ed.value.split('\n').length,cur=caretPos(ed);
    let gh='';for(let i=1;i<=n;i++)gh+='<div class="gLine'+(i===cur.line?' cur':'')+'">'+i+'</div>';
    g.innerHTML=gh;
    const lc=document.getElementById('lnCol');if(lc)lc.textContent='Ln '+cur.line+', Col '+cur.col;
  };
  const sync=()=>{paint();if(onChange)onChange(ed.value);};
  const put=(val,caret)=>{ed.value=val;ed.selectionStart=ed.selectionEnd=caret;sync();};
  ed.addEventListener('input',sync);
  ed.addEventListener('keyup',paint);
  ed.addEventListener('click',paint);
  ed.addEventListener('keydown',e=>{
    const s=ed.selectionStart,epos=ed.selectionEnd,v=ed.value;
    if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();if(onRun)onRun();return;}
    if(e.key==='Tab'){
      e.preventDefault();
      const ls=v.lastIndexOf('\n',s-1)+1;
      if(s!==epos&&v.slice(s,epos).includes('\n')){
        const le=v.indexOf('\n',epos);const end=le===-1?v.length:le;
        const block=v.slice(ls,end);
        const outb=e.shiftKey?block.replace(/^ {1,4}/gm,''):block.replace(/^/gm,'    ');
        ed.value=v.slice(0,ls)+outb+v.slice(end);
        ed.selectionStart=ls;ed.selectionEnd=ls+outb.length;sync();
      }else if(e.shiftKey){
        const mm=v.slice(ls).match(/^ {1,4}/);
        if(mm)put(v.slice(0,ls)+v.slice(ls+mm[0].length),Math.max(ls,s-mm[0].length));
      }else put(v.slice(0,s)+'    '+v.slice(epos),s+4);
      return;
    }
    if(e.key==='Enter'){
      e.preventDefault();
      const ls=v.lastIndexOf('\n',s-1)+1;
      const indent=(v.slice(ls).match(/^ */)||[''])[0];
      const prev=v.slice(0,s).trimEnd().slice(-1);
      const ins='\n'+indent+(prev===':'?'    ':'');
      put(v.slice(0,s)+ins+v.slice(epos),s+ins.length);
      return;
    }
    if(s===epos){
      if((e.key==='"'&&v[s]==='"')||(CLOSERS.includes(e.key)&&v[s]===e.key)){e.preventDefault();ed.selectionStart=ed.selectionEnd=s+1;paint();return;}
      if(e.key==='"'){e.preventDefault();put(v.slice(0,s)+'""'+v.slice(epos),s+1);return;}
      if(OPEN[e.key]){e.preventDefault();put(v.slice(0,s)+e.key+OPEN[e.key]+v.slice(epos),s+1);return;}
      if(e.key==='Backspace'&&s>0){
        const pair=OPEN[v[s-1]]||(v[s-1]==='"'?'"':null);
        if(pair&&v[s]===pair){e.preventDefault();put(v.slice(0,s-1)+v.slice(s+1),s-1);return;}
      }
    }
  });
  paint();
  return ed;
}

/* ------------------------------ storage ------------------------------ */
const store={
  mem:{},
  persistent:(()=>{try{localStorage.setItem('__ml_t','1');localStorage.removeItem('__ml_t');return true}catch(e){return false}})(),
  get(){if(!this.persistent)return this.mem;try{return JSON.parse(localStorage.getItem('mldojo')||'{}')}catch(e){return this.mem}},
  set(d){this.mem=d;if(this.persistent){try{localStorage.setItem('mldojo',JSON.stringify(d))}catch(e){this.persistent=false}}},
  lesson(id){return this.get()[id]||{};},
  patch(id,p){const d=this.get();d[id]=Object.assign({},d[id],p);this.set(d);}
};

/* ------------------------------ belts ------------------------------ */
const BELTS=[[0,'White belt'],[10,'Yellow belt'],[25,'Orange belt'],[40,'Green belt'],[55,'Blue belt'],[70,'Purple belt'],[85,'Brown belt'],[100,'Black belt 🖤']];
function totalLessons(){return STREAMS.reduce((a,s)=>a+s.lessons.length,0);}
function doneCount(){const d=store.get();let n=0;STREAMS.forEach(s=>s.lessons.forEach(l=>{if(d[l.id]&&d[l.id].done)n++;}));return n;}
function beltName(){const pct=totalLessons()?100*doneCount()/totalLessons():0;let name=BELTS[0][1];for(const[t,n]of BELTS)if(pct>=t)name=n;return name;}
function refreshBelt(){
  const pct=totalLessons()?Math.round(100*doneCount()/totalLessons()):0;
  document.getElementById('beltName').textContent=beltName();
  document.getElementById('beltFill').style.width=pct+'%';
  document.getElementById('beltPct').textContent=pct+'%';
}
function toast(msg){
  const t=document.createElement('div');t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#0f2a2e;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2)';
  document.body.appendChild(t);setTimeout(()=>t.remove(),2600);
}

/* ------------------------------ Pyodide runner ------------------------------ */
let _py=null,_pyInit=null;const _loadedPkgs=new Set();
function getPy(status){
  if(_pyInit)return _pyInit;
  _pyInit=(async()=>{
    if(status)status('Loading Python (first run downloads ~10MB)…');
    _py=await loadPyodide();
    return _py;
  })();
  return _pyInit;
}
async function ensurePackages(packages,status){
  const py=await getPy(status);
  const need=(packages||[]).filter(p=>!_loadedPkgs.has(p));
  if(need.length){if(status)status('Loading '+need.join(', ')+'…');await py.loadPackage(need);need.forEach(p=>_loadedPkgs.add(p));}
  return py;
}
const PY_HARNESS=`
import json, io, sys, os, traceback
os.environ.setdefault("MPLBACKEND", "Agg")
def _grade(code, tests):
    ns={}
    buf=io.StringIO(); old=sys.stdout; sys.stdout=buf
    res={"ok":True,"stdout":"","error":None,"results":[],"figure":None}
    try:
        exec(code, ns)
    except Exception as e:
        res["ok"]=False
        res["error"]="".join(traceback.format_exception_only(type(e),e)).strip()
    finally:
        sys.stdout=old
    res["stdout"]=buf.getvalue()
    ns["_stdout"]=res["stdout"]
    if res["ok"]:
        for t in tests:
            try:
                ok=bool(eval(t["expr"], ns))
                res["results"].append({"d":t["d"],"pass":ok})
            except Exception as e:
                res["results"].append({"d":t["d"],"pass":False,"err":"".join(traceback.format_exception_only(type(e),e)).strip()})
    # capture any matplotlib figure the student drew (after tests, so tests can inspect it)
    try:
        if "matplotlib" in sys.modules:
            import matplotlib.pyplot as _plt, base64 as _b64
            if _plt.get_fignums():
                _fb=io.BytesIO()
                _plt.gcf().savefig(_fb, format="png", dpi=80, bbox_inches="tight")
                _plt.close("all")
                res["figure"]=_b64.b64encode(_fb.getvalue()).decode()
    except Exception:
        pass
    return res
json.dumps(_grade(_CODE, json.loads(_TESTS_JSON)))
`;
async function runPython(code,tests,packages,status){
  const py=await ensurePackages(packages,status);
  try{await py.loadPackagesFromImports(code);}catch(e){/* unknown imports fail at exec with a clear Python error */}
  py.globals.set('_CODE',code);
  py.globals.set('_TESTS_JSON',JSON.stringify(tests||[]));
  const out=await py.runPythonAsync(PY_HARNESS);
  return JSON.parse(out);
}

  const opts=block.querySelectorAll('.qOpt');
  opts.forEach((o,i)=>{o.classList.remove('sel','correct','wrong');if(i===qq.answer)o.classList.add('correct');if(i===oi&&oi!==qq.answer)o.classList.add('wrong');});

let hintIdx=0;
// Detect Python patterns beyond the absolute basics, so the exercise can be MARKED
// as using intermediate Python (each is taught in the Python stream before it appears here).
function pyFeatures(code){
  code=String(code||'');const f=[];
  if(/\[[^\]\n]*\bfor\b[^\]\n]*\bin\b/.test(code)||/\b(sum|min|max|any|all|sorted|list|dict|set)\s*\([^)]*\bfor\b[^)]*\bin\b/.test(code))f.push('comprehensions');
  if(/\blambda\b/.test(code))f.push('lambda');
  if(/\bzip\s*\(/.test(code))f.push('zip');
  if(/\benumerate\s*\(/.test(code))f.push('enumerate');
  if(/\b(any|all)\s*\(/.test(code))f.push('any/all');
  return f;
}

function initExercise(l){
  const e=lessonExs(l)[0];const sid=l.id;const saved=store.lesson(sid);
  hintIdx=saved.hintIdx||0;
  const ed=wireEditor(saved.code!=null?saved.code:e.starter,

function setTab(name){
  document.getElementById('io-tests').style.display=name==='tests'?'block':'none';
  document.getElementById('io-console').style.display=name==='console'?'block':'none';
  document.getElementById('tab-tests').classList.toggle('active',name==='tests');
  document.getElementById('tab-console').classList.toggle('active',name==='console');
}
async function runExercise(l){
  const e=lessonExs(l)[0];const sid=l.id;
  const code=document.getElementById('ed').value;
  const tests=document.getElementById('io-tests');
  const con=document.getElementById('io-console');
  const btn=document.getElementById('btnRun');btn.disabled=true;
  tests.innerHTML='<div class="cLine dim"><span class="spin"></span><span id="pyStatus">Starting Python…</span></div>';
  const status=msg=>{const el=document.getElementById('pyStatus');if(el)el.textContent=msg;};
  try{
    const r=await runPython(code,e.tests,e.packages,status);
    con.innerHTML=(r.stdout?r.stdout.split('\n').map(x=>`<div class="cLine">${esc(x)}</div>`).join(''):'<span class="cLine dim">(no output)</span>')
      +(r.figure?`<img class="pyFig" src="data:image/png;base64,${r.figure}" alt="your plot">`:'');
    if(!r.ok){
      tests.innerHTML=`<div class="tcase bad">✘ Your code raised an error:</div><div class="cLine err">${esc(r.error)}</div>`;
      con.innerHTML+=`<div class="cLine err">${esc(r.error)}</div>`;
      setTab('console');
    }else{
      const passed=r.results.filter(t=>t.pass).length;
      tests.innerHTML=r.results.map(t=>`<div class="tcase ${t.pass?'ok':'bad'}">${t.pass?'✔':'✘'} ${esc(t.d)}${t.err?', '+esc(t.err):''}</div>`).join('')+
        `<div class="aiBox">Passed ${passed} / ${r.results.length} checks.</div>`;
      setTab('tests');
      if(passed===r.results.length){markComplete(l);}
    }
  }catch(err){
    tests.innerHTML=`<div class="tcase bad">✘ Could not run Python: ${esc(err.message||err)}</div>
      <div class="cLine dim">If this persists, the Pyodide CDN may be blocked on your network.</div>`;
  }
  btn.disabled=false;
}
function markComplete(l){
  const sid=l.id;
  if(!store.lesson(sid).done){store.patch(sid,{done:true,completedAt:Date.now()});
    const banner=document.getElementById('doneBanner');if(banner)banner.style.display='block';
    toast('✅ Lesson complete, '+doneCount()+'/'+totalLessons());
    refreshBelt();renderNav();
  }
}
function nextStep(l){
  const e=lessonExs(l)[0];const hints=e.hints||[];
  const box=document.getElementById('io-tests');setTab('tests');
  if(hintIdx<hints.length){
    box.insertAdjacentHTML('beforeend',`<div class="aiBox hint">💡 <b>Next step ${hintIdx+1}/${hints.length}:</b> ${esc(hints[hintIdx])}</div>`);
    hintIdx++;store.patch(l.id,{hintIdx});
    return;
  }
  askTutorInline(l,'I am stuck on this exercise. Give me ONE short concrete next step based on my current code, without giving the full solution.');
}

function tutorLog(cls,html){const log=document.getElementById('tutorLog');const div=document.createElement('div');div.className='tMsg '+cls;div.innerHTML=html;log.appendChild(div);log.scrollTop=log.scrollHeight;return div;}
async function askClaudeSafe(prompt){
  if(!(window.cowork&&window.cowork.askClaude))throw new Error('The AI tutor is available in the Cowork/desktop app. (In a plain browser preview it is disabled, but everything else, including running Python, works.)');
  return await window.cowork.askClaude(prompt,[]);
}
async function sendTutor(){
  const q=document.getElementById('tutorQ').value.trim();if(!q)return;
  document.getElementById('tutorQ').value='';
  tutorLog('tUser',esc(q));
  const l=cur.si>=0?STREAMS[cur.si].lessons[cur.li]:{title:'the MLDojo welcome page',body:'The student has not opened a lesson yet.'};
  const wait=tutorLog('tBot','<span class="spin"></span>Thinking…');
  try{
    const ans=await askClaudeSafe(`You are MLDojo's tutor. The student is on this lesson:\n\n${lessonContext(l)}\n\nAnswer their question clearly, grounded first (what it is / what it's for) before any math, in plain English. Keep it focused.\n\nQUESTION: ${q}`);
    wait.innerHTML=esc(String(ans));
  }catch(e){wait.innerHTML=esc(e.message);}
}
function askTutorInline(l,prompt){
  openTutor();
  document.getElementById('tutorQ').value='';
  const code=document.getElementById('ed')?document.getElementById('ed').value:'';
  const wait=tutorLog('tBot','<span class="spin"></span>Thinking…');
  askClaudeSafe(`You are MLDojo's tutor helping with this lesson:\n\n${lessonContext(l)}\n\nThe student's current code:\n${code}\n\n${prompt}`)
    .then(a=>wait.innerHTML=esc(String(a))).catch(e=>wait.innerHTML=esc(e.message));
}
async function diveDeeperAsk(l){
  const box=document.getElementById('deepBox');box.hidden=false;
  const note=document.createElement('div');note.style.marginTop='10px';note.innerHTML='<span class="spin"></span>Asking the tutor for a deeper, Bishop-level walkthrough…';
  box.appendChild(note);
  try{
    const a=await askClaudeSafe(`You are MLDojo's tutor. Give a rigorous but plain-English "dive deeper" on the core math of this lesson, at roughly the level of Bishop's Pattern Recognition and Machine Learning, but explained so a motivated beginner follows every step. Ground each formula in what it does. Lesson:\n\n${lessonContext(l)}`);
    note.innerHTML='<b>📖 Deeper (tutor):</b><br>'+esc(String(a));
  }catch(e){note.innerHTML=esc(e.message);}
}
function openTutor(){document.getElementById('tutorPanel').classList.remove('hidden');document.getElementById('tutorFab').classList.add('hidden');}
function closeTutor(){document.getElementById('tutorPanel').classList.add('hidden');document.getElementById('tutorFab').classList.remove('hidden');}
document.getElementById('tutorFab').onclick=openTutor;
document.getElementById('tutorClose').onclick=closeTutor;
document.getElementById('tutorSend').onclick=sendTutor;
document.getElementById('tutorQ').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendTutor();}});

STREAMS.push({icon:'🧭',track:'Start Here',title:'Orientation: the words before the work',blurb:'A short map of the machine-learning ideas the foundations keep borrowing, so nothing is ever referenced before you have met it.',lessons:[
{id:'ml0',
 title:'What machine learning is, and what "error" really means',
 body:`
<div class="ground"><span class="gTag">🎯 Why this comes before everything</span>
<p>The math streams ahead (linear algebra, calculus, probability) keep pointing at machine
learning to explain <i>why</i> the math matters, "this is how a model reduces its <b>error</b>,"
"this is how it <b>learns</b>." That is only fair if you already know those words. So before any
math, here is the map: the handful of ML terms the foundations borrow, in plain English. We are
not teaching ML yet, the full ML track comes after the foundations. This is just so no idea is
ever used before you have met it.</p></div>

<h3>The five words the whole course leans on</h3>
<p><b>Model</b>: the thing machine learning produces: a function with adjustable <b>knobs</b>
(also called <i>parameters</i> or <i>weights</i>). Turn the knobs, and it computes different
answers. <b>Prediction</b>, the model's answer for a given input (a predicted house price, a
guess of "spam" or "not spam"). <b>Features</b>, the inputs you feed it (a house's size, age,
location, the columns of your data). <b>Label</b> (or <b>target</b>), the true answer you
want it to predict (the actual sale price). <b>Training</b> (or <b>learning</b>), the process
of adjusting the knobs so the predictions get closer to the labels. That is the entire loop,
and every algorithm in the ML track is a variation on it.</p>

<h3>The centerpiece: what "error" means in ML</h3>
<p>Say a model predicts a house will sell for <b>180k</b> and it actually sells for <b>200k</b>.
The model was <b>wrong by 20k</b>. That gap, <i>prediction minus reality</i>, is the
<b>error</b> (for a single example it is also called the <b>residual</b>). Error is not a bug
or a crash; it is simply <b>a number measuring how wrong a prediction is</b>.</p>
<p>A model makes <i>many</i> predictions, so we need one number for "how wrong overall." That
single summary is the <b>loss</b> (also called the <b>cost</b>, or <b>objective</b>, three
words, same thing). The most common one is <b>Mean Squared Error (MSE)</b>: take every gap,
<b>square it</b>, and average. Why squared? Briefly (the full answer is a whole lesson later):
so that overshoots and undershoots do not cancel out, and so that big misses count much more
than small ones.</p>
<p>Now the payoff, this single idea unlocks the math streams. Every time you read
<b>"reduce the error," "minimize the loss," or "gradient descent"</b> in the coming lessons, it
means exactly one thing: <b>turn the model's knobs until that number is as small as possible.</b>
Linear algebra will give us a way to compute predictions in bulk; calculus will give us a way to
find which direction shrinks the error; probability will tell us what "as small as possible"
should even mean. All three are in service of this.</p>

<div class="demystify"><b>Critical: "error" has TWO meanings in this course, never mix them.</b>
(1) A <b>program error</b>, a bug that stops your code from running (Python's
<code>IndentationError</code>, <code>ValueError</code>, a crash). You will learn to read these
in the Python stream's "Reading errors" lesson. (2) A <b>model error</b>, how wrong a
perfectly-working model's predictions are. A program with zero bugs can still have enormous
model error. When the math streams say "reduce the error," they always mean the <i>model</i>
kind. When they say "read the error message," they mean the <i>program</i> kind. Same word,
two worlds.</div>

<h3>What it looks like as a number (you will write this yourself soon)</h3>
<div class="codeSample"># predictions the model made, and the actual answers
predictions = [180, 150, 310]
actuals     = [200, 140, 300]

# the error (residual) for each: prediction - actual
residuals = [-20, 10, 10]          # off by 20 low, 10 high, 10 high

# one number for "how wrong overall" — Mean Squared Error
# average of the squared residuals:
# (400 + 100 + 100) / 3 = 200.0   ← this is the loss training shrinks</div>
<p>You do not need to write that yet, the Python stream teaches you how. For now, just hold
the idea: <b>error is how wrong; loss is how wrong overall; training makes it small.</b></p>`,
 docs:[['A visual, non-technical intro to ML','https://mlu-explain.github.io/']],
 quiz:{title:'Quick check, the vocabulary',questions:[
   {q:'In machine learning, the "error" of a prediction is:',
    options:['A bug that crashes the program mid-run','The gap between the prediction and the truth','A missing or corrupted data file','The time the program takes to run'],answer:1,
    why:'Error = prediction minus reality. For one example it is the residual; averaged and squared across all of them it becomes the loss (MSE).'},
   {q:'When a later math lesson says "gradient descent reduces the error," it means:',
    options:['It fixes bugs in your code','It turns the model\u2019s knobs to shrink the loss','It hides the error messages from you','It makes the program run much faster'],answer:1,
    why:'"Reduce the error" = shrink the model error (loss) by adjusting the parameters. That is what training is.'},
   {q:'A "loss" or "cost" function is:',
    options:['The price you paid for the software licence','A single score of how wrong the model is','A particular kind of program crash or exception','The number of input features in the dataset'],answer:1,
    why:'Loss = cost = objective: a single score of overall wrongness. MSE is the most common example.'},
   {q:'A program with no bugs at all:',
    options:['Must therefore have zero model error','Can still have large model error anyway','Cannot be trained on any data','Will never produce any predictions'],answer:1,
    why:'Working code and an accurate model are separate things. The math streams always mean model error; "read the error" means the program kind.'}
 ]}}
]});

{id:'py1',
 title:'Your first Python: variables, lists, and what a "dimension" is',
 body:`
<div class="ground"><span class="gTag">🎯 What Python even is</span>
<p>Before the first line of code: <b>Python is a programming language</b>, a precise way of
writing instructions that a computer executes. Specifically, it is a <b>general-purpose,
interpreted</b> language: general-purpose meaning it runs everything from websites to
telescopes (not just ML), and interpreted meaning a program called the <i>interpreter</i>
reads your file and executes it line by line, immediately, no separate build step, which is
a big part of why it feels so quick to think in. It was created by Guido van Rossum in 1991
and designed around one value above all: <b>readability</b>, code that looks close to plain
English. That design choice is exactly why it became the language of data science and ML.</p>
<p>In ML, Python's role is precise: it is where ML solutions are <b>prototyped, designed, and
orchestrated</b>, the heavy number-crunching itself runs in far more optimized compiled code
that Python directs (an honest distinction this track makes precise in the ML Toolkit
stream). ML work leans on words like <i>list</i>, <i>index</i>, and <i>dimension</i> as if
everyone already knows them, so before we touch NumPy or a single dataset, we learn the tools
of the trade from zero, starting with "what is a variable."</p></div>

<div class="demystify"><b>Demystify the name:</b> Python is named after <i>Monty Python's
Flying Circus</i>, not the snake, van Rossum wanted a name that was short, unique, and
slightly mischievous. The documentation is full of spam-and-eggs jokes for this reason.</div>

<p><b>Everything in this course runs right here in your browser</b>: nothing to install.
But if you ever want to experiment further on your own machine, there is a step-by-step
walkthrough for the standard professional setup:</p>
<p><button class="primary" onclick="renderSetupGuide()">🛠 Set up Python for ML on my machine, step by step</button></p>

<h3>A variable is a labelled box</h3>
<p>A <b>variable</b> is just a name that points at a value, so you can use it later:</p>
<div class="codeSample">age = 31
name = "Ada"
price = 4.50
is_open = True</div>
<p>Those four values show the everyday <b>types</b>: a whole number (<code>int</code>), text
(<code>str</code>, always in quotes), a decimal (<code>float</code>), and a true/false
(<code>bool</code>). You never declare the type: Python reads it from the value.</p>

<h3>A list is an ordered collection: and your first "dimension"</h3>
<p>A <b>list</b> holds several values in order, inside square brackets:</p>
<div class="codeSample">scores = [80, 90, 100]
scores[0]        # 80  — counting starts at 0! this is the "index"
len(scores)      # 3   — how many items</div>
<p>Here is the idea people quietly assume in ML: <b>dimension</b> just means <i>how many
numbers (axes) it takes to describe your data</i>. A single value like <code>90</code> is one
number. A flat <b>list</b> like <code>[80, 90, 100]</code> is <b>one-dimensional</b>, you need
one index to reach an item. A <b>list of lists</b>, a grid, is <b>two-dimensional</b>: rows
and columns, reached with two indices:</p>
<div class="codeSample">grid = [[1, 2, 3],
        [4, 5, 6]]
grid[1][2]       # 6  — row 1, column 2
len(grid)        # 2  — number of rows
len(grid[0])     # 3  — number of columns</div>
<div class="demystify"><b>Demystify "dimension":</b> it is not a spooky word. A table of data
with <b>n rows and m columns</b> is "n examples, each described by m numbers", that <i>m</i>
is the number of dimensions (also called <i>features</i>) of each example. When later lessons
say "a point in 3-dimensional space," they just mean a list of 3 numbers. When they say
"300-dimensional," they mean a list of 300 numbers. Same idea, bigger list.</div>

<h3>Loops and functions: doing something to every item</h3>
<p>A <b>loop</b> repeats work; a <b>function</b> is a reusable named recipe that takes inputs and
<code>return</code>s a result:</p>
<div class="codeSample">def average(nums):
    return sum(nums) / len(nums)

average([80, 90, 100])   # 90.0</div>
<p><code>sum()</code> and <code>len()</code> are built in. In the exercise you'll use exactly
these tools, no libraries, just Python, to prove the ideas stuck.</p>`,
 docs:[['The Python Tutorial (official)','https://docs.python.org/3/tutorial/'],['Python for absolute beginners','https://wiki.python.org/moin/BeginnersGuide/NonProgrammers']],

{id:'py8',
 title:'Lists in depth: slicing, negative indexes, and growing lists',
 body:`
<div class="ground"><span class="gTag">🎯 Why go deeper on lists</span>
<p>Lists are the container you will touch most, and three of their tricks, <b>slicing</b>,
<b>negative indexes</b>, and <b>mutation</b>, appear constantly in real code (and NumPy
borrows the exact same notation, so learning it here pays twice).</p></div>

<h3>Negative indexes: counting from the end</h3>
<div class="codeSample">nums = [10, 20, 30, 40, 50]
nums[0]      # 10  — first
nums[-1]     # 50  — LAST (minus means "from the end")
nums[-2]     # 40  — second to last</div>
<p><code>nums[-1]</code> is how Python code says "the last item" without knowing the length —
you will see it everywhere.</p>

<h3>Slicing: a sub-list by range</h3>
<div class="codeSample">nums[1:4]    # [20, 30, 40]  — start included, END EXCLUDED
nums[:2]     # [10, 20]      — from the beginning
nums[2:]     # [30, 40, 50]  — to the end
nums[:]      # a COPY of the whole list</div>
<p>The rule to burn in: <b>start included, end excluded</b>, the same convention as
<code>range(a, b)</code>, and the same slice notation NumPy uses on whole datasets
(<code>X[:, 0]</code> is this exact syntax, with a comma). Why exclusive ends? So
<code>nums[:k]</code> and <code>nums[k:]</code> split a list cleanly with no overlap, you
will use precisely this to split data into train and test sets later.</p>

<h3>Mutation: lists can change</h3>
<div class="codeSample">nums.append(60)      # grows the list in place → [10, 20, 30, 40, 50, 60]
nums[0] = 99         # replaces an item in place
30 in nums           # True — membership test</div>
<p>A list is a living object: <code>append</code> grows it, assignment by index rewrites a
slot. Contrast with numbers and strings, which never change in place. One classic
consequence, flagged now so it never bites you: <code>b = a</code> does <b>not</b> copy a
list, both names point at the <i>same</i> list, and changing one "changes" the other.
An actual copy is <code>b = a[:]</code>.</p>

<div class="demystify"><b>Demystify "index out of range":</b> the error just means you asked
for a slot that does not exist (like <code>nums[10]</code> in a 6-item list). Note the
asymmetry: <i>indexing</i> past the end is an error, but <i>slicing</i> past the end is
forgiven (<code>nums[2:100]</code> quietly stops at the end), a deliberate design choice
that makes slice-based code robust.</div>`,
 docs:[['Python tutorial (lists)','https://docs.python.org/3/tutorial/introduction.html#lists']],
 quiz:{title:'Quick check',questions:[
   {q:'For nums = [10, 20, 30, 40, 50], what is nums[-1] and nums[1:3]?',
    options:['50 and [20, 30]','50 and [20, 30, 40]','40 and [10, 20]','An error and [20, 30]'],answer:0,
    why:'-1 means last (50). Slices include the start, EXCLUDE the end: indexes 1 and 2 → [20, 30].'},
   {q:'After b = a (where a is a list), appending to b:',
    options:['Leaves a unchanged','Also changes a, both names point at the SAME list; a real copy is a[:]','Raises an error','Creates a new list automatically'],answer:1,
    why:'Assignment shares the object; it does not copy. This is the classic beginner trap, defused now.'},
   {q:'Why does Python exclude the end index in slices (nums[1:4] stops at 3)?',
    options:['A historical accident with no benefit','So nums[:k] and nums[k:] split cleanly with no overlap, like train/test splits later','To make slices shorter','Because indexes start at 1'],answer:1,
    why:'Half-open ranges compose perfectly: the two halves share no element and miss none. Data splitting uses exactly this.'}
 ]},
 exs:[{title:'Slice, grow, and split like a data scientist',
   lang:'python',
   prompt:`Given <code>nums = [10, 20, 30, 40, 50]</code>:
   <ol>
   <li><code>last</code>, the last item via a negative index (no <code>len()</code>),</li>
   <li><code>middle</code>, the slice <code>[20, 30, 40]</code>,</li>
   <li>append <code>60</code>, then set <code>n</code> to the new length (6),</li>
   <li><code>train, test</code>, split the (grown) list into the first 4 items and the rest, using two slices with the same cut point,</li>
   <li><code>copy_differs</code>, make <code>c = nums[:]</code> (a real copy), append <code>99</code> to <code>c</code>, and set this to <code>True</code> if <code>len(c) != len(nums)</code> (proving the copy is independent).</li>
   </ol>`,
   starter:`nums = [10, 20, 30, 40, 50]

# 1) Last item, negative index
last =

# 2) The middle three: [20, 30, 40]
middle =

# 3) Grow the list, then measure it
nums.append(60)
n =

# 4) Split at position 4: first four / the rest

# 5) A real copy is independent

c.append(99)

print(last, middle, n, train, test, copy_differs)
`,
   solution:`nums = [10, 20, 30, 40, 50]

# 1) Last item, negative index
last = nums[-1]

# 2) The middle three: [20, 30, 40]
middle = nums[1:4]

# 3) Grow the list, then measure it
nums.append(60)
n = len(nums)

# 4) Split at position 4: first four / the rest
train = nums[:4]
test = nums[4:]

# 5) A real copy is independent
c = nums[:]
c.append(99)
copy_differs = len(c) != len(nums)

print(last, middle, n, train, test, copy_differs)
`,

     {d:'train/test split cleanly: [10,20,30,40] and [50,60]',expr:'train == [10,20,30,40] and test == [50,60]'},
     {d:'the copy grew independently, nums is untouched by c.append',expr:'copy_differs == True and len(nums) == 6'}
   ],
   hints:[
     'last = nums[-1]; middle = nums[1:4], remember the end index is excluded.',
     'The split idiom: train = nums[:4], test = nums[4:]. Same cut point, no overlap, nothing missed.',
     'nums[:] makes a genuine copy; plain c = nums would have shared the same list and the lengths would match.'
   ]}]},

{id:'py2',
 title:'Making decisions: booleans and if / elif / else',
 body:`
<div class="ground"><span class="gTag">🎯 What it does</span>
<p>Programs make choices. A <b>boolean</b> is a value that is either <code>True</code> or
<code>False</code>, and comparisons produce them: <code>3 > 5</code> is <code>False</code>,
<code>age >= 18</code> might be <code>True</code>. An <code>if</code> statement runs a block
only when its condition is <code>True</code>.</p></div>
<div class="codeSample">temp = 30
if temp > 25:
    label = "hot"
elif temp > 15:
    label = "mild"
else:
    label = "cold"
# label is "hot"</div>
<p>Read it top to bottom: Python checks each condition in order and runs the <b>first</b> one
that is true, skipping the rest. <code>elif</code> means "else, if…"; <code>else</code> is the
catch-all. The comparison operators produce booleans: <code>==</code> (equal), <code>!=</code>
(not equal), <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>, <code>&gt;=</code>.</p>

<h3>Logical operators: combining conditions</h3>
<p>Real decisions need more than one test at a time, and the three <b>logical operators</b>
join booleans together:</p>
<div class="codeSample">and   True only if BOTH sides are true     age >= 18 and has_ticket
or    True if EITHER side is true          is_weekend or is_holiday
not   flips a boolean                      not is_empty</div>
<p>So <code>if age >= 13 and age &lt;= 19:</code> is "a teenager"; <code>if not found:</code>
runs when <code>found</code> is False. A handy shortcut Python allows: <code>13 &lt;= age &lt;= 19</code>
chains comparisons directly. In ML you will write these constantly, "keep the row if it is
<i>not</i> missing <b>and</b> the value is positive." Two quiet rules worth knowing:
<code>and</code>/<code>or</code> read left to right and <b>stop early</b> once the answer is
decided (short-circuit), and any value can be treated as truthy/falsy, <code>0</code>, an
empty list <code>[]</code>, and an empty string <code>""</code> all count as <b>False</b>.</p>

<div class="demystify"><b>Watch out:</b> <code>=</code> assigns a value; <code>==</code> asks
"are these equal?". Mixing them up is the single most common beginner bug. And
<code>and</code>/<code>or</code>/<code>not</code> are words in Python, not <code>&amp;&amp;</code>,
<code>||</code>, <code>!</code> as in some other languages.</div>`,
 quiz:{title:'Quick check',questions:[
   {q:'What does the expression 3 > 5 evaluate to?',
    options:['True','False','3','An error'],answer:1,
    why:'3 is not greater than 5, so the comparison is False, a boolean value.'},
   {q:'"age >= 18 and has_ticket" is True when:',
    options:['Either condition is true','BOTH conditions are true, that is what "and" requires','Neither is true','Always'],answer:1,
    why:'"and" needs both sides true; "or" needs just one; "not" flips a boolean. These three combine conditions.'},
   {q:'In an if / elif / else chain, how many blocks run?',
    options:['All whose conditions are true','Exactly one, the first true condition (or else)','Always the else block','None until the end'],answer:1,
    why:'Python runs the first branch whose condition is True and skips the rest; else runs only if none matched.'}
 ]},
 exs:[{title:'Write a classifier with if / elif / else',
   lang:'python',
   prompt:`Write a function <code>classify(n)</code> that returns the string <code>"positive"</code>
   if <code>n</code> is greater than 0, <code>"negative"</code> if it is less than 0, and
   <code>"zero"</code> otherwise. Then set <code>passing</code> to a boolean: <code>True</code>
   if <code>score</code> is at least 60.`,
   starter:`def classify(n):
    # return "positive", "negative", or "zero"
    pass

score = 72
passing =            # True if score >= 60

print(classify(5), classify(-2), classify(0), passing)
`,
   solution:`def classify(n):
    if n > 0:
        return "positive"
    elif n < 0:
        return "negative"
    else:
        return "zero"

score = 72
passing = score >= 60

print(classify(5), classify(-2), classify(0), passing)
`,
   tests:[
     {d:'classify(5) is "positive"',expr:'classify(5) == "positive"'},
     {d:'classify(-2) is "negative"',expr:'classify(-2) == "negative"'},
     {d:'classify(0) is "zero"',expr:'classify(0) == "zero"'},
     {d:'passing is True for score 72',expr:'passing is True'}
   ],
   hints:[
     'Inside classify, use if n > 0: return "positive", a return immediately ends the function.',
     'Add elif n < 0: return "negative" and else: return "zero".',
     'passing is just the comparison itself: passing = score >= 60 (that expression is already a boolean).'
   ]}]},

{id:'pyop',
 title:'Operators: assignment shortcuts, division, and the one-line if',
 body:`
<div class="ground"><span class="gTag">🎯 What it does</span>
<p>A handful of compact operators show up in almost every program (and every loop you are about
to write). None is hard; they are just shorthand. Meeting them now means the code ahead reads
smoothly instead of looking cryptic.</p></div>

<h3>Augmented assignment: update a variable in place</h3>
<div class="codeSample">total = 10
total += 5     # same as  total = total + 5   →  15
total -= 3     #                              →  12
total *= 2     #                              →  24
total /= 4     #                              →  6.0</div>
<p><code>+=</code> reads "add to." It is the exact pattern behind an <b>accumulator</b>, start
at a value and keep updating it, which is how a loop builds a sum, a count, or (later) how
training keeps adjusting a weight: <code>weight -= learning_rate * gradient</code>. You will use
<code>+=</code> in the very next lesson.</p>

<h3>Integer division // and remainder %</h3>
<div class="codeSample">17 / 5    # 3.4   — normal division (always a float)
17 // 5   # 3     — floor division: how many whole 5s fit
17 % 5    # 2     — modulo: the remainder left over</div>
<p>These two are workhorses in ML plumbing: <code>%</code> tests divisibility
(<code>n % 2 == 0</code> means "even"), and both split data into <b>batches</b>, "how many
full batches of 32?" is <code>n // 32</code>, and <code>i % 32</code> tells you your position
inside the current batch.</p>

<h3>The ternary: an <code>if</code> that fits on one line</h3>
<div class="codeSample">label = "even" if n % 2 == 0 else "odd"</div>
<p>The <b>conditional expression</b> (nicknamed the "ternary") is a compact
<code>if</code>/<code>else</code> that <i>produces a value</i>. Read it as: "<code>label</code>
is <code>"even"</code> <b>if</b> the condition holds, <b>else</b> <code>"odd"</code>." It is the
same logic as a full if-block, squeezed into one expression, handy when you just need to pick
between two values.</p>

<div class="demystify"><b>Demystify <code>%</code>:</b> "modulo" is just the remainder from
division, the thing you learned as "17 divided by 5 is 3 remainder 2." Nothing more, but that
remainder is secretly everywhere: even/odd, wrapping around a clock, cycling through colors,
and slicing data into batches.</div>`,
 docs:[['Python operators','https://docs.python.org/3/reference/expressions.html#operator-precedence']],
 quiz:{title:'Quick check',questions:[
   {q:'After total = 10; total += 5; total *= 2, what is total?',
    options:['20','30, first 10 + 5 = 15, then 15 * 2 = 30','25','17'],answer:1,
    why:'+= updates in place (10 → 15), then *= doubles it (15 → 30). Augmented assignment is just "do the op, then store back."'},
   {q:'17 % 5 evaluates to:',
    options:['3','2, the remainder after taking out three 5s (15), leaving 2','3.4','85'],answer:1,
    why:'Modulo is the remainder. 17 // 5 = 3 (whole 5s), and 17 − 15 = 2 is left over. n % 2 == 0 is the standard "is it even?" test.'},
   {q:'The expression  "yes" if x > 0 else "no"  is:',
    options:['A syntax error','A ternary, a compact if/else that produces one of two values','A loop','A function call'],answer:1,
    why:'The conditional expression picks a value based on a condition, all on one line, the same logic as a full if/else block.'}
 ]},
 exs:[{title:'Use the compact operators',
   lang:'python',
   prompt:`Pure Python:
   <ol>
   <li>Start <code>total = 10</code>; use <code>+=</code> to add 5, then <code>*=</code> to double it, leave the result in <code>total</code> (30),</li>
   <li><code>whole</code> = <code>17 // 5</code> and <code>rem</code> = <code>17 % 5</code> (3 and 2),</li>
   <li><code>parity</code>, use a ternary to set it to <code>"even"</code> if <code>num</code> is even, else <code>"odd"</code> (for <code>num = 4</code> → "even").</li>
   </ol>`,
   starter:`total = 10
# add 5 to total, then double it, using += and *=


# whole-number quotient and remainder of 17 divided by 5
whole =
rem =

num = 4
# set parity using a ternary
parity =

print(total, whole, rem, parity)
`,
   solution:`total = 10
# add 5, then double, using += and *=
total += 5
total *= 2

whole = 17 // 5      # 17 // 5
rem = 17 % 5         # 17 % 5

num = 4
parity = "even" if num % 2 == 0 else "odd"

print(total, whole, rem, parity)
`,
   tests:[
     {d:'total is 30 (10 += 5 → 15, then *= 2 → 30)',expr:'total == 30'},
     {d:'17 // 5 is 3 (whole fives)',expr:'whole == 3'},
     {d:'17 % 5 is 2 (the remainder)',expr:'rem == 2'},
     {d:'the ternary set parity to "even" for num = 4',expr:'parity == "even"'}
   ],
   hints:[
     'total += 5 then total *= 2. Augmented assignment updates the variable in place.',
     '// is floor division (3), % is the remainder (2).',
     'parity = "even" if num % 2 == 0 else "odd", the value before "if", the condition, then "else" the other value.'
   ]}]},

{id:'py3',
 title:'Repeating work: loops',
 body:`
<div class="ground"><span class="gTag">🎯 What it does</span>
<p>A <b>loop</b> does something once for each item, so you never copy-paste the same line.
A <code>for</code> loop walks through a collection; <code>range(a, b)</code> generates the
numbers <code>a, a+1, …, b-1</code> (the end is <i>excluded</i>).</p></div>
<div class="codeSample">total = 0
for x in [10, 20, 30]:
    total += x        # total becomes 10, then 30, then 60
# total is 60

for i in range(1, 4):
    print(i)          # prints 1, 2, 3</div>
<p>The pattern <code>total += x</code> (short for <code>total = total + x</code>) is an
<b>accumulator</b>: start at a base value, then update it each pass. Summing, counting, and
finding a maximum are all accumulators, and later, <i>training a model</i> is one too.</p>
<p>You can loop over <i>any</i> collection this way, not just lists, including a <b>dictionary
(a map)</b>, where you often want each key <i>and</i> its value together with
<code>for key, value in d.items()</code>. Dictionaries come a couple of lessons from now, so we
cover that pattern in full there, just know that <code>for</code> is not list-only.</p>

<h3>while: loop until a condition changes</h3>
<p><code>for</code> is for "once per item." Its sibling <code>while</code> is for "as long as
this is true", when you do not know in advance how many repetitions you need:</p>
<div class="codeSample">x = 100.0
steps = 0
while x > 1:          # keep going as long as the condition holds
    x = x / 2
    steps += 1
# x is 0.78125, steps is 7</div>
<p>That shape, <i>repeat until good enough</i>, is exactly how model training loops work
("keep stepping downhill while the error is still improving"). Two control words work in any
loop: <code>break</code> exits the loop immediately; <code>continue</code> skips to the next
pass. And the classic hazard, named now: a <code>while</code> whose condition never becomes
false runs forever, always make sure something inside the loop moves it toward stopping.</p>`,
 quiz:{title:'Quick check',questions:[
   {q:'When do you reach for while instead of for?',
    options:['Never; they are identical','When you do not know the number of repetitions in advance, repeat AS LONG AS a condition holds (like "train until good enough")','When looping over a list','Only for infinite loops'],answer:1,
    why:'for = once per item; while = until the condition changes. Training loops are the canonical ML example of the second.'},
   {q:'Which numbers does range(1, 4) produce?',
    options:['1, 2, 3, 4','1, 2, 3','0, 1, 2, 3','2, 3, 4'],answer:1,
    why:'range starts at the first number and stops BEFORE the second: 1, 2, 3.'},
   {q:'What is total += x short for?',
    options:['total = x','total = total + x','total = total * x','x = x + total'],answer:1,
    why:'+= updates the variable in place: total = total + x. It is the accumulator pattern.'}
 ]},
 exs:[{title:'Sum the even numbers with a loop',
   lang:'python',
   prompt:`Using a <code>for</code> loop over <code>range(1, 11)</code> (the numbers 1..10), add up
   just the <b>even</b> numbers into <code>total</code> and count how many there were into
   <code>count</code>. (A number is even when <code>x % 2 == 0</code>.) Expected: total 30, count 5.`,
   starter:`total = 0
count = 0
for x in range(1, 11):
    # if x is even, add it to total and add 1 to count
    pass

print("total =", total, " count =", count)
`,
   solution:`total = 0
count = 0
for x in range(1, 11):
    if x % 2 == 0:
        total += x
        count += 1

print("total =", total, " count =", count)
`,
   tests:[
     {d:'total is 30 (2+4+6+8+10)',expr:'total == 30'},
     {d:'count is 5 (there are five evens)',expr:'count == 5'},
     {d:'the program prints its results',expr:'"total" in _stdout'}
   ],
   hints:[
     'The even test is x % 2 == 0 (the remainder when divided by 2 is zero).',
     'Inside the if, do two accumulations: total += x and count += 1.',
     'range(1, 11) stops at 10, so the evens are 2, 4, 6, 8, 10 → total 30, count 5.'
   ]}]},

{id:'pycomp',
 title:'Comprehensions: building lists in one line (the ML workhorse)',
 body:`
<div class="ground"><span class="gTag">🎯 What it does</span>
<p>You just wrote loops that build a result, start an empty list, loop, append. That pattern is
so common Python gives it a one-line form: the <b>comprehension</b>. It is the single most
common line of code in data and ML work, every dataset transformation you will read uses it —
so learning to write and read it now pays off on every lesson after this one.</p></div>

<h3>From a loop to a comprehension</h3>
<div class="codeSample"># the long way — build a list with a loop
squares = []
for x in range(5):
    squares.append(x * x)

# the same thing, as a comprehension
squares = [x * x for x in range(5)]     # [0, 1, 4, 9, 16]</div>
<p>Read it left to right: "<code>x * x</code>, <b>for each</b> <code>x</code> <b>in</b>
<code>range(5)</code>." The <i>expression</i> comes first (what to put in the list), then the
loop. It builds the whole list in one readable line.</p>

<h3>Filtering: add an <code>if</code></h3>
<div class="codeSample">evens = [x for x in range(10) if x % 2 == 0]     # [0, 2, 4, 6, 8]
big = [n for n in [4, 120, 7, 300] if n > 100]   # [120, 300]</div>
<p>A trailing <code>if</code> keeps only the items that pass, "for each x, <b>if</b> it is even,
include it." This is exactly how you will filter rows of data later.</p>

<h3>The <code>_</code> throwaway, and "do this N times"</h3>
<div class="codeSample">zeros = [0 for _ in range(4)]                    # [0, 0, 0, 0]
rolls = [random.randint(1, 6) for _ in range(1000)]   # roll a die 1000 times</div>
<p>When you do <b>not need the loop variable</b>, you just want to repeat something a set number
of times, the convention is to name it <code>_</code> (a plain underscore), Python's way of
saying "I am ignoring this." That <code>[... for _ in range(n)]</code> reads as "do this
<code>n</code> times and collect the results."</p>

<h3>Generator expressions: feeding <code>sum</code>, <code>min</code>, <code>max</code></h3>
<div class="codeSample">total = sum(x * x for x in nums)          # no [ ] needed inside sum()
count_big = sum(1 for x in nums if x > 100)   # COUNT the items over 100</div>
<p>Drop the square brackets and you have a <b>generator expression</b>, the same idea, but it
feeds values one at a time straight into <code>sum</code>/<code>min</code>/<code>max</code>
without building a list first (lighter on memory for big data). One idiom is worth memorizing
because it appears constantly: <code>sum(1 for x in items if condition)</code> <b>counts</b> how
many items match, you add <code>1</code> for each one that passes. (You will see this exact line
counting die rolls and matching data in the probability stream.)</p>

<h3>Nested comprehensions: building a grid (a matrix)</h3>
<p>Put a comprehension <i>inside</i> another and you build a <b>list of lists</b>, a grid. This
is exactly how you will build matrices in the linear-algebra stream:</p>
<div class="codeSample">grid = [[r * c for c in range(3)] for r in range(2)]
# [[0, 0, 0], [0, 1, 2]]   — outer loop makes rows, inner loop makes each row</div>
<p>Read it outside-in: the <b>outer</b> <code>for r in range(2)</code> makes two rows; for each
row, the <b>inner</b> <code>[... for c in range(3)]</code> builds that row's three cells. It is
two nested loops folded together. A related move you will see is looping twice to <i>flatten</i>
— <code>[x for row in grid for x in row]</code> walks every row, then every cell in it, into one
flat list. (These are the fanciest comprehensions we use; if one is hard to read, unfold it into
plain nested for-loops.)</p>

<div class="demystify"><b>Demystify the comprehension:</b> it is <i>just a for-loop folded onto
one line</i>, nothing new is happening, the machine still loops. If a comprehension ever looks
confusing, mentally unfold it back into the empty-list-loop-append form and it becomes obvious.
Dicts and sets have the same shorthand: <code>{k: v for ...}</code> and <code>{x for ...}</code>.</div>`,
 docs:[['Python tutorial (list comprehensions)','https://docs.python.org/3/tutorial/datastructures.html#list-comprehensions']],
 quiz:{title:'Quick check',questions:[
   {q:'[x * 2 for x in range(4)] produces:',
    options:['[0, 1, 2, 3]','[0, 2, 4, 6], double each number from 0 to 3','[2, 4, 6, 8]','8'],answer:1,
    why:'For each x in 0,1,2,3, the expression x*2 gives 0,2,4,6. A comprehension is a loop that builds a list.'},
   {q:'In  [0 for _ in range(5)]  , what is the underscore _ for?',
    options:['A syntax error','A throwaway name for the loop variable you do not need, "just do this 5 times"','It multiplies by 5','It reverses the list'],answer:1,
    why:'_ is the convention for "I am ignoring this variable." Here you just want to repeat 0 five times: [0,0,0,0,0].'},
   {q:'What does  sum(1 for x in data if x > 10)  compute?',
    options:['The total of all values','The COUNT of items greater than 10, it adds 1 for each match','The largest value','10'],answer:1,
    why:'Adding 1 for every item that passes the condition counts them. This "sum(1 for ... if ...)" idiom is everywhere in data code.'}
 ]},
 exs:[{title:'Write your first comprehensions',
   lang:'python',
   prompt:`Use comprehensions (no manual append loops):
   <ol>
   <li><code>squares</code>, the squares of 1..5: <code>[1, 4, 9, 16, 25]</code>,</li>
   <li><code>evens</code>, the even numbers in <code>range(10)</code>: <code>[0, 2, 4, 6, 8]</code>,</li>
   <li><code>count_big</code>, how many numbers in <code>[3, 8, 1, 9, 4]</code> are greater than 4 (use the <code>sum(1 for ...)</code> counting idiom, expect 2),</li>
   <li><code>threes</code>, the number <code>3</code> repeated 4 times using <code>_</code>: <code>[3, 3, 3, 3]</code>.</li>
   </ol>`,
   starter:`nums = [3, 8, 1, 9, 4]

# 1) squares of 1..5
squares =

# 2) even numbers in range(10)
evens =

# 3) count how many nums are > 4 (sum of 1 per match)
count_big =

# 4) the value 3, four times (use _)
threes =

print(squares, evens, count_big, threes)
`,
   solution:`nums = [3, 8, 1, 9, 4]

# 1) squares of 1..5
squares = [x * x for x in range(1, 6)]

# 2) even numbers in range(10)

# 3) count how many nums are > 4 (sum of 1 per match)

# 4) the value 3, four times (use _)
