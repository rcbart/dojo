<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Docker Crash Course</title>
<style>
  :root{
    --bg:#0d1117; --panel:#141b23; --panel2:#1b2530; --ink:#e6edf3; --muted:#93a1b1;
    --teal:#2dd4bf; --teal-dim:#155e59; --line:#26313d; --code:#0b1017;
    --good:#22c55e; --good-bg:#0e2a1a; --bad:#ef4444; --bad-bg:#2a1414; --accent:#38bdf8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--teal);text-decoration:none} a:hover{text-decoration:underline}
  #app{display:flex;min-height:100vh}
  /* sidebar */
  #sidebar{width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 0}
  .brand{padding:0 20px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .brand h1{font-size:17px;margin:0;color:#fff;letter-spacing:.2px}
  .brand .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .progwrap{padding:12px 20px}
  .progbar{height:7px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .progfill{height:100%;width:0;background:linear-gradient(90deg,var(--teal-dim),var(--teal));transition:width .4s}
  .progtxt{font-size:11px;color:var(--muted);margin-top:6px}
  .searchwrap{padding:6px 20px 4px}
  #search{width:100%;background:var(--code);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:9px 11px;font-size:13.5px;outline:none}
  #search:focus{border-color:var(--teal)}
  .searchinfo{font-size:11px;color:var(--muted);padding:4px 20px 0}
  .result{padding:9px 20px;cursor:pointer;border-left:3px solid transparent}
  .result:hover{background:var(--panel2);border-left-color:var(--teal)}
  .result .rt{font-size:13.5px;color:#fff;font-weight:600}
  .result .rs{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
  .result .rs mark{background:var(--teal-dim);color:#d7fff6;border-radius:3px;padding:0 2px}
  .noresult{padding:12px 20px;font-size:13px;color:var(--muted)}
  .navgroup{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);
    padding:14px 20px 6px;font-weight:700}
  .navitem{display:flex;align-items:center;gap:9px;padding:8px 20px;cursor:pointer;
    font-size:14px;color:var(--ink);border-left:3px solid transparent}
  .navitem:hover{background:var(--panel2)}
  .navitem.active{background:var(--panel2);border-left-color:var(--teal);color:#fff}
  .navitem .dot{width:16px;height:16px;flex:0 0 16px;border-radius:50%;border:2px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;font-size:10px}
  .navitem.done .dot{background:var(--teal);border-color:var(--teal);color:#04211f}
  .navitem .t{flex:1}
  /* main */
  #main{flex:1;min-width:0;display:flex;justify-content:center;padding:38px 40px 90px}
  #content{max-width:820px;width:100%}
  #content h2{font-size:26px;margin:.2em 0 .5em;color:#fff}
  #content h3{font-size:19px;margin:1.5em 0 .4em;color:var(--teal)}
  #content h4{font-size:16px;margin:1.2em 0 .3em;color:var(--ink)}
  #content p{margin:.7em 0}
  #content p.dd{margin:.2em 0 .8em 1.2em;color:var(--muted)}
  #content ul,#content ol{margin:.6em 0;padding-left:1.4em}
  #content li{margin:.3em 0}
  #content strong{color:#fff}
  #content code{background:var(--code);border:1px solid var(--line);border-radius:5px;
    padding:.08em .38em;font:13.5px/1.4 "SF Mono",Menlo,Consolas,monospace;color:#8be9c9}
  #content hr{border:0;border-top:1px solid var(--line);margin:1.8em 0}
  blockquote{margin:1em 0;padding:.5em 1em;background:var(--panel);border-left:3px solid var(--accent);
    border-radius:0 6px 6px 0;color:var(--ink)}
  blockquote p{margin:.3em 0}
  pre.code{position:relative;background:var(--code);border:1px solid var(--line);border-radius:9px;
    padding:14px 16px;overflow-x:auto;margin:1em 0}
  pre.code code{background:none;border:0;padding:0;color:#d7e2ea;
    font:13px/1.55 "SF Mono",Menlo,Consolas,monospace;white-space:pre}
  pre.code .copy{position:absolute;top:8px;right:8px;background:var(--panel2);color:var(--muted);
    border:1px solid var(--line);border-radius:6px;font-size:11px;padding:3px 9px;cursor:pointer}
  pre.code .copy:hover{color:var(--teal);border-color:var(--teal)}
  .tablewrap{overflow-x:auto;margin:1em 0}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  th{background:var(--panel2);color:#fff}
  tr:nth-child(even) td{background:rgba(255,255,255,.02)}
  .pagehdr{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:2px}
  /* quiz */
  .quiz{margin:34px 0 10px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .quiz h3{margin-top:0;color:#fff}
  .quiz .qmeta{font-size:13px;color:var(--muted);margin-bottom:14px}
  .qcard{margin:16px 0;padding:16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
  .qtext{font-weight:600;margin-bottom:12px}
  .opt{display:block;width:100%;text-align:left;background:var(--code);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:11px 13px;margin:8px 0;cursor:pointer;font-size:14.5px;
    transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--teal)}
  .opt.correct{border-color:var(--good);background:var(--good-bg)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.disabled{cursor:default;opacity:.85}
  .why{margin-top:10px;font-size:13.5px;color:var(--ink);background:var(--code);
    border-left:3px solid var(--teal);border-radius:0 6px 6px 0;padding:9px 12px;display:none}
  .why.show{display:block}
  .why.ok{border-left-color:var(--good)} .why.no{border-left-color:var(--bad)}
  .qscore{margin-top:16px;font-size:14px;color:var(--muted)}
  .navbtns{display:flex;justify-content:space-between;margin-top:40px;gap:12px}
  .navbtns button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:11px 18px;font-size:14px;cursor:pointer}
  .navbtns button:hover:not(:disabled){border-color:var(--teal);color:#fff}
  .navbtns button:disabled{opacity:.35;cursor:default}
  .navbtns .next{background:var(--teal-dim);border-color:var(--teal)}
  .mobtog{display:none}
  @media(max-width:860px){
    #sidebar{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .25s}
    #sidebar.open{transform:none}
    #main{padding:64px 18px 80px}
    .mobtog{display:inline-flex;position:fixed;top:12px;left:12px;z-index:40;background:var(--panel);
      border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
  }
</style>
</head>
<body>
<button class="mobtog" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <h1>Docker Crash Course</h1>
      <div class="sub">From zero to production containers · interactive</div>
    </div>
    <div class="progwrap">
      <div class="progbar"><div class="progfill" id="progfill"></div></div>
      <div class="progtxt" id="progtxt">0% complete</div>
    </div>
    <div class="searchwrap">
      <input id="search" type="search" placeholder="Search the course…" autocomplete="off">
    </div>
    <div id="results"></div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"><div id="content"></div></main>
</div>

<script>
/* Minimal, dependency-free Markdown -> HTML renderer.
   Supports the subset used by the course: headings, bold, inline code, links,
   fenced code blocks, tables, blockquotes, ordered/unordered lists, hr,
   definition-style ": " lines, and paragraphs. Works in Node and the browser. */
(function (global) {
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(text) {
    // protect inline code spans
    var codes = [];
    text = text.replace(/`([^`]+)`/g, function (_, c) {
      codes.push("<code>" + escapeHtml(c) + "</code>");
      return "␀" + (codes.length - 1) + "␀";
    });
    text = escapeHtml(text);
    // bold (non-greedy so it can span inner single-* italics)
    text = text.replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>");
    // italics (remaining single *)
    text = text.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    // links [text](url)
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, t, u) {
      var safe = u.replace(/"/g, "%22");
      var ext = /^https?:\/\//.test(u) ? ' target="_blank" rel="noopener"' : "";
      return '<a href="' + safe + '"' + ext + ">" + t + "</a>";
    });
    // restore code spans
    text = text.replace(/␀(\d+)␀/g, function (_, i) {
      return codes[+i];
    });
    return text;
  }

  function renderTable(rows) {
    // rows: array of raw '| a | b |' lines (header, sep, ...body)
    function cells(line) {
      var t = line.trim().replace(/^\|/, "").replace(/\|$/, "");
      return t.split("|").map(function (c) { return c.trim(); });
    }
    var header = cells(rows[0]);
    var body = rows.slice(2).map(cells);
    var html = '<div class="tablewrap"><table><thead><tr>';
    header.forEach(function (h) { html += "<th>" + inline(h) + "</th>"; });
    html += "</tr></thead><tbody>";
    body.forEach(function (r) {
      html += "<tr>";
      r.forEach(function (c) { html += "<td>" + inline(c) + "</td>"; });
      html += "</tr>";
    });
    html += "</tbody></table></div>";
    return html;
  }

  function mdToHtml(md) {
    md = md.replace(/\r\n/g, "\n");
    var lines = md.split("\n");
    var out = [];
    var i = 0;

    function isTableSep(line) {
      return /^\s*\|?[\s:-]*-[\s:|-]*\|?\s*$/.test(line) && line.indexOf("-") !== -1;
    }

    while (i < lines.length) {
      var line = lines[i];

      // fenced code block
      var fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        var lang = fence[1] || "";
        var buf = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++; // skip closing fence
        out.push('<pre class="code" data-lang="' + lang + '"><button class="copy" type="button">Copy</button><code>' +
          escapeHtml(buf.join("\n")) + "</code></pre>");
        continue;
      }

      // horizontal rule
      if (/^\s*---\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

      // heading
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        var lvl = h[1].length;
        out.push("<h" + lvl + ">" + inline(h[2].trim()) + "</h" + lvl + ">");
        i++;
        continue;
      }

      // blockquote (may span lines)
      if (/^\s*>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        out.push('<blockquote>' + mdToHtml(q.join("\n")) + "</blockquote>");
        continue;
      }

      // table
      if (line.indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var trows = [];
        while (i < lines.length && lines[i].indexOf("|") !== -1 && lines[i].trim() !== "") {
          trows.push(lines[i]);
          i++;
        }
        out.push(renderTable(trows));
        continue;
      }

      // unordered list
      if (/^\s*[-*]\s+/.test(line)) {
        var items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          var item = lines[i].replace(/^\s*[-*]\s+/, "");
          i++;
          // continuation lines (indented, not a new list item / block)
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && lines[i].trim() !== "") {
            item += " " + lines[i].trim();
            i++;
          }
          items.push("<li>" + inline(item) + "</li>");
        }
        out.push("<ul>" + items.join("") + "</ul>");
        continue;
      }

      // ordered list
      if (/^\s*\d+\.\s+/.test(line)) {
        var oitems = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          var oitem = lines[i].replace(/^\s*\d+\.\s+/, "");
          i++;
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) && lines[i].trim() !== "") {
            oitem += " " + lines[i].trim();
            i++;
          }
          oitems.push("<li>" + inline(oitem) + "</li>");
        }
        out.push("<ol>" + oitems.join("") + "</ol>");
        continue;
      }

      // definition-style ": " line -> indented note paragraph
      if (/^:\s+/.test(line)) {
        out.push('<p class="dd">' + inline(line.replace(/^:\s+/, "")) + "</p>");
        i++;
        continue;
      }

      // blank line
      if (line.trim() === "") { i++; continue; }

      // paragraph (gather until blank / block start)
      var para = [line];
      i++;
      while (i < lines.length && lines[i].trim() !== "" &&
             !/^(#{1,6})\s/.test(lines[i]) &&
             !/^```/.test(lines[i]) &&
             !/^\s*>\s?/.test(lines[i]) &&
             !/^\s*[-*]\s+/.test(lines[i]) &&
             !/^\s*\d+\.\s+/.test(lines[i]) &&
             !/^:\s+/.test(lines[i]) &&
             !/^\s*---\s*$/.test(lines[i]) &&
             !(lines[i].indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1]))) {
        para.push(lines[i]);
        i++;
      }
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }

    return out.join("\n");
  }

  if (typeof module !== "undefined" && module.exports) module.exports = mdToHtml;
  else global.mdToHtml = mdToHtml;
})(typeof window !== "undefined" ? window : this);

</script>
<script>
const DATA = {"pages": [{"id": "setup-local-docker", "title": "Setup — install & run Docker", "group": "Get started", "md": "*Do this once. In ~10 minutes you'll have Docker installed and a real container running. Every step\nspelled out for macOS, Windows, and Linux. No prior experience assumed.*\n\n> **This course is hands-on, on your own machine.** The site you're reading gives you the lessons\n> and quizzes, but the real work happens in your own terminal — installing tools, running\n> containers, and breaking things you can then fix. This setup page gets your machine ready; do it\n> before the first lab.\n\n---\n\n## Step 1 — Install Docker\n\n**macOS**\n: Download **Docker Desktop** from <https://www.docker.com/products/docker-desktop/>, open the\n`.dmg`, drag Docker to Applications, and launch it. Wait for the whale icon in the menu bar to go\nsteady (engine running). Apple Silicon and Intel both supported.\n\n**Windows**\n: Download **Docker Desktop** and run the installer. Allow it to enable **WSL 2** (Windows\nSubsystem for Linux) if prompted — accept and reboot if asked. Launch Docker Desktop; wait for\n\"Engine running.\" Run course commands in **PowerShell** or **Windows Terminal**.\n\n**Linux**\n: Install **Docker Engine** for your distro (<https://docs.docker.com/engine/install/>). Quick path\non Debian/Ubuntu:\n\n```bash\ncurl -fsSL https://get.docker.com | sh\nsudo usermod -aG docker $USER      # run docker without sudo — log out/in afterward\n```\n\n> **Version note.** Docker Engine v29 is current as of this writing (it makes the containerd image\n> store the default). Everything in this course is stable across recent versions; commands are\n> unchanged. Check `docker --version`.\n\n## Step 2 — Verify it works\n\n```bash\ndocker --version                 # prints the version\ndocker run --rm hello-world      # pulls a tiny image and runs it\n```\n\nIf you see \"Hello from Docker!\", the whole pipeline works: Docker pulled an **image** from a\nregistry, created a **container** from it, ran it, and (thanks to `--rm`) cleaned it up.\n\n## Step 3 — Run something real\n\nLet's run a web server and actually visit it:\n\n```bash\ndocker run -d --name web -p 8080:80 nginx\n```\n\nBreaking that down (you'll learn each flag in the modules):\n\n- `-d` — **detached**: run in the background.\n- `--name web` — give the container a friendly name.\n- `-p 8080:80` — **publish** the container's port 80 to your machine's port 8080.\n- `nginx` — the image to run (pulled automatically if not present).\n\nOpen <http://localhost:8080> in your browser — you'll see the nginx welcome page, served from\ninside a container. Check it's running and read its logs:\n\n```bash\ndocker ps                        # your running container, its ports\ndocker logs web                  # the server's output\n```\n\n## Step 4 — Look inside the running container\n\n```bash\ndocker exec -it web bash         # open a shell INSIDE the container\n# now you're \"inside\" — try:  ls /usr/share/nginx/html   then:  exit\n```\n\n`exec` runs a command in an existing container; `-it` makes it interactive. This is how you poke\naround a running container to debug it.\n\n## Step 5 — Stop and clean up\n\n```bash\ndocker stop web                  # stop the container\ndocker rm web                    # remove it\ndocker ps -a                     # -a shows stopped containers too (should be gone now)\n```\n\nThat's the core loop: `run` to start, `ps`/`logs`/`exec` to inspect, `stop`/`rm` to clean up.\nEverything else builds on it.\n\n---\n\n## Troubleshooting\n\n**\"Cannot connect to the Docker daemon\" / \"docker: command not found\"**\n: Docker Desktop isn't running (or Engine isn't installed). Start it, wait for the running\nindicator, retry. On Linux: `sudo systemctl start docker`.\n\n**`docker run` needs sudo on Linux**\n: Add yourself to the `docker` group (Step 1) and log out/in, or prefix commands with `sudo`.\n\n**Port 8080 already in use**\n: Something else uses it. Pick another host port: `-p 9090:80`, then visit `localhost:9090`.\n\n**Windows: `docker` behaves oddly**\n: Ensure Docker Desktop is running with the WSL 2 backend. Run commands in PowerShell or a WSL\nterminal."}, {"id": "primer-what-are-containers", "title": "Primer — What are containers?", "group": "Get started", "md": "*The idea everything else rests on. No jargon assumed. ~10 min.*\n\n---\n\n## The problem containers solve\n\nYou build an app on your laptop. It works. You send it to a teammate — it breaks. You deploy it to\na server — it breaks differently. Why? Because each machine has a slightly different operating\nsystem, different versions of libraries, different settings. The infamous line is **\"but it works\non my machine.\"**\n\nA **container** fixes this by packaging your app *together with everything it needs to run* — the\ncode, the runtime, the libraries, the settings — into one sealed bundle that runs **the same\neverywhere**. Your laptop, a teammate's laptop, a cloud server: identical behavior, because they're\nall running the exact same bundle.\n\n## The lunchbox analogy\n\nThink of a container as a **lunchbox**. Instead of hoping the destination has the right food,\nutensils, and napkins, you pack everything into one box. Wherever you take it, the meal is complete\nand identical. A software container packs your app plus its entire environment the same way — so\n\"where it runs\" no longer changes \"how it runs.\"\n\n## Container vs virtual machine (the key distinction)\n\nBefore containers, the way to get a consistent environment was a **virtual machine (VM)** — a full\nfake computer, with its own complete operating system, running on top of your real one. VMs work,\nbut each one is **heavy**: gigabytes in size, slow to start (like booting a PC), and resource-hungry\nbecause every VM runs a whole OS.\n\nContainers are lighter because they **share the host's operating system kernel** instead of each\nshipping their own. Picture the difference:\n\n```\n   VIRTUAL MACHINES                         CONTAINERS\n   ───────────────                          ──────────\n   [ App A ] [ App B ]                       [ App A ] [ App B ] [ App C ]\n   [ Guest OS ][ Guest OS ]   ← whole OS      [   shared container runtime  ]\n   [     Hypervisor      ]      per app       [       host operating system  ]\n   [   Host operating system ]                [          hardware            ]\n```\n\n- A **VM** virtualizes the *hardware* — heavy, minutes to boot, GBs each.\n- A **container** virtualizes the *operating system* — light, starts in **milliseconds**, MBs each.\n\nSo you can run many more containers than VMs on the same machine, and start them almost instantly.\nThat efficiency is why containers took over modern software delivery.\n\n## Images vs containers (don't mix these up)\n\nTwo words you'll use constantly, and they're different:\n\n- An **image** is the **blueprint** — a read-only, packaged snapshot of your app and its\n  environment. You build it once; it doesn't run.\n- A **container** is a **running instance** of an image — the blueprint brought to life. You can\n  start many containers from one image, like baking many cookies from one cutter.\n\n> Image = the recipe (or class). Container = the meal being cooked (or object). One image, many\n> containers.\n\n## What Docker is (one line)\n\n**Docker** is the most popular tool for building images and running containers. It gives you simple\ncommands (`docker build`, `docker run`) and a format for images that the whole industry adopted.\nWhen people say \"containerize my app,\" they usually mean \"package it as a Docker image.\"\n\n## Why this matters for your career\n\nContainers are the foundation of modern infrastructure. **Kubernetes** (the second half of your\nlearning path) exists to run *thousands* of containers across many machines. You can't understand\nKubernetes without understanding containers first — which is exactly why this course comes before\nit. Master the lunchbox, then learn to manage a whole warehouse of them."}, {"id": "primer-core-concepts", "title": "Primer — Core concepts & glossary", "group": "Get started", "md": "*Read this if any word in this course feels assumed. It defines the background terms — machine,\nhost, process, kernel, port, and friends — in plain English, so nothing later leaves you lost. ~10\nmin. Skim it now; come back whenever a term trips you up.*\n\n---\n\nMost tutorials assume you already know a pile of infrastructure vocabulary. This page doesn't. Here\nis every foundational term the course leans on, explained simply.\n\n## Machines: computers that run things\n\n- **Machine / computer** — any computer that runs software. Could be your laptop or a server.\n- **Server** — a computer whose job is to run programs for others (serve web pages, hold a\n  database), usually running somewhere in a data center, on all the time.\n- **Host** — in Docker talk, **the machine that Docker itself runs on** — your laptop, or a cloud\n  server. Containers run \"on the host.\" When you see `localhost` or \"the host,\" it means *this\n  machine, the one running the containers.*\n- **Node** — a generic word for \"one machine in a group of machines.\" A single server in a cluster\n  is called a node. (You'll use this word constantly in Kubernetes; in Docker it just means \"a\n  machine running containers.\")\n- **Instance** — one running copy of something. \"An instance of a server\" = one particular running\n  server. \"A container instance\" = one running container. If you run three copies of an app, you\n  have three instances.\n- **Virtual machine (VM)** — a software-simulated computer running *inside* a real one, with its own\n  full operating system. Cloud servers are usually VMs. (Containers are the *lighter* alternative —\n  see the \"What are containers?\" primer.)\n- **Cloud** — someone else's computers (Amazon, Google, Microsoft) that you rent by the hour instead\n  of buying hardware.\n\n## Inside a machine: operating systems and processes\n\n- **Operating system (OS)** — the base software that runs a computer (Linux, macOS, Windows).\n  Containers almost always run **Linux** inside, even on a Mac/Windows host (Docker Desktop runs a\n  small hidden Linux VM for this).\n- **Kernel** — the innermost core of the operating system that manages hardware, memory, and running\n  programs. The key fact for Docker: **containers share the host's Linux kernel** (that's why\n  they're lightweight), whereas VMs each ship their own.\n- **Process** — one running program. When you start a container, its main program runs as a process.\n  A container lives exactly as long as its main process; when that process exits, the container\n  stops.\n- **Filesystem** — the tree of files and folders a program sees (`/app`, `/etc`, …). Each container\n  has its **own isolated filesystem** taken from its image, separate from the host's.\n- **Environment variable** — a named value passed to a program at startup (like `LOG_LEVEL=debug`),\n  used to configure it without changing code. Docker sets these with `-e`.\n\n## Networking basics\n\n- **IP address** — a machine's numeric address on a network, like `10.0.0.7`. Each container gets\n  its own.\n- **Port** — a numbered \"door\" on a machine for a specific service (web servers usually listen on\n  port 80, databases on 5432). One machine has many ports so many services can share one IP.\n- **`localhost` / `127.0.0.1`** — \"this same machine.\" Crucial gotcha: inside a container,\n  `localhost` means *the container itself*, not your laptop or another container.\n- **Publish a port** (`-p 8080:80`) — poke a hole so a port inside a container is reachable from the\n  host. \"Host 8080 → container 80.\"\n- **DNS** — the system that turns names into IP addresses, so you can say `db` instead of\n  `10.0.0.7`.\n\n## Docker-specific building blocks\n\n- **Image** — a read-only, packaged blueprint of an app plus everything it needs. Built once, run\n  many times. (Like a class, or a recipe.)\n- **Container** — one running instance of an image. (Like an object, or the cooked meal.)\n- **Layer** — an image is built from stacked read-only layers, each recording one change; they're\n  cached and shared to save space and time.\n- **Dockerfile** — the text recipe listing the steps to build an image.\n- **Registry** — an online store of images (e.g. Docker Hub) you push to and pull from.\n- **Volume** — Docker-managed storage that lives *outside* a container so data survives when the\n  container is deleted.\n- **Docker daemon (`dockerd`)** — the background service that actually builds images and runs\n  containers.\n- **Docker CLI** — the `docker` command you type, which sends your requests to the daemon.\n- **Client / server** — a pattern where one program (the *client*, here the CLI) asks another (the\n  *server*, here the daemon) to do work. Docker is built this way.\n\n## Ideas and formats you'll meet\n\n- **CPU architecture** — the \"instruction set\" a chip understands: **amd64** (Intel/AMD) or\n  **arm64** (Apple Silicon, many phones/servers). An image built for one won't run on the other\n  unless it's *multi-architecture*.\n- **YAML** — a human-friendly text format for configuration (used by `compose.yaml` and, later,\n  Kubernetes). Indentation matters; it's just structured key/value data.\n- **Declarative** — you describe the *desired end state* (\"I want these services running\") and the\n  tool makes it happen, versus **imperative** (you give step-by-step commands). Compose and\n  Kubernetes are declarative.\n- **Stateless vs stateful** — *stateless* apps keep no important local data (any copy is\n  interchangeable — easy to scale); *stateful* apps do (databases), so their storage must be\n  preserved.\n\n## How to use this page\n\nYou don't need to memorize this. Skim it once so the words feel familiar, and jump back whenever a\nterm in a later module is fuzzy. Every concept here is used, in context, in the modules that follow."}, {"id": "00-what-is-docker", "title": "0 · What Docker is", "group": "Fundamentals", "md": "*No lab — the mental model. ~10 min read.*\n\n---\n\n## Recap and sharpen\n\n**Docker packages your app into an image and runs it as a container.** An image is the sealed\nblueprint (app + libraries + runtime + settings); a container is a running instance. Containers are\nlight because they share the host OS kernel instead of shipping a whole OS like a VM. This module\nmaps out the whole Docker world so the later hands-on modules have a frame.\n\n## The three things Docker gives you\n\n1. **Build** — turn your app into an **image** using a recipe file (a `Dockerfile`). Reproducible:\n   the same Dockerfile builds the same image anywhere.\n2. **Ship** — push images to a **registry** (like Docker Hub), a shared library others can pull\n   from. This is how an image built on your laptop runs unchanged on a server.\n3. **Run** — start **containers** from images, locally or in production, with resource limits,\n   networking, and storage you control.\n\nBuild, ship, run — the whole Docker lifecycle. Kubernetes (later) is about the \"run\" part at massive\nscale.\n\n## The pieces and how they fit\n\n| Piece | What it is |\n|-------|-----------|\n| **Docker CLI** | The `docker` command you type — your interface to everything |\n| **Docker daemon** (`dockerd`) | The background service that actually builds images and runs containers |\n| **Image** | The read-only blueprint of an app + environment |\n| **Container** | A running instance of an image |\n| **Dockerfile** | The text recipe used to build an image |\n| **Registry** | A store for images (Docker Hub, GitHub Container Registry, private registries) |\n| **Volume** | Persistent storage that outlives a container |\n| **Network** | Virtual networks that let containers talk to each other and the outside |\n\nWhen you type `docker run nginx`, the CLI asks the daemon to: find the `nginx` image (pull it from a\nregistry if missing), create a container from it, and start it. You'll see every one of these pieces\nin the labs.\n\n## The client–daemon architecture (why it matters)\n\nDocker is split in two: the **CLI** (what you type) talks to the **daemon** (the engine that does\nthe work) over an API. Usually both run on your machine, but the daemon could be remote. Practical\nconsequences:\n\n- If the daemon isn't running, every command fails with \"cannot connect to the Docker daemon\" —\n  start Docker Desktop / the docker service.\n- The daemon, not the CLI, holds your images and containers. `docker ps` asks the daemon what it's\n  running.\n\n## The OCI standard (Docker isn't the only player)\n\nDocker popularized containers, but the **image format** and **runtime** are now open standards under\nthe **OCI** (Open Container Initiative). That's why images you build with Docker also run on other\nruntimes (containerd, CRI-O, Podman) and on Kubernetes — which doesn't even use Docker directly\nanymore, but runs the same OCI images. **Learn Docker images once, and they run everywhere in the\ncloud-native world.** This is the payoff that connects this course to Kubernetes.\n\n## Where Docker fits vs Kubernetes\n\n- **Docker** = build and run containers, typically on **one machine**. Great for development,\n  building images, and simple deployments.\n- **Kubernetes** = orchestrate **thousands** of containers across **many machines** — scheduling,\n  scaling, healing, networking them as a fleet. It runs the very images Docker builds.\n\nYou build with Docker; you operate at scale with Kubernetes. This course makes you fluent in the\nfirst so the second makes sense.\n\n## The mental checklist for any Docker task\n\n1. **What image am I using or building?** (blueprint)\n2. **What container(s) will run from it, with what ports/env/limits?** (instances)\n3. **Does it need persistent data?** (volumes)\n4. **Does it need to talk to other containers?** (networks)\n5. **Where does the image live so others can run it?** (registry)\n\nEvery module answers one of these."}, {"id": "01-images-and-layers", "title": "1 · Images & layers", "group": "Fundamentals", "md": "*How images actually work — the key to building fast, small images later. Concepts + a short\ninspect lab. ~20 min. Requires Docker.*\n\n---\n\nAn image feels like a single file, but inside it's built from **layers** stacked on top of each\nother. Understanding layers is what separates people who *use* Docker from people who are *good* at\nit — it explains build speed, image size, and caching.\n\n## Layers: an image is a stack\n\nEvery instruction in a build adds a **layer** — a read-only set of filesystem changes. A typical\nimage might be:\n\n```\n   ┌─────────────────────────────┐  ← your app code            (layer 4)\n   ├─────────────────────────────┤  ← installed dependencies   (layer 3)\n   ├─────────────────────────────┤  ← your runtime (e.g. Node) (layer 2)\n   └─────────────────────────────┘  ← a base OS (e.g. Debian)  (layer 1, the \"base image\")\n```\n\nLayers stack bottom-up, each recording only *what changed* from the one below. The final image is\nall layers combined, presented as one filesystem (via a \"union filesystem\"). When a container runs,\nDocker adds a thin **writable layer** on top — so the image stays read-only and the container's\nchanges live separately.\n\n## Why layers are brilliant\n\nTwo big payoffs, both of which you'll exploit later:\n\n- **Sharing/caching between images.** If ten images all start `FROM debian`, that Debian layer is\n  stored **once** and shared. Pulling a new image only downloads layers you don't already have.\n- **Fast rebuilds.** Docker caches each layer. If you rebuild and a layer's inputs haven't changed,\n  Docker **reuses the cached layer** instead of redoing the work. Order your build steps well and\n  rebuilds take seconds (Module 3 covers this).\n\n## Base images\n\nMost images start `FROM` a **base image** — a starting point someone else published:\n\n- **Full OS bases** — `ubuntu`, `debian`: familiar, lots of tools, larger.\n- **Slim bases** — `debian:slim`, `python:3.12-slim`: trimmed down, smaller.\n- **Alpine** — `alpine`: tiny (~5 MB) Linux; great for size, but uses `musl` libc which occasionally\n  trips up some software.\n- **Distroless / scratch** — minimal or *empty* bases for the smallest, most secure images\n  (Module 7).\n\nChoosing a smaller base is the easiest win for image size and security.\n\n## Tags and digests (naming images)\n\nAn image reference looks like `repository:tag`, e.g. `nginx:1.27` or `python:3.12-slim`.\n\n- **`repository`** — the image name (optionally with a registry/user prefix, e.g.\n  `ghcr.io/acme/api`).\n- **`tag`** — a human label for a version, e.g. `1.27`, `latest`. **`latest` is just a default tag,\n  not \"the newest\" magically** — it's whatever was last pushed as `latest`. In production, **pin a\n  real version tag**; never rely on `latest`.\n- **`digest`** — a content hash like `@sha256:abc123…` that identifies an *exact, immutable* image.\n  A tag can move; a digest never changes. For reproducible deployments, reference by digest.\n\n## Lab: look inside images\n\nPull an image and inspect its layers:\n\n```bash\ndocker pull python:3.12-slim\ndocker images                       # size of the image\ndocker history python:3.12-slim     # the layers and what each added\n```\n\n`docker history` shows each layer and the instruction that created it — you're seeing the stack.\nNow pull something that shares layers:\n\n```bash\ndocker pull python:3.12             # the non-slim variant\ndocker images | grep python\n```\n\nNotice pulls are faster when layers are already present (shared base layers aren't re-downloaded).\nInspect full metadata:\n\n```bash\ndocker inspect python:3.12-slim | less   # config, layers, env, entrypoint (JSON)\n```\n\n### Experiment: pin by digest\n\n```bash\ndocker inspect --format='{{index .RepoDigests 0}}' python:3.12-slim\n# copy the name@sha256:... and run it — that exact image, immutable:\ndocker run --rm python@sha256:<the-digest> python --version\n```"}, {"id": "02-lab-run-manage-containers", "title": "2 · Lab: run & manage containers", "group": "Fundamentals", "md": "*Hands-on. The everyday commands you'll use constantly. ~25 min. Requires Docker.*\n\n---\n\nThis module is pure practice. By the end, running, inspecting, and cleaning up containers is\nmuscle memory.\n\n## The anatomy of `docker run`\n\n```\ndocker run [options] IMAGE [command]\n```\n\nEverything is an option on this one command. The ones you'll use daily:\n\n| Option | Meaning |\n|--------|---------|\n| `-d` | Detached — run in the background |\n| `--name X` | Name the container (else you get a random name) |\n| `-p H:C` | Publish host port H → container port C |\n| `-e KEY=val` | Set an environment variable inside the container |\n| `-v ...` | Mount a volume / bind mount (Module 4) |\n| `--rm` | Delete the container automatically when it exits |\n| `-it` | Interactive + TTY — for shells and interactive programs |\n| `--restart` | Restart policy (e.g. `unless-stopped`) — Module 10 |\n\n## Foreground vs detached\n\n```bash\n# foreground: you see output, Ctrl-C stops it\ndocker run --rm nginx\n\n# detached: runs in background, prints the container ID\ndocker run -d --name web -p 8080:80 nginx\n```\n\nForeground is great for short commands and seeing logs live; detached is for long-running services.\n\n## Inspecting running containers\n\n```bash\ndocker ps                     # running containers\ndocker ps -a                  # include stopped ones\ndocker logs web               # its output\ndocker logs -f web            # follow (stream) logs, Ctrl-C to stop following\ndocker inspect web            # full JSON: IP, mounts, env, state\ndocker stats                  # live CPU/memory/network usage, Ctrl-C to exit\ndocker top web                # processes running inside\n```\n\n`docker logs` and `docker inspect` are your first two debugging tools — reach for them whenever a\ncontainer misbehaves.\n\n## Running commands inside a container\n\n```bash\ndocker exec -it web bash      # a shell inside the running container\n# inside: ls, cat /etc/nginx/nginx.conf, whoami ... then: exit\n\ndocker exec web nginx -v      # run a one-off command without a shell\n```\n\n`exec` runs a **new** command in an **already-running** container. (Different from `run`, which\ncreates a new container.)\n\n## Lifecycle: stop, start, remove\n\n```bash\ndocker stop web               # graceful stop (SIGTERM, then SIGKILL after a grace period)\ndocker start web              # start it again (keeps its config)\ndocker restart web            # stop + start\ndocker rm web                 # remove a stopped container\ndocker rm -f web              # force-remove even if running\n```\n\n## Cleaning up (reclaim disk)\n\nContainers, images, and volumes accumulate. Clean safely:\n\n```bash\ndocker ps -a                  # see what's around\ndocker container prune        # remove all stopped containers\ndocker image prune            # remove dangling (untagged) images\ndocker system df              # how much disk Docker is using\ndocker system prune           # remove unused data (asks first) — careful\n```\n\n## Guided exercise\n\nRun through this end to end:\n\n```bash\n# 1. start a named web server in the background\ndocker run -d --name site -p 8080:80 nginx\n\n# 2. confirm it's up and visit http://localhost:8080\ndocker ps\n\n# 3. watch its logs while you refresh the browser a few times\ndocker logs -f site           # Ctrl-C to stop following\n\n# 4. hop inside and change the homepage\ndocker exec -it site bash\necho \"<h1>Hello from my container</h1>\" > /usr/share/nginx/html/index.html\nexit\n# refresh the browser — your text appears\n\n# 5. stop, restart (note: your edit persists across restart), then remove\ndocker stop site && docker start site     # edit still there (same container)\ndocker rm -f site                          # now it's gone entirely\n```\n\n### The key lesson from step 5\n\nYour edit survived `stop`/`start` (same container's writable layer) but vanished with `rm` — because\na container's changes live in its **throwaway writable layer**, not the image. **Containers are\nephemeral.** Anything you need to keep must go in a **volume** (Module 4). This is the single most\nimportant mental shift for using containers correctly.\n\n## Your turn (challenge)\n\nWithout copying the guided exercise: run a **detached** Redis container named `cache`, confirm it's\nhealthy by running a command *inside* it, then remove it — in four commands.\n\n**Verify you succeeded:**\n```bash\ndocker run -d --name cache redis:7 >/dev/null && \\\ndocker exec cache redis-cli ping | grep -q PONG && echo \"PASS ✓ (got PONG)\" || echo \"try again\"\ndocker rm -f cache >/dev/null\n```\n*(Goal: `docker run -d`, then `docker exec cache redis-cli ping` returns `PONG`, then `docker rm\n-f cache`.)*"}, {"id": "03-dockerfiles", "title": "3 · Building images (Dockerfiles)", "group": "Fundamentals", "md": "*The core practitioner skill: packaging your own app. Concepts + a build-it-yourself lab. ~30 min.\nRequires Docker.*\n\n---\n\nA **Dockerfile** is a text recipe listing the steps to build an image. `docker build` runs those\nsteps top to bottom, each producing a layer, and hands you a finished image. This is how you turn\n*your* code into a container.\n\n## The essential instructions\n\n| Instruction | What it does |\n|-------------|--------------|\n| `FROM` | The base image to start from (always first) |\n| `WORKDIR` | Set the working directory for later steps |\n| `COPY` | Copy files from your machine into the image |\n| `RUN` | Execute a command at **build time** (install deps, compile) — creates a layer |\n| `ENV` | Set an environment variable (persists into the running container) |\n| `EXPOSE` | Document which port the app listens on (informational) |\n| `CMD` | The **default command** to run when a container starts |\n| `ENTRYPOINT` | The fixed executable; `CMD` becomes its default arguments |\n\n## A first Dockerfile, explained\n\nSay you have a tiny Node app (`app.js` + `package.json`). The Dockerfile:\n\n```dockerfile\nFROM node:20-slim              # start from a small Node base image\nWORKDIR /app                   # work inside /app in the image\nCOPY package*.json ./          # copy ONLY dependency manifests first (see caching below)\nRUN npm install                # install dependencies at build time -> a layer\nCOPY . .                       # now copy the rest of the source\nEXPOSE 3000                    # document the port\nCMD [\"node\", \"app.js\"]         # what runs when the container starts\n```\n\nBuild and run it:\n\n```bash\ndocker build -t myapp:1.0 .    # -t names/tags the image; \".\" is the build context (this folder)\ndocker run --rm -p 3000:3000 myapp:1.0\n```\n\n## The single most important idea: build cache & layer order\n\nDocker caches each layer. On rebuild, it reuses a cached layer **if that step's inputs haven't\nchanged** — and once one layer misses the cache, every layer after it rebuilds too. So **order your\nDockerfile from least-changing to most-changing.**\n\nThat's why the example copies `package*.json` and runs `npm install` **before** copying the rest of\nthe source:\n\n- Your **dependencies** change rarely → that expensive `npm install` layer stays cached across most\n  rebuilds.\n- Your **source code** changes constantly → put `COPY . .` late, so editing code only invalidates\n  the cheap final layers.\n\nGet this backwards (copy everything, then install) and *every* code edit re-runs `npm install` —\nslow. This ordering trick is the #1 Dockerfile skill.\n\n## CMD vs ENTRYPOINT (the classic confusion)\n\n- **`CMD`** sets the default command, and it's easy to **override** at run time:\n  `docker run myapp echo hi` runs `echo hi` instead.\n- **`ENTRYPOINT`** sets a fixed executable that always runs; anything you pass at run time becomes\n  its **arguments**. Common pattern: `ENTRYPOINT [\"python\", \"app.py\"]` with `CMD [\"--help\"]` as\n  default args.\n\nUse `CMD` alone for simple apps; use `ENTRYPOINT` when the image is really \"a command\" that takes\narguments.\n\n## `.dockerignore` — keep junk out of the build\n\nThe build context (\"`.`\") gets sent to the daemon. Exclude things you don't want copied (and that\nwould bust the cache or bloat the image) with a `.dockerignore` file:\n\n```\nnode_modules\n.git\n*.log\n.env\nDockerfile\n```\n\nAlways add one — it speeds builds and avoids leaking secrets like `.env` into images.\n\n## Lab: build your own image\n\nCreate a folder with these two files:\n\n**`app.py`**\n```python\nimport http.server, socketserver\nPORT = 8000\nclass H(http.server.SimpleHTTPRequestHandler):\n    def do_GET(self):\n        self.send_response(200); self.end_headers()\n        self.wfile.write(b\"Hello from my own Docker image!\\n\")\nwith socketserver.TCPServer((\"\", PORT), H) as httpd:\n    print(f\"serving on {PORT}\"); httpd.serve_forever()\n```\n\n**`Dockerfile`**\n```dockerfile\nFROM python:3.12-slim\nWORKDIR /app\nCOPY app.py .\nEXPOSE 8000\nCMD [\"python\", \"app.py\"]\n```\n\nBuild, run, test:\n\n```bash\ndocker build -t hello-py:1.0 .\ndocker run --rm -p 8000:8000 hello-py:1.0\n# in another terminal:\ncurl localhost:8000        # → Hello from my own Docker image!\n```\n\n### Experiments\n\n1. **Watch the cache.** Rebuild without changes (`docker build -t hello-py:1.0 .`) — every step says\n   `CACHED`, instant. Now edit `app.py`'s message and rebuild — only the layers from `COPY app.py`\n   onward rebuild.\n2. **Override CMD.** `docker run --rm hello-py:1.0 python --version` — runs a different command\n   because `CMD` is easily overridden.\n3. **Add a `.dockerignore`** with `__pycache__` and rebuild — cleaner context.\n\n## Your turn (challenge)\n\nWrite a `Dockerfile` for a tiny Python web app of your own that serves the text `my dockerfile\nworks` on port 8000, build it as `mine:1.0`, and prove it. Order your instructions so a code edit\ndoes **not** re-run dependency install (even though this app has none — practice the habit).\n\n**Verify you succeeded:**\n```bash\ndocker rm -f m 2>/dev/null; docker run -d --name m -p 8000:8000 mine:1.0 >/dev/null && sleep 1 && \\\ncurl -s localhost:8000 | grep -q \"my dockerfile works\" && echo \"PASS ✓\" || echo \"try again\"\ndocker rm -f m >/dev/null\n```\n*(Adapt the lab's `app.py`/`Dockerfile`; change the response text. Rebuild twice and confirm the\nsecond build is fully `CACHED`.)*"}, {"id": "04-data-volumes", "title": "4 · Data: volumes & bind mounts", "group": "Fundamentals", "md": "*Containers are throwaway — so where does data live? Concepts + a lab. ~25 min. Requires Docker.*\n\n---\n\nYou learned in Module 2 that a container's changes vanish when it's removed. That's fine for the\napp itself (rebuild the image), but disastrous for a **database** or **uploaded files**. The fix is\nto store data *outside* the container, in **volumes** or **bind mounts**.\n\n## The three ways storage works\n\n| Kind | Where data lives | Use it for |\n|------|-----------------|-----------|\n| **Container writable layer** | Inside the container (gone on `rm`) | Temporary scratch only |\n| **Named volume** | Managed by Docker, on the host | Databases, persistent app data |\n| **Bind mount** | A specific folder on your host | Live-editing source in dev; config files |\n\n## Named volumes — the default for persistence\n\nA **volume** is storage Docker manages for you, living on the host but referenced by name. It\nsurvives container removal, can be shared between containers, and is the **recommended** way to\npersist data.\n\n```bash\ndocker volume create appdata\ndocker run -d --name db -v appdata:/var/lib/postgresql/data postgres:16\n```\n\n`-v appdata:/var/lib/postgresql/data` mounts the `appdata` volume at Postgres's data directory.\nNow the database files live in the volume, not the container. Remove and recreate the container and\nthe data is still there:\n\n```bash\ndocker rm -f db\ndocker run -d --name db -v appdata:/var/lib/postgresql/data postgres:16   # same data!\n```\n\nManage volumes:\n\n```bash\ndocker volume ls\ndocker volume inspect appdata\ndocker volume rm appdata          # only when no container uses it\n```\n\n## Bind mounts — map a host folder in\n\nA **bind mount** maps an exact folder on *your machine* into the container. Changes flow both ways\nin real time — perfect for **development**, where you want the container to see your code as you\nedit it.\n\n```bash\n# serve the current folder's files with nginx, live\ndocker run -d --name dev -p 8080:80 -v \"$(pwd)\":/usr/share/nginx/html:ro nginx\n```\n\n- `\"$(pwd)\"` — the current host directory (use the full path on Windows).\n- `:ro` — read-only inside the container (drop it for read-write).\n\nEdit a file in that folder and refresh the browser — the change is instant, no rebuild. That's the\ndev superpower of bind mounts.\n\n## Volume vs bind mount — which when?\n\n- **Named volume** → **production data** you want Docker to manage and persist (databases, uploads).\n  Portable, backed up as a unit, not tied to a host path.\n- **Bind mount** → **development** (live code) and injecting **specific host files** (a config file,\n  certificates). Tied to an exact host path.\n\nRule of thumb: *volumes for data the app owns; bind mounts for files you own and want to hand in.*\n\n## Lab: prove persistence\n\n```bash\n# 1. create a volume and write to it from a container\ndocker run --rm -v mydata:/data alpine sh -c \"echo 'persisted!' > /data/note.txt\"\n\n# 2. a DIFFERENT container reads the same volume\ndocker run --rm -v mydata:/data alpine cat /data/note.txt\n# → persisted!      (data outlived the first container)\n\n# 3. bind-mount demo: create a file on the host, see it inside\nmkdir -p site && echo \"<h1>Live edit</h1>\" > site/index.html\ndocker run -d --name live -p 8080:80 -v \"$(pwd)/site\":/usr/share/nginx/html:ro nginx\ncurl localhost:8080          # → Live edit\necho \"<h1>Changed!</h1>\" > site/index.html\ncurl localhost:8080          # → Changed!   (no rebuild, no restart)\n\ndocker rm -f live\ndocker volume rm mydata\n```\n\n### Experiment: a real database that survives\n\n```bash\ndocker run -d --name pg -e POSTGRES_PASSWORD=secret -v pgdata:/var/lib/postgresql/data postgres:16\ndocker exec -it pg psql -U postgres -c \"CREATE TABLE t(x int); INSERT INTO t VALUES(42);\"\ndocker rm -f pg                                   # destroy the container\ndocker run -d --name pg -e POSTGRES_PASSWORD=secret -v pgdata:/var/lib/postgresql/data postgres:16\ndocker exec -it pg psql -U postgres -c \"SELECT * FROM t;\"   # → 42 — data survived!\ndocker rm -f pg && docker volume rm pgdata\n```\n\n## Your turn (challenge)\n\nCreate a named volume `notes`, write a line into it from one container, then read that same line\nfrom a **different** container — proving the data is independent of any single container.\n\n**Verify you succeeded:**\n```bash\ndocker volume create notes >/dev/null\ndocker run --rm -v notes:/d alpine sh -c 'echo \"it persists\" > /d/n.txt'\ndocker run --rm -v notes:/d alpine cat /d/n.txt | grep -q \"it persists\" && echo \"PASS ✓\" || echo \"try again\"\ndocker volume rm notes >/dev/null\n```"}, {"id": "05-networking", "title": "5 · Networking", "group": "Fundamentals", "md": "*How containers talk to the world and to each other. Concepts + a lab. ~25 min. Requires Docker.*\n\n---\n\nContainers are isolated by default — including their networking. Docker gives each a virtual network\ninterface and lets you connect them into virtual networks. Two questions this module answers: *how do\nI reach a container from my laptop?* and *how do two containers talk to each other?*\n\n## Publishing ports — reaching a container from outside\n\nA container's ports are private until you **publish** them with `-p HOST:CONTAINER`:\n\n```bash\ndocker run -d -p 8080:80 nginx     # host :8080  →  container :80\n```\n\nNow `localhost:8080` on your machine reaches port 80 inside the container. Without `-p`, nothing\noutside the container can reach it. You can publish several: `-p 8080:80 -p 8443:443`.\n\n## Docker networks — how containers find each other\n\nBy default, containers you start are attached to the default **bridge** network, but the *magic\nfeature* — automatic name resolution — only works on a **user-defined bridge network**. Create one\nand containers on it can reach each other **by container name**, no IPs needed:\n\n```bash\ndocker network create appnet\ndocker run -d --name db  --network appnet postgres:16 -e POSTGRES_PASSWORD=x\ndocker run -d --name api --network appnet myapi         # can connect to \"db:5432\"\n```\n\nInside `api`, the hostname `db` resolves to the database container automatically. This built-in DNS\nis why you should **always create a user-defined network** for multi-container apps (Compose does\nthis for you — Module 6).\n\n## The network drivers (know these names)\n\n| Driver | What it does |\n|--------|-------------|\n| **bridge** | Default. A private virtual network on one host; containers talk via it. User-defined bridges add name-based DNS. |\n| **host** | The container shares the host's network directly (no isolation, no `-p` needed). Fast, but less isolated. |\n| **none** | No networking at all — fully isolated. |\n| **overlay** | Spans **multiple hosts** (for Docker Swarm / clusters). The idea Kubernetes networking generalizes. |\n\nFor local single-host work you'll use **bridge** (user-defined) almost always.\n\n## How it connects to the outside\n\n- **Outbound** (container → internet) works by default via NAT — a container can `curl` the web with\n  no config.\n- **Inbound** (internet/host → container) requires publishing a port with `-p`.\n\n## Lab: two containers talking\n\nBuild a tiny app that talks to Redis over a user-defined network.\n\n```bash\n# 1. a private network with DNS\ndocker network create appnet\n\n# 2. start Redis on it (no published port needed — only the app talks to it)\ndocker run -d --name redis --network appnet redis:7\n\n# 3. run a throwaway client on the same network and reach redis BY NAME\ndocker run --rm --network appnet redis:7 redis-cli -h redis ping\n# → PONG      (the name \"redis\" resolved to the container)\n```\n\nNow show that name resolution needs the shared network:\n\n```bash\n# a container NOT on appnet cannot resolve \"redis\"\ndocker run --rm redis:7 redis-cli -h redis ping\n# → error: could not connect / name resolution fails\n```\n\n### Experiment: publish vs internal\n\nStart a web app that talks to Redis internally but is reachable from your browser:\n\n```bash\ndocker run -d --name web --network appnet -p 8080:80 nginx   # published to you\n# 'web' can reach 'redis' by name over appnet; you reach 'web' via localhost:8080\ndocker exec web getent hosts redis      # shows redis's internal IP — DNS working\ndocker rm -f web redis && docker network rm appnet\n```\n\n## Practitioner notes\n\n- **Only publish what you must.** A database usually needs no `-p` — only the app talks to it, over\n  the private network. Publishing it exposes it to your whole host/LAN.\n- **Names > IPs.** Container IPs change; always connect by container/service name on a user-defined\n  network.\n- This is exactly the model Kubernetes scales up: every Pod gets an IP, and **Services** give stable\n  names — the same \"talk by name, not IP\" principle you just used.\n\n## Your turn (challenge)\n\nCreate a user-defined network, put two containers on it, and have one reach the other **by name**.\nThen prove a container *not* on that network cannot resolve the name.\n\n**Verify you succeeded:**\n```bash\ndocker network create appnet >/dev/null\ndocker run -d --name redis --network appnet redis:7 >/dev/null\nOK=$(docker run --rm --network appnet redis:7 redis-cli -h redis ping 2>/dev/null)\nBAD=$(docker run --rm redis:7 redis-cli -h redis ping 2>&1 | grep -qi \"could not\\|not known\\|resolve\" && echo blocked)\n[ \"$OK\" = PONG ] && [ \"$BAD\" = blocked ] && echo \"PASS ✓ (name works on net, fails off net)\" || echo \"try again\"\ndocker rm -f redis >/dev/null; docker network rm appnet >/dev/null\n```"}, {"id": "06-docker-compose", "title": "6 · Docker Compose", "group": "Fundamentals", "md": "*Real apps are several containers. Compose runs them together from one file. Concepts + a full lab.\n~30 min. Requires Docker.*\n\n---\n\nTyping long `docker run` commands for a web app + database + cache gets old fast, and you have to\nremember the order, networks, and flags. **Docker Compose** lets you describe the whole stack in one\nYAML file and bring it up with a single command.\n\n## The idea\n\nA `compose.yaml` file lists your **services** (containers), plus their images, ports, environment,\nvolumes, and dependencies. Then:\n\n```bash\ndocker compose up -d      # start the whole stack\ndocker compose down       # stop and remove it\n```\n\nCompose automatically creates a **private network** for the stack (so services reach each other by\nname) and manages volumes — the manual steps from Modules 4–5, done for you.\n\n## A complete example\n\nA web API plus a Postgres database plus a Redis cache:\n\n```yaml\nservices:\n  api:\n    build: .                     # build the image from a Dockerfile here\n    ports:\n      - \"3000:3000\"              # publish to your machine\n    environment:\n      DATABASE_URL: postgres://postgres:secret@db:5432/app   # \"db\" = the service name!\n      REDIS_URL: redis://cache:6379\n    depends_on:\n      - db\n      - cache\n\n  db:\n    image: postgres:16\n    environment:\n      POSTGRES_PASSWORD: secret\n      POSTGRES_DB: app\n    volumes:\n      - pgdata:/var/lib/postgresql/data     # named volume for persistence\n\n  cache:\n    image: redis:7\n\nvolumes:\n  pgdata:                         # declare the named volume\n```\n\nRead it top-down:\n\n- **`services`** — each becomes a container. The **service name** (`api`, `db`, `cache`) is also its\n  **hostname** on the auto-created network — that's why `api` reaches the database at `db:5432`.\n- **`build: .`** vs **`image:`** — build from a local Dockerfile, or pull a prebuilt image.\n- **`depends_on`** — start order (db and cache before api). *Note: it waits for start, not for\n  \"ready\" — for true readiness you add healthchecks, Module 10.*\n- **`volumes:`** (top level) — declares named volumes the services mount.\n\n## The everyday Compose commands\n\n```bash\ndocker compose up -d           # start in background\ndocker compose ps              # what's running in this stack\ndocker compose logs -f api     # follow one service's logs\ndocker compose exec api sh     # shell into a service\ndocker compose build           # rebuild images\ndocker compose restart api     # restart one service\ndocker compose down            # stop + remove containers and network\ndocker compose down -v         # ...and delete named volumes too (data gone!)\n```\n\nCompose is **project-scoped** to the folder — everything is namespaced so multiple stacks don't\ncollide.\n\n## Lab: run a real two-service app\n\nCreate a folder with these files.\n\n**`compose.yaml`**\n```yaml\nservices:\n  web:\n    image: nginx\n    ports:\n      - \"8080:80\"\n    volumes:\n      - ./html:/usr/share/nginx/html:ro\n    depends_on:\n      - redis\n  redis:\n    image: redis:7\n```\n\n**`html/index.html`**\n```html\n<h1>Served by Compose</h1>\n```\n\nBring it up and test:\n\n```bash\ndocker compose up -d\ndocker compose ps                       # web + redis running\ncurl localhost:8080                     # → Served by Compose\n\n# web can reach redis by service name over the auto-created network:\ndocker compose exec web getent hosts redis    # resolves to redis's IP\n\ndocker compose logs redis               # see redis output\ndocker compose down                     # tear it all down cleanly\n```\n\nYou just ran a multi-container app with networking and a bind mount — in two commands.\n\n### Experiments\n\n1. **Scale a service.** `docker compose up -d --scale redis=3` — three redis containers; Compose\n   load-names them. (Stateless services scale trivially; stateful ones need care.)\n2. **Change and reload.** Edit `html/index.html`, `curl` again — instant (bind mount). Change the\n   published port to `8090:80`, `docker compose up -d` — Compose reconciles just that.\n3. **Persist data.** Add a `db` service with a `pgdata` volume (from the example above), `up`, write\n   a row, `down` (without `-v`), `up` again — data survives; `down -v` — data gone.\n\n## Why Compose matters for Kubernetes\n\nA Compose file is a **declarative** description of a whole app: \"here are my services, their config,\nand how they connect — make it so.\" That's the exact mindset Kubernetes uses, just at cluster scale\nwith more power. Many teams prototype with Compose, then translate to Kubernetes manifests. Learning\nCompose is a gentle on-ramp to the declarative thinking the next course is built on.\n\n## Your turn (challenge)\n\nWrite a `compose.yaml` with two services — `web` (nginx on host port 8087) and `cache` (redis) —\nwhere `web` can resolve `cache` by name. Bring it up, prove both, tear it down.\n\n**Verify you succeeded:**\n```bash\ndocker compose up -d >/dev/null 2>&1; sleep 3\nW=$(curl -s -o /dev/null -w \"%{http_code}\" localhost:8087)\nD=$(docker compose exec -T web getent hosts cache >/dev/null 2>&1 && echo ok)\n[ \"$W\" = 200 ] && [ \"$D\" = ok ] && echo \"PASS ✓\" || echo \"try again (web=$W dns=$D)\"\ndocker compose down >/dev/null 2>&1\n```"}, {"id": "07-image-optimization-security", "title": "7 · Image optimization & security", "group": "Practitioner", "md": "*The difference between amateur and production images: small, fast, and secure. Concepts + a lab.\n~30 min. Requires Docker.*\n\n---\n\nA working image isn't a good image. Production images should be **small** (fast to push/pull, less\nto attack), **cached well** (fast builds), and **secure** (no secrets, no root, few packages). This\nmodule is the practitioner content that pays for itself fastest.\n\n## Multi-stage builds — the big one\n\nYour app needs a lot of tooling to *build* (compilers, dev dependencies) but almost none to *run*.\nA **multi-stage build** uses one stage to build and a second, clean stage to hold only the final\nartifact — so the build tools never ship.\n\n```dockerfile\n# ---- stage 1: build ----\nFROM node:20 AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci                       # full dev dependencies\nCOPY . .\nRUN npm run build                # produces /app/dist\n\n# ---- stage 2: runtime (tiny, clean) ----\nFROM nginx:alpine\nCOPY --from=build /app/dist /usr/share/nginx/html   # copy ONLY the built output\n```\n\nThe final image is just nginx + your built files — none of Node, npm, or source. Multi-stage builds\nroutinely cut image size by 80–95%. **This is the top technique to know.**\n\n## Pick a small, appropriate base\n\n- `node:20` (~1 GB) vs `node:20-slim` (~200 MB) vs `node:20-alpine` (~150 MB). Prefer **slim** or\n  **alpine** unless you hit a compatibility issue.\n- **`distroless`** images (Google) contain your app and its runtime but **no shell or package\n  manager** — tiny and hard to attack.\n- **`scratch`** is an empty base — for static binaries (e.g. Go), the whole image can be a few MB.\n\n## Order layers for cache (recap + why it matters here)\n\nFrom Module 3: copy dependency manifests and install **before** copying source, so dependency layers\nstay cached. Good ordering makes CI builds seconds instead of minutes. Also combine related `RUN`\nsteps and clean up in the *same* layer:\n\n```dockerfile\nRUN apt-get update && apt-get install -y --no-install-recommends curl \\\n && rm -rf /var/lib/apt/lists/*      # clean up in the SAME layer, or the files still ship\n```\n\n(Deleting files in a *later* layer doesn't shrink the image — the earlier layer still contains\nthem.)\n\n## Security essentials\n\n- **Don't run as root.** By default containers run as root; a breakout is then root on the host.\n  Add a user:\n  ```dockerfile\n  RUN useradd -m app\n  USER app\n  ```\n- **Never bake secrets into images.** Passwords/keys in a `Dockerfile`, `ENV`, or copied `.env` are\n  baked into layers *forever* and visible with `docker history`. Pass secrets at **run time**\n  (env vars, mounted files, secret managers) — never build time.\n- **Use `.dockerignore`** so `.env`, `.git`, and keys never enter the build context.\n- **Pin base image versions** (and ideally digests) so a moving `latest` can't slip in changes or\n  vulnerabilities.\n- **Scan your images** for known vulnerabilities:\n  ```bash\n  docker scout cves myapp:1.0        # Docker's built-in vulnerability scan\n  ```\n- **Minimize installed packages** — every package is attack surface. Fewer tools = smaller + safer.\n\n## Lab: shrink and harden an image\n\nStart with a naive image and improve it. Given a small static site build, compare a bloated approach\nto a multi-stage one.\n\n```bash\n# naive: full node image just to serve static files (huge)\ncat > Dockerfile.naive <<'EOF'\nFROM node:20\nWORKDIR /app\nCOPY . .\nRUN npm install && npm run build 2>/dev/null || mkdir -p dist && echo \"<h1>hi</h1>\" > dist/index.html\nCMD [\"npx\", \"serve\", \"dist\"]\nEOF\n\n# good: multi-stage, tiny runtime\ncat > Dockerfile.good <<'EOF'\nFROM node:20 AS build\nWORKDIR /app\nCOPY . .\nRUN mkdir -p dist && echo \"<h1>hi</h1>\" > dist/index.html\nFROM nginx:alpine\nCOPY --from=build /app/dist /usr/share/nginx/html\nUSER nginx\nEOF\n\ndocker build -f Dockerfile.naive -t site:naive .\ndocker build -f Dockerfile.good  -t site:good  .\ndocker images | grep site      # compare sizes — 'good' is a fraction of 'naive'\n```\n\n### Experiments\n\n1. **Scan both.** `docker scout cves site:naive` vs `site:good` — the smaller image has far fewer\n   CVEs (less software = less risk).\n2. **Prove secrets leak.** Add `ENV SECRET=hunter2` to a Dockerfile, build, then `docker history\n   --no-trunc <image>` — the secret is visible. Never do this in reality.\n3. **Non-root check.** `docker run --rm site:good whoami` (may need a shell image) vs a root image —\n   confirm the runtime user.\n\n## Your turn (challenge)\n\nBuild an image `safe:1.0` that (a) runs as a **non-root** user and (b) contains **no** baked-in\nsecret. Confirm both.\n\n**Verify you succeeded:**\n```bash\nU=$(docker run --rm safe:1.0 id -u 2>/dev/null)\nLEAK=$(docker history --no-trunc safe:1.0 2>/dev/null | grep -ci \"password\\|secret\\|token\")\n[ -n \"$U\" ] && [ \"$U\" -ne 0 ] && [ \"$LEAK\" -eq 0 ] && echo \"PASS ✓ (uid=$U, no secrets in layers)\" || echo \"try again (uid=$U leaks=$LEAK)\"\n```\n*(Hint: `RUN adduser`/`useradd` then `USER`; never put secrets in `ENV`/`Dockerfile`.)*"}, {"id": "08-buildkit-buildx-multiplatform", "title": "8 · Advanced builds: buildx & multi-arch", "group": "Practitioner", "md": "*The modern build engine and how to produce images that run on any CPU. Concepts + labs. ~30 min.\nRequires Docker (BuildKit ships enabled in current versions).*\n\n---\n\n`docker build` looks simple, but underneath, modern Docker uses a much more capable engine —\n**BuildKit** — driven by a client called **buildx**. Understanding it is what lets you build\n**multi-architecture** images (Intel *and* Apple Silicon/ARM servers), pass **secrets** safely at\nbuild time, and cache dependencies far more aggressively. This is the advanced-build knowledge that\nseparates senior practitioners.\n\n## BuildKit — the engine under `docker build`\n\n**BuildKit** is Docker's build backend (default in current Docker). Versus the old builder it gives\nyou:\n\n- **Parallelism** — independent build stages run at the same time (multi-stage builds get faster).\n- **Better caching** — including external cache and fine-grained `RUN` cache mounts.\n- **Build secrets & SSH** — use credentials during a build *without baking them into the image*.\n- **Multi-platform output** — one build, images for several CPU architectures.\n\nYou're already using it. **buildx** is the CLI front-end that exposes BuildKit's full power:\n`docker buildx build ...` (and plain `docker build` routes through it too).\n\n## Why multi-platform matters\n\nCPUs come in architectures — **`amd64`** (Intel/AMD, most cloud servers and older laptops) and\n**`arm64`** (Apple Silicon Macs, AWS Graviton, Raspberry Pi, and increasingly cloud). An image built\nfor one **won't run** on the other. If you build on an Apple Silicon Mac and deploy to an amd64\nserver, your image can fail with `exec format error`.\n\nA **multi-platform image** bundles builds for several architectures under one tag; the runtime\nautomatically pulls the right one. Publish once, run anywhere.\n\n## Builders and the `docker-container` driver\n\nThe default builder can't produce multi-platform images — you need a builder using the\n`docker-container` driver (which runs BuildKit in a helper container with emulation):\n\n```bash\ndocker buildx create --name multi --driver docker-container --use   # create & select it\ndocker buildx inspect --bootstrap                                    # start it; lists supported platforms\ndocker buildx ls                                                     # your builders\n```\n\n## Building multi-platform images\n\n```bash\n# build for BOTH architectures from one Dockerfile and push the multi-arch image\ndocker buildx build --platform linux/amd64,linux/arm64 \\\n  -t YOURNAME/app:1.0 --push .\n```\n\nKey point: multi-platform results usually go straight to a **registry** (`--push`) because a single\nlocal Docker image store holds one architecture at a time. Emulation (QEMU) lets one machine build\nfor the \"other\" arch.\n\nInspect the result — one tag, multiple architectures:\n\n```bash\ndocker buildx imagetools inspect YOURNAME/app:1.0\n# shows manifests for linux/amd64 and linux/arm64 under one tag\n```\n\n## Build secrets — credentials without baking them in\n\nModule 7 warned: never put secrets in a Dockerfile or `ENV` (they persist in layers). But sometimes\na build *needs* a secret (a private package token). BuildKit's `--secret` mounts it **only for one\n`RUN`**, leaving nothing in the image:\n\n```dockerfile\n# syntax=docker/dockerfile:1\nFROM alpine\nRUN --mount=type=secret,id=npmtoken \\\n    TOKEN=$(cat /run/secrets/npmtoken) && echo \"using $TOKEN to fetch deps\"\n```\n\n```bash\ndocker buildx build --secret id=npmtoken,src=./token.txt -t app .\n# the token is available during that RUN, but never stored in any layer\n```\n\nVerify it's not in the image with `docker history` — it isn't. This is the *correct* way to use a\ncredential at build time.\n\n## Cache mounts — stop re-downloading dependencies\n\nA `RUN --mount=type=cache` persists a directory **across builds** (e.g. the package manager cache),\nso dependencies aren't re-fetched every time even when the layer rebuilds:\n\n```dockerfile\n# syntax=docker/dockerfile:1\nFROM node:20-slim\nWORKDIR /app\nCOPY package*.json ./\nRUN --mount=type=cache,target=/root/.npm npm ci\nCOPY . .\n```\n\nThe npm download cache survives between builds — big speedups in CI.\n\n## `docker buildx bake` — declarative builds\n\nFor multiple images/targets, `bake` builds them from a config file (like Compose, but for builds):\n\n```hcl\n# docker-bake.hcl\ngroup \"default\" { targets = [\"api\", \"web\"] }\ntarget \"api\" { context = \"./api\"; tags = [\"YOURNAME/api:1.0\"]; platforms = [\"linux/amd64\",\"linux/arm64\"] }\ntarget \"web\" { context = \"./web\"; tags = [\"YOURNAME/web:1.0\"] }\n```\n\n```bash\ndocker buildx bake            # builds all targets, parallel, per their config\n```\n\nGreat for CI where you build a whole app's images reproducibly with one command.\n\n## Lab: build a multi-platform image locally\n\n```bash\n# 1. a builder that can do multi-platform\ndocker buildx create --name multi --driver docker-container --use\ndocker buildx inspect --bootstrap | grep -i platforms      # note linux/amd64, linux/arm64, ...\n\n# 2. a trivial image; build for two arches. Without --push, use --output to inspect:\nprintf 'FROM alpine\\nCMD [\"uname\",\"-m\"]\\n' > Dockerfile\ndocker buildx build --platform linux/amd64,linux/arm64 -t demo:multi .   # builds both (needs --push to store as multi-arch)\n\n# 3. build+load a SINGLE arch locally and run it\ndocker buildx build --platform linux/arm64 -t demo:arm --load .\ndocker run --rm demo:arm            # prints aarch64 (arm64) even on an amd64 host, via emulation\n\n# 4. clean up\ndocker buildx rm multi\n```\n\n*(Full multi-arch publishing needs a registry — swap in `--push -t YOURNAME/demo:multi` with your\nDocker Hub name to try the real thing, then `docker buildx imagetools inspect` it.)*\n\n### Experiment: prove a build secret doesn't leak\n\n```bash\necho \"supersecret\" > token.txt\nprintf '# syntax=docker/dockerfile:1\\nFROM alpine\\nRUN --mount=type=secret,id=t cat /run/secrets/t > /dev/null && echo used it\\n' > Dockerfile\ndocker buildx build --secret id=t,src=./token.txt -t sec:demo --load .\ndocker history --no-trunc sec:demo | grep -i supersecret || echo \"secret NOT in image ✓\"\nrm token.txt\n```"}, {"id": "09-registries-distribution", "title": "9 · Registries & distribution", "group": "Practitioner", "md": "*How images get from your machine to everyone else (and to Kubernetes). Concepts + a lab. ~20 min.\nRequires Docker + a free Docker Hub account for the push step.*\n\n---\n\nAn image on your laptop helps only you. A **registry** is a shared store you push images to and\nothers (or servers, or Kubernetes) pull from. This is the \"ship\" in build–ship–run.\n\n## What a registry is\n\nA registry hosts named, tagged images. The big ones:\n\n- **Docker Hub** (`docker.io`) — the default public registry; where `nginx`, `postgres`, etc. live.\n- **GitHub Container Registry** (`ghcr.io`), **GitLab**, cloud registries (**ECR**, **GCR/Artifact\n  Registry**, **ACR**) — often used for private/team images.\n- **Self-hosted** registries for full control.\n\nWhen you `docker pull nginx`, you're really pulling `docker.io/library/nginx:latest` — the registry\nand tag are just defaulted.\n\n## Image names decoded\n\nA fully-qualified name has four parts:\n\n```\n   ghcr.io  /  acme      /  api    :  1.4.2\n   registry    namespace    repo      tag\n```\n\n- **registry** — where it lives (defaults to `docker.io`).\n- **namespace** — the user/org (e.g. your Docker Hub username).\n- **repository** — the image name.\n- **tag** — the version label (defaults to `latest`).\n\nTo push somewhere, your image must be **tagged** with that destination's name.\n\n## The push workflow\n\n```bash\n# 1. log in to the registry\ndocker login                       # Docker Hub (or: docker login ghcr.io)\n\n# 2. tag your local image with your namespace\ndocker tag myapp:1.0 YOURNAME/myapp:1.0\n\n# 3. push it\ndocker push YOURNAME/myapp:1.0\n\n# now anyone (or any server) can:\ndocker pull YOURNAME/myapp:1.0\n```\n\n`docker tag` doesn't copy the image — it adds another name pointing at the same layers. Push uploads\nonly layers the registry doesn't already have (layer sharing again).\n\n## Tagging strategy (a practitioner habit)\n\nGive each build **multiple** meaningful tags:\n\n- A **version** tag (`1.4.2`) — immutable, what you deploy.\n- A **moving** tag (`1.4`, `stable`) — points at the latest patch.\n- Often the **git commit SHA** — perfectly traceable to source.\n\n```bash\ndocker tag myapp:build YOURNAME/myapp:1.4.2\ndocker tag myapp:build YOURNAME/myapp:1.4\ndocker tag myapp:build YOURNAME/myapp:$(git rev-parse --short HEAD)\ndocker push -a YOURNAME/myapp        # push all tags of this repo\n```\n\n**Avoid deploying `latest`** — it's ambiguous and makes rollbacks and debugging painful. Deploy\nspecific version tags (or digests).\n\n## Lab: push and pull your own image\n\n*(Needs a free Docker Hub account; substitute your username for `YOURNAME`.)*\n\n```bash\n# build a trivial image\necho '<h1>My published image</h1>' > index.html\nprintf 'FROM nginx:alpine\\nCOPY index.html /usr/share/nginx/html/\\n' > Dockerfile\ndocker build -t YOURNAME/hello-web:1.0 .\n\n# push it\ndocker login\ndocker push YOURNAME/hello-web:1.0\n\n# prove it's remote: delete locally, then pull it back and run\ndocker rmi YOURNAME/hello-web:1.0\ndocker run --rm -p 8080:80 YOURNAME/hello-web:1.0   # pulled from the registry\ncurl localhost:8080                                  # → My published image\n```\n\nYou just did the full round trip an image takes to production: build → tag → push → pull → run.\n\n### No account? Run a local registry\n\n```bash\ndocker run -d -p 5000:5000 --name registry registry:2\ndocker tag myapp:1.0 localhost:5000/myapp:1.0\ndocker push localhost:5000/myapp:1.0\ndocker pull localhost:5000/myapp:1.0\ndocker rm -f registry\n```\n\n## Why this matters for Kubernetes\n\nKubernetes never builds images — it **pulls them from a registry** and runs them. Every Deployment\nyou write later references an image by `registry/namespace/repo:tag`. Private registries need\nKubernetes **imagePullSecrets**. The tagging discipline you learn here directly determines how clean\nyour Kubernetes rollouts and rollbacks are."}, {"id": "10-debugging-production", "title": "10 · Debugging & production", "group": "Practitioner", "md": "*Running containers well, and fixing them when they break. Concepts + a lab. ~25 min. Requires\nDocker.*\n\n---\n\nGetting a container to run is easy; running it *reliably* and diagnosing it when it fails is the\npractitioner skill. This module covers the production habits and the debugging toolkit.\n\n## Healthchecks — is the app actually working?\n\nA container can be \"running\" while the app inside is broken (deadlocked, not listening). A\n**healthcheck** teaches Docker to test the app itself:\n\n```dockerfile\nHEALTHCHECK --interval=30s --timeout=3s --retries=3 \\\n  CMD curl -f http://localhost:3000/health || exit 1\n```\n\n`docker ps` then shows `healthy`/`unhealthy`, and orchestrators use it to restart or route around\nbad containers. This is the direct ancestor of Kubernetes **liveness/readiness probes**.\n\n## Restart policies — survive crashes and reboots\n\n```bash\ndocker run -d --restart unless-stopped --name api myapi\n```\n\n| Policy | Behavior |\n|--------|----------|\n| `no` | Never restart (default) |\n| `on-failure[:N]` | Restart if it exits non-zero, up to N times |\n| `always` | Always restart (even after daemon reboot) |\n| `unless-stopped` | Like `always`, but not if you manually stopped it |\n\nFor long-running services use `unless-stopped` or `always`.\n\n## Resource limits — don't let one container eat the host\n\n```bash\ndocker run -d --memory 512m --cpus 1.5 --name api myapi\n```\n\n- `--memory 512m` — hard cap; the container is killed (OOM) if it exceeds it.\n- `--cpus 1.5` — at most 1.5 CPU cores' worth.\n\nWithout limits, a runaway container can starve everything else. Setting requests/limits is mandatory\nin production — and, again, a core Kubernetes concept (Module: resources).\n\n## Logging — where output goes\n\nContainers should log to **stdout/stderr** (not files inside the container). Docker captures that,\nand you read it with `docker logs`. In production, a logging **driver** ships those logs to a central\nsystem. The rule: **apps log to stdout; the platform handles the rest.** Twelve-factor apps do this;\nKubernetes assumes it.\n\n## The debugging toolkit\n\nWhen a container misbehaves, in order:\n\n```bash\ndocker ps -a                     # is it running? exited? what code? (Exited (1) = crashed)\ndocker logs <c>                  # what did it say? (usually the answer)\ndocker inspect <c>               # config, mounts, env, network, last stat
