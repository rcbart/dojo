e/exit code\ndocker exec -it <c> sh           # get inside a RUNNING container and poke around\ndocker stats <c>                 # is it starved for CPU/memory?\ndocker events                    # stream of daemon events (starts, dies, OOMs)\n```\n\n### When the container won't even start\n\nIf it exits immediately, you can't `exec` in. Options:\n\n- `docker logs <c>` — the crash reason is almost always here.\n- Override the entrypoint to get a shell instead of the app:\n  ```bash\n  docker run -it --entrypoint sh myimage       # explore the image's filesystem\n  ```\n- Check the exit code in `docker ps -a` (137 = OOM-killed / SIGKILL; 1 = app error).\n\n## Common gotchas\n\n- **\"It exited immediately.\"** A container lives only as long as its main process. If `CMD` runs and\n  returns (e.g. a script that finishes), the container stops. Long-running services must stay in the\n  foreground.\n- **Editing files then losing them.** Changes in the writable layer vanish on `rm` — use volumes.\n- **`localhost` inside a container is the container**, not your host or another container. Use the\n  service/container name on a shared network, or `host.docker.internal` to reach the host from a\n  container (Desktop).\n- **Port already allocated.** Another process/container owns the host port — change the host side of\n  `-p`.\n- **Image changes not taking effect.** You rebuilt but ran the old tag, or the cache served a stale\n  layer — rebuild with the right tag (`--no-cache` to force).\n\n## Lab: diagnose a broken container\n\n```bash\n# 1. a container that crashes on start\ndocker run --name boom alpine sh -c \"echo starting; exit 1\"\ndocker ps -a | grep boom          # Exited (1) — it crashed\ndocker logs boom                  # → starting   (the clue)\n\n# 2. a healthcheck in action\ndocker run -d --name web -p 8080:80 \\\n  --health-cmd=\"curl -f http://localhost:80 || exit 1\" --health-interval=5s nginx\nsleep 8; docker ps                # STATUS shows (healthy)\ndocker inspect --format='{{.State.Health.Status}}' web\n\n# 3. hit a memory limit\ndocker run --rm --memory 16m alpine sh -c \"cat /dev/zero | head -c 100m | tail\" ; echo \"exit: $?\"\n# the container is OOM-killed (exit 137) — the limit worked\n\ndocker rm -f boom web\n```"}, {"id": "13-runtime-security-limits", "title": "10b · Runtime security & limits", "group": "Practitioner", "md": "*What actually contains a container at runtime: users, capabilities, cgroups — and the flags that keep one container from eating the host. ~12 min read.*\n\n---\n\nModule 7 hardened the *image*. This module hardens the *running container* — because \"containers\nare isolated\" is a default, not a guarantee, and every piece of that isolation has a flag that\nloosens or tightens it. Production incidents live in those flags.\n\n## Run as a user, not as root\n\nThe single highest-value fix. By default, the process in a container runs as **root** — and while\nit's root *inside* a namespace, a container-escape bug turns namespace-root into host-root. Deny\nthat outcome in the image:\n\n```dockerfile\nFROM node:22-slim\nRUN useradd --create-home appuser\nUSER appuser\n```\n\nor at run time: `docker run --user 1000:1000 …`. Verify with `docker exec <c> whoami`. If the app\nneeds to bind port 80, don't hand back root — publish `-p 80:8080` and listen on 8080, or grant\njust the one capability (next section). **Rootless mode** goes further: the Docker *daemon* itself\nruns as an unprivileged user, so even a daemon compromise doesn't yield host-root. It has\nlimitations (some networking and storage drivers), but for CI runners and multi-user hosts it's\nworth knowing it exists.\n\n## Capabilities: root, unbundled\n\nLinux splits root's powers into ~40 **capabilities** — bind low ports (`NET_BIND_SERVICE`), change\nfile ownership (`CHOWN`), load kernel modules (`SYS_MODULE`)… Docker grants a default subset;\nthe tightening pattern is drop everything, add back what's proven necessary:\n\n```bash\ndocker run --cap-drop=ALL --cap-add=NET_BIND_SERVICE nginx\n```\n\nAnd the flag to treat as radioactive: **`--privileged`** turns *off* essentially all isolation —\nevery capability, every device, no seccomp. If a README tells you to use it, the README is asking\nyou to run that software as the host. There is almost always a narrower flag (`--cap-add`,\n`--device`) that grants only what's needed.\n\nTwo smaller belts worth wearing: `--security-opt no-new-privileges` stops processes gaining\nprivileges via setuid binaries, and `--read-only` (with `--tmpfs /tmp` for scratch) makes the\ncontainer's filesystem immutable — malware that can't write is malware that mostly can't persist.\n\n## Resource limits: cgroups, and why the default is dangerous\n\nNamespaces control what a container can *see*; **cgroups** control what it can *use*. The default\nis **unlimited** — one leaking process can consume every byte of RAM on the host, and the kernel's\nOOM killer then shoots processes more or less at random, including other containers. Limits turn\n\"the host died\" into \"the bad container died\":\n\n```bash\ndocker run \\\n  --memory=512m --memory-swap=512m \\   # hard RAM cap, no swap escape hatch\n  --cpus=1.5 \\                         # at most 1.5 cores' worth of time\n  --pids-limit=256 \\                   # fork bombs stop at 256 processes\n  myapp\n```\n\nWhat happens at the limit differs, and the difference matters in debugging: hitting the **memory**\ncap kills the container (exit code **137**, OOMKilled — check `docker inspect`); hitting the\n**CPU** cap only *throttles* it — the app gets slow, not dead. So: mysterious 137s → raise or fix\nmemory; mysterious latency with healthy dependencies → check CPU throttling. `docker stats` shows\nlive usage per container; measure before choosing numbers, then set limits a comfortable margin\nabove real usage. These are the same knobs Kubernetes exposes as `resources.requests/limits`\n(Kubernetes course, module 6) — learn the semantics here, reuse them there.\n\n## Logging drivers: where stdout actually goes\n\nYour app logs to stdout (module 10's advice) — but *where does stdout go*? A **logging driver**\ndecides. The default, `json-file`, appends to a file per container **without bound**: the\nclassic slow outage is a host whose disk filled with logs months after deploy. Fix it globally in\n`/etc/docker/daemon.json`:\n\n```json\n{ \"log-driver\": \"local\", \"log-opts\": { \"max-size\": \"20m\", \"max-file\": \"5\" } }\n```\n\n(`local` is the compact, rotating driver; `json-file` accepts the same rotation options. Drivers\nlike `journald`, `syslog`, `fluentd`, `awslogs` ship logs off-host — at which point remember\nmodule 10: logs are part of your attack surface and your data-retention story too.)\n\n## The checklist\n\nEvery production `docker run` (or Compose service) should be able to answer:\n\n- **Who am I?** — a non-root `USER`, ideally with `no-new-privileges`.\n- **What can I do?** — `--cap-drop=ALL` plus explicit adds; never `--privileged`.\n- **What can I use?** — memory, CPU, and pids limits set from measured usage.\n- **What can I write?** — `--read-only` where the app allows, volumes for the rest.\n- **Where do my logs go?** — a rotating or shipping driver, never unbounded files.\n\nFive questions, one line each in Compose — and the difference between an incident that ends at one\ncontainer and one that takes the host."}, {"id": "11-challenges-projects", "title": "11 · Hands-on challenges & projects", "group": "Practitioner", "md": "*Where knowledge becomes skill. Six graded, real-world builds — no step-by-step. Each has clear\nacceptance criteria, a self-check command to verify you passed, and a solution to peek at only after\nyou try. ~90 min total. Requires Docker.*\n\n---\n\nReading and following labs builds recognition; **building things yourself, from a spec, builds\ncompetence** — the kind interviewers and jobs actually test. Do these in order; each pulls together\nseveral modules. Try hard before opening a solution.\n\n> **How to use this module.** Read the goal + acceptance criteria, build it yourself, then run the\n> **Verify** command. If it prints the success line, you passed. Only then compare with the\n> **Solution**.\n\n---\n\n## Challenge 1 — Containerize a static site\n\n**Goal:** package a one-page site into an image and serve it.\n\n**Acceptance criteria:**\n\n- A `Dockerfile` builds an image `mysite:1.0` based on nginx.\n- Your own `index.html` (containing the text `Hello Docker`) is served on container port 80.\n- Running it published to host port 8080 returns your page.\n\n**Verify:**\n```bash\ndocker rm -f c1 2>/dev/null; docker run -d --name c1 -p 8080:80 mysite:1.0 >/dev/null \\\n && sleep 1 && curl -s localhost:8080 | grep -q \"Hello Docker\" \\\n && echo \"PASS ✓\" || echo \"FAIL ✗\"; docker rm -f c1 >/dev/null\n```\n\n**Solution:**\n```bash\necho \"<h1>Hello Docker</h1>\" > index.html\nprintf 'FROM nginx:alpine\\nCOPY index.html /usr/share/nginx/html/index.html\\n' > Dockerfile\ndocker build -t mysite:1.0 .\n```\n\n---\n\n## Challenge 2 — Shrink an app with a multi-stage build\n\n**Goal:** produce a *small* image using a multi-stage build.\n\n**Acceptance criteria:**\n\n- A multi-stage `Dockerfile` (a `build` stage + a slim runtime stage).\n- Final image `tiny:1.0` is **under 70 MB**.\n- Running it prints `built small`.\n\n**Verify:**\n```bash\nSIZE=$(docker image inspect tiny:1.0 --format '{{.Size}}' 2>/dev/null); \\\nOUT=$(docker run --rm tiny:1.0 2>/dev/null); \\\n[ -n \"$SIZE\" ] && [ \"$SIZE\" -lt 73400320 ] && echo \"$OUT\" | grep -q \"built small\" \\\n && echo \"PASS ✓ ($((SIZE/1024/1024)) MB)\" || echo \"FAIL ✗ (size=$SIZE, out=$OUT)\"\n```\n\n**Solution:**\n```dockerfile\n# Dockerfile\nFROM golang:1.22 AS build\nWORKDIR /src\nRUN printf 'package main\\nimport \"fmt\"\\nfunc main(){ fmt.Println(\"built small\") }\\n' > main.go \\\n && CGO_ENABLED=0 go build -o /app main.go\nFROM alpine:3.20\nCOPY --from=build /app /app\nCMD [\"/app\"]\n```\n```bash\ndocker build -t tiny:1.0 .\n```\n*(A static Go binary on Alpine is only a few MB — the build tools never ship.)*\n\n---\n\n## Challenge 3 — A multi-service stack with Compose\n\n**Goal:** run a web app + Redis + Postgres together with Compose, with persistence and a healthcheck.\n\n**Acceptance criteria:**\n\n- A `compose.yaml` with three services: `web` (nginx, published on 8085), `cache` (redis), `db`\n  (postgres with a password and a **named volume** for its data).\n- `web` can resolve `cache` and `db` by name.\n- `db` has a **healthcheck** and reports healthy.\n\n**Verify:**\n```bash\ndocker compose up -d >/dev/null 2>&1; sleep 6\nWEB=$(curl -s -o /dev/null -w \"%{http_code}\" localhost:8085)\nDNS=$(docker compose exec -T web getent hosts db >/dev/null 2>&1 && echo ok)\nHLTH=$(docker compose ps db | grep -qi healthy && echo ok)\nVOL=$(docker compose config --volumes | head -1)\n[ \"$WEB\" = 200 ] && [ \"$DNS\" = ok ] && [ \"$HLTH\" = ok ] && [ -n \"$VOL\" ] \\\n && echo \"PASS ✓\" || echo \"FAIL ✗ (web=$WEB dns=$DNS health=$HLTH vol=$VOL)\"\ndocker compose down -v >/dev/null 2>&1\n```\n\n**Solution:**\n```yaml\n# compose.yaml\nservices:\n  web:\n    image: nginx\n    ports: [\"8085:80\"]\n    depends_on: [db, cache]\n  cache:\n    image: redis:7\n  db:\n    image: postgres:16\n    environment: { POSTGRES_PASSWORD: secret }\n    volumes: [pgdata:/var/lib/postgresql/data]\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U postgres\"]\n      interval: 3s\n      timeout: 3s\n      retries: 5\nvolumes:\n  pgdata:\n```\n\n---\n\n## Challenge 4 — Harden an image\n\n**Goal:** take a naive image and make it non-root and clean.\n\n**Acceptance criteria:**\n\n- Image `hard:1.0` runs as a **non-root** user (uid ≠ 0).\n- A `.dockerignore` exists excluding `.git` and `.env`.\n- The base image is **pinned** to a specific tag (not bare `latest`).\n\n**Verify:**\n```bash\nUID0=$(docker run --rm hard:1.0 id -u 2>/dev/null)\nIGN=$(grep -qE '\\.env' .dockerignore 2>/dev/null && echo ok)\nPIN=$(grep -qE '^FROM .+:.+' Dockerfile && ! grep -qiE '^FROM [^:]+$|:latest' Dockerfile && echo ok)\n[ -n \"$UID0\" ] && [ \"$UID0\" -ne 0 ] && [ \"$IGN\" = ok ] && [ \"$PIN\" = ok ] \\\n && echo \"PASS ✓ (uid=$UID0)\" || echo \"FAIL ✗ (uid=$UID0 ignore=$IGN pin=$PIN)\"\n```\n\n**Solution:**\n```dockerfile\n# Dockerfile\nFROM alpine:3.20\nRUN adduser -D -u 1000 app\nUSER app\nCMD [\"id\"]\n```\n```bash\nprintf '.git\\n.env\\n*.log\\n' > .dockerignore\ndocker build -t hard:1.0 .\n```\n\n---\n\n## Challenge 5 — Data that survives\n\n**Goal:** prove a database's data outlives its container.\n\n**Acceptance criteria:**\n\n- Start Postgres with a **named volume**; create a table with a known row.\n- **Destroy the container** entirely, start a fresh one on the same volume.\n- The row is still there.\n\n**Verify:** *(the steps below ARE the test — the final SELECT must return 42)*\n```bash\ndocker rm -f pg 2>/dev/null; docker volume rm c5 2>/dev/null\ndocker run -d --name pg -e POSTGRES_PASSWORD=x -v c5:/var/lib/postgresql/data postgres:16 >/dev/null\nsleep 6; docker exec pg psql -U postgres -c \"CREATE TABLE t(x int); INSERT INTO t VALUES(42);\" >/dev/null\ndocker rm -f pg >/dev/null                                   # destroy the container\ndocker run -d --name pg -e POSTGRES_PASSWORD=x -v c5:/var/lib/postgresql/data postgres:16 >/dev/null\nsleep 6; docker exec pg psql -U postgres -tAc \"SELECT x FROM t;\" | grep -q 42 \\\n && echo \"PASS ✓ data survived\" || echo \"FAIL ✗\"\ndocker rm -f pg >/dev/null; docker volume rm c5 >/dev/null\n```\n\n**Solution:** the Verify block *is* the solution — the key idea is mounting the **same named volume**\n(`-v c5:/var/lib/postgresql/data`) into the replacement container, so the data (in the volume, not\nthe container) persists.\n\n---\n\n## Challenge 6 (capstone) — Build & publish a multi-arch image\n\n**Goal:** publish a real multi-architecture image to a registry. *(Needs a free Docker Hub account;\nuse your username for `YOU`.)*\n\n**Acceptance criteria:**\n\n- Image `YOU/greet:1.0` built for **both** `linux/amd64` and `linux/arm64`, pushed to Docker Hub.\n- The pushed tag exposes **two** platform manifests.\n- Pulling and running it prints `hello multiarch`.\n\n**Verify:**\n```bash\ndocker buildx imagetools inspect YOU/greet:1.0 2>/dev/null | grep -c \"Platform:\" | \\\n  awk '{ if ($1>=2) print \"PASS ✓ (\"$1\" platforms)\"; else print \"FAIL ✗ (\"$1\")\" }'\ndocker run --rm YOU/greet:1.0 2>/dev/null | grep -q \"hello multiarch\" && echo \"run PASS ✓\"\n```\n\n**Solution:**\n```bash\necho '<none>' >/dev/null\nprintf 'FROM alpine:3.20\\nCMD [\"echo\",\"hello multiarch\"]\\n' > Dockerfile\ndocker buildx create --name multi --driver docker-container --use 2>/dev/null\ndocker login\ndocker buildx build --platform linux/amd64,linux/arm64 -t YOU/greet:1.0 --push .\ndocker buildx rm multi\n```\n\n---\n\n## Where to go from here\n\nIf you completed all six unaided, you can containerize apps, optimize and secure images, run\nmulti-service stacks, persist data, and publish portable images — the working toolkit of a Docker\npractitioner. For more reps: containerize a project of your own (your language, your app), then take\nit into the **Kubernetes course** and run it at scale."}, {"id": "12-next-steps-kubernetes", "title": "12 · From Docker to Kubernetes", "group": "Practitioner", "md": "*The bridge module. What you've mastered, what Docker alone can't do, and exactly how each concept\nmaps into Kubernetes. Concept-only. ~12 min.*\n\n---\n\n## What you can now do\n\nYou can package any app into a small, secure image; run and manage containers; persist data with\nvolumes; connect containers over networks; orchestrate a multi-container app with Compose; push\nimages to a registry; and debug containers in production. That's a genuine, employable Docker skill\nset. Congratulations.\n\n## What Docker alone can't do\n\nDocker (and Compose) runs containers on **one machine**. Real systems need more:\n\n- **Many machines.** Spread containers across a fleet of servers for capacity and resilience.\n- **Self-healing.** If a container or a whole server dies, something must restart/reschedule the work\n  automatically.\n- **Scaling.** Automatically add/remove copies of a service as load changes.\n- **Zero-downtime updates.** Roll out a new version gradually, roll back instantly if it's bad.\n- **Service discovery & load balancing at scale.** Stable names and traffic spreading across many\n  replicas on many hosts.\n- **Declarative desired state.** \"I want 5 healthy replicas of this image\" — and have the system\n  continuously make reality match, forever.\n\nThat job — **orchestrating containers across a cluster** — is exactly what **Kubernetes** does.\n\n## How your Docker knowledge maps to Kubernetes\n\nEverything you learned has a direct Kubernetes counterpart. This table is your head start on the\nnext course:\n\n| Docker concept | Kubernetes counterpart |\n|----------------|------------------------|\n| A running container | A **Pod** (one or more containers, the smallest unit) |\n| `docker run` | A **Deployment** (declares desired replicas, self-heals) |\n| `-p` publish port | A **Service** (stable name + load balancing across pods) |\n| Compose service-to-service DNS | Kubernetes **Service DNS** (same \"talk by name\") |\n| `-e` env vars / config files | **ConfigMaps** and **Secrets** |\n| Named volumes | **PersistentVolumes / PersistentVolumeClaims** |\n| `HEALTHCHECK` | **liveness / readiness probes** |\n| `--memory` / `--cpus` | resource **requests and limits** |\n| `compose.yaml` (declarative stack) | Kubernetes **manifests** (declarative objects) |\n| Registry push/pull | Kubernetes pulls the same images (+ **imagePullSecrets**) |\n| `docker logs` / `exec` / `inspect` | `kubectl logs` / `exec` / `describe` |\n\nNotice the pattern: Kubernetes takes each single-machine Docker idea and makes it **declarative,\nscalable, and self-healing across a cluster.** You're not starting over — you're leveling up the same\nconcepts.\n\n## The mindset shift ahead\n\n- **Imperative → declarative.** Less \"run this container,\" more \"here is the desired state; keep it\n  true.\" (Compose already nudged you this way.)\n- **Pets → cattle.** Individual containers become interchangeable, disposable replicas managed as a\n  group.\n- **One host → a cluster.** Networking, storage, and scheduling become cluster-wide concerns.\n\n## Where to go next\n\nStart the **Kubernetes course**. It opens exactly where this one ends — with the images you now know\nhow to build — and teaches you to run them at scale: Pods, Deployments, Services, config, storage,\nthen production practices (probes, resources, RBAC, network policy), packaging (Helm, Kustomize,\nCI/CD), advanced platform features (ingress, autoscaling, operators), a capstone app, and CKA/CKAD\nexam alignment.\n\nKeep Docker handy — you'll build images throughout the Kubernetes course. The two tools are partners:\n**Docker builds; Kubernetes operates.**\n\n## Course recap — the one-paragraph mental model\n\n**Docker** packages an app and its environment into a layered, read-only **image** (built from a\n`Dockerfile`, stored in a **registry**) and runs it as a lightweight **container** that shares the\nhost OS kernel. You persist data in **volumes**, connect containers over **networks** (talking by\nname), compose multi-container apps declaratively, and harden images with multi-stage builds,\nnon-root users, and no baked-in secrets. Everything that follows in Kubernetes is these same ideas —\nmade declarative, scalable, and self-healing across a whole cluster."}], "quizzes": {"primer-core-concepts": [{"q": "What does 'host' mean in Docker?", "options": ["The machine Docker runs on — your laptop or a server — where containers run", "A website you visit", "The container's main process", "A registry that stores images"], "answer": 0, "why": "The host is the computer running Docker. Containers run 'on the host', and 'localhost' from your shell means this machine.", "whyWrong": ["", "That's a web host in casual speech; in Docker, host means the machine running the Docker engine.", "The main process runs inside a container; the host is the machine underneath all containers.", "Registries store images remotely; the host is the local machine that runs them."]}, {"q": "What is a 'node'?", "options": ["A generic term for one machine in a group; in Docker, a machine running containers", "A single container", "A line of YAML", "A network port"], "answer": 0, "why": "A node is one machine among several. You'll use the word constantly in Kubernetes; in Docker it just means a machine that runs containers.", "whyWrong": ["", "A node is a whole machine; one node can run many containers at once.", "YAML lines configure things; a node is a physical or virtual machine in a group.", "A port is one network endpoint on a machine; the node is the machine itself."]}, {"q": "Why are containers lighter than virtual machines, in kernel terms?", "options": ["Containers share the host's kernel; VMs each ship their own full operating system", "Containers have no files", "VMs don't use CPUs", "Containers run without any operating system at all"], "answer": 0, "why": "A VM virtualizes hardware and runs a whole OS (heavy). A container shares the host's Linux kernel, so it's just isolated processes — light and fast.", "whyWrong": ["", "Containers have full filesystems — image layers plus a writable layer on top.", "VMs absolutely use CPUs; they virtualize hardware, which is exactly why they're heavy.", "Containers still rely on an OS — they share the host's Linux kernel instead of shipping their own."]}, {"q": "Inside a container, what does 'localhost' refer to?", "options": ["The container itself — not your laptop or another container", "Always your physical machine", "The Docker registry", "Every container at once"], "answer": 0, "why": "Each container has its own network identity, so 'localhost' inside it means that container. To reach another container, use its name on a shared network.", "whyWrong": ["", "Each container has its own network namespace, so localhost stops at the container's boundary — it never means your laptop.", "The registry is a remote image store; it has nothing to do with loopback addresses.", "Loopback is private to each container; there's no shared address that reaches them all."]}, {"q": "Image vs container vs instance?", "options": ["Image = read-only blueprint; container = a running instance of an image; 'instance' = one running copy of something", "They are three words for the same file", "An image runs; a container is stored", "An instance is a type of registry"], "answer": 0, "why": "You build an image once and start many containers (instances) from it — like baking many cookies from one cutter.", "whyWrong": ["", "They're distinct things: an image is stored, a container runs, and an instance is one running copy.", "Backwards — images sit on disk read-only; containers are what actually run.", "A registry stores images; 'instance' just means one running copy of something."]}], "08-buildkit-buildx-multiplatform": [{"q": "What is BuildKit?", "options": ["Docker's modern build engine — parallel stages, better caching, build secrets, and multi-platform output; the default builder", "A registry for storing images", "A container orchestrator", "A text editor for Dockerfiles"], "answer": 0, "why": "BuildKit is the backend behind docker build (default in current Docker), exposed via buildx. It's faster and far more capable than the old builder.", "whyWrong": ["", "Registries store built images; BuildKit is the engine that builds them.", "Orchestrating containers is Kubernetes' job; BuildKit only builds images.", "You write Dockerfiles in any editor; BuildKit is what executes them."]}, {"q": "Why build multi-platform images?", "options": ["amd64 and arm64 are incompatible; a multi-arch image runs on both, so you publish once and run anywhere", "To make images larger", "Because Docker requires two images per app", "To avoid using a registry"], "answer": 0, "why": "An image built for one CPU architecture won't run on the other. A multi-arch image bundles both, and the runtime pulls the right one.", "whyWrong": ["", "Size isn't the goal — each platform still pulls only its own architecture's layers.", "Docker has no such rule; multi-arch exists because CPU architectures are incompatible.", "Multi-arch depends on a registry more, not less — that's where the manifest list lives."]}, {"q": "Why do multi-platform builds usually go straight to a registry with --push?", "options": ["The local image store holds one architecture at a time; the registry stores the multi-arch manifest", "Registries build the image for you", "--push is faster than building locally", "Local builds are not allowed"], "answer": 0, "why": "A single local Docker image is one architecture. The multi-arch manifest (linking both) lives in a registry, so you push it directly.", "whyWrong": ["", "The build happens in your builder; the registry just stores the result.", "--push controls where the result goes, not how fast the build runs.", "Local builds are fine (--load for one arch); it's the multi-arch manifest the local store can't hold."]}, {"q": "How do you use a credential at build time without leaking it into the image?", "options": ["RUN --mount=type=secret with --secret — available for that RUN only, never stored in a layer", "Put it in an ENV instruction", "COPY the secret file into the image", "Hard-code it in the Dockerfile"], "answer": 0, "why": "BuildKit build secrets are mounted just for one RUN and never written to a layer, so 'docker history' won't reveal them — unlike ENV/COPY.", "whyWrong": ["", "ENV values are baked into image metadata — anyone can read them with docker history or inspect.", "A copied file lives in a layer forever, even if a later instruction deletes it.", "The Dockerfile usually lands in git, and its values end up in layers — a leak on both fronts."]}, {"q": "What does a 'RUN --mount=type=cache' do?", "options": ["Persists a directory (e.g. the package cache) across builds so dependencies aren't re-downloaded each time", "Deletes the build cache", "Publishes the image", "Runs the container"], "answer": 0, "why": "A cache mount keeps something like the npm/apt cache between builds, so even when the layer rebuilds, deps aren't fetched again — big CI speedups.", "whyWrong": ["", "It preserves a cache directory across builds — the opposite of deleting anything.", "Publishing is docker push / --push; a cache mount only affects the build.", "Nothing runs a container; RUN executes a build step, and the mount just gives it a persistent directory."]}], "11-challenges-projects": [{"q": "Why do build-from-a-spec challenges build skill that guided labs alone don't?", "options": ["You build from a spec without step-by-step guidance — the way real work and interviews test you", "They are shorter than labs", "They avoid using Docker", "They require no thinking"], "answer": 0, "why": "Following steps builds recognition; producing a working result from requirements builds the transferable competence jobs actually test.", "whyWrong": ["", "They usually take longer than labs — the point is depth, not brevity.", "They use Docker heavily; you just don't get the commands handed to you.", "The opposite — unguided problem-solving demands more thinking, and that's what builds skill."]}, {"q": "In the multi-stage challenge, what made the image tiny?", "options": ["A multi-stage build shipping only the final binary on a slim base — no build tools", "Deleting the source after building in the same image", "Using a bigger base image", "Compressing the container at runtime"], "answer": 0, "why": "The build stage compiles; a clean runtime stage copies only the artifact. Build tools and source never ship, so the image is a few MB.", "whyWrong": ["", "Deleting files in a later layer doesn't shrink the image — the earlier layer still carries them.", "A bigger base makes the image bigger; the trick is a minimal runtime base.", "There's no runtime compression; size is fixed by the layers the image ships."]}, {"q": "In the Compose stack challenge, what gave the database persistence and readiness?", "options": ["A named volume for its data and a healthcheck reporting healthy", "Publishing its port to the host", "Running it as root", "Using the latest tag"], "answer": 0, "why": "A named volume keeps the data across container recreation; a healthcheck lets Compose report the DB as truly ready, not just started.", "whyWrong": ["", "Publishing a port exposes the DB to the outside; it does nothing for persistence or readiness.", "Root grants privilege, not persistence — without a volume the data still dies with the container.", "A tag picks which image you run; it can't keep data alive or signal readiness."]}, {"q": "In the persistence challenge, why did the data survive destroying the container?", "options": ["It lived in a named volume mounted into the replacement container, not in the container's writable layer", "Docker automatically backs up containers", "The data was stored in the image", "Containers never lose data"], "answer": 0, "why": "Mounting the same named volume into the new container reattaches the data, which lives independently of any single container.", "whyWrong": ["", "Docker takes no automatic backups; removing a container permanently deletes its writable layer.", "Images are read-only — runtime writes never land in the image.", "Containers lose their writable layer on rm every time; that's exactly why volumes exist."]}, {"q": "In the capstone, what does a multi-arch image let you do?", "options": ["Publish one tag that runs on both amd64 and arm64 — publish once, run anywhere", "Run two containers at once", "Skip the registry", "Avoid writing a Dockerfile"], "answer": 0, "why": "A multi-architecture image serves the correct build to each platform automatically, so the same tag works on Intel and ARM machines.", "whyWrong": ["", "You can run any number of containers from any image; multi-arch is about CPU architectures.", "Multi-arch relies on the registry to hold the manifest list — you push more, not less.", "You still write a Dockerfile; buildx just builds it once per platform."]}], "setup-local-docker": [{"q": "What single application do you install to use Docker locally?", "options": ["Docker Desktop (macOS/Windows) or Docker Engine (Linux)", "Kubernetes", "A virtual machine hypervisor only", "A web browser extension"], "answer": 0, "why": "Docker Desktop bundles the engine and tools on Mac/Windows; on Linux you install Docker Engine directly. That's all you need.", "whyWrong": ["", "Kubernetes is an orchestrator for later; it isn't needed to run Docker locally.", "A hypervisor alone gives you VMs, not Docker; Desktop manages its own VM where one is needed.", "Docker is a native app plus a background engine, not something that lives in a browser."]}, {"q": "What did 'docker run hello-world' actually do?", "options": ["Pulled an image from a registry, created a container from it, and ran it", "Installed Docker", "Started a Kubernetes cluster", "Compiled your source code"], "answer": 0, "why": "It demonstrated the whole pipeline: fetch image → create container → run. --rm then cleaned the container up.", "whyWrong": ["", "Docker was already installed — the command exercised it by pulling and running an image.", "No cluster involved; a single container ran on your one machine.", "hello-world is a prebuilt image; nothing of yours was compiled."]}, {"q": "What does the flag '-p 8080:80' mean?", "options": ["Publish the container's port 80 to your machine's port 8080", "Use 8080 MB of memory", "Run 80 containers on port 8080", "Pause the container for 80 seconds"], "answer": 0, "why": "-p HOST:CONTAINER maps a host port to a container port so you can reach the containerized service from your machine.", "whyWrong": ["", "Memory is set with -m/--memory; -p is purely about network ports.", "-p maps one host port to one container port; it never multiplies containers.", "Pausing is docker pause; these numbers are port numbers, not seconds."]}, {"q": "How do you get a shell inside a running container?", "options": ["docker exec -it <name> bash", "docker run bash", "docker shell <name>", "docker inspect <name>"], "answer": 0, "why": "exec runs a new command in an already-running container; -it makes it interactive so you get a usable shell.", "whyWrong": ["", "docker run starts a brand-new container from an image — it doesn't enter the one already running.", "There is no docker shell command; exec is how you run commands in a live container.", "inspect prints JSON metadata about the container; it never opens a shell."]}, {"q": "Which two commands stop and then remove a container?", "options": ["docker stop <name> then docker rm <name>", "docker pause then docker delete", "docker kill then docker build", "docker down then docker clean"], "answer": 0, "why": "stop halts the container gracefully; rm removes the stopped container. (docker rm -f does both at once.)", "whyWrong": ["", "pause only freezes processes, and docker delete doesn't exist — rm is the removal command.", "kill does stop it (ungracefully), but build creates images; it removes nothing.", "down belongs to Compose and docker clean doesn't exist; cleanup is rm or prune."]}], "primer-what-are-containers": [{"q": "What problem do containers solve?", "options": ["They package an app with everything it needs so it runs the same everywhere", "They make code run faster on the CPU", "They replace the need for a programming language", "They store backups of your data"], "answer": 0, "why": "By bundling app + runtime + libraries + settings, a container behaves identically on any machine — ending 'works on my machine.'", "whyWrong": ["", "Code runs at roughly native speed either way; containers solve consistency, not performance.", "You still write the app in a language; containers just package and run it.", "Containers are ephemeral runtime environments, not backup storage — rather the opposite."]}, {"q": "What is the key difference between a container and a virtual machine?", "options": ["A VM ships a whole guest OS (heavy); a container shares the host OS kernel (light, fast)", "A container ships a whole OS; a VM shares the kernel", "They are the same thing", "A container needs special hardware; a VM doesn't"], "answer": 0, "why": "VMs virtualize hardware and run full OSes (GBs, slow boot). Containers virtualize the OS, sharing the kernel — MBs, millisecond start.", "whyWrong": ["", "That's backwards — the VM carries the full guest OS; the container shares the host kernel.", "They differ fundamentally: VMs virtualize hardware, containers virtualize the OS.", "If anything it's reversed: VMs lean on hardware virtualization support; containers need none."]}, {"q": "What is the difference between an image and a container?", "options": ["An image is the read-only blueprint; a container is a running instance of it", "An image runs; a container is just a file", "They are interchangeable words", "A container builds an image"], "answer": 0, "why": "Image = recipe/blueprint (doesn't run). Container = the blueprint brought to life. One image can spawn many containers.", "whyWrong": ["", "Backwards — the image is the static blueprint; the container is the thing that runs.", "They name different things: stored blueprint versus live instance.", "It flows the other way: images are built from Dockerfiles, and containers are started from images."]}, {"q": "Can you run many containers from one image?", "options": ["Yes — one image, many containers", "No — each image runs exactly one container", "Only if the image is small", "Only on Linux"], "answer": 0, "why": "Like baking many cookies from one cutter, you can start any number of containers from a single image.", "whyWrong": ["", "Images aren't consumed by use — the same read-only image can back unlimited containers.", "Size affects disk and pull time, not how many containers you can start.", "This works on every platform Docker supports; it's core to how images work."]}, {"q": "What is Docker, in one line?", "options": ["The most popular tool for building images and running containers", "A cloud hosting provider", "A programming language", "A type of virtual machine"], "answer": 0, "why": "Docker gives simple commands (build, run) and the image format the industry standardized on.", "whyWrong": ["", "Docker is a tool you run anywhere, including your laptop — it doesn't host anything for you.", "It's tooling around containers; you use it alongside whatever language your app is written in.", "Containers are lighter than VMs precisely because Docker doesn't virtualize hardware."]}], "00-what-is-docker": [{"q": "What are the three stages of the Docker lifecycle?", "options": ["Build an image, ship it to a registry, run it as containers", "Compile, test, delete", "Download, install, uninstall", "Plan, design, deploy"], "answer": 0, "why": "Build (Dockerfile → image), Ship (push to a registry), Run (start containers). Kubernetes scales up the 'run' stage.", "whyWrong": ["", "Compiling and testing belong to your app's CI; Docker's lifecycle is build → ship → run.", "That's installing software on a PC, not the image lifecycle.", "That's generic project management; Docker's concrete stages are build, ship, run."]}, {"q": "What's the difference between the Docker CLI and the daemon?", "options": ["The CLI is what you type; the daemon is the background engine that builds/runs and holds images", "They are the same program", "The CLI runs containers; the daemon is just for logging", "The daemon is the command you type"], "answer": 0, "why": "You type `docker` (CLI), which sends requests over an API to the daemon (dockerd), which does the actual work.", "whyWrong": ["", "They're separate programs: the CLI is a thin client that talks to the dockerd daemon over an API.", "The daemon does all the real work — building, running, storing images; logging is a sliver of it.", "You type docker (the CLI); the daemon, dockerd, runs in the background."]}, {"q": "Why do Docker images run on Kubernetes and other runtimes?", "options": ["They follow the open OCI standard, so any OCI-compatible runtime can run them", "Kubernetes secretly installs Docker on every node", "Images are rewritten for each platform", "They don't — you must rebuild for Kubernetes"], "answer": 0, "why": "The image format and runtime are OCI standards, so images built with Docker run on containerd, CRI-O, Podman, and Kubernetes unchanged.", "whyWrong": ["", "Modern Kubernetes uses containerd or CRI-O directly — no Docker installed on the nodes.", "No rewriting happens; the same OCI image bytes run everywhere.", "No rebuild needed — Kubernetes pulls and runs the exact image you built."]}, {"q": "Docker vs Kubernetes, in one line each?", "options": ["Docker builds/runs containers on a machine; Kubernetes orchestrates many containers across many machines", "Docker is for Windows; Kubernetes is for Linux", "They are competing products that do the same thing", "Kubernetes builds images; Docker runs them"], "answer": 0, "why": "You build with Docker and operate at scale with Kubernetes, which runs the very images Docker builds.", "whyWrong": ["", "Both run everywhere; the real split is single-machine tooling versus cluster orchestration.", "They're complementary layers: Docker builds/runs on one host, Kubernetes coordinates many.", "Backwards — Docker (or your CI) builds images; Kubernetes only pulls and runs them."]}, {"q": "What file is the recipe for building an image?", "options": ["A Dockerfile", "A compose.yaml", "A registry.json", "An image.lock"], "answer": 0, "why": "docker build runs the instructions in a Dockerfile top-to-bottom to produce an image.", "whyWrong": ["", "compose.yaml describes how to run a stack of services, not how to build an image.", "There's no registry.json; registries just store finished images.", "image.lock doesn't exist in Docker; the build recipe is the Dockerfile."]}], "01-images-and-layers": [{"q": "What is a layer in a Docker image?", "options": ["A read-only set of filesystem changes; build instructions stack into layers that combine into the image", "A separate running container", "A network connection between images", "A backup copy of the image"], "answer": 0, "why": "Each instruction records only what changed, as a layer. Stacked via a union filesystem, they present as one image.", "whyWrong": ["", "Containers are runtime instances; layers are static filesystem diffs inside an image.", "Images don't network with each other; layers stack, they don't connect.", "Layers aren't redundancy — each holds different changes, and together they form the one image."]}, {"q": "Give one benefit of layers.", "options": ["Shared/cached storage between images and fast rebuilds via layer caching", "They make containers run as root", "They encrypt your source code", "They remove the need for a registry"], "answer": 0, "why": "Common base layers are stored once and shared; unchanged layers are reused on rebuild, so builds and pulls are fast.", "whyWrong": ["", "The user a container runs as comes from USER/defaults; layers have nothing to do with it.", "Layers are plain content-addressed tarballs — no encryption involved.", "You still push and pull through registries; layers just make those transfers incremental."]}, {"q": "Does the tag 'latest' mean 'the newest version'?", "options": ["No — it's just a default tag; pin a real version in production", "Yes — Docker always resolves it to the newest release", "Yes, but only for official images", "It means the image is broken"], "answer": 0, "why": "'latest' is whatever was last pushed under that tag — not magically newest. Production should pin explicit version tags.", "whyWrong": ["", "Docker never resolves versions — latest is only whatever was most recently pushed to that tag.", "Official images follow the same rule: latest is a convention, not a guarantee, for everyone.", "latest says nothing about quality; it's simply the default tag name."]}, {"q": "Tag versus digest?", "options": ["A tag is a movable human label; a digest is an immutable content hash of an exact image", "A digest is a nickname; a tag is a hash", "They are identical", "A tag is for private images; a digest for public ones"], "answer": 0, "why": "Tags can be repointed; a @sha256 digest always identifies the exact same image — ideal for reproducible deploys.", "whyWrong": ["", "Swapped — the tag is the movable nickname; the digest is the sha256 content hash.", "One can be repointed at new content and the other can't — that difference is the whole point.", "Both apply to any image, public or private; visibility isn't the distinction."]}, {"q": "What happens to an image's layers when a container writes files?", "options": ["The image stays read-only; the container gets a thin writable layer on top", "The image's layers are modified in place", "The write fails — containers can't write", "A new image is automatically pushed"], "answer": 0, "why": "Images are read-only. A running container adds a throwaway writable layer, which is why its changes vanish when it's removed.", "whyWrong": ["", "Image layers are immutable; copy-on-write sends every change to the container's own layer.", "Containers can write freely — into a thin writable layer stacked on the read-only image.", "Nothing is pushed automatically; capturing changes as an image takes an explicit commit or build."]}], "02-lab-run-manage-containers": [{"q": "What's the difference between 'docker run' and 'docker exec'?", "options": ["run creates a new container from an image; exec runs a command in an already-running container", "They are the same", "run is for images; exec is for volumes", "exec creates containers; run inspects them"], "answer": 0, "why": "Use run to start a fresh container; use exec to execute something inside a container that's already up (e.g. a debug shell).", "whyWrong": ["", "They differ: two `run`s give you two containers, while exec steps into one that already exists.", "Both operate on containers; volumes have their own docker volume commands.", "Backwards — run is the creator; inspecting is docker inspect, and exec just runs commands inside."]}, {"q": "What does '-d' do, and when do you want it?", "options": ["Detached/background — for long-running services", "Debug mode — prints extra logs", "Delete the container after exit", "Download the image only"], "answer": 0, "why": "-d runs the container in the background and returns your prompt — right for servers you want to keep running.", "whyWrong": ["", "-d stands for detach, not debug; it changes where the container runs, not what it prints.", "Auto-cleanup on exit is --rm, a different flag.", "Pulling without running is docker pull; -d still starts the container."]}, {"q": "Your first two debugging commands when a container misbehaves?", "options": ["docker logs and docker inspect", "docker build and docker push", "docker network and docker volume", "docker login and docker tag"], "answer": 0, "why": "logs shows what the app said; inspect shows its full config, mounts, env, and last state. Start there.", "whyWrong": ["", "build and push make and publish images — no help for diagnosing a running container.", "Those manage networks and volumes; they don't show what the app said or how it's configured.", "login and tag deal with registries and naming, unrelated to debugging."]}, {"q": "Why did an in-container file edit survive 'start' but not 'rm'?", "options": ["It lived in the container's writable layer; removing the container deletes that layer", "Docker only saves edits on Tuesdays", "The edit was written to the image", "start rebuilds the container from scratch"], "answer": 0, "why": "stop/start keep the same container (and its writable layer). rm destroys the container and its layer — so persist data in volumes.", "whyWrong": ["", "Persistence follows the container lifecycle, not the calendar.", "Images are read-only; runtime edits never touch them.", "start resumes the very same container with its writable layer intact — nothing is rebuilt."]}, {"q": "What does 'docker system prune' do?", "options": ["Removes unused Docker data — stopped containers, dangling images, etc. — to reclaim disk", "Deletes all your images including in-use ones with no warning", "Restarts the Docker daemon", "Publishes your images to a registry"], "answer": 0, "why": "It reclaims space by removing unused resources (it prompts first). Handy when Docker's disk usage grows.", "whyWrong": ["", "It only touches unused resources, and it asks for confirmation first.", "The daemon keeps running; prune only cleans up stored data.", "Publishing is docker push; prune deletes local leftovers instead."]}], "03-dockerfiles": [{"q": "What does each instruction in a Dockerfile roughly produce?", "options": ["A layer; docker build runs the instructions top to bottom", "A separate container", "A new registry", "A network"], "answer": 0, "why": "Instructions like FROM/RUN/COPY each add a layer. The build executes them in order to assemble the image.", "whyWrong": ["", "Containers come from running the finished image; the build itself produces layers.", "Registries are servers you push to — builds never create them.", "Networks are runtime objects made with docker network create, not build output."]}, {"q": "Why copy package.json and install dependencies BEFORE copying the source?", "options": ["So the cached dependency layer is reused unless deps change; source edits don't trigger a reinstall", "Because COPY must come first", "To make the image larger", "It makes no difference"], "answer": 0, "why": "Layer caching: put least-changing steps first. Dependencies rarely change, so that expensive install layer stays cached across code edits.", "whyWrong": ["", "There's no ordering rule for COPY; the ordering here is purely a caching strategy.", "Order doesn't change the final size; it changes which layers the cache can reuse.", "It makes a big difference: with source copied first, every code edit invalidates the install layer."]}, {"q": "CMD versus ENTRYPOINT?", "options": ["CMD is an easily-overridden default command; ENTRYPOINT is a fixed executable that takes run-time args as its arguments", "They are identical", "ENTRYPOINT is overridden by default; CMD is fixed", "CMD runs at build time; ENTRYPOINT at run time"], "answer": 0, "why": "docker run myapp <x> overrides CMD entirely, but is passed as arguments to an ENTRYPOINT. Use ENTRYPOINT when the image *is* a command.", "whyWrong": ["", "They react differently to docker run arguments — CMD is replaced, ENTRYPOINT receives them.", "Swapped: CMD is the easily replaced default; ENTRYPOINT is the fixed part.", "Both take effect at container start; neither runs during the build — that's RUN."]}, {"q": "What is a .dockerignore file for?", "options": ["Excluding files from the build context — faster builds and no leaked secrets/junk", "Listing images to delete", "Ignoring container logs", "Telling Kubernetes which pods to skip"], "answer": 0, "why": "It keeps things like node_modules, .git, and .env out of the build context, speeding builds and preventing secret leaks into images.", "whyWrong": ["", "Deleting images is rmi/prune; .dockerignore only filters the build context.", "It acts at build time; it has no effect on runtime logs.", "Kubernetes never reads it — it's purely a docker build concern."]}, {"q": "What does '-t' do in 'docker build -t name:tag .'?", "options": ["Names and tags the resulting image; '.' is the build context", "Runs the build in a terminal", "Times the build", "Tags a running container"], "answer": 0, "why": "-t assigns a repository:tag to the built image so you can refer to it; the trailing path is the build context sent to the daemon.", "whyWrong": ["", "Builds already print to your terminal; -t stands for tag.", "No timing involved — the flag names the image.", "It tags the image being built; containers aren't tagged at all."]}], "04-data-volumes": [{"q": "Why can't important data live in the container itself?", "options": ["The writable layer is deleted when the container is removed — containers are ephemeral", "Containers have no disk access", "Docker encrypts and hides it", "The data is sent to the registry"], "answer": 0, "why": "A container's changes live in its throwaway writable layer. Removing the container deletes them, so persistent data must live outside.", "whyWrong": ["", "Containers read and write disk freely — the problem is those writes die with the container.", "Nothing is encrypted or hidden; the writable layer is simply deleted on docker rm.", "Registries only receive images you push; runtime data never goes there."]}, {"q": "Named volume versus bind mount — the core difference?", "options": ["A volume is Docker-managed storage referenced by name; a bind mount maps a specific host folder", "A volume maps a host folder; a bind mount is Docker-managed", "They are the same", "A volume is read-only; a bind mount is read-write"], "answer": 0, "why": "Volumes are managed by Docker and portable; bind mounts point at an exact directory on your machine.", "whyWrong": ["", "Swapped: Docker manages volumes; bind mounts are the ones tied to a host path you choose.", "They differ in who picks the location — Docker for volumes, you for bind mounts.", "Either kind can be read-only or read-write; :ro is an option, not a type."]}, {"q": "Which storage type do you use for a production database?", "options": ["A named volume", "A bind mount to /tmp", "The container's writable layer", "None — databases don't persist"], "answer": 0, "why": "Named volumes are Docker-managed, portable, and survive container removal — the recommended home for app data like databases.", "whyWrong": ["", "/tmp is typically wiped on reboot — about the worst home for database files.", "The writable layer is destroyed with the container, taking the database with it.", "Databases absolutely persist — that's their job; they just need storage that outlives containers."]}, {"q": "Which storage type is ideal for live-editing code during development?", "options": ["A bind mount", "A named volume", "A registry", "The image itself"], "answer": 0, "why": "A bind mount maps your source folder into the container so edits appear instantly — no rebuild needed.", "whyWrong": ["", "A named volume hides inside Docker's storage area — awkward to edit from your editor; volumes are for data, not source.", "A registry stores finished images; it can't reflect your keystrokes.", "Code baked into the image needs a rebuild for every change — exactly what live editing avoids."]}, {"q": "What does ':ro' do on a mount?", "options": ["Makes it read-only inside the container", "Rotates the volume", "Marks it as a root-owned mount", "Enables remote access"], "answer": 0, "why": "ro = read-only; the container can read the mounted data but not modify it. Drop it for read-write.", "whyWrong": ["", "There's no rotation concept for mounts; ro abbreviates read-only.", "Ownership comes from the files' uid/gid, not from a mount flag.", "Mount flags are local filesystem semantics; nothing about remote access."]}], "05-networking": [{"q": "What does '-p 8080:80' do?", "options": ["Publishes container port 80 to host port 8080 so you can reach it", "Connects two containers together", "Limits the container to 80 MB of memory", "Opens 8080 ports"], "answer": 0, "why": "Publishing maps a host port to a container port so traffic from your machine reaches the containerized service.", "whyWrong": ["", "Container-to-container traffic uses shared networks and names; -p is for reaching in from the host.", "Memory is -m/--memory; -p only touches ports.", "It maps exactly one host port to one container port — no multiplication."]}, {"q": "On a user-defined bridge network, how do containers find each other?", "options": ["By container name — Docker provides automatic DNS", "By hard-coded IP addresses only", "They can't communicate", "Through the registry"], "answer": 0, "why": "User-defined bridge networks include DNS, so a container can reach another by its name (e.g. connect to 'db').", "whyWrong": ["", "IPs work but change on every restart; built-in DNS by name is the reliable mechanism.", "Containers on the same network talk freely — that's the network's purpose.", "The registry stores images; it plays no part in runtime traffic."]}, {"q": "Why create a user-defined network instead of using the default bridge?", "options": ["Automatic name-based DNS between containers; the default bridge lacks it", "It's faster to type", "The default bridge can't reach the internet", "User-defined networks don't need publishing"], "answer": 0, "why": "Name resolution between containers only works on user-defined networks, which is why multi-container apps should use one.", "whyWrong": ["", "Typing effort is the same; the difference is functional — name resolution.", "The default bridge reaches the internet fine; what it lacks is DNS between containers.", "Publishing is still required for inbound host access on any network type."]}, {"q": "Does a container need '-p' to reach the internet?", "options": ["No — outbound works by default; -p is only for inbound access", "Yes — nothing works without -p", "Only for HTTPS", "Only on Windows"], "answer": 0, "why": "Containers can make outbound connections via NAT out of the box. Publishing (-p) is only needed to accept inbound traffic.", "whyWrong": ["", "Outbound traffic is NATed by default; -p only controls inbound reachability.", "Protocol doesn't matter — all outbound connections work without publishing.", "The behavior is the same on every OS Docker runs on."]}, {"q": "Should a database container usually publish its port?", "options": ["No — only the app needs it over the private network; publishing exposes it unnecessarily", "Yes — always publish every port", "Only in development", "Only if it uses TLS"], "answer": 0, "why": "If only your app talks to the DB, keep it on the private network unpublished. Publishing exposes the database to your whole host/LAN.", "whyWrong": ["", "Publish only what outside clients need; every published port widens your attack surface.", "Even in dev it's optional — the app reaches the DB over the shared network either way.", "TLS encrypts traffic but doesn't reduce exposure; an unpublished port on the private network is safer still."]}], "06-docker-compose": [{"q": "What does 'docker compose up' do that saves you effort?", "options": ["Starts all services and auto-creates their network and volumes — no long docker run commands", "Builds a Kubernetes cluster", "Pushes images to a registry", "Deletes unused images"], "answer": 0, "why": "Compose reads the whole stack from one YAML file and brings it up together, wiring networking and volumes automatically.", "whyWrong": ["", "Compose is single-host; no cluster is created.", "Pushing is a separate command; up creates and starts services.", "Cleanup is prune; up brings things into existence."]}, {"q": "How does the 'api' service reach the database in Compose?", "options": ["By the service name 'db' as a hostname on the auto-created network", "By the database's IP address hard-coded in the app", "Through the host's localhost", "Via the registry"], "answer": 0, "why": "Compose puts services on a shared network with DNS; the service name doubles as its hostname (e.g. db:5432).", "whyWrong": ["", "Container IPs change on every recreation; hard-coding them breaks constantly.", "localhost inside the api container is the api container itself, not the host or the DB.", "The registry distributes images; it can't carry database connections."]}, {"q": "What does 'depends_on' guarantee — and not guarantee?", "options": ["Start order; not that the dependency is actually ready — use healthchecks for readiness", "That the dependency never crashes", "That services share a volume", "Nothing at all"], "answer": 0, "why": "depends_on sequences container startup but doesn't wait for the app inside to be ready. Add healthchecks for true readiness.", "whyWrong": ["", "It has no effect after startup — the dependency can still crash at any time.", "Volume sharing is configured under volumes:, unrelated to depends_on.", "It does guarantee something — creation and start order — it just stops short of readiness."]}, {"q": "What's the danger of 'docker compose down -v'?", "options": ["The -v deletes named volumes — you lose the data", "It publishes your data publicly", "It rebuilds all images from scratch", "Nothing — it's always safe"], "answer": 0, "why": "Plain 'down' removes containers and the network; adding -v also removes named volumes, permanently deleting persisted data.", "whyWrong": ["", "Nothing gets published; the flag deletes local volumes.", "Rebuilding is docker compose build; -v controls volume removal.", "It's destructive: named volumes and the data inside them are gone for good."]}, {"q": "Why is Compose good preparation for Kubernetes?", "options": ["It's declarative — you describe the desired stack and Compose makes it so, the mindset Kubernetes uses", "It is actually Kubernetes", "It runs across many machines like Kubernetes", "It replaces the need to learn Kubernetes"], "answer": 0, "why": "Compose introduces declarative, multi-service thinking. Kubernetes uses the same mindset at cluster scale with more power.", "whyWrong": ["", "They're separate tools; Compose just shares the declarative style.", "Compose stays on one host — spanning machines is exactly what Kubernetes adds.", "Production-scale orchestration still needs Kubernetes; Compose is the on-ramp, not the destination."]}], "07-image-optimization-security": [{"q": "What does a multi-stage build achieve?", "options": ["Builds in one stage and ships only the final artifact in a clean stage — much smaller, no build tools", "Runs the build twice for safety", "Splits the app across multiple containers", "Encrypts the image"], "answer": 0, "why": "A build stage compiles; a slim runtime stage copies only the output. Build tools and source never ship — often 80–95% smaller.", "whyWrong": ["", "Each stage runs once with a different job — compile versus package; nothing repeats for safety.", "Stages exist only during the build; the output is still a single image.", "No encryption happens; the win is size and a smaller attack surface."]}, {"q": "Why delete apt caches in the SAME RUN layer where you install?", "options": ["Deleting in a later layer doesn't shrink the image; the earlier layer still contains the files", "It's faster to type", "apt requires it", "It has no effect either way"], "answer": 0, "why": "Each layer is immutable. Files added in one layer persist even if removed in a later one, so clean up within the same RUN.", "whyWrong": ["", "Typing convenience isn't the point — layer immutability is.", "apt doesn't care; the constraint comes from how image layers store files.", "It matters a lot: cleanup in a separate layer leaves the cache bytes in the image forever."]}, {"q": "Why should you never put secrets in a Dockerfile or ENV?", "options": ["They're baked into layers permanently and visible via docker history; pass secrets at run time", "ENV variables are too slow", "Docker forbids strings in ENV", "It makes the image smaller but insecure"], "answer": 0, "why": "Anything in the image (including build-time ENV) is inspectable forever. Provide secrets at run time via env, mounts, or a secret manager.", "whyWrong": ["", "ENV has zero performance cost; the issue is that its values are permanently readable.", "ENV accepts any string happily — that's the danger, not a restriction.", "Secrets don't shrink anything; they just sit in the layers waiting to be found."]}, {"q": "Why avoid running a container as root?", "options": ["A container breakout would be root on the host; run as a non-root user", "Root containers can't reach the network", "It makes images larger", "Root is not allowed by Docker"], "answer": 0, "why": "Containers run as root by default; adding a USER limits the blast radius if the container is compromised.", "whyWrong": ["", "Networking works identically for any user; the risk is privilege, not connectivity.", "A USER instruction adds essentially nothing to image size either way.", "Root is not only allowed, it's the default — which is exactly why you add USER."]}, {"q": "One command to check an image for known vulnerabilities?", "options": ["docker scout cves <image>", "docker vuln <image>", "docker inspect --security", "docker scan-now"], "answer": 0, "why": "docker scout cves reports known CVEs in an image's packages. Smaller images with fewer packages typically have far fewer.", "whyWrong": ["", "docker vuln doesn't exist; vulnerability scanning lives under docker scout.", "inspect has no --security flag — it dumps object metadata, not CVEs.", "Not a real command; the older docker scan was retired in favor of scout."]}], "09-registries-distribution": [{"q": "What is a registry?", "options": ["A shared store for images that you push to and others/servers/Kubernetes pull from", "A log of every container that has run", "A network between containers", "A type of volume"], "answer": 0, "why": "Registries (Docker Hub, GHCR, ECR, etc.) host named, tagged images so they can travel from your laptop to servers and clusters.", "whyWrong": ["", "Run history lives on each host (docker ps -a); registries never see your containers.", "Networks connect running containers; registries store and serve images.", "Volumes hold runtime data on a host; a registry is a remote image store."]}, {"q": "Decode the image name 'ghcr.io/acme/api:1.4.2'.", "options": ["registry ghcr.io, namespace acme, repository api, tag 1.4.2", "namespace ghcr.io, registry acme, tag api, repo 1.4.2", "It's all just the repository name", "registry acme, tag ghcr.io"], "answer": 0, "why": "Fully-qualified names are registry/namespace/repository:tag. Missing parts default to docker.io and :latest.", "whyWrong": ["", "The order is fixed left to right: registry host, then namespace, then repo, then tag.", "The parts have distinct roles — the slashes and colon split registry/namespace/repo:tag.", "The registry is the hostname up front (ghcr.io), and the tag is what follows the colon."]}, {"q": "Does 'docker tag' copy the image?", "options": ["No — it adds another name pointing at the same layers", "Yes — it duplicates all layers", "Only for public images", "Only across registries"], "answer": 0, "why": "Tagging just creates an additional reference to the same image content; push then uploads only layers the registry lacks.", "whyWrong": ["", "No bytes are copied — both names point at the same content-addressed layers.", "Visibility is irrelevant; tag is a purely local aliasing operation.", "tag never moves data anywhere; transferring between registries takes a push."]}, {"q": "Why avoid deploying the 'latest' tag?", "options": ["It's ambiguous and makes rollbacks/debugging hard; deploy specific version tags", "latest images are always broken", "latest can't be pulled by servers", "It costs more to store"], "answer": 0, "why": "'latest' can point at different content over time, so you can't reliably know or roll back what's deployed. Pin explicit versions.", "whyWrong": ["", "latest images work fine technically; the problem is not knowing which build you're running.", "Servers pull latest without complaint — that's part of the danger.", "Storage cost is identical; the price you pay is traceability."]}, {"q": "Does Kubernetes build images?", "options": ["No — it pulls prebuilt images from a registry and runs them", "Yes — it builds from your Dockerfile on each node", "Only for private images", "Only with Helm"], "answer": 0, "why": "Kubernetes runs images; it doesn't build them. Your CI builds and pushes images, and Kubernetes pulls them by name.", "whyWrong": ["", "Nodes never see your Dockerfile; they receive finished images from the registry.", "Public or private, Kubernetes only pulls — building happens in your CI.", "Helm templates manifests; it doesn't build images either."]}], "10-debugging-production": [{"q": "What does a HEALTHCHECK add over 'the container is running'?", "options": ["It tests the app itself, so Docker knows healthy vs unhealthy — the basis of Kubernetes probes", "It restarts the host", "It scans for vulnerabilities", "It publishes ports automatically"], "answer": 0, "why": "A process can be 'running' but broken. A healthcheck probes the app so orchestrators can restart or route around it.", "whyWrong": ["", "Nothing about health checks touches the host machine.", "CVE scanning is docker scout's job; a healthcheck probes whether the app answers.", "Port publishing is your -p flags; healthchecks only report status."]}, {"q": "Which restart policy suits a long-running service?", "options": ["unless-stopped (or always)", "no", "on-failure:0", "never"], "answer": 0, "why": "unless-stopped restarts the container across crashes and reboots, but respects a manual stop. 'always' is similar but ignores manual stops.", "whyWrong": ["", "'no' is the default do-nothing policy — a crash leaves your service down.", "on-failure:0 means zero retries, so the first crash is final.", "'never' isn't a Docker policy name; the no-restart option is called 'no'."]}, {"q": "Where should containerized apps write their logs?", "options": ["To stdout/stderr — the platform captures and ships them", "To a file inside the container", "To the image's layers", "To the registry"], "answer": 0, "why": "Logging to stdout/stderr lets Docker capture output (docker logs) and lets logging drivers/Kubernetes ship it centrally.", "whyWrong": ["", "In-container files vanish with the container and are invisible to docker logs and log shippers.", "Image layers are read-only at runtime; nothing can log into them.", "The registry only stores images; it never receives runtime output."]}, {"q": "A container exits immediately. What's the first command to run?", "options": ["docker logs <c> — the crash reason is usually there (and docker ps -a shows the exit code)", "docker push <c>", "docker network create", "reinstall Docker"], "answer": 0, "why": "Logs almost always contain the error. ps -a shows the exit code (e.g. 1 = app error, 137 = OOM-killed).", "whyWrong": ["", "Pushing uploads an image — it tells you nothing about why a container died.", "Creating a network changes nothing for a crashed container and reveals nothing.", "The daemon is fine — one crashing container is an app problem, and its logs say why."]}, {"q": "What does exit code 137 usually mean?", "options": ["OOM-killed / SIGKILL — often a memory limit was exceeded", "Success", "The image was not found", "A network timeout"], "answer": 0, "why": "137 = 128 + 9 (SIGKILL). It commonly means the container hit its memory limit and was killed.", "whyWrong": ["", "Success is exit code 0; anything nonzero signals a problem.", "A missing image fails at pull time, before any container exists to have an exit code.", "Timeouts surface as app-level errors; 137 specifically means killed by SIGKILL."]}], "12-next-steps-kubernetes": [{"q": "What's the fundamental limit of Docker/Compose that Kubernetes removes?", "options": ["They run on one machine; Kubernetes orchestrates containers across a cluster of machines", "Docker can't build images", "Compose can't use volumes", "Docker can't run databases"], "answer": 0, "why": "Docker/Compose are single-host. Kubernetes schedules, scales, and self-heals containers across many machines.", "whyWrong": ["", "Building images is precisely Docker's specialty.", "Compose handles volumes fine; its limit is being confined to one host.", "Databases
