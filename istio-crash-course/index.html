el**.\nThat's the headline: mesh security with zero sidecars and zero restarts.\n\n### 3. Prove L4 is working\n\n```bash\nkubectl exec \"$(kubectl get pod -l app=ratings -o jsonpath='{.items[0].metadata.name}')\" \\\n  -- curl -s productpage:9080/productpage | grep -o \"<title>.*</title>\"\n# works, and the ratings→productpage hop is mTLS via ztunnel\n```\n\n### 4. Add a waypoint for L7 features\n\nSuppose you want weighted routing (a canary) on `reviews` — that's L7, so the namespace needs a\nwaypoint:\n\n```bash\nistioctl waypoint apply --namespace default --enroll-namespace\nkubectl get pods                        # a waypoint (Envoy) pod appears for the namespace\n```\n\nNow L7 rules like a VirtualService weighted split (Module 4) are enforced by the waypoint. Apply a\nDestinationRule + a 50/50 VirtualService for `reviews` and it behaves exactly as in sidecar mode —\nbut only this namespace runs an Envoy, and only because it opted into L7.\n\n### Clean up\n\n```bash\nkind delete cluster --name istio-lab\n```\n\n## Sidecar vs ambient — when to pick which\n\n- **Sidecar** — simplest mental model, per-pod isolation, most mature. Good default for small/medium\n  meshes and when you want full L7 everywhere.\n- **Ambient** — lower cost at scale, gradual adoption, painless upgrades. Increasingly preferred for\n  large fleets and mixed workloads.\n\nEither way the **concepts are identical** — you've already learned them; ambient just relocates the\nproxies."}, {"id": "09-gateway-api", "title": "9 · The Kubernetes Gateway API", "group": "Platform", "md": "*The modern, portable way to configure ingress — and increasingly the recommended one. Concepts +\na lab. ~20 min.*\n\n---\n\nIstio has two ways to configure traffic entering the mesh:\n\n1. **Istio's own API** — the `Gateway` + `VirtualService` you learned in Module 3. Istio-specific,\n   very feature-rich.\n2. **The Kubernetes Gateway API** — a *standard*, cross-vendor set of resources that Istio (and\n   Envoy Gateway, Contour, Cilium, etc.) all implement. Same YAML works across implementations.\n\nThe Gateway API is the CNCF-standard successor to the old `Ingress` resource, and Istio fully\nsupports it. For new setups it's often the recommended path because it's portable and cleanly\nsplits responsibilities between teams.\n\n## The resources (and who owns them)\n\n| Resource | Owned by | Means |\n|----------|----------|-------|\n| **GatewayClass** | platform/infra | Which controller implements gateways (Istio installs one) |\n| **Gateway** | platform team | An entry point: listeners, ports, protocols, TLS |\n| **HTTPRoute** | app teams | Routing rules: match paths/headers → backend Services |\n\nNote the clean split: infra owns the **Gateway** (the door), app teams own their **HTTPRoute** (their\nroutes) — the main reason the standard was designed this way.\n\n> **Careful — same word, two meanings.** Istio's `Gateway` (networking.istio.io) and the Gateway\n> API's `Gateway` (gateway.networking.k8s.io) are *different resources*. This module means the\n> Kubernetes **Gateway API** one.\n\n## The same Bookinfo ingress, in Gateway API\n\nCompare to Module 3. A **Gateway** opens the door:\n\n```yaml\napiVersion: gateway.networking.k8s.io/v1\nkind: Gateway\nmetadata:\n  name: bookinfo-gateway\nspec:\n  gatewayClassName: istio           # Istio implements this Gateway\n  listeners:\n  - name: http\n    port: 80\n    protocol: HTTP\n    allowedRoutes:\n      namespaces: { from: Same }\n```\n\nAn **HTTPRoute** provides the rules (this replaces the VirtualService for ingress):\n\n```yaml\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata:\n  name: bookinfo\nspec:\n  parentRefs:\n  - name: bookinfo-gateway          # attach to the Gateway above\n  rules:\n  - matches:\n    - path: { type: Exact, value: /productpage }\n    - path: { type: PathPrefix, value: /static }\n    - path: { type: Exact, value: /login }\n    - path: { type: PathPrefix, value: /api/v1/products }\n    backendRefs:\n    - name: productpage\n      port: 9080\n```\n\n## Lab: expose Bookinfo via the Gateway API\n\nThe Gateway API CRDs may need installing first (Istio's docs command):\n\n```bash\nkubectl get crd gateways.gateway.networking.k8s.io >/dev/null 2>&1 || \\\n  kubectl apply -f \"https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.0/standard-install.yaml\"\n```\n\nApply the bundled sample (Istio ships it):\n\n```bash\nkubectl apply -f samples/bookinfo/gateway-api/bookinfo-gateway.yaml\nkubectl get gateway bookinfo-gateway          # wait for PROGRAMMED=True\n```\n\nIstio auto-provisions an Envoy for this Gateway. Reach it (port-forward the generated service, whose\nname matches the Gateway):\n\n```bash\nkubectl port-forward svc/bookinfo-gateway-istio 8080:80\ncurl -s http://localhost:8080/productpage | grep -o \"<title>.*</title>\"\n# → <title>Simple Bookstore App</title>\n```\n\nSame result as Module 3 — different, portable API.\n\n### Traffic splitting with Gateway API\n\nWeighted canaries work here too, via `backendRefs` weights:\n\n```yaml\nrules:\n- backendRefs:\n  - name: reviews-v1\n    port: 9080\n    weight: 90\n  - name: reviews-v2\n    port: 9080\n    weight: 10\n```\n\nFor advanced Istio-only features (fault injection, mirroring, some policies), you may still reach\nfor a VirtualService — Istio lets you mix both. But basic ingress and splits are fully covered by\nthe standard API.\n\n## Which should you use?\n\n- **Gateway API** — new projects, portability across meshes/gateways, clean team split. The\n  recommended default going forward.\n- **Istio Gateway + VirtualService** — when you need Istio's richer L7 features not yet in the\n  standard, or you're maintaining existing config.\n\nThey interoperate, so it's not an all-or-nothing choice."}, {"id": "10-debugging-gotchas", "title": "10 · Debugging & next steps", "group": "Platform", "md": "*The field guide you'll come back to. Concept-only. ~15 min.*\n\n---\n\nYou now know the whole model: istiod programs Envoy proxies (sidecar or ambient) from your\nVirtualService/DestinationRule/PeerAuthentication/AuthorizationPolicy YAML, giving you traffic\ncontrol, mTLS, and observability. This module is the practical stuff that saves hours.\n\n## The debugging toolkit — four commands\n\nAlmost every Istio problem is diagnosed with these:\n\n- **`istioctl analyze`** — static analysis of your config across the namespace/cluster. Catches\n  dangling references, conflicts, missing subsets, injection issues. **Run this first, always.**\n- **`istioctl proxy-status`** — is every proxy **SYNCED** with istiod? `STALE`/`NOT SENT` means a\n  push isn't landing (often a bad config istiod rejected).\n- **`istioctl proxy-config <listeners|routes|clusters|endpoints|secret> <pod>`** — the *actual*\n  Envoy config a proxy received. When traffic misbehaves, confirm the proxy really has the rule you\n  think it does.\n- **`kubectl logs <pod> -c istio-proxy`** — the sidecar's own logs, including access logs and\n  `RESPONSE_FLAGS` (the same UH/UT/NR codes from the Envoy course).\n\nAdd **Kiali** (visual health/mTLS) and **`istioctl x describe pod <pod>`** (a plain-English summary\nof how a pod is configured) and you can resolve the large majority of issues.\n\n## The gotchas that bite everyone\n\n- **Forgot to label the namespace / labelled it too late.** No sidecar = not in the mesh. Injection\n  happens at pod **creation**; label the namespace *then* `kubectl rollout restart` existing\n  deployments. Symptom: pod shows `1/1`.\n- **DestinationRule subset missing.** A VirtualService routing to `subset: v2` with no matching\n  DestinationRule subset produces **503s**. Define subsets before routing to them. `istioctl analyze`\n  catches this.\n- **Route order.** In a VirtualService, the **first matching** `http` rule wins — specific matches\n  (headers, exact paths) must go **above** catch-alls. The #1 routing surprise.\n- **mTLS mode mismatch.** Setting `STRICT` while a client (a non-mesh pod, a health checker, a\n  Prometheus scrape) still speaks plaintext → connection failures. Roll out STRICT only once\n  everything talking to the workload is meshed; use PERMISSIVE during migration.\n- **AuthorizationPolicy \"deny by accident.\"** An ALLOW policy with `rules: []` allows **nothing**.\n  Adding your first ALLOW policy to a workload implicitly denies everything else to it — intended,\n  but surprising.\n- **`host` naming.** In VirtualService/DestinationRule, short names resolve in the resource's\n  namespace; across namespaces use the FQDN (`reviews.default.svc.cluster.local`). Wrong host =\n  traffic doesn't match.\n- **Gateway selector.** An Istio `Gateway` must `selector` the right ingress proxy\n  (`istio: ingressgateway`), or it configures nothing.\n- **Two `Gateway` kinds.** Mixing up Istio's `Gateway` and the Gateway API `Gateway` (Module 9)\n  leads to confusing \"why isn't my config applied\" moments — check the `apiVersion`.\n- **Ambient: expecting L7 without a waypoint.** In ambient mode, HTTP-level rules need a waypoint;\n  ztunnel alone only does L4/mTLS. No waypoint = your VirtualService split silently doesn't apply.\n\n## A debugging method that works\n\n1. **`istioctl analyze`** — fix anything it flags before going deeper.\n2. **Is the workload in the mesh?** `2/2` (sidecar) or namespace ambient-labelled? `istioctl x describe pod`.\n3. **Is the proxy synced?** `istioctl proxy-status` → SYNCED.\n4. **Does the proxy have the rule?** `istioctl proxy-config routes/clusters <pod>` — verify the\n   route/subset/endpoint actually exists there.\n5. **What does the traffic say?** Sidecar access logs + `RESPONSE_FLAGS` (NR = no route, UH = no\n   healthy upstream, etc.), and Kiali for a visual.\n\nNinety percent of issues fall out by step 4.\n\n## Performance & production notes\n\n- **Right-size the profile.** The `demo` profile is for learning; use `default` or a tuned profile\n  in production, and set proxy resource requests/limits.\n- **Trace sampling.** 100% sampling is fine in dev; lower it in prod (e.g. 1%) to control overhead.\n- **Prefer ambient for large fleets** to cut per-pod proxy overhead; sidecar for maximal per-workload\n  isolation.\n- **Roll out mTLS STRICT gradually** (namespace by namespace) using PERMISSIVE as the bridge.\n- **Keep VirtualServices lean** — prefer header/exact/prefix matches over heavy regex.\n\n## Where to go next\n\n- **Official docs & tasks** — <https://istio.io/latest/docs/> (the \"Tasks\" section is excellent,\n  hands-on, and canonical).\n- **Ambient docs** — <https://istio.io/latest/docs/ambient/> — deployment and migration guides.\n- **Gateway API** — <https://gateway-api.sigs.k8s.io> — the portable ingress standard.\n- **The Envoy course** — to understand what the proxies are actually doing under istiod's\n  instructions, learn the data plane itself.\n- **Practice ideas:** do a full canary rollout (0→100%) on Bookinfo; enforce mesh-wide STRICT mTLS\n  plus per-service AuthorizationPolicies; migrate a namespace from sidecar to ambient; wire an\n  external service in with a `ServiceEntry`.\n\n## Course recap — the one-paragraph mental model\n\n**Istio** is a service mesh: **istiod** (the control plane) watches your Kubernetes objects and\nstreams **Envoy** config + identity certs to a fleet of proxies (the data plane) over **xDS**. Those\nproxies — a **sidecar** in every pod, or a per-node **ztunnel** plus **waypoint** in ambient mode —\ncarry every service-to-service call, giving you **traffic management** (Gateway/VirtualService/\nDestinationRule: routing, canaries, retries, faults), **security** (automatic **mTLS** +\nidentity-based **AuthorizationPolicy**), and **observability** (metrics, traces, and Kiali's live\ngraph) — all declaratively, with no changes to your application code."}], "quizzes": {"setup-local-istio": [{"q": "What does Istio run on top of, and what tool makes a local cluster for this course?", "options": ["Kubernetes; kind makes a throwaway local cluster inside Docker", "A bare web server; npm makes the cluster", "A database; SQL makes the cluster", "Nothing — Istio runs directly on your laptop"], "answer": 0, "why": "Istio is a Kubernetes add-on. kind (Kubernetes-IN-Docker) spins up a real one-node cluster locally so you can install Istio into it.", "whyWrong": ["", "npm manages JavaScript packages — it can't create clusters, and Istio needs Kubernetes underneath, not a bare web server.", "Databases and SQL play no role here; the cluster is a Kubernetes cluster and kind builds it in Docker.", "Istio has no standalone mode — it installs into a Kubernetes cluster, which is exactly why kind exists."]}, {"q": "What does 'istioctl install --set profile=demo' install?", "options": ["The control plane (istiod) plus ingress/egress gateways — the demo profile for learning", "Only a single Envoy proxy with no control plane", "A production-hardened, minimal install", "The Kubernetes cluster itself"], "answer": 0, "why": "The demo profile is 'batteries included' with relaxed resource needs — istiod and gateways — ideal for tutorials, not production.", "whyWrong": ["", "A lone Envoy with no control plane would have nothing programming it; the demo profile ships istiod plus gateways.", "Demo is deliberately roomy and relaxed for learning — the leaner installs are the 'minimal' and 'default' profiles.", "istioctl assumes a cluster already exists; kind created that separately beforehand."]}, {"q": "What does labelling a namespace with 'istio-injection=enabled' do?", "options": ["New pods created there automatically get an Envoy sidecar injected", "It encrypts the namespace's stored data", "It deletes any pods without a sidecar", "It installs Istio into that namespace"], "answer": 0, "why": "The injector webhook watches labelled namespaces and adds the sidecar container to any new pod created there.", "whyWrong": ["", "The label drives sidecar injection; it does nothing to data at rest.", "Existing sidecar-less pods are left alone — they just sit outside the mesh until recreated.", "Istio is installed once, cluster-wide, into istio-system; the label only opts that namespace's new pods into injection."]}, {"q": "Why do the Bookinfo app pods show '2/2' containers?", "options": ["Your app container plus the injected Envoy sidecar proxy", "Two copies of the same app for redundancy", "One container for HTTP and one for HTTPS", "A bug — pods should always be 1/1"], "answer": 0, "why": "2/2 means two containers in the pod: your application and the istio-proxy (Envoy) sidecar that Istio injected.", "whyWrong": ["", "Redundancy comes from Deployment replicas (more pods), not duplicate containers inside one pod.", "One Envoy handles every protocol; there's no per-protocol container split.", "2/2 is the expected state inside the mesh — the second container is the injected sidecar, not a malfunction."]}, {"q": "What does the Kiali dashboard show you?", "options": ["A live graph of which services call which, with traffic rates and health", "The source code of each service", "Your cloud provider's billing", "The Kubernetes node's disk usage only"], "answer": 0, "why": "Kiali visualizes the mesh: nodes for each service, edges for live traffic, health colors, and mTLS padlocks.", "whyWrong": ["", "Kiali watches traffic between services; it never sees or displays source code.", "Kiali reads mesh telemetry, not your cloud provider's billing APIs.", "Node disk usage is generic Kubernetes monitoring; Kiali's whole point is the service-to-service picture."]}], "primer-what-is-istio": [{"q": "In one sentence, what is Istio?", "options": ["A service mesh that manages, secures, and observes traffic between services without changing the services", "A programming language for microservices", "A database that stores service configuration", "A replacement for Kubernetes"], "answer": 0, "why": "Istio makes the network between your services smart and controllable — traffic control, security, and observability — with no app code changes.", "whyWrong": ["", "You keep writing services in whatever language you like; Istio operates on the network between them.", "Istio's config lives in ordinary Kubernetes resources; it isn't a datastore of any kind.", "Istio requires Kubernetes and runs on top of it — it adds a layer rather than replacing one."]}, {"q": "What is the trick that lets Istio add features without changing your code?", "options": ["A proxy next to every service handles all its traffic, so the mesh controls both ends of every call", "It rewrites your source code at compile time", "It requires every service to import an Istio library", "It runs your services on faster hardware"], "answer": 0, "why": "With a proxy on both ends of every call, Istio can encrypt, route, retry, and measure traffic uniformly — the app just makes a normal call.", "whyWrong": ["", "Your source and binaries are untouched — the interception happens at the network layer via the proxy.", "Needing a library in every service is precisely the problem the sidecar model avoids.", "Hardware speed is irrelevant; the features come from mediating traffic, not accelerating it."]}, {"q": "Which proxy does Istio use as its data plane?", "options": ["Envoy — Istio programs a whole fleet of them automatically", "nginx", "HAProxy", "Its own proxy written in Java"], "answer": 0, "why": "Istio is the brain (control plane) that generates config for a fleet of Envoy proxies (the data plane). You never hand-write Envoy config.", "whyWrong": ["", "nginx is a fine proxy, but Istio's data plane is built on Envoy and its dynamic xDS APIs.", "HAProxy isn't live-programmable the way Istio needs; Envoy was designed for exactly this.", "Istio didn't write its own proxy — it adopted Envoy, which is C++ (and istiod is Go)."]}, {"q": "Name the two halves of a mesh and Istio's control-plane component.", "options": ["Data plane = the proxies; control plane = the brain, istiod", "Frontend = the proxies; backend = istiod", "Data plane = istiod; control plane = the proxies", "Client = the proxies; server = istiod"], "answer": 0, "why": "The data plane (Envoy proxies) carries traffic; the control plane (istiod) computes config and pushes it to every proxy live.", "whyWrong": ["", "Frontend/backend describes app tiers, not mesh layers; the split is proxies (data) versus istiod (control).", "That's reversed — the proxies carry the data, istiod does the controlling.", "Client and server are roles in one call; every proxy plays both, and istiod sits above them all."]}, {"q": "Which is something you get 'for free' once Istio is installed?", "options": ["mTLS encryption between services, canary traffic control, retries, and observability", "Automatic bug-free application code", "Free cloud compute", "A new database for each service"], "answer": 0, "why": "Because every call passes through a proxy, the mesh provides encryption, traffic management, resilience, and telemetry without app changes.", "whyWrong": ["", "The mesh handles the network between services; bugs inside your code are still yours.", "Istio consumes compute (the proxies aren't free) — it certainly doesn't provide any.", "Databases are entirely outside Istio's scope."]}], "primer-sidecar-vs-ambient": [{"q": "In sidecar mode, where does the proxy live?", "options": ["Inside every pod, next to the app — a full Envoy sidecar", "Once per cluster, in a central location", "On the client's laptop", "Inside istiod only"], "answer": 0, "why": "Sidecar mode injects a full Envoy into each pod. Every packet in/out of the app detours through its personal proxy.", "whyWrong": ["", "One shared proxy is closer to ambient's ztunnel idea; sidecar mode is defined by the per-pod proxy.", "The mesh lives inside the cluster; nothing runs on client machines.", "istiod is the control plane — it programs proxies but carries no application traffic itself."]}, {"q": "In ambient mode, what are the two proxy layers and what does each do?", "options": ["ztunnel — per-node, handles mTLS/L4 cheaply; waypoint — a full Envoy added per-namespace/service for L7", "A frontend proxy and a backend proxy, both per-pod", "Two sidecars per pod for redundancy", "ztunnel for HTTP and waypoint for TCP, both per-pod"], "answer": 0, "why": "ztunnel (Rust, per-node) does cheap universal encryption + L4. A waypoint (Envoy) is added only where richer L7 features are needed.", "whyWrong": ["", "Ambient splits by layer (L4 vs L7) and placement (node vs namespace), not front-versus-back.", "Ambient's whole point is removing per-pod proxies, not doubling them.", "Inverted and misplaced — ztunnel is the L4 layer, the waypoint handles HTTP, and neither runs per pod."]}, {"q": "What is a big advantage of ambient's ztunnel when you turn it on?", "options": ["It encrypts traffic with no pod restarts, and costs less than a proxy per pod", "It removes the need for Kubernetes", "It makes every pod run twice as fast", "It requires rewriting your apps in Rust"], "answer": 0, "why": "Labelling a namespace enables ztunnel's mTLS instantly with no restarts, and one per-node agent is far cheaper than a proxy in every pod.", "whyWrong": ["", "Kubernetes is still required; ambient only changes where the proxies run.", "ztunnel adds encryption at modest cost; it doesn't accelerate your applications.", "Rust is ztunnel's implementation language — your apps stay exactly as they are."]}, {"q": "Is Envoy still involved in ambient mode?", "options": ["Yes — the waypoint proxy is Envoy; it's just no longer in every pod", "No — ambient mode removes Envoy entirely", "Only on Windows nodes", "Only in the control plane"], "answer": 0, "why": "Envoy remains the L7 engine as the waypoint proxy. Ambient just relocates it out of every pod to where it's actually needed.", "whyWrong": ["", "Envoy is only removed from pods; it returns as the waypoint wherever L7 features are needed.", "The node OS has nothing to do with it; ambient runs on ordinary Linux nodes like the rest of Istio.", "The control plane is istiod; the Envoy in ambient is the waypoint, squarely in the data plane."]}, {"q": "Do Istio concepts like mTLS and VirtualService apply to both modes?", "options": ["Yes — only the plumbing differs; the concepts carry over", "No — ambient mode uses completely different concepts", "Only mTLS applies to both; VirtualService is sidecar-only", "Neither applies to ambient mode"], "answer": 0, "why": "The same objects work in both modes. In ambient, L7 rules are enforced by the waypoint and L4/mTLS by ztunnel.", "whyWrong": ["", "The APIs are shared on purpose — VirtualService, PeerAuthentication and friends work in ambient too.", "VirtualService works in ambient as well; it's enforced by a waypoint instead of a sidecar.", "Both apply: ztunnel provides mTLS everywhere and waypoints enforce the L7 objects."]}], "00-what-is-istio": [{"q": "What are the three things Istio provides?", "options": ["Traffic management, security, and observability", "Compute, storage, and networking hardware", "A compiler, a linker, and a debugger", "Frontend, backend, and database"], "answer": 0, "why": "Everything Istio does falls into these three buckets — control where traffic goes, secure it with mTLS/authz, and observe it.", "whyWrong": ["", "Those are infrastructure resources; Istio is software managing traffic over whatever infra you already have.", "Compiler, linker, and debugger are build tools — Istio never touches your build.", "Frontend/backend/database is an app architecture; Istio's pillars are about the network between services."]}, {"q": "Name the data plane and control plane in Istio.", "options": ["Data plane = Envoy proxies; control plane = istiod", "Data plane = istiod; control plane = Envoy proxies", "Data plane = Kubernetes; control plane = Docker", "They are the same component"], "answer": 0, "why": "Envoy proxies carry the traffic (data plane); istiod computes and pushes their config (control plane).", "whyWrong": ["", "Swapped — istiod is the control-plane brain; the Envoy proxies are the data plane carrying traffic.", "Kubernetes and Docker are the platform underneath; the mesh split is Envoy (data) versus istiod (control).", "They're distinct components: istiod pushes config, the proxies move packets."]}, {"q": "Do you configure Envoy directly when using Istio?", "options": ["No — you write Istio objects, and istiod translates them to Envoy config over xDS", "Yes — you hand-write every proxy's YAML", "Only for the ingress gateway", "Envoy has no configuration"], "answer": 0, "why": "You declare intent as Istio CRDs; istiod discovers services and generates the Envoy config, streaming it to proxies via xDS.", "whyWrong": ["", "Hand-writing every proxy's YAML is exactly the pain Istio removes; istiod generates it all.", "Even the ingress gateway is an istiod-programmed Envoy — you configure it with Gateway and VirtualService.", "Envoy is intensely configurable; that's the whole reason istiod exists to generate its config."]}, {"q": "How does Istio differ from a gateway like Envoy Gateway?", "options": ["A gateway handles edge (in/out) traffic; a mesh also manages traffic between all services", "A gateway is faster but less secure", "They are identical", "A mesh only works at the edge"], "answer": 0, "why": "Gateways cover north-south (edge) traffic. A mesh covers east-west (service-to-service) too — usually with a gateway at the edge as well.", "whyWrong": ["", "Speed and security aren't the axis — the difference is scope: edge-only versus every service-to-service hop.", "A gateway covers only the edge; a mesh adds all the east-west traffic between services.", "The opposite — a mesh's distinguishing feature is covering traffic inside the cluster, well past the edge."]}, {"q": "Give a situation where Istio is overkill.", "options": ["A handful of services, where an edge gateway plus basic retries is simpler", "A bank processing millions of encrypted transactions", "A 500-service platform needing uniform mTLS", "Any system running on Kubernetes"], "answer": 0, "why": "A mesh earns its complexity at scale. For a few services, a single gateway and in-code retries are often enough — though ambient lowers the entry cost.", "whyWrong": ["", "High-volume regulated encryption is the classic case where a mesh earns its complexity.", "Uniform mTLS across hundreds of services is precisely what Istio is for.", "Running Kubernetes doesn't imply a mesh — small clusters often do fine with an ingress and in-code retries."]}], "01-architecture": [{"q": "What are istiod's three jobs?", "options": ["Config/xDS push, certificate authority (identity/mTLS), and sidecar injection webhook", "Storing logs, running databases, and serving web pages", "Compiling code, running tests, and deploying images", "Load balancing, caching, and DNS only"], "answer": 0, "why": "istiod bundles the old Pilot (config/xDS), Citadel (CA/identity), and the injection webhook into one control-plane component.", "whyWrong": ["", "Logs go to your logging stack and databases to your apps — istiod handles config, certificates, and injection.", "Compiling, testing, and deploying is a CI/CD pipeline's job; istiod runs the mesh, not your builds.", "Load balancing happens inside the Envoy proxies istiod programs; caching and DNS aren't istiod's jobs at all."]}, {"q": "How does an app's traffic reach its sidecar without any code changes?", "options": ["An init container sets iptables rules that transparently redirect in/outbound traffic into Envoy", "The app must call the sidecar's API directly", "Istio recompiles the app to add proxy calls", "A human manually reroutes each connection"], "answer": 0, "why": "Transparent interception via iptables (commonly ports 15001 out, 15006 in) means the app is unaware a proxy is in the path.", "whyWrong": ["", "The app never knowingly talks to the sidecar — interception is transparent via iptables.", "No recompilation happens; the redirect is at the network layer with the code untouched.", "It's fully automatic at pod startup via an init container, never a manual operation."]}, {"q": "What does istiod stream to the proxies, and over what protocol?", "options": ["Envoy configuration and certificates, over xDS", "Container images, over HTTP", "Application source code, over SSH", "Database rows, over SQL"], "answer": 0, "why": "istiod pushes generated Envoy config plus identity certs to every proxy using the xDS APIs, updating them live.", "whyWrong": ["", "Container images are pulled by the kubelet from a registry; istiod ships proxy config, not containers.", "istiod never sees your source code; it streams generated Envoy config plus identity certs.", "There's no SQL anywhere in the path — xDS is a gRPC configuration protocol."]}, {"q": "In the mesh, a call from service A to service B is really between what?", "options": ["A's sidecar and B's sidecar — encrypted and policy-checked", "A's app and B's app, directly", "istiod and the Kubernetes API", "The client's browser and B"], "answer": 0, "why": "Every hop is sidecar-to-sidecar (mTLS, observed, authorized). The apps think they talk directly, but the proxies mediate.", "whyWrong": ["", "The apps believe they talk directly, but iptables detours every packet through both sidecars.", "istiod is out-of-band — it programs the proxies but sits on no request path.", "The browser only reaches the edge gateway; inside the mesh the hop in question is proxy-to-proxy."]}, {"q": "What form do all Istio configuration objects take?", "options": ["Kubernetes Custom Resources (CRDs) you apply as YAML, like VirtualService and DestinationRule", "Compiled binaries", "Rows in a SQL database", "Environment variables on each pod"], "answer": 0, "why": "You express intent as Kubernetes CRDs (Gateway, VirtualService, DestinationRule, PeerAuthentication, etc.) and kubectl apply them.", "whyWrong": ["", "Nothing is compiled — it's declarative YAML applied to the Kubernetes API.", "Config lives in the Kubernetes API server as resources, not in a SQL database you manage.", "Env vars configure single containers; mesh-wide intent is expressed as CRDs that istiod watches."]}], "02-lab-install-and-inject": [{"q": "What single thing controls whether a pod gets a sidecar?", "options": ["The namespace's 'istio-injection=enabled' label, applied before the pod is created", "The pod's memory limit", "The container image name", "The node's operating system"], "answer": 0, "why": "The injector webhook adds a sidecar to new pods in labelled namespaces. Existing pods must be recreated to get one.", "whyWrong": ["", "The injector ignores resource limits; only the namespace label matters.", "The webhook doesn't inspect image names — any new pod in a labelled namespace gets the sidecar.", "Injection is decided by an admission webhook at pod creation; the node has no say in it."]}, {"q": "What does '2/2' versus '1/1' tell you about a pod?", "options": ["2/2 = app plus injected istio-proxy sidecar; 1/1 = no sidecar", "2/2 = two apps; 1/1 = one app, both unrelated to Istio", "It refers to CPU cores", "It shows the pod's restart count"], "answer": 0, "why": "The container count reveals the sidecar: 2/2 means your app and the Envoy proxy; 1/1 means the pod isn't in the mesh.", "whyWrong": ["", "The second container is the istio-proxy sidecar, which is entirely about Istio.", "The READY column counts containers, not CPU cores.", "Restarts have their own column; READY is containers-ready over containers-total."]}, {"q": "What does 'istioctl proxy-status' show?", "options": ["Each proxy and whether it is SYNCED with istiod's latest config", "The CPU temperature of each node", "The Git history of your config", "The number of users on the website"], "answer": 0, "why": "proxy-status lists every managed proxy and its sync state. STALE/NOT SENT signals a config push that isn't landing.", "whyWrong": ["", "Hardware telemetry isn't istioctl's domain; proxy-status is about config sync with istiod.", "Git history lives in your repo; this shows each proxy's live xDS sync state.", "Website traffic comes from Prometheus/Kiali; proxy-status is purely control-plane sync."]}, {"q": "Who wrote the listeners/routes/clusters you see with 'istioctl proxy-config'?", "options": ["istiod generated them from discovered services — you didn't write them", "You wrote them by hand in envoy.yaml", "Kubernetes wrote them automatically without Istio", "They are hard-coded into the Envoy image"], "answer": 0, "why": "istiod discovers every service and produces each proxy's Envoy config. proxy-config just shows you what it delivered.", "whyWrong": ["", "There's no envoy.yaml for you to write — istiod generates everything from your CRDs and discovered services.", "Bare Kubernetes produces no Envoy config; kube-proxy works differently, and this is istiod's output.", "The image ships only a bootstrap stub; the real listeners, routes, and clusters arrive from istiod at runtime."]}, {"q": "What identity format does each workload get?", "options": ["A SPIFFE URI, e.g. spiffe://cluster.local/ns/default/sa/…, used for mTLS and authorization", "A random UUID with no meaning", "Its pod IP address", "Its container image digest"], "answer": 0, "why": "istiod's CA issues each workload a SPIFFE identity tied to its ServiceAccount, which mTLS and AuthorizationPolicy use to know who a caller is.", "whyWrong": ["", "The identity is structured and meaningful — cluster, namespace, ServiceAccount — not random.", "Pod IPs churn constantly; identity is deliberately decoupled from addresses.", "Image digests identify code, not the running workload's ServiceAccount-based identity."]}], "03-traffic-gateway-virtualservice": [{"q": "What does an Istio Gateway do versus a VirtualService?", "options": ["Gateway opens the edge door (port/host/protocol); VirtualService decides where matched traffic goes", "Gateway routes traffic; VirtualService opens ports", "They do exactly the same thing", "Gateway stores data; VirtualService encrypts it"], "answer": 0, "why": "A Gateway is the front door (accepts connections). A VirtualService provides the routing rules. You use them together for ingress.", "whyWrong": ["", "Reversed — the Gateway only opens ports and hosts; routing decisions live in the VirtualService.", "They're complementary halves; a Gateway alone routes nothing.", "Neither stores data — the Gateway is the listening door and the VirtualService is the route table."]}, {"q": "If two 'http.match' rules in a VirtualService both match, which wins?", "options": ["The first one listed", "The most specific one", "The last one listed", "Istio returns an error"], "answer": 0, "why": "First match wins (like raw Envoy). Put specific matches above catch-alls or they'll be shadowed.", "whyWrong": ["", "Istio doesn't rank rules by specificity — position in the list is all that matters.", "Last-listed winning would mean catch-alls always shadow everything; it's the first match that takes the traffic.", "Overlapping matches are perfectly legal; Envoy just evaluates them top-down."]}, {"q": "How do you make a VirtualService apply to internal east-west traffic instead of the edge?", "options": ["Bind it to the 'mesh' gateway (or omit gateways) and set hosts to the internal service", "It's impossible — VirtualServices only work at the edge", "Delete the Gateway object", "Add a DestinationRule instead"], "answer": 0, "why": "VirtualServices work east-west too. Without a `gateways` binding to an edge Gateway, the rules apply to in-mesh service-to-service traffic.", "whyWrong": ["", "VirtualServices apply in-mesh by default; binding to an edge Gateway is the optional extra, not the only mode.", "Deleting the Gateway just closes the edge door; it doesn't repoint the rules at east-west traffic.", "DestinationRules define subsets and policy — the routing rules still come from a VirtualService."]}, {"q": "In the lab, why did '/' return 404 but '/productpage' returned 200?", "options": ["Only the paths listed in the VirtualService were routed; others aren't matched", "The backend was down for '/'", "'/' is always blocked by Istio", "The Gateway only allows HTTPS"], "answer": 0, "why": "The VirtualService exposed specific paths. The gateway is a controlled front door — unlisted paths simply don't match a route.", "whyWrong": ["", "The backend was healthy; the request never reached it because no route matched '/'.", "Istio doesn't block '/' specially — it routes only what your VirtualService matches.", "The Gateway accepted plain HTTP fine; the 404 came from route matching, not TLS."]}, {"q": "What tool checks your Istio config for problems?", "options": ["istioctl analyze", "kubectl encrypt", "envoy --validate", "istio-doctor"], "answer": 0, "why": "istioctl analyze statically scans your config for conflicts, dangling references, and common mistakes.", "whyWrong": ["", "kubectl has no 'encrypt' subcommand.", "You never run Envoy by hand under Istio, so a validate flag on it isn't the tool here.", "istio-doctor doesn't exist; the real linter is istioctl analyze."]}], "04-traffic-destinationrule-canary": [{"q": "What does the VirtualService decide versus the DestinationRule?", "options": ["VirtualService = where/which subset and weights; DestinationRule = how (LB, pools, outlier) and it defines the subsets", "VirtualService = encryption; DestinationRule = routing", "They are interchangeable", "VirtualService = clusters; DestinationRule = listeners"], "answer": 0, "why": "VirtualService is the 'where' (routing/splits). DestinationRule is the 'how' (policy) and crucially defines the named subsets you route to.", "whyWrong": ["", "Encryption isn't the split — the VirtualService picks where traffic goes, the DestinationRule sets how it's treated.", "They're complementary, not interchangeable — a VirtualService routes to subsets only a DestinationRule can define.", "Listeners and clusters are Envoy internals; both CRDs sit a level above that."]}, {"q": "Why must a DestinationRule exist before you route traffic to 'v2'?", "options": ["It defines subset v2 by pod label; a VirtualService can only target subsets that are defined", "It encrypts v2's traffic first", "It creates the v2 pods", "It isn't required at all"], "answer": 0, "why": "Subsets (versions) are declared in the DestinationRule. Routing to an undefined subset yields 503s.", "whyWrong": ["", "A DestinationRule can carry TLS settings, but routing needs it for subset definitions, not encryption.", "Pods come from Deployments; the DestinationRule only groups existing pods into named subsets by label.", "It is required — routing to an undefined subset produces 503s."]}, {"q": "How do you do a 50/50 canary split between two versions?", "options": ["Two route destinations to different subsets, each with weight: 50", "Two separate Gateways", "Set replicas to 50 on each Deployment", "Apply the same VirtualService twice"], "answer": 0, "why": "Weighted routing: list both subset destinations in the VirtualService with weights that sum to 100 (e.g. 50/50), then shift over time.", "whyWrong": ["", "Gateways open doors; they don't split traffic between versions.", "Replica ratios give only rough, accidental balance — weights give an exact, instantly adjustable split.", "Applying the same VirtualService twice just overwrites it; the weights inside one VS do the splitting."]}, {"q": "How do you send only user 'jason' to v2 while everyone else stays on v1?", "options": ["A VirtualService match on the 'end-user: jason' header routing to subset v2, with a default route to v1", "Delete all v1 pods", "A DestinationRule with a jason subset", "An AuthorizationPolicy allowing jason"], "answer": 0, "why": "Header-based routing: a match rule for the end-user header targets v2; a fallback route sends everyone else to v1.", "whyWrong": ["", "Deleting v1 sends everyone to v2 — the opposite of a targeted test.", "A DestinationRule defines subsets by pod labels, not by calling user; user matching happens in the VirtualService.", "AuthorizationPolicy allows or denies requests — it never routes anyone to a different version."]}, {"q": "Name one thing a DestinationRule 'trafficPolicy' controls.", "options": ["Load-balancer algorithm, connection-pool limits, or outlier detection", "The pod's container image", "The namespace label", "The Gateway's port number"], "answer": 0, "why": "trafficPolicy sets how to talk to a destination — LB algorithm, connection pools, outlier detection, TLS — for the host or per subset.", "whyWrong": ["", "Container images belong to the Deployment spec.", "Namespace labels control injection, not per-destination connection behavior.", "Ports are opened on the Gateway; trafficPolicy governs how proxies talk to a destination."]}], "05-resilience-fault-injection": [{"q": "Where do you set a request timeout — VirtualService or DestinationRule?", "options": ["VirtualService (on the route)", "DestinationRule", "PeerAuthentication", "The Gateway"], "answer": 0, "why": "Timeouts and retries are route behavior, set in the VirtualService. Connection pools and outlier detection live in the DestinationRule.", "whyWrong": ["", "The DestinationRule holds connection-level policy like pools and outlier detection; per-request timeouts sit on the VS route.", "PeerAuthentication sets mTLS mode and has nothing to do with timing.", "The Gateway opens ports; it carries no per-route timeout settings."]}, {"q": "What does 'outlierDetection' do?", "options": ["Ejects a pod that returns repeated errors, routing around it — passive health checking", "Detects unusual login attempts", "Finds slow database queries", "Removes duplicate config objects"], "answer": 0, "why": "Outlier detection watches real responses and pulls a misbehaving endpoint out of rotation for a cooldown, then tentatively returns it.", "whyWrong": ["", "It watches backend endpoints' error rates, not user logins or authentication.", "Query performance is invisible to the proxy; it only sees each endpoint's responses.", "Config hygiene is istioctl analyze's job; outlier detection acts on live traffic."]}, {"q": "What is the risk of aggressive retries?", "options": ["They multiply load; only retry idempotent calls and keep attempts modest", "They encrypt traffic twice", "They delete data", "They have no downside"], "answer": 0, "why": "Each retry is another request. Too many can amplify load on an already-struggling service, and non-idempotent calls can cause duplicates.", "whyWrong": ["", "Retries don't touch encryption; the danger is load amplification.", "Retries delete nothing themselves — the real hazards are extra load and duplicated non-idempotent writes.", "They're double-edged: every attempt is real load on a possibly already-struggling service."]}, {"q": "What is fault injection for?", "options": ["Deliberately adding delays/errors to verify callers handle failure — chaos testing — without touching real services", "Fixing broken YAML automatically", "Speeding up slow services", "Encrypting traffic"], "answer": 0, "why": "Fault injection makes the proxy fabricate delays or aborts so you can test resilience (timeouts, retries, UI degradation) safely.", "whyWrong": ["", "It breaks things on purpose; it never repairs YAML.", "It adds delays and errors — the opposite of an accelerator — to see how callers cope.", "Encryption is mTLS's job; fault injection is for testing failure handling."]}, {"q": "Does the backend service see an injected fault?", "options": ["No — the proxy fabricates the delay or abort; the backend never receives it", "Yes — the fault is sent to the backend", "Only for delays, not aborts", "Only if mTLS is disabled"], "answer": 0, "why": "Injection happens at the proxy. For an abort, the caller gets the error without the request ever reaching the backend.", "whyWrong": ["", "Both kinds are fabricated at the proxy — for aborts the backend never receives the request at all.", "Delays are also imposed by the proxy in the request path, not by the backend.", "mTLS is orthogonal; injection happens in the proxy either way."]}], "06-security-mtls-authz": [{"q": "What does the 'mutual' in mTLS add over normal HTTPS?", "options": ["Both ends present and verify certificates — the client is authenticated too, not just the server", "It uses a longer encryption key", "It makes traffic faster", "It removes the need for certificates"], "answer": 0, "why": "Regular HTTPS authenticates only the server. mTLS authenticates both sides, so each service cryptographically proves its identity.", "whyWrong": ["", "Key length isn't the distinction; the added piece is verifying the client's certificate too.", "mTLS adds a little handshake cost if anything; the win is identity, not speed.", "It needs more certificates, not fewer — one for each side."]}, {"q": "What is the difference between PERMISSIVE and STRICT mTLS mode?", "options": ["PERMISSIVE accepts both mTLS and plaintext (for gradual adoption); STRICT rejects plaintext", "PERMISSIVE is encrypted; STRICT is not", "They are the same", "STRICT allows plaintext; PERMISSIVE blocks it"], "answer": 0, "why": "PERMISSIVE eases migration by accepting both. Once everything is meshed, switch to STRICT so only encrypted mTLS traffic is allowed.", "whyWrong": ["", "Both modes encrypt mesh-to-mesh traffic; the difference is whether plaintext from others is also accepted.", "They differ exactly in plaintext handling — that difference is the whole migration story.", "Backwards — STRICT is the mode that refuses plaintext."]}, {"q": "What does an AuthorizationPolicy match a caller on?", "options": ["SPIFFE principals tied to Kubernetes ServiceAccounts — cryptographically proven by mTLS", "The caller's browser user-agent", "A password in the request body", "The caller's pod name only"], "answer": 0, "why": "Authz uses the mTLS-verified identity (SPIFFE principal), plus optional namespace, path, method, or JWT claims — proven, not spoofable.", "whyWrong": ["", "User-agent is a spoofable request header; identity comes from verified certificates.", "No passwords are involved; the proxy checks the mTLS peer certificate.", "Pod names churn with every restart; policies bind to stable ServiceAccount-based principals."]}, {"q": "With no AuthorizationPolicy on a workload, what is allowed?", "options": ["Everything — policies are additive; adding an ALLOW policy restricts to what's listed", "Nothing — all traffic is denied by default", "Only GET requests", "Only traffic from the same namespace"], "answer": 0, "why": "Default is allow-all. Your first ALLOW policy on a workload implicitly denies everything else to it (an ALLOW with empty rules allows nothing).", "whyWrong": ["", "Deny-by-default only kicks in once a workload has its first ALLOW policy.", "No method filtering exists until a policy says so.", "Namespace isn't restricted by default either — with no policy, anyone in the mesh can call the workload."]}, {"q": "Why is identity-based authorization stronger than IP allowlists?", "options": ["Identity is cryptographically proven by mTLS and doesn't change with pod IPs", "IP addresses are encrypted and identities are not", "Allowlists are slower to type", "It isn't stronger; they're equivalent"], "answer": 0, "why": "Pod IPs churn and can be spoofed; a SPIFFE identity is verified by mTLS certificates, giving stable, forgery-resistant access control.", "whyWrong": ["", "Neither is 'encrypted' as such; the point is identities are cryptographically verified and stable.", "Typing effort isn't the argument — IP churn and spoofability are.", "They're not equivalent: IPs get reused and spoofed, while SPIFFE identities are proven on every handshake."]}], "07-observability-kiali-telemetry": [{"q": "Match the tool to its job: Prometheus, Grafana, Kiali, Jaeger.", "options": ["Prometheus stores metrics; Grafana graphs them; Kiali maps the services; Jaeger shows per-request traces", "They all do the same thing", "Prometheus draws graphs; Grafana stores traces; Kiali stores metrics; Jaeger maps services", "Kiali stores metrics; Jaeger graphs them; Prometheus maps services; Grafana traces"], "answer": 0, "why": "Prometheus = metric store, Grafana = dashboards, Kiali = live service graph, Jaeger = distributed traces of individual requests.", "whyWrong": ["", "Each tool has a distinct role — storage, dashboards, topology, traces — deliberately composed.", "That scrambles the roles: Prometheus stores, Grafana graphs, Kiali maps, Jaeger traces.", "Also scrambled — Kiali doesn't store metrics and Grafana doesn't hold traces."]}, {"q": "Which 'golden signals' do the sidecars emit for free?", "options": ["Request rate, errors, and duration/latency (plus saturation)", "CPU model, RAM brand, and disk maker", "Source code size and commit count", "Only the number of pods"], "answer": 0, "why": "Every proxy reports rate, error fraction, and latency percentiles consistently across all services and languages — no app instrumentation.", "whyWrong": ["", "Hardware inventory isn't something the proxies emit; they report traffic behavior.", "Code size and commits live in your repo tooling; the sidecars see requests, not source.", "Pod counts come from Kubernetes itself; the proxies add rate, errors, and latency."]}, {"q": "What is the one thing your apps must do for distributed tracing to link the hops?", "options": ["Forward the tracing headers (like traceparent/x-request-id) from incoming to outgoing requests", "Install a Jaeger agent in each container", "Rewrite each service in Go", "Nothing — Istio does 100% of it"], "answer": 0, "why": "Proxies generate spans, but only propagating the trace headers lets them be stitched into one end-to-end trace. Bookinfo already does this.", "whyWrong": ["", "No per-container agent is needed; the sidecar already reports spans.", "Tracing is language-agnostic — you only need to pass the headers through.", "Istio does most of it, but it can't link an incoming request to your outgoing calls unless the app forwards the headers."]}, {"q": "What does Kiali's graph show?", "options": ["A live map of services, their call edges, traffic rates, health, and mTLS status", "A list of your Git commits", "The raw YAML of every config object", "The billing for your cloud account"], "answer": 0, "why": "Kiali draws the mesh in real time: which service calls which, request rates, health colors, and padlocks for encrypted (mTLS) edges.", "whyWrong": ["", "Git commits aren't mesh telemetry.", "Kiali can display config, but the graph is a live traffic map, not raw YAML.", "Billing isn't in scope for any mesh tool."]}, {"q": "How do you turn trace sampling to 100%?", "options": ["A Telemetry resource with randomSamplingPercentage: 100", "Restart istiod", "Delete Prometheus", "Set replicas to 100"], "answer": 0, "why": "The Telemetry API tunes what's collected. randomSamplingPercentage: 100 traces everything (fine for dev; lower it in production).", "whyWrong": ["", "Restarting istiod changes nothing about sampling policy.", "Deleting Prometheus loses your metrics; sampling is a Telemetry-API setting.", "Replicas scale pods; the sampling percentage is set in a Telemetry resource."]}], "08-ambient-mode": [{"q": "What are ambient mode's two layers and their jobs?", "options": ["ztunnel — per-node, mTLS + L4; waypoint — an Envoy per namespace/service for L7", "Two sidecars per pod", "A frontend and a backend database", "ztunnel for logging and waypoint for metrics"], "answer": 0, "why": "ztunnel (per-node, Rust) handles cheap universal encryption and L4. A waypoint (Envoy) adds L7 features only where needed.", "whyWrong": ["", "Ambient's defining move is removing per-pod proxies, not doubling them.", "Frontend-and-database isn't the split; it's L4-per-node versus L7-per-namespace.", "Both layers carry traffic and enforce policy; logging-versus-metrics isn't the division."]}, {"q": "What happens to your pods' container count in ambient mode?", "options": ["They stay 1/1 — there is no sidecar", "They become 2/2 like sidecar mode", "They become 3/3", "The pods are deleted"], "answer": 0, "why": "Ambient removes per-pod proxies, so pods keep their normal container count while ztunnel handles their traffic from the node.", "whyWrong": ["", "2/2 is sidecar mode; ambient leaves the pod untouched while ztunnel proxies from the node.", "Nothing is added to pods at all — that's the point.", "Pods keep running; enrollment doesn't even restart them."]}, {"q": "What do you get just by labelling a namespace 'istio.io/dataplane-mode=ambient'?", "options": ["Automatic mTLS and L4 via ztunnel, with no pod restarts", "Full L7 routing immediately", "A sidecar injected into every pod", "Nothing until you reboot the cluster"], "answer": 0, "why": "The label enrolls the namespace into ztunnel's secure L4 overlay instantly — encryption with zero restarts. L7 needs a waypoint.", "whyWrong": ["", "L7 features wait until you add a waypoint; the label gives you the secure L4 overlay.", "No sidecars exist in ambient — ztunnel on the node picks up the traffic.", "No reboot is needed; enrollment is immediate and restart-free."]}, {"q": "When do you need to add a waypoint proxy?", "options": ["For L7 features — HTTP routing, weighted canaries, L7 authorization, retries", "For basic encryption between pods", "Only to see metrics", "Never — ztunnel does everything"], "answer": 0, "why": "ztunnel is L4 only. HTTP-level behavior (routing rules, splits, L7 authz) requires a waypoint Envoy for that namespace/service.", "whyWrong": ["", "Basic encryption is exactly what ztunnel already covers.", "L4 telemetry flows without a waypoint; it's HTTP-level behavior that needs one.", "ztunnel stops at L4 — HTTP routing, splits, and L7 authorization are beyond it."]}, {"q": "Do your VirtualService and AuthorizationPolicy objects still work in ambient mode?", "options": ["Yes — L7 ones are enforced by the waypoint, L4 ones by ztunnel", "No — ambient uses entirely different objects", "Only AuthorizationPolicy works", "Only in the istio-system namespace"], "answer": 0, "why": "The same config applies. Ambient just changes where enforcement happens: waypoint for L7, ztunnel for L4/mTLS.", "whyWrong": ["", "Ambient reuses the same APIs; only the enforcement point moves.", "VirtualService works too, once a waypoint exists to enforce it.", "They apply in your app namespaces, same as in sidecar mode."]}], "09-gateway-api": [{"q": "What problem does the Kubernetes Gateway API solve that Istio's own API doesn't?", "options": ["Portability — a standard API implemented by many gateways/meshes, with a clean infra/app ownership split", "It makes traffic encrypted; Istio's API doesn't", "It is the only way to do routing", "It replaces Kubernetes"], "answer": 0, "why": "The Gateway API is a cross-vendor standard (Istio, Envoy Gateway, Contour, Cilium all implement it), so the same YAML is portable.", "whyWrong": ["", "Istio's own API encrypts just as well; the standard's win is portability, not security.", "Istio's Gateway and VirtualService still work fine; the standard is an alternative, not the only way.", "It's a Kubernetes API standardizing ingress and mesh config — nothing about replacing Kubernetes."]}, {"q": "Which Gateway API resource do application teams typically write?", "options": ["HTTPRoute — the routing rules attached to a Gateway", "GatewayClass — the controller selection", "Node — a cluster machine", "Secret — a TLS cert only"], "answer": 0, "why": "The Gateway API splits ownership: platform teams own GatewayClass/Gateway (the door); app teams own HTTPRoute (their routes).", "whyWrong": ["", "GatewayClass is the platform team's choice of controller, not an app-team artifact.", "Node is a core Kubernetes machine object, unrelated to routing.", "Secrets hold the certs a Gateway references; the routes themselves live in HTTPRoute."]}, {"q": "Are Istio's 'Gateway' and the Gateway API's 'Gateway' the same thing?", "options": ["No — they are different resources in different API groups that happen to share the name", "Yes — identical resources", "The Gateway API one is just an alias", "Istio has no Gateway resource"], "answer": 0, "why": "networking.istio.io/Gateway and gateway.networking.k8s.io/Gateway are distinct. Check the apiVersion to know which you're using.", "whyWrong": ["", "Same name, different apiVersions — networking.istio.io versus gateway.networking.k8s.io.", "Neither aliases the other; they're separate resources with different schemas.", "Istio does have its own Gateway resource — that's what causes the name collision."]}, {"q": "How do you do a weighted canary in an HTTPRoute?", "options": ["Multiple backendRefs with weight values", "Two separate Gateways", "A DestinationRule subset", "You can't — HTTPRoute has no splitting"], "answer": 0, "why": "The Gateway API supports traffic splitting directly via weighted backendRefs, the portable equivalent of a weighted VirtualService.", "whyWrong": ["", "Two Gateways would be two doors, not a split behind one route.", "DestinationRule subsets are Istio's mechanism; HTTPRoute splits natively with weighted backendRefs.", "It does — weighted backendRefs are core HTTPRoute functionality."]}, {"q": "When might you still reach for an Istio VirtualService?", "options": ["For Istio-only L7 features like fault injection or mirroring not yet in the standard API", "Whenever you use Kubernetes", "For basic path routing only", "Never — VirtualService is deprecated"], "answer": 0, "why": "The standard covers basic ingress and splits; richer Istio features (faults, mirroring, some policies) may still need a VirtualService. They interoperate.", "whyWrong": ["", "Kubernetes alone doesn't force either API; the standard covers most basic needs.", "Basic path routing is exactly what HTTPRoute handles portably.", "VirtualService isn't deprecated — it remains the way to reach Istio-specific features."]}], "10-debugging-gotchas": [{"q": "What's the first command to run when something is wrong in Istio?", "options": ["istioctl analyze", "kubectl delete everything", "istioctl install again", "curl the pod directly"], "answer": 0, "why": "istioctl analyze statically catches most misconfigurations (dangling refs, missing subsets, injection issues) before you dig deeper.", "whyWrong": ["", "Deleting everything destroys the evidence along with the cluster; diagnose first.", "Reinstalling rarely fixes a config bug and can mask the real cause.", "Curling pods directly is a useful later step, but analyze catches config errors in seconds."]}, {"q": "A VirtualService routes to 'subset: v2' but you get 503s. Likely cause?", "options": ["No matching DestinationRule subset defines v2", "The cluster is out of disk space", "mTLS is disabled", "The Gateway port is wrong"], "answer": 0, "why": "Subsets are defined in DestinationRules. Routing to an undefined subset produces 503s — istioctl analyze flags this.", "whyWrong": ["", "Disk pressure shows up as evictions, not 503s on routes to a named subset.", "mTLS being off doesn't break subset routing; the undefined subset does.", "A wrong Gateway port fails connections at the edge, not subset routing inside the mesh."]}, {"q": "You set mTLS to STRICT and a metrics scraper suddenly breaks. Why?", "options": ["Something still speaks plaintext; STRICT rejects it — migrate with PERMISSIVE first", "STRICT mode deletes the scraper", "The scraper needs a bigger CPU", "STRICT only works on Tuesdays"], "answer": 0, "why": "STRICT refuses non-mTLS traffic. If a non-meshed client still sends plaintext, it fails. Roll out STRICT once everything is meshed.", "whyWrong": ["", "Nothing is deleted; the plaintext connection is simply refused.", "It's a protocol refusal, not a resource shortage.", "Modes have no schedule; STRICT applies the moment the policy does."]}, {"q": "In ambient mode your weighted traffic split doesn't apply. What's missing?", "options": ["A waypoint — L7 rules need one; ztunnel only does L4/mTLS", "A second cluster", "A DestinationRule in istio-system", "A bigger node"], "answer": 0, "why": "ztunnel is L4-only. HTTP-level behavior like weighted splits requires deploying a waypoint proxy for that namespace/service.", "whyWrong": ["", "One cluster is plenty; the missing piece is the L7 proxy.", "A DestinationRule doesn't add L7 capability, and moving config to istio-system wouldn't either — a waypoint would.", "Capacity isn't the problem; ztunnel simply can't do HTTP-level splits."]}, {"q": "Recite the Istio mesh in one line.", "options": ["istiod programs Envoy proxies over xDS to carry all traffic, providing traffic management, mTLS security, and observability declaratively", "Kubernetes runs containers and that's the whole mesh", "Envoy stores data while istiod serves web pages", "The mesh is just a load balancer at the edge"], "answer": 0, "why": "That's the whole model: control plane (istiod) → data plane (Envoy sidecars/ambient) via xDS, delivering traffic control, security, and observability from YAML.", "whyWrong": ["", "Kubernetes runs the containers, but the mesh is the proxy layer istiod programs on top of it.", "Envoy proxies traffic and istiod pushes config; neither stores data nor serves web pages.", "An edge load balancer covers ingress only; the mesh manages every hop between services."]}], "11-egress-serviceentry": [{"q": "What does outboundTrafficPolicy: REGISTRY_ONLY change?", "options": ["It speeds up DNS", "Unknown destinations are refused: the mesh becomes default-deny for egress, and every external dependency must be declared with a ServiceEntry", "It blocks all HTTPS", "It forces all traffic through the ingress gateway"], "answer": 1, "why": "The default (ALLOW_ANY) passes unknown traffic through blind. REGISTRY_ONLY flips it: no registry entry, no connection — which turns your ServiceEntries into a reviewed, version-controlled list of everything the cluster talks to.", "whyWrong": ["DNS performance is unrelated.", "", "Declared HTTPS destinations work fine — undeclared ones are refused.", "Ingress handles inbound; this setting governs outbound."]}, {"q": "Besides making a call allowed under strict egress, what does a ServiceEntry buy you?", "options": ["Free TLS certificates for the external host", "The external service joins the registry: per-destination telemetry in Kiali/metrics, plus VirtualService timeouts and DestinationRule circuit breaking wrapped around a dependency you don't operate", "It caches the external service's responses", "Nothing else"], "answer": 1, "why": "Registry membership is what unlocks the mesh's machinery — visibility and resilience policy — for outside destinations. External dependencies fail more than yours; now your timeouts apply to them.", "whyWrong": ["Certificates come from the external host itself; the mesh doesn't issue for outsiders.", "", "The mesh proxies traffic; it doesn't cache response bodies.", "Allowing the call is the smaller half of the value."]}, {"q": "When is an egress GATEWAY (not just ServiceEntries) actually warranted?", "options": ["Always — it's a best practice", "When outbound traffic must exit from known network locations — a partner allowlists your IPs, or compliance requires one audited, meterable choke point", "Whenever you have more than 10 external dependencies", "When Kiali shows a PassthroughCluster"], "answer": 1, "why": "The gateway adds a hop, a fleet, and fiddly YAML. Its unique value is topological: one known exit point with fixed IPs you can log, meter, and close. Absent that requirement, REGISTRY_ONLY + ServiceEntries carries most teams.", "whyWrong": ["It's a cost with a specific payoff, not a default.", "", "Dependency count doesn't change the topology question.", "PassthroughCluster traffic means undeclared dependencies — the fix is ServiceEntries, not a gateway."]}], "12-request-auth-jwt": [{"q": "You apply a RequestAuthentication with correct jwtRules. A request with NO token still gets through. Why?", "options": ["The sidecar is broken", "RequestAuthentication only validates tokens that are present; requiring one is an authorization decision — add an AuthorizationPolicy on requestPrincipals", "JWTs are optional in Istio by design and cannot be required", "The token cache is stale"], "answer": 1, "why": "Validation and requirement are deliberately separate questions. Valid tokens produce a requestPrincipal; absent tokens produce nothing — and only an AuthorizationPolicy can say 'nothing is not enough.'", "whyWrong": ["It's working as specified — the spec is just narrower than people assume.", "", "They can absolutely be required; it just takes the second resource.", "Caching affects key fetches, not the present-vs-absent logic."]}, {"q": "What does combining principals and requestPrincipals in one AuthorizationPolicy rule express?", "options": ["Redundancy for reliability", "Both identities at once: WHICH SERVICE is calling (mTLS certificate) and WHICH USER it carries (validated JWT) — e.g. only the frontend, only with an admin's token", "It doubles the token lifetime", "Nothing — they're aliases"], "answer": 1, "why": "Service identity from certificates plus user identity from tokens, enforced in one place, is the concrete form of zero-trust: the network location of the caller appears nowhere in the rule.", "whyWrong": ["They check different credentials, not the same one twice.", "", "Lifetimes belong to the IdP issuing the token.", "principals comes from the mTLS peer; requestPrincipals from the JWT — different layers entirely."]}, {"q": "After enabling REGISTRY_ONLY egress, every JWT suddenly fails validation. What happened?", "options": ["The IdP revoked all tokens", "The sidecars can no longer fetch the issuer's JWKS keys — strict egress silently blocked the jwksUri; add a ServiceEntry for the IdP", "JWTs are incompatible with strict egress", "Clock skew"], "answer": 1, "why": "Signature validation needs the issuer's published keys, and fetching them is an external call like any other. This cross-module interaction — egress policy breaking authentication — is the mesh-debugging lesson in miniature.", "whyWrong": ["Mass revocation at the IdP is possible but wouldn't coincide with your egress change.", "", "They're fully compatible once the key endpoint is declared.", "Skew produces sporadic expiry errors, not a sudden total failure aligned with a config change."]}]}};
const KEY = "istio-course-progress-v1";
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ done = {}; }
let current = 0;

function save(){ try { localStorage.setItem(KEY, JSON.stringify(done)); } catch(e){} }

// plain-text index for search (strip markdown to readable text)
function stripMd(md){
  return md
    .replace(/```[\s\S]*?```/g, " ")     // code fences
    .replace(/`[^`]+`/g, " ")            // inline code
    .replace(/^\s*\|.*$/gm, " ")         // table rows
    .replace(/[#>*_\-]+/g, " ")          // md symbols
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1") // links -> text
    .replace(/\s+/g, " ").trim();
}
const INDEX = DATA.pages.map((p,idx) => ({idx, id:p.id, title:p.title, text:stripMd(p.md)}));

function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function escHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function snippet(text, q){
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i === -1) return "";
  const start = Math.max(0, i - 45), end = Math.min(text.length, i + q.length + 55);
  let s = (start>0?"…":"") + text.slice(start, end) + (end<text.length?"…":"");
  const re = new RegExp(escRe(q), "ig");
  return escHtml(s).replace(re, m => "<mark>"+escHtml(m)+"</mark>");
}

function doSearch(q){
  const nav = document.getElementById("nav");
  const box = document.getElementById("results");
  q = q.trim();
  if (!q){ box.innerHTML = ""; nav.style.display = ""; return; }
  nav.style.display = "none";
  const ql = q.toLowerCase();
  const hits = INDEX.map(p => {
    const inTitle = p.title.toLowerCase().includes(ql);
    const inText = p.text.toLowerCase().includes(ql);
    return (inTitle||inText) ? {p, inTitle, snip: snippet(p.text, q)} : null;
  }).filter(Boolean);
  if (!hits.length){ box.innerHTML = '<div class="noresult">No matches for “'+escHtml(q)+'”.</div>'; return; }
  box.innerHTML = '<div class="searchinfo">'+hits.length+' module'+(hits.length>1?'s':'')+' match</div>';
  hits.forEach(h => {
    const d = document.createElement("div");
    d.className = "result";
    d.innerHTML = '<div class="rt"></div><div class="rs">'+(h.snip||"(title match)")+'</div>';
    d.querySelector(".rt").textContent = h.p.title;
    d.onclick = () => {
      document.getElementById("search").value = "";
      doSearch("");
      go(h.p.idx);
      document.getElementById('sidebar').classList.remove('open');
    };
    box.appendChild(d);
  });
}

function buildNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  let lastGroup = null;
  DATA.pages.forEach((p, idx) => {
    if (p.group !== lastGroup){
      const g = document.createElement("div");
      g.className = "navgroup"; g.textContent = p.group;
      nav.appendChild(g); lastGroup = p.group;
    }
    const it = document.createElement("div");
    it.className = "navitem" + (idx===current?" active":"") + (done[p.id]?" done":"");
    it.innerHTML = '<span class="dot">'+(done[p.id]?"✓":"")+'</span><span class="t"></span>';
    it.querySelector(".t").textContent = p.title;
    it.onclick = () => { go(idx); document.getElementById('sidebar').classList.remove('open'); };
    nav.appendChild(it);
  });
}

function updateProgress(){
  const total = DATA.pages.length;
  const n = DATA.pages.filter(p => done[p.id]).length;
  const pct = Math.round(100*n/total);
  document.getElementById("progfill").style.width = pct + "%";
  document.getElementById("progtxt").textContent = pct + "% complete · " + n + "/" + total + " modules";
}

function attachCopy(root){
  root.querySelectorAll("pre.code .copy").forEach(btn => {
    btn.onclick = () => {
      const code = btn.parentElement.querySelector("code").innerText;
      navigator.clipboard.writeText(code).then(()=>{
        btn.textContent = "Copied!"; setTimeout(()=>btn.textContent="Copy", 1200);
      });
    };
  });
}

function renderQuiz(pid){
  const qs = DATA.quizzes[pid];
  if (!qs || !qs.length) return "";
  const wrap = document.createElement("div");
  wrap.className = "quiz";
  wrap.innerHTML = '<h3>Test your knowledge</h3><div class="qmeta">'+qs.length+
    ' questions · answer all to mark this module complete.</div>';
  const state = {answered: new Array(qs.length).fill(false), correct: 0};
  qs.forEach((q, qi) => {
    const card = document.createElement("div");
    card.className = "qcard";
    const qt = document.createElement("div");
    qt.className = "qtext"; qt.textContent = (qi+1)+". "+q.q;
    card.appendChild(qt);
    const why = document.createElement("div");
    why.className = "why";
    q.options.forEach((opt, oi) => {
      const b = document.createElement("button");
      b.className = "opt"; b.textContent = opt;
      b.onclick = () => {
        if (state.answered[qi]) return;
        state.answered[qi] = true;
        const ok = oi === q.answer;
        if (ok) state.correct++;
        card.querySelectorAll(".opt").forEach((x, xi) => {
          x.classList.add("disabled");
          if (xi === q.answer) x.classList.add("correct");
          if (xi === oi && !ok) x.classList.add("wrong");
        });
        why.textContent = ok ? ("✓ Correct. " + q.why)
          : ("✗ Not quite. " + ((q.whyWrong && q.whyWrong[oi]) ? q.whyWrong[oi] + " " : "") + q.why);
        why.className = "why show " + (ok ? "ok":"no");
        maybeComplete();
      };
      card.appendChild(b);
    });
    card.appendChild(why);
    wrap.appendChild(card);
  });
  const score = document.createElement("div");
  score.className = "qscore";
  wrap.appendChild(score);
  function maybeComplete(){
    const n = state.answered.filter(Boolean).length;
    score.textContent = "Answered "+n+"/"+qs.length+" · "+state.correct+" correct";
    if (n === qs.length){
      if (!done[pid]){ done[pid] = true; save(); buildNav(); updateProgress(); }
      score.textContent += "  —  module complete ✓";
    }
  }
  return wrap;
}

function go(idx){
  current = idx;
  const p = DATA.pages[idx];
  const c = document.getElementById("content");
  c.innerHTML = '<div class="pagehdr">'+p.group+'</div><h2></h2>';
  c.querySelector("h2").textContent = p.title;
  const body = document.createElement("div");
  body.innerHTML = mdToHtml(p.md);
  c.appendChild(body);
  attachCopy(c);
  const quiz = renderQuiz(p.id);
  if (quiz) c.appendChild(quiz);
  // prev/next
  const nb = document.createElement("div");
  nb.className = "navbtns";
  const prev = document.createElement("button");
  prev.textContent = "← Previous"; prev.disabled = idx===0;
  prev.onclick = ()=>go(idx-1);
  const next = document.createElement("button");
  next.className = "next";
  next.textContent = idx===DATA.pages.length-1 ? "Finish ✓" : "Next →";
  next.disabled = idx===DATA.pages.length-1 && !!done[p.id];
  next.onclick = ()=>{ if(idx<DATA.pages.length-1) go(idx+1); else { done[p.id]=true; save(); buildNav(); updateProgress(); } };
  nb.appendChild(prev); nb.appendChild(next);
  c.appendChild(nb);
  buildNav();
  updateProgress();
  window.scrollTo(0,0);
  document.getElementById("main").scrollTo && document.getElementById("main").scrollTo(0,0);
}

document.getElementById("search").addEventListener("input", e => doSearch(e.target.value));

buildNav();
updateProgress();
go(0);
</script>
</body>
