<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Istio Crash Course</title>
<style>
  :root{
    --bg:#0d1117; --panel:#141b23; --panel2:#1b2530; --ink:#e6edf3; --muted:#93a1b1;
    --teal:#2dd4bf; --teal-dim:#155e59; --line:#26313d; --code:#0b1017;
    --good:#22c55e; --good-bg:#0e2a1a; --bad:#ef4444; --bad-bg:#2a1414; --accent:#38bdf8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--teal);text-decoration:none} a:hover{text-decoration:underline}
  #app{display:flex;min-height:100vh}
  /* sidebar */
  #sidebar{width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 0}
  .brand{padding:0 20px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .brand h1{font-size:17px;margin:0;color:#fff;letter-spacing:.2px}
  .brand .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .progwrap{padding:12px 20px}
  .progbar{height:7px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .progfill{height:100%;width:0;background:linear-gradient(90deg,var(--teal-dim),var(--teal));transition:width .4s}
  .progtxt{font-size:11px;color:var(--muted);margin-top:6px}
  .searchwrap{padding:6px 20px 4px}
  #search{width:100%;background:var(--code);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:9px 11px;font-size:13.5px;outline:none}
  #search:focus{border-color:var(--teal)}
  .searchinfo{font-size:11px;color:var(--muted);padding:4px 20px 0}
  .result{padding:9px 20px;cursor:pointer;border-left:3px solid transparent}
  .result:hover{background:var(--panel2);border-left-color:var(--teal)}
  .result .rt{font-size:13.5px;color:#fff;font-weight:600}
  .result .rs{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
  .result .rs mark{background:var(--teal-dim);color:#d7fff6;border-radius:3px;padding:0 2px}
  .noresult{padding:12px 20px;font-size:13px;color:var(--muted)}
  .navgroup{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);
    padding:14px 20px 6px;font-weight:700}
  .navitem{display:flex;align-items:center;gap:9px;padding:8px 20px;cursor:pointer;
    font-size:14px;color:var(--ink);border-left:3px solid transparent}
  .navitem:hover{background:var(--panel2)}
  .navitem.active{background:var(--panel2);border-left-color:var(--teal);color:#fff}
  .navitem .dot{width:16px;height:16px;flex:0 0 16px;border-radius:50%;border:2px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;font-size:10px}
  .navitem.done .dot{background:var(--teal);border-color:var(--teal);color:#04211f}
  .navitem .t{flex:1}
  /* main */
  #main{flex:1;min-width:0;display:flex;justify-content:center;padding:38px 40px 90px}
  #content{max-width:820px;width:100%}
  #content h2{font-size:26px;margin:.2em 0 .5em;color:#fff}
  #content h3{font-size:19px;margin:1.5em 0 .4em;color:var(--teal)}
  #content h4{font-size:16px;margin:1.2em 0 .3em;color:var(--ink)}
  #content p{margin:.7em 0}
  #content p.dd{margin:.2em 0 .8em 1.2em;color:var(--muted)}
  #content ul,#content ol{margin:.6em 0;padding-left:1.4em}
  #content li{margin:.3em 0}
  #content strong{color:#fff}
  #content code{background:var(--code);border:1px solid var(--line);border-radius:5px;
    padding:.08em .38em;font:13.5px/1.4 "SF Mono",Menlo,Consolas,monospace;color:#8be9c9}
  #content hr{border:0;border-top:1px solid var(--line);margin:1.8em 0}
  blockquote{margin:1em 0;padding:.5em 1em;background:var(--panel);border-left:3px solid var(--accent);
    border-radius:0 6px 6px 0;color:var(--ink)}
  blockquote p{margin:.3em 0}
  pre.code{position:relative;background:var(--code);border:1px solid var(--line);border-radius:9px;
    padding:14px 16px;overflow-x:auto;margin:1em 0}
  pre.code code{background:none;border:0;padding:0;color:#d7e2ea;
    font:13px/1.55 "SF Mono",Menlo,Consolas,monospace;white-space:pre}
  pre.code .copy{position:absolute;top:8px;right:8px;background:var(--panel2);color:var(--muted);
    border:1px solid var(--line);border-radius:6px;font-size:11px;padding:3px 9px;cursor:pointer}
  pre.code .copy:hover{color:var(--teal);border-color:var(--teal)}
  .tablewrap{overflow-x:auto;margin:1em 0}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  th{background:var(--panel2);color:#fff}
  tr:nth-child(even) td{background:rgba(255,255,255,.02)}
  .pagehdr{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:2px}
  /* quiz */
  .quiz{margin:34px 0 10px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .quiz h3{margin-top:0;color:#fff}
  .quiz .qmeta{font-size:13px;color:var(--muted);margin-bottom:14px}
  .qcard{margin:16px 0;padding:16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
  .qtext{font-weight:600;margin-bottom:12px}
  .opt{display:block;width:100%;text-align:left;background:var(--code);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:11px 13px;margin:8px 0;cursor:pointer;font-size:14.5px;
    transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--teal)}
  .opt.correct{border-color:var(--good);background:var(--good-bg)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.disabled{cursor:default;opacity:.85}
  .why{margin-top:10px;font-size:13.5px;color:var(--ink);background:var(--code);
    border-left:3px solid var(--teal);border-radius:0 6px 6px 0;padding:9px 12px;display:none}
  .why.show{display:block}
  .why.ok{border-left-color:var(--good)} .why.no{border-left-color:var(--bad)}
  .qscore{margin-top:16px;font-size:14px;color:var(--muted)}
  .navbtns{display:flex;justify-content:space-between;margin-top:40px;gap:12px}
  .navbtns button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:11px 18px;font-size:14px;cursor:pointer}
  .navbtns button:hover:not(:disabled){border-color:var(--teal);color:#fff}
  .navbtns button:disabled{opacity:.35;cursor:default}
  .navbtns .next{background:var(--teal-dim);border-color:var(--teal)}
  .mobtog{display:none}
  @media(max-width:860px){
    #sidebar{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .25s}
    #sidebar.open{transform:none}
    #main{padding:64px 18px 80px}
    .mobtog{display:inline-flex;position:fixed;top:12px;left:12px;z-index:40;background:var(--panel);
      border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
  }
</style>
</head>
<body>
<button class="mobtog" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ Menu</button>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <h1>Istio Crash Course</h1>
      <div class="sub">From zero to service mesh · interactive</div>
    </div>
    <div class="progwrap">
      <div class="progbar"><div class="progfill" id="progfill"></div></div>
      <div class="progtxt" id="progtxt">0% complete</div>
    </div>
    <div class="searchwrap">
      <input id="search" type="search" placeholder="Search the course…" autocomplete="off">
    </div>
    <div id="results"></div>
    <nav id="nav"></nav>
  </aside>
  <main id="main"><div id="content"></div></main>
</div>

<script>
/* Minimal, dependency-free Markdown -> HTML renderer.
   Supports the subset used by the course: headings, bold, inline code, links,
   fenced code blocks, tables, blockquotes, ordered/unordered lists, hr,
   definition-style ": " lines, and paragraphs. Works in Node and the browser. */
(function (global) {
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(text) {
    // protect inline code spans
    var codes = [];
    text = text.replace(/`([^`]+)`/g, function (_, c) {
      codes.push("<code>" + escapeHtml(c) + "</code>");
      return "␀" + (codes.length - 1) + "␀";
    });
    text = escapeHtml(text);
    // bold (non-greedy so it can span inner single-* italics)
    text = text.replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>");
    // italics (remaining single *)
    text = text.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    // links [text](url)
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, t, u) {
      var safe = u.replace(/"/g, "%22");
      var ext = /^https?:\/\//.test(u) ? ' target="_blank" rel="noopener"' : "";
      return '<a href="' + safe + '"' + ext + ">" + t + "</a>";
    });
    // restore code spans
    text = text.replace(/␀(\d+)␀/g, function (_, i) {
      return codes[+i];
    });
    return text;
  }

  function renderTable(rows) {
    // rows: array of raw '| a | b |' lines (header, sep, ...body)
    function cells(line) {
      var t = line.trim().replace(/^\|/, "").replace(/\|$/, "");
      return t.split("|").map(function (c) { return c.trim(); });
    }
    var header = cells(rows[0]);
    var body = rows.slice(2).map(cells);
    var html = '<div class="tablewrap"><table><thead><tr>';
    header.forEach(function (h) { html += "<th>" + inline(h) + "</th>"; });
    html += "</tr></thead><tbody>";
    body.forEach(function (r) {
      html += "<tr>";
      r.forEach(function (c) { html += "<td>" + inline(c) + "</td>"; });
      html += "</tr>";
    });
    html += "</tbody></table></div>";
    return html;
  }

  function mdToHtml(md) {
    md = md.replace(/\r\n/g, "\n");
    var lines = md.split("\n");
    var out = [];
    var i = 0;

    function isTableSep(line) {
      return /^\s*\|?[\s:-]*-[\s:|-]*\|?\s*$/.test(line) && line.indexOf("-") !== -1;
    }

    while (i < lines.length) {
      var line = lines[i];

      // fenced code block
      var fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        var lang = fence[1] || "";
        var buf = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++; // skip closing fence
        out.push('<pre class="code" data-lang="' + lang + '"><button class="copy" type="button">Copy</button><code>' +
          escapeHtml(buf.join("\n")) + "</code></pre>");
        continue;
      }

      // horizontal rule
      if (/^\s*---\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

      // heading
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        var lvl = h[1].length;
        out.push("<h" + lvl + ">" + inline(h[2].trim()) + "</h" + lvl + ">");
        i++;
        continue;
      }

      // blockquote (may span lines)
      if (/^\s*>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        out.push('<blockquote>' + mdToHtml(q.join("\n")) + "</blockquote>");
        continue;
      }

      // table
      if (line.indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var trows = [];
        while (i < lines.length && lines[i].indexOf("|") !== -1 && lines[i].trim() !== "") {
          trows.push(lines[i]);
          i++;
        }
        out.push(renderTable(trows));
        continue;
      }

      // unordered list
      if (/^\s*[-*]\s+/.test(line)) {
        var items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          var item = lines[i].replace(/^\s*[-*]\s+/, "");
          i++;
          // continuation lines (indented, not a new list item / block)
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && lines[i].trim() !== "") {
            item += " " + lines[i].trim();
            i++;
          }
          items.push("<li>" + inline(item) + "</li>");
        }
        out.push("<ul>" + items.join("") + "</ul>");
        continue;
      }

      // ordered list
      if (/^\s*\d+\.\s+/.test(line)) {
        var oitems = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          var oitem = lines[i].replace(/^\s*\d+\.\s+/, "");
          i++;
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) && lines[i].trim() !== "") {
            oitem += " " + lines[i].trim();
            i++;
          }
          oitems.push("<li>" + inline(oitem) + "</li>");
        }
        out.push("<ol>" + oitems.join("") + "</ol>");
        continue;
      }

      // definition-style ": " line -> indented note paragraph
      if (/^:\s+/.test(line)) {
        out.push('<p class="dd">' + inline(line.replace(/^:\s+/, "")) + "</p>");
        i++;
        continue;
      }

      // blank line
      if (line.trim() === "") { i++; continue; }

      // paragraph (gather until blank / block start)
      var para = [line];
      i++;
      while (i < lines.length && lines[i].trim() !== "" &&
             !/^(#{1,6})\s/.test(lines[i]) &&
             !/^```/.test(lines[i]) &&
             !/^\s*>\s?/.test(lines[i]) &&
             !/^\s*[-*]\s+/.test(lines[i]) &&
             !/^\s*\d+\.\s+/.test(lines[i]) &&
             !/^:\s+/.test(lines[i]) &&
             !/^\s*---\s*$/.test(lines[i]) &&
             !(lines[i].indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1]))) {
        para.push(lines[i]);
        i++;
      }
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }

    return out.join("\n");
  }

  if (typeof module !== "undefined" && module.exports) module.exports = mdToHtml;
  else global.mdToHtml = mdToHtml;
})(typeof window !== "undefined" ? window : this);

</script>
<script>
const DATA = {"pages": [{"id": "setup-local-istio", "title": "Setup — run Istio locally", "group": "Get started", "md": "*Do this once. In ~15 minutes you'll have a real Kubernetes cluster on your laptop with Istio\ninstalled, a demo app running inside the mesh, and a dashboard showing traffic. Every step spelled\nout. Requires a machine with ~8 GB RAM free.*\n\n> **This course is hands-on, on your own machine.** The site you're reading gives you the lessons\n> and quizzes, but the real work happens in your own terminal — installing tools, running\n> containers, and breaking things you can then fix. This setup page gets your machine ready; do it\n> before the first lab.\n\nIstio runs on **Kubernetes**, so first we make a tiny throwaway Kubernetes cluster on your machine\nwith **kind** (Kubernetes-IN-Docker), then install Istio into it. You'll install four command-line\ntools; everything else is pulled automatically.\n\n---\n\n## Step 1 — Install the prerequisites\n\nYou need **Docker**, **kind**, and **kubectl**.\n\n**Docker**\n: Install Docker Desktop from <https://www.docker.com/products/docker-desktop/> (macOS/Windows) or\nDocker Engine on Linux (<https://docs.docker.com/engine/install/>). Launch it and wait for the\nrunning indicator. Verify: `docker run --rm hello-world`.\n\n**kubectl** (the Kubernetes command-line tool)\n: Follow <https://kubernetes.io/docs/tasks/tools/>. On macOS: `brew install kubectl`. Verify:\n`kubectl version --client`.\n\n**kind** (runs Kubernetes inside Docker)\n: Follow <https://kind.sigs.k8s.io/docs/user/quick-start/>. On macOS: `brew install kind`. Verify:\n`kind version`.\n\n## Step 2 — Create a local Kubernetes cluster\n\n```bash\nkind create cluster --name istio-lab\nkubectl cluster-info --context kind-istio-lab   # should print cluster URLs\nkubectl get nodes                               # one node, status Ready\n```\n\nYou now have a one-node Kubernetes cluster running in Docker. `kubectl` is how you talk to it.\n\n## Step 3 — Download Istio and get `istioctl`\n\n`istioctl` is Istio's own command-line installer/manager.\n\n```bash\n# macOS / Linux — downloads the latest Istio and its samples into ./istio-*/\ncurl -L https://istio.io/downloadIstio | sh -\ncd istio-*                       # e.g. cd istio-1.30.1\nexport PATH=$PWD/bin:$PATH        # put istioctl on your PATH for this terminal\nistioctl version                 # confirms istioctl works (control plane not installed yet)\n```\n\n*(Windows: download the release zip from <https://github.com/istio/istio/releases>, unzip, and add\nthe `bin` folder to your PATH.)*\n\n> **Version note.** Istio 1.30.x is current as of this writing. The `downloadIstio` script always\n> fetches the latest stable. If a newer version exists when you read this, the commands are\n> unchanged. Check <https://istio.io> for the newest release.\n\n## Step 4 — Install Istio (demo profile)\n\nThe **demo profile** installs everything with relaxed resource needs — perfect for learning.\n\n```bash\nistioctl install --set profile=demo -y\n```\n\nThis deploys **istiod** (the control-plane brain) plus ingress/egress gateways into the\n`istio-system` namespace. Confirm:\n\n```bash\nkubectl get pods -n istio-system     # istiod + gateways, all Running\n```\n\n## Step 5 — Turn on automatic sidecar injection\n\nTell Istio to inject an Envoy sidecar into every pod created in the `default` namespace:\n\n```bash\nkubectl label namespace default istio-injection=enabled\nkubectl get namespace -L istio-injection    # 'default' now shows enabled\n```\n\nFrom now on, any pod you deploy into `default` automatically gets a proxy beside it.\n\n## Step 6 — Deploy the sample app (Bookinfo)\n\nIstio ships a demo microservices app called **Bookinfo** (a bookstore page: `productpage` calls\n`details`, `reviews`, and `ratings`; `reviews` has three versions). It's the standard way to see\nthe mesh in action. From inside the `istio-*` folder:\n\n```bash\nkubectl apply -f samples/bookinfo/platform/kube/bookinfo.yaml\nkubectl get pods      # each app pod shows 2/2 — your container + the injected Envoy sidecar\n```\n\nThat **2/2** is the whole point: two containers per pod — your app *and* its sidecar proxy.\n\n## Step 7 — Send traffic and confirm it works\n\n```bash\n# run a throwaway curl pod inside the cluster to hit the productpage service\nkubectl exec \"$(kubectl get pod -l app=ratings -o jsonpath='{.items[0].metadata.name}')\" \\\n  -c ratings -- curl -sS productpage:9080/productpage | grep -o \"<title>.*</title>\"\n# → <title>Simple Bookstore App</title>\n```\n\nIf you see the title, traffic flowed through the mesh (app → sidecar → sidecar → app).\n\n## Step 8 — Open the dashboards (Kiali)\n\nInstall the observability add-ons (Kiali, Prometheus, Grafana, Jaeger) and open the service graph:\n\n```bash\nkubectl apply -f samples/addons        # Kiali, Prometheus, Grafana, Jaeger\nkubectl rollout status deployment/kiali -n istio-system\nistioctl dashboard kiali               # opens Kiali in your browser\n```\n\nKiali draws a live map of which service calls which. (Generate some traffic first so there's\nsomething to see — re-run the curl from Step 7 a few times.)\n\n## Step 9 — Clean up when done\n\n```bash\nkind delete cluster --name istio-lab   # deletes everything — cluster, Istio, apps\n```\n\nThat one command removes the whole environment. To start again, repeat from Step 2.\n\n---\n\n## Troubleshooting\n\n**Pods stuck in `Pending` or the node looks unhealthy**\n: kind needs enough memory. Give Docker Desktop ≥ 8 GB (Settings → Resources) and recreate the\ncluster.\n\n**`istioctl: command not found`**\n: Your PATH doesn't include Istio's `bin`. Re-run `export PATH=$PWD/bin:$PATH` from inside the\n`istio-*` folder (each new terminal needs it, or copy `istioctl` somewhere on your PATH).\n\n**App pods show `1/2` and never reach `2/2`**\n: The sidecar wasn't injected. Make sure you labelled the namespace (Step 5) *before* deploying the\napp; if not, `kubectl rollout restart deployment` in `default` re-injects.\n\n**`istioctl dashboard kiali` won't open**\n: Make sure the addons applied and Kiali is Running (`kubectl get pods -n istio-system`). The\ncommand holds the terminal open (it's port-forwarding) — leave it running and use the browser tab.\n\n**Everything is slow the first time**\n: Normal — Kubernetes and Istio images download once, then cache."}, {"id": "primer-what-is-istio", "title": "Primer — What is Istio?", "group": "Get started", "md": "*Start here. No Kubernetes or networking expertise assumed. ~10 min. If you've done the Envoy\ncourse, this is the \"boss\" that drives thousands of Envoys — here's the whole idea before any\nYAML.*\n\n---\n\n## The problem Istio solves\n\nPicture a modern app built as lots of small services — a \"microservices\" system. A web frontend\ncalls an orders service, which calls a payments service, which calls a database, and so on.\nHundreds of little programs, all talking to each other over the network, constantly.\n\nNow every team keeps hitting the *same* headaches:\n\n- Is the traffic between these services **encrypted**? Can each service **prove who it is**?\n- When a service is **slow or down**, who retries? Who stops hammering it?\n- Can we send **1% of traffic to a new version** to test it safely?\n- **Why is this request slow** — which hop is the problem?\n\nYou *could* write all that logic into every single service, in every programming language, over and\nover. That's the trap. **Istio's job is to handle all of it for you, outside your code.**\n\n## The one-sentence definition\n\n> **Istio is a service mesh: a layer that manages, secures, and observes the traffic between your\n> services — without you changing the services themselves.**\n\n\"Service mesh\" just means: the network *between* your services becomes smart and controllable,\nmanaged as one thing.\n\n## How it pulls this off: put a proxy next to everything\n\nIstio's trick is to place a small **proxy** (a middleman program) right next to every one of your\nservices. Your service stops talking to other services directly — it talks to its local proxy, and\nthe proxy handles the real network on its behalf.\n\n```\n   your service  ──►  its proxy  ──►  another service's proxy  ──►  that service\n```\n\nBecause a proxy sits on **both ends of every call**, Istio can — for *every* service, with **zero\nchanges to your code** — encrypt the traffic, retry failures, split traffic between versions, and\nrecord metrics on every request. Your app just makes a normal call; the mesh does the rest around\nit.\n\n> **The proxy Istio uses is Envoy.** If you've seen the Envoy course, that's the exact same proxy —\n> Istio is the \"brain\" that programs a whole fleet of Envoys automatically. You never hand-write\n> Envoy config; you tell Istio your intent and it generates the Envoy config for you.\n\n## The two halves: the brain and the muscle\n\nEvery mesh, Istio included, splits into two parts — remember these two words and Istio makes sense:\n\n- **The data plane** — the fleet of **proxies** that actually carry your traffic and enforce the\n  rules. This is the \"muscle.\" (In Istio, these are Envoy proxies.)\n- **The control plane** — the **brain**, a component called **`istiod`**. You give it your intent\n  (\"encrypt everything,\" \"send 10% to v2\"), and it figures out the exact proxy config and **pushes\n  it to every proxy**, updating them live as services come and go.\n\nYou state policy once, centrally, as a few lines of YAML. istiod programs the entire fleet to\nmatch. That's the magic: **you manage the mesh, not each proxy.**\n\n## What you actually *do* with Istio\n\nYou don't program proxies. You write small Kubernetes YAML objects that describe intent, and Istio\nturns them into proxy behavior. The main ones (each gets its own module later):\n\n- **Gateway** — \"let outside traffic in on this port/host.\" (the front door)\n- **VirtualService** — routing rules: \"send `/reviews` to the reviews service; send 10% to v2.\"\n- **DestinationRule** — policy for a destination: load balancing, connection limits, and defining\n  \"subsets\" (versions) like v1/v2.\n- **PeerAuthentication / AuthorizationPolicy** — \"require encryption (mTLS)\" and \"service A may\n  call service B, nobody else.\"\n- **Telemetry** — what metrics/traces/logs to collect.\n\n## What you get, for free, once it's on\n\n- **mTLS everywhere** — every service-to-service call is encrypted and mutually authenticated, and\n  each service gets a cryptographic identity. No code changes.\n- **Smart traffic control** — canary releases, blue-green, A/B by header, weighted splits.\n- **Resilience** — retries, timeouts, circuit breaking, and deliberate fault injection for testing.\n- **Deep observability** — consistent metrics, distributed traces, and a live service graph\n  (**Kiali**) showing what's calling what and where it's failing.\n\n## Two ways to run it (a heads-up)\n\nIstio has two \"data-plane modes,\" and you'll meet both. **Sidecar mode** puts a full Envoy proxy\ninside every pod — powerful, and the classic model this course teaches first. **Ambient mode** is\nnewer and sidecar-less: it uses a lightweight per-node agent for encryption and adds Envoy only\nwhere richer features are needed, cutting resource cost. The next primer explains the difference\nsimply; Module 8 is hands-on.\n\n## Do you even need Istio? (honest note)\n\nA mesh earns its complexity when you have **many** services all needing uniform security,\nresilience, and visibility. For a handful of services, a single gateway at the edge is often\nenough. Istio's newer ambient mode exists specifically to make adopting a mesh cheaper and less\nall-or-nothing. This course teaches you the whole thing so you can decide with open eyes."}, {"id": "primer-sidecar-vs-ambient", "title": "Primer — Sidecar vs Ambient", "group": "Get started", "md": "*A 6-minute orientation so the rest of the course isn't confusing. Istio has two \"modes\" for where\nits proxies live. You'll learn sidecar mode first (it's the clearest), and meet ambient properly in\nModule 8.*\n\n---\n\nIstio needs proxies on your traffic to do its job. There are two designs for *where those proxies\nsit*. Same goals (encryption, routing, resilience, metrics) — different plumbing and different\ncost.\n\n## Sidecar mode — a proxy inside every pod\n\nThe classic model. Alongside every copy of every service, Istio injects a **full Envoy proxy** into\nthe same pod. (A \"pod\" is Kubernetes' smallest unit — think \"a running copy of your service.\")\nThat proxy is called a **sidecar** because it rides along next to your app like a motorcycle\nsidecar.\n\n```\n   ┌─────── pod ───────┐        ┌─────── pod ───────┐\n   │  your app   ↕  Envoy │ ───► │  Envoy  ↕   your app │\n   └───────────────────┘        └───────────────────┘\n```\n\nEvery packet in or out of your app quietly detours through its personal Envoy, which applies\nencryption, routing, and policy. It's powerful and simple to reason about: one proxy per app,\nfull features everywhere.\n\n**The catch:** a proxy in *every* pod costs CPU and memory per pod, adds a little latency, and\nupgrading Istio means restarting every pod to update its sidecar. At a few services that's nothing;\nat thousands, it adds up.\n\n## Ambient mode — no sidecars, shared proxies instead\n\nThe newer, \"sidecar-less\" design. Istio pulls the proxy *out* of your pods and splits the work into\ntwo layers:\n\n- **ztunnel** (\"zero-trust tunnel\") — a lightweight agent that runs **once per node** (a node is a\n  worker machine that hosts many pods). It's written in Rust and handles the cheap, universal\n  part: **encrypting traffic (mTLS) and basic L4 routing** for all pods on that node. Turning it on\n  requires **no pod restarts**.\n- **waypoint proxy** — a **full Envoy**, added only for the namespaces/services that need the\n  richer **L7 features** (HTTP routing rules, traffic splitting, L7 authorization). You deploy one\n  only where you actually need it.\n\n```\n   pod   pod   pod          (no proxy inside the pods)\n     \\    |    /\n      [ ztunnel ]  ← one per node: encryption + L4 for everyone, cheaply\n          |\n      [ waypoint (Envoy) ]  ← added only where L7 features are needed\n```\n\nSo Envoy is still the L7 engine — it's just no longer sitting in every single pod. You pay for the\nheavy proxy only where it earns its keep.\n\n## How they compare\n\n| | Sidecar mode | Ambient mode |\n|--|--|--|\n| Proxy location | Full Envoy in every pod | Per-node ztunnel; Envoy waypoint only where needed |\n| Cost per pod | Higher (a proxy each) | Lower (shared) |\n| Enabling it | Inject sidecar, restart pod | Label the namespace, **no restart** |\n| L7 features | Everywhere by default | Add a waypoint where needed |\n| Maturity | Battle-tested, the classic model | Production-ready and increasingly the default choice |\n| Best when | You want full features per workload, simplest mental model | You want lower cost, gradual adoption, big fleets |\n\n## Which does this course use?\n\n**Sidecar first.** It's the clearest way to *see* the mesh — you can literally watch a second\ncontainer appear inside your pod. Modules 2–7 use sidecar mode. Then **Module 8** teaches ambient\nproperly, now that you know what the proxy underneath is actually doing. The concepts you learn\n(mTLS, VirtualService, authorization) apply to **both** modes — only the plumbing differs."}, {"id": "00-what-is-istio", "title": "0 · What Istio is", "group": "Fundamentals", "md": "*No lab — this sets the mental model. ~12 min read.*\n\n---\n\n## Recap in one breath\n\n**Istio is a service mesh.** It puts a proxy (Envoy) next to every service, and a brain (`istiod`)\nthat programs all those proxies from your simple YAML intent. The result: encryption, traffic\ncontrol, resilience, and observability for all your service-to-service traffic — **without touching\nyour application code.**\n\nIf that already makes sense from the primers, this module sharpens it and places Istio among its\nalternatives.\n\n## The three things Istio gives you\n\nEverything Istio does falls into three buckets. The whole course is these three, in depth:\n\n1. **Traffic management** — control *where* requests go and *how*. Route by path/header, split\n   traffic between versions (canary), rewrite, mirror, and apply retries/timeouts. You express this\n   as a few Kubernetes objects; Istio programs the proxies to enforce it.\n2. **Security** — **mTLS** (mutual TLS) between every service automatically, so traffic is encrypted\n   and both sides prove their identity. Plus **authorization**: \"service A may call service B, and\n   nobody else.\" Identity is built in, not bolted on.\n3. **Observability** — because every request passes through a proxy, Istio produces uniform\n   **metrics**, **distributed traces**, and a live **service graph** (Kiali) for free. You see what\n   calls what, how fast, and where it's failing.\n\n## Data plane and control plane (the core split)\n\nKeep these two words straight and Istio is simple:\n\n| Half | What it is | In Istio |\n|------|-----------|----------|\n| **Data plane** | The proxies that carry traffic and enforce rules | **Envoy** proxies (sidecars or waypoints) |\n| **Control plane** | The brain that computes config and pushes it to the proxies | **`istiod`** |\n\nYou never configure Envoy by hand. You write Istio objects (VirtualService, DestinationRule,\netc.); `istiod` translates them into Envoy config and streams it to every proxy over a standard API\ncalled **xDS**. Services appear, disappear, scale — istiod keeps every proxy up to date, live.\n\n> **This is why the Envoy course and this one fit together:** Envoy is the muscle, Istio is the\n> brain. Learn Envoy to understand *what* the proxy does; learn Istio to drive a whole fleet of\n> them declaratively.\n\n## Where the proxies sit: sidecar vs ambient (quick recap)\n\n- **Sidecar mode** — a full Envoy inside every pod. Classic, full-featured, higher per-pod cost.\n  *This course teaches it first (Modules 2–7).*\n- **Ambient mode** — no per-pod sidecar; a per-node **ztunnel** does cheap encryption/L4, and an\n  Envoy **waypoint** is added only where L7 features are needed. Lower cost, gradual adoption.\n  *Module 8.*\n\nSame features either way — only the plumbing differs.\n\n## Istio vs the alternatives (so you know the landscape)\n\n- **Istio** — the most feature-rich and widely used mesh; uses Envoy; now offers both sidecar and\n  ambient. Powerful, historically heavier (ambient addresses that).\n- **Linkerd** — a simpler, lighter mesh that uses its *own* tiny Rust proxy (not Envoy). Fewer\n  knobs, easy to run; less flexible for complex L7 needs.\n- **Consul (service mesh)** — HashiCorp's mesh, also Envoy-based, strong in multi-platform / VM +\n  Kubernetes environments.\n- **Envoy Gateway / Contour / Gloo** — these are **gateways** (edge ingress), not full meshes.\n  They manage north-south (in/out) traffic, not necessarily every east-west (service-to-service)\n  call. A mesh covers east-west too.\n\nRule of thumb: **gateway** = your front door; **mesh** = the smart network *between* all your\nservices (which usually includes a gateway at the edge).\n\n## When Istio is (and isn't) worth it\n\n**Worth it when:** you have many services, need uniform encryption/identity, want safe canary\nreleases, and need consistent observability across teams — without every team re-implementing it.\n\n**Overkill when:** you have a handful of services. A single edge gateway plus basic\nretries/timeouts in code is simpler. The cost/benefit shifts as the system grows — and ambient\nmode lowers the entry cost considerably.\n\n## The mental checklist for this course\n\nWhen you look at any Istio setup, ask:\n\n1. **Is the workload in the mesh?** (sidecar injected, or namespace in ambient?)\n2. **How does traffic get in?** (a Gateway + VirtualService, or Gateway API)\n3. **Where does it route, and how is it split?** (VirtualService + DestinationRule subsets)\n4. **Is it secured?** (mTLS mode + AuthorizationPolicy)\n5. **Can I see it?** (Kiali/metrics/traces)\n\nThose five questions are the whole game. Every module fills in one."}, {"id": "01-architecture", "title": "1 · Architecture (istiod + proxies)", "group": "Fundamentals", "md": "*No lab — this is the map. Once you can trace how your YAML becomes proxy behavior, every later\nmodule reads itself. ~15 min.*\n\n---\n\n## The whole architecture in one picture\n\n```\n   YOU  ──apply──►  Kubernetes API  ◄──watches──  ┌───────────────┐\n   (VirtualService,                                │    istiod      │  ← the control plane (brain)\n    DestinationRule,                               │  (config + CA  │\n    PeerAuthentication…)                           │  + injector)   │\n                                                   └──────┬────────┘\n                                                          │ xDS (streams config + certs)\n                        ┌─────────────────────────────────┼───────────────────────┐\n                        ▼                                  ▼                        ▼\n                  [ Envoy sidecar ]                 [ Envoy sidecar ]        [ ingress gateway ]\n                    next to app A                     next to app B            (Envoy at the edge)\n                        │                                  ▲\n                        └────────── encrypted mTLS ────────┘   ← the data plane (muscle)\n```\n\nYou apply Istio objects to Kubernetes. **istiod** watches them, computes the right Envoy\nconfiguration, and streams it (plus TLS certificates) to every proxy over **xDS**. The proxies —\nthe **data plane** — carry the actual traffic.\n\n## istiod — the control plane, up close\n\n`istiod` is a single component that bundles three jobs (they used to be separate: Pilot, Citadel,\nGalley):\n\n- **Configuration (Pilot).** Watches the Kubernetes API for your Istio objects *and* for services\n  and pods coming/going. It converts all of that into Envoy config and pushes updates to every\n  proxy via **xDS** — live, no restarts. This is the bulk of what istiod does.\n- **Certificate Authority (Citadel).** Issues each workload a cryptographic **identity** as an\n  X.509 certificate (using the **SPIFFE** standard), and rotates these certs automatically. This is\n  what makes automatic **mTLS** possible — every proxy has a verifiable identity.\n- **Sidecar injection (webhook).** A Kubernetes \"mutating admission webhook\": when a pod is created\n  in an injection-enabled namespace, istiod automatically edits the pod spec to add the Envoy\n  sidecar container. That's why your pods came up as `2/2`.\n\nOne process, three hats. In production you run a few replicas of it for high availability.\n\n## The data plane — Envoy, in two roles\n\nSame Envoy binary, two placements:\n\n- **Sidecar proxy** — one Envoy per pod, intercepting that pod's traffic (sidecar mode).\n- **Gateway proxy** — standalone Envoys at the mesh edge (the **ingress gateway** for traffic\n  coming in, **egress gateway** for traffic going out).\n\nBoth are just Envoy, configured entirely by istiod. You never write their config directly.\n\n## How a sidecar hijacks your app's traffic (the clever bit)\n\nYour application code makes a normal network call — it has no idea Istio exists. So how does the\ntraffic reach the sidecar? When the sidecar is injected, an **init container** programs the pod's\n**iptables** rules so that:\n\n- every packet **leaving** the app is transparently redirected into the local Envoy (commonly port\n  `15001`),\n- every packet **arriving** at the pod is redirected into Envoy first (port `15006`),\n\nEnvoy then applies mTLS, routing, and policy, and forwards on. The app thinks it's talking directly\nto the other service; really every byte detours through its sidecar. This \"transparent\ninterception\" is why **no code changes** are needed.\n\n## How one request flows through the mesh\n\nFollow `productpage` calling `reviews`:\n\n1. productpage's app makes a plain call to `reviews:9080`.\n2. **Its sidecar intercepts the outbound request** (iptables), looks up istiod-provided routing\n   (VirtualService/DestinationRule), picks a healthy `reviews` endpoint and version, and opens an\n   **mTLS** connection to that pod's sidecar.\n3. **The reviews sidecar receives it**, verifies the caller's identity, checks any\n   **AuthorizationPolicy**, decrypts, and hands the plain request to the reviews app.\n4. The response returns the same way; **both sidecars record metrics/traces** for the hop.\n\nEvery call in the mesh is really *sidecar-to-sidecar*, encrypted, observed, and policy-checked —\nwith your apps none the wiser.\n\n## Ambient mode architecture (preview)\n\nIn ambient mode the picture changes: instead of a sidecar per pod, a per-node **ztunnel** handles\nmTLS + L4 for all local pods, and an Envoy **waypoint** is deployed per-namespace/service for L7.\nistiod still programs everything over xDS; only *where the proxies live* differs. Full detail in\nModule 8.\n\n## The Istio object model (what you'll actually write)\n\nAll Istio config is **Kubernetes Custom Resources** (CRDs) — YAML you `kubectl apply`. The families:\n\n| Object | Purpose | Module |\n|--------|---------|--------|\n| **Gateway** | Configure an edge proxy: ports, hosts, TLS (the front door) | 3 |\n| **VirtualService** | Routing rules: match → destination, splits, rewrites, retries, faults | 3–5 |\n| **DestinationRule** | Post-routing policy: subsets (versions), load balancing, pooling, outlier detection | 4–5 |\n| **PeerAuthentication** | mTLS mode (STRICT/PERMISSIVE) for workloads | 6 |\n| **AuthorizationPolicy** | Who may call whom (allow/deny by identity, path, method) | 6 |\n| **Telemetry** | Tune metrics/traces/logging | 7 |\n| **Sidecar / WorkloadEntry / ServiceEntry** | Scope proxies, add non-K8s or external endpoints | later reading |\n\nYou'll meet the top five constantly. Everything else is refinement."}, {"id": "02-lab-install-and-inject", "title": "2 · Lab: install & inspect", "group": "Fundamentals", "md": "*Hands-on. You'll confirm Istio is running, see a sidecar get injected, and use `istioctl` to look\nat the Envoy config istiod generated. ~20 min. Assumes you finished the Setup page.*\n\nIf you completed **Setup**, your cluster already has Istio and Bookinfo. This lab is about *seeing*\nthe machinery you read about in Module 1. If you deleted the cluster, redo Setup Steps 2–6 first.\n\n---\n\n## 1. Confirm the control plane is healthy\n\n```bash\nkubectl get pods -n istio-system           # istiod + gateways Running\nistioctl version                           # client + control-plane versions match\nistioctl x precheck                         # sanity checks the install\n```\n\n## 2. See sidecar injection happen live\n\nInjection is a namespace label. Watch it work on a fresh pod:\n\n```bash\n# a namespace WITHOUT the label — no sidecar\nkubectl create namespace nomesh\nkubectl -n nomesh run demo --image=nginx --restart=Never\nkubectl -n nomesh get pod demo             # READY 1/1  — no sidecar\n\n# the default namespace HAS the label (from Setup) — sidecar injected\nkubectl -n default run demo --image=nginx --restart=Never\nkubectl -n default get pod demo            # READY 2/2  — app + istio-proxy\n```\n\nThe difference — `1/1` vs `2/2` — is the injector webhook adding an Envoy container. Prove it:\n\n```bash\nkubectl -n default get pod demo -o jsonpath='{.spec.containers[*].name}'\n# → demo istio-proxy\n```\n\nClean up the demos:\n\n```bash\nkubectl -n default delete pod demo; kubectl delete namespace nomesh\n```\n\n## 3. List the proxies istiod is managing\n\n```bash\nistioctl proxy-status\n# one line per proxy (each Bookinfo pod + the gateways), showing sync state SYNCED\n```\n\n`SYNCED` means the proxy has the latest config istiod pushed. Anything stuck in `STALE`/`NOT SENT`\nis a red flag (Module 10).\n\n## 4. Look at the Envoy config istiod generated\n\nYou wrote no Envoy config — istiod did. Inspect what a sidecar actually received. Pick the\n`productpage` pod:\n\n```bash\nPP=$(kubectl get pod -l app=productpage -o jsonpath='{.items[0].metadata.name}')\n\nistioctl proxy-config listeners $PP        # the ports this proxy handles\nistioctl proxy-config routes    $PP        # HTTP route rules\nistioctl proxy-config clusters  $PP        # upstream services it knows about\nistioctl proxy-config endpoints $PP        # the actual pod IPs behind each service\n```\n\nEverything you learned in the Envoy course (listeners → routes → clusters → endpoints) is here —\nexcept **you never wrote it**. istiod discovered every service in the cluster and generated it.\nNotice clusters for `reviews`, `details`, `ratings`, etc., each with real endpoint IPs.\n\n## 5. See the mTLS certificate a workload was issued\n\nistiod's built-in CA gave each workload an identity:\n\n```bash\nistioctl proxy-config secret $PP           # lists the workload's certs\n# The identity is a SPIFFE URI like spiffe://cluster.local/ns/default/sa/bookinfo-productpage\n```\n\nThat SPIFFE identity is what mTLS and AuthorizationPolicy (Module 6) use to know *who* a caller is.\n\n## 6. Generate traffic and watch a proxy's stats\n\nSend some requests, then read the sidecar's own metrics (same admin interface as raw Envoy, port\n15000 inside the pod):\n\n```bash\n# drive traffic\nfor i in $(seq 1 20); do\n  kubectl exec \"$(kubectl get pod -l app=ratings -o jsonpath='{.items[0].metadata.name}')\" \\\n    -c ratings -- curl -s productpage:9080/productpage >/dev/null; done\n\n# read the productpage sidecar's request counters\nkubectl exec $PP -c istio-proxy -- curl -s localhost:15000/stats | grep -E \"reviews.*upstream_rq_total\"\n```\n\nYou're looking at the exact Envoy stats from the Envoy course — now auto-generated inside a mesh.\n\n## Experiments\n\n1. **Break injection ordering.** Deploy an app to a namespace *before* labelling it, note `1/1`,\n   then label it and `kubectl rollout restart` the deployment — it comes back `2/2`. Injection\n   happens at pod *creation*, so existing pods must be recreated.\n2. **Diff two proxies.** Run `istioctl proxy-config clusters` for `productpage` vs `ratings`. They\n   differ — each proxy only gets the config relevant to its workload, computed by istiod.\n3. **Trigger `analyze`.** Run `istioctl analyze -n default` — it scans your config for problems and\n   prints warnings. You'll use this constantly (Module 10)."}, {"id": "03-traffic-gateway-virtualservice", "title": "3 · Ingress: Gateway & VirtualService", "group": "Fundamentals", "md": "*Concepts + a lab getting outside traffic into the mesh and routing it. ~25 min. Uses the Bookinfo\napp from Setup.*\n\n---\n\nTwo objects do most traffic work in Istio, and they answer two different questions:\n\n- **Gateway** — \"**let traffic in**.\" It configures an edge Envoy (the ingress gateway) to accept\n  connections on a port/host/protocol. It's the front door, nothing more.\n- **VirtualService** — \"**where does this traffic go?**\" The routing rules: match on host/path/\n  headers and send to a service (optionally a specific version, with rewrites, splits, retries).\n\nA Gateway without a VirtualService is an open door with no directions. You almost always use them\ntogether.\n\n## Gateway — the front door\n\n```yaml\napiVersion: networking.istio.io/v1\nkind: Gateway\nmetadata:\n  name: bookinfo-gateway\nspec:\n  selector:\n    istio: ingressgateway        # which edge proxy this configures (the one installed by Istio)\n  servers:\n  - port:\n      number: 80\n      name: http\n      protocol: HTTP\n    hosts:\n    - \"*\"                        # accept any Host header (a real site lists its domains)\n```\n\nThis says: on the ingress gateway, open port 80 for HTTP, for any host. It does **not** say where\nrequests go — that's the VirtualService's job.\n\n## VirtualService — the routing rules\n\n```yaml\napiVersion: networking.istio.io/v1\nkind: VirtualService\nmetadata:\n  name: bookinfo\nspec:\n  hosts:\n  - \"*\"\n  gateways:\n  - bookinfo-gateway            # attach these rules to the Gateway above\n  http:\n  - match:                       # only these paths are exposed publicly\n    - uri: { exact: /productpage }\n    - uri: { prefix: /static }\n    - uri: { exact: /login }\n    - uri: { prefix: /api/v1/products }\n    route:\n    - destination:\n        host: productpage        # the in-cluster Service to send matched traffic to\n        port: { number: 9080 }\n```\n\nKey ideas:\n\n- **`hosts`** — which incoming hostnames these rules apply to.\n- **`gateways`** — bind to a Gateway (for ingress). Omit it / use `mesh` and the rules apply to\n  *internal* service-to-service traffic instead — VirtualServices work east-west too, not just at\n  the edge.\n- **`http[].match`** — ordered rules on uri/headers/method/query. **First match wins** (same as raw\n  Envoy).\n- **`route[].destination.host`** — the target Kubernetes Service (and optionally a `subset` = a\n  version; Module 4).\n\n## Lab: expose Bookinfo to the outside\n\nIstio ships these exact manifests. From inside your `istio-*` folder:\n\n```bash\nkubectl apply -f samples/bookinfo/networking/bookinfo-gateway.yaml\nistioctl analyze                 # should report no problems\n```\n\nFind how to reach the ingress gateway. On kind, port-forward it:\n\n```bash\n# forward localhost:8080 to the ingress gateway's port 80\nkubectl -n istio-system port-forward svc/istio-ingressgateway 8080:80\n```\n\nIn another terminal:\n\n```bash\ncurl -s \"http://localhost:8080/productpage\" | grep -o \"<title>.*</title>\"\n# → <title>Simple Bookstore App</title>\n```\n\nYou just reached an in-mesh app from outside, through the ingress gateway. Open\n<http://localhost:8080/productpage> in a browser and refresh a few times — note the **Book Reviews**\nbox sometimes shows stars, sometimes not: that's the three `reviews` versions being hit\nround-robin. We'll take control of that in Module 4.\n\n### Prove the routing is selective\n\nThe VirtualService only exposed specific paths. Try one it didn't:\n\n```bash\ncurl -s -o /dev/null -w \"%{http_code}\\n\" \"http://localhost:8080/\"          # 404 — not matched\ncurl -s -o /dev/null -w \"%{http_code}\\n\" \"http://localhost:8080/productpage\" # 200 — matched\n```\n\nOnly the paths you listed are reachable — the gateway is a controlled front door, not a wide-open\nproxy.\n\n### Experiments\n\n1. **Add a path.** Edit the VirtualService to also expose `prefix: /api/v1/products` responses (it\n   already is) — try changing a `prefix` to something wrong, re-apply, and watch that route 404.\n2. **Host-based routing.** Change `hosts` to `bookinfo.local` and re-run curl with\n   `-H \"Host: bookinfo.local\"`. Only requests with that Host now match — how one gateway serves many\n   sites.\n3. **`istioctl analyze` a mistake.** Point the VirtualService `gateways` at a name that doesn't\n   exist, apply, and run `istioctl analyze` — it flags the dangling reference."}, {"id": "04-traffic-destinationrule-canary", "title": "4 · DestinationRule & canaries", "group": "Fundamentals", "md": "*The payoff module: safely shifting traffic between versions. Concepts + a hands-on canary. ~25\nmin. Uses Bookinfo (which has three `reviews` versions).*\n\n---\n\n## VirtualService vs DestinationRule (the pairing to memorize)\n\nThey work as a team:\n\n- **VirtualService = the \"where.\"** Routing decisions: which service, which **subset** (version),\n  what weights/splits, matches, rewrites.\n- **DestinationRule = the \"how.\"** Policy applied *after* a destination is chosen: load-balancing\n  algorithm, connection pool limits, outlier detection — **and crucially, it defines the `subsets`**\n  (named versions) that a VirtualService can route to.\n\n> A VirtualService can't send traffic to \"v2\" until a DestinationRule has *defined* what \"v2\" means\n> (which pods, by label). Define subsets in the DestinationRule; route to them in the\n> VirtualService.\n\n## Defining versions with subsets\n\nBookinfo's `reviews` pods are labelled `version: v1|v2|v3`. A DestinationRule turns those labels\ninto named subsets:\n\n```yaml\napiVersion: networking.istio.io/v1\nkind: DestinationRule\nmetadata:\n  name: reviews\nspec:\n  host: reviews                 # the Service\n  subsets:\n  - name: v1\n    labels: { version: v1 }     # subset v1 = pods labelled version=v1\n  - name: v2\n    labels: { version: v2 }\n  - name: v3\n    labels: { version: v3 }\n```\n\nNow \"v2\" is a thing a VirtualService can target.\n\n## Lab: pin, split, then canary `reviews`\n\n### Step 0 — apply the DestinationRules\n\n```bash\nkubectl apply -f samples/bookinfo/networking/destination-rule-all.yaml\n```\n\n### Step 1 — pin everyone to v1 (no more random stars)\n\n```bash\nkubectl apply -f samples/bookinfo/networking/virtual-service-all-v1.yaml\n```\n\nThat file routes every service to its v1 subset. Refresh\n<http://localhost:8080/productpage> (keep the port-forward from Module 3 running) — the reviews box\nnow **always** shows the v1 look (no stars), every time. You've taken control of versioning.\n\n### Step 2 — a 50/50 canary split\n\nApply a VirtualService that weights `reviews` traffic between v1 and v3:\n\n```bash\nkubectl apply -f samples/bookinfo/networking/virtual-service-reviews-50-v3.yaml\n```\n\nThe relevant part looks like:\n\n```yaml\nhttp:\n- route:\n  - destination: { host: reviews, subset: v1 }\n    weight: 50\n  - destination: { host: reviews, subset: v3 }\n    weight: 50\n```\n\nRefresh the page repeatedly: about **half** the loads show v3 (red stars), half show v1 (none).\nThat's a **canary** — a controlled percentage on the new version. To roll out, you'd shift 50 → 90\n→ 100; to abort, back to 0. Traffic percentage, not luck.\n\n### Step 3 — route by identity (header-based)\n\nSend only a specific user to v2 while everyone else stays on v1:\n\n```bash\nkubectl apply -f samples/bookinfo/networking/virtual-service-reviews-test-v2.yaml\n```\n\nThat rule matches a header (`end-user: jason`) and routes only those requests to v2. Log into the\nBookinfo page as user **jason** (any password) and you'll see v2; log out and you're back on v1.\nThis is how you dark-launch a feature to internal users or a cohort before anyone else.\n\n```yaml\nhttp:\n- match:\n  - headers: { end-user: { exact: jason } }\n  route:\n  - destination: { host: reviews, subset: v2 }\n- route:                                    # everyone else\n  - destination: { host: reviews, subset: v1 }\n```\n\n## DestinationRule's other job: traffic policy\n\nBeyond subsets, a DestinationRule sets *how* to talk to a destination:\n\n```yaml\nspec:\n  host: reviews\n  trafficPolicy:\n    loadBalancer: { simple: LEAST_REQUEST }   # or ROUND_ROBIN, RANDOM, consistent-hash for affinity\n    connectionPool:\n      tcp: { maxConnections: 100 }\n      http: { http2MaxRequests: 1000 }\n  subsets: [ ... ]\n```\n\nPolicy can be set for the whole host or per subset. Load-balancing and connection pools here are the\nsame primitives from the Envoy course — Istio just exposes them declaratively.\n\n## Reset when done\n\n```bash\nkubectl apply -f samples/bookinfo/networking/virtual-service-all-v1.yaml   # back to all-v1\n```"}, {"id": "05-resilience-fault-injection", "title": "5 · Resilience & fault injection", "group": "Fundamentals", "md": "*Make the mesh survive failure — and deliberately cause failure to test it. Concepts + a lab. ~25\nmin. Uses Bookinfo.*\n\n---\n\nDistributed systems fail constantly: a service is slow, a pod dies mid-request, the network blips.\nIstio lets you add resilience as configuration and — just as important — **inject faults on purpose**\nto check your resilience actually works.\n\n## Timeouts — don't wait forever\n\nBy default a request waits a long time for a slow backend, tying up resources. Cap it in the\nVirtualService:\n\n```yaml\nhttp:\n- route:\n  - destination: { host: reviews, subset: v1 }\n  timeout: 1s        # give up after 1 second, return an error to the caller\n```\n\n## Retries — paper over transient failures\n\nRe-send a failed idempotent request to another instance before giving up:\n\n```yaml\nhttp:\n- route:\n  - destination: { host: reviews }\n  retries:\n    attempts: 3\n    perTryTimeout: 500ms\n    retryOn: 5xx,reset,connect-failure    # what counts as retryable\n```\n\nRetries + multiple healthy pods make a single transient failure invisible to the caller. (Careful:\nretries multiply load — keep `attempts` modest and only retry idempotent calls.)\n\n## Circuit breaking — stop hammering a sick service\n\nSet in the **DestinationRule**. Two parts:\n\n```yaml\nspec:\n  host: reviews\n  trafficPolicy:\n    connectionPool:                 # cap concurrency — the \"breaker\"\n      tcp: { maxConnections: 1 }\n      http: { http1MaxPendingRequests: 1, maxRequestsPerConnection: 1 }\n    outlierDetection:               # eject unhealthy pods automatically\n      consecutive5xxErrors: 3\n      interval: 10s\n      baseEjectionTime: 30s         # pull a bad pod out for 30s, then tentatively return it\n```\n\n- **`connectionPool`** limits how many concurrent requests/connections a destination gets. Exceed\n  it and new requests fail fast (a 503) instead of piling up — that's the circuit \"tripping.\"\n- **`outlierDetection`** watches real responses and **ejects** a pod that returns repeated errors,\n  routing around it — the same passive health checking from the Envoy course.\n\n## Fault injection — break things on purpose\n\nThe clever inverse of resilience: make Istio *inject* delays or errors so you can verify callers\nhandle them. Set it in the VirtualService.\n\n**Inject a delay** (test timeouts/retries):\n\n```yaml\nhttp:\n- fault:\n    delay:\n      percentage: { value: 100 }\n      fixedDelay: 7s          # add 7s to every matching request\n  route:\n  - destination: { host: ratings, subset: v1 }\n```\n\n**Inject an abort** (test error handling):\n\n```yaml\nhttp:\n- fault:\n    abort:\n      percentage: { value: 50 }\n      httpStatus: 500         # fail half the requests with 500\n  route:\n  - destination: { host: ratings, subset: v1 }\n```\n\nThe backend never sees these — Istio's proxy fabricates the delay/error. This is chaos engineering\nas config.\n\n## Lab: inject a fault and watch it surface\n\nIstio ships a fault example. With Bookinfo pinned to v1 (Module 4) and logged in as **jason**:\n\n```bash\n# route jason's reviews to v2, and inject a 7s delay into ratings for jason\nkubectl apply -f samples/bookinfo/networking/virtual-service-ratings-test-delay.yaml\n```\n\nNow load <http://localhost:8080/productpage> as jason. The page is **slow and the reviews section\nshows an error** — because `reviews:v2` has a hard-coded 10s timeout calling `ratings`, but a\n*3-retry × 2s* budget elsewhere trips first. You just discovered a real timeout bug using fault\ninjection, exactly as the Istio tutorial intends.\n\nFix-test loop: add a `timeout` or adjust retries in the VirtualService, re-apply, reload, and watch\nthe behavior change — all without redeploying a single service.\n\n### Experiment: abort injection\n\nApply an abort fault (500 at 50%) to `ratings` for jason (edit the delay sample's `fault` block to\nuse `abort`), reload repeatedly, and watch the reviews stars appear/disappear as half the ratings\ncalls fail — confirming how the UI degrades under partial failure.\n\n## Reset\n\n```bash\nkubectl apply -f samples/bookinfo/networking/virtual-service-all-v1.yaml\n```"}, {"id": "11-egress-serviceentry", "title": "5b · Egress & ServiceEntry", "group": "Fundamentals", "md": "*The mesh knows every service inside it — and nothing about the internet. This module is about calls that leave the cluster. ~10 min read.*\n\n---\n\nEvery module so far managed traffic *between* your services. But real applications call out:\nStripe, S3, a partner's API, the legacy database that never moved. By default that traffic is a\nblind spot — and in a security review, the blind spot is the finding. This module closes it.\n\n## The default: outbound traffic is invisible, and allowed\n\nOut of the box, Istio's sidecars pass through traffic to unknown destinations\n(`outboundTrafficPolicy: ALLOW_ANY`). Your pod can call `api.stripe.com` — it works, but the mesh\nsees only \"bytes to somewhere\": no per-destination telemetry, no retries or timeouts, no policy.\nKiali draws it as traffic to a black hole named `PassthroughCluster`.\n\nThe strict posture flips the default:\n\n```yaml\nmeshConfig:\n  outboundTrafficPolicy:\n    mode: REGISTRY_ONLY     # unknown destination => connection refused\n```\n\nNow the mesh is a **default-deny egress boundary**: a compromised pod can't quietly exfiltrate\ndata to an attacker's server, because the attacker's server isn't in the registry. The cost: every\nlegitimate external dependency must now be *declared*. That declaration is the ServiceEntry.\n\n## ServiceEntry: teaching the mesh about the outside\n\nA **ServiceEntry** adds an external destination to Istio's service registry — after which the mesh\ntreats it like any other service:\n\n```yaml\napiVersion: networking.istio.io/v1\nkind: ServiceEntry\nmetadata: { name: stripe }\nspec:\n  hosts: [api.stripe.com]\n  location: MESH_EXTERNAL\n  resolution: DNS\n  ports:\n  - { number: 443, name: tls, protocol: TLS }\n```\n\nTwo consequences, immediately: the call is **allowed** again under `REGISTRY_ONLY`, and it's\n**visible** — `api.stripe.com` appears in Kiali and the metrics with its own request rates and\nerror counts. And because it's registry material, the module 4–5 machinery now applies to it: a\n`VirtualService` can put a 3-second timeout on Stripe calls, a `DestinationRule` can cap\nconnections and eject a flapping endpoint — your resilience policies, wrapped around a dependency\nyou don't operate. Declaring an entry per external dependency also produces something audit teams\nask for and rarely get: a *reviewed*, version-controlled list of everything the cluster talks to.\n\n## The honest caveat: hosts vs IPs\n\n`REGISTRY_ONLY` matches TLS traffic by **SNI hostname**. A pod calling a raw IP, or speaking a\nprotocol without SNI, doesn't match a `hosts:` entry — and sufficiently deliberate malware can\nshape its traffic to dodge host-based matching. Treat mesh egress control as a strong *first*\nfence — excellent against accidents, misconfig, and lazy attackers — and pair it with\n**NetworkPolicy** (Kubernetes course, module 7) at L3/L4 for the layer below. Defense in depth,\nnot either/or.\n\n## The egress gateway: one door out\n\nFor compliance postures that require outbound traffic to exit from *known network locations* —\n\"only these IPs may reach the payment processor\" — Istio offers the **egress gateway**: the mirror\nof module 3's ingress. Sidecars route external calls to a dedicated Envoy fleet, which makes the\nactual outbound connection:\n\n```\npod → sidecar ──mTLS──► egress gateway ──TLS──► api.stripe.com\n```\n\nThe wins: the processor can allowlist the gateway's IPs; outbound TLS origination happens at one\naudited place; and *all* external traffic funnels through a choke point you can log, meter, and —\nin an incident — close. The cost is real too: an extra hop, an extra fleet to run, and more YAML\n(the VirtualService that reroutes sidecar→gateway is famously fiddly). The honest sizing: most\nteams live well on `REGISTRY_ONLY` + ServiceEntries; add the egress gateway when a regulator,\npartner contract, or SOC's allowlist asks for it by name — not before.\n\n## The checklist\n\n- Flip to `REGISTRY_ONLY` early — retrofitting it after a hundred undeclared dependencies is an\n  archaeology project. (Grep Kiali/metrics for `PassthroughCluster` traffic *first* to find them.)\n- One **ServiceEntry per external dependency**, in version control, reviewed like code.\n- Timeouts and `DestinationRule` circuit breaking on the entries that matter — external services\n  fail more, not less, than yours.\n- **NetworkPolicy underneath**, egress gateway when compliance calls for it."}, {"id": "06-security-mtls-authz", "title": "6 · Security: mTLS & authorization", "group": "Fundamentals", "md": "*The reason many teams adopt Istio: encryption and access control between services, with no app\nchanges. Concepts + a lab. ~25 min. Uses Bookinfo.*\n\n---\n\nIstio security has two layers, and they answer different questions:\n\n- **Authentication (mTLS)** — \"**is this connection encrypted, and who is the caller?**\" Handled by\n  mutual TLS between proxies, using the identities istiod's CA issued.\n- **Authorization (AuthorizationPolicy)** — \"**is this caller *allowed* to do this?**\" Allow/deny\n  rules based on identity, namespace, path, and method.\n\nEncrypt first (mTLS), then decide who may do what (authz).\n\n## mTLS — automatic mutual encryption\n\n\"Mutual TLS\" means **both** ends present a certificate and verify the other. Regular HTTPS only\nauthenticates the server; mTLS authenticates the client too. In Istio, every workload already has a\nSPIFFE identity cert (Module 1), so the sidecars can do mTLS **automatically** — you turn it on with\npolicy, no certs to manage.\n\n### PERMISSIVE vs STRICT\n\nBy default Istio uses **PERMISSIVE** mode: a proxy accepts *both* mTLS and plain traffic. This lets\nyou adopt Istio gradually without breaking not-yet-meshed clients. Once everything is in the mesh,\nswitch to **STRICT** — plaintext is rejected.\n\n```yaml\napiVersion: security.istio.io/v1\nkind: PeerAuthentication\nmetadata:\n  name: default\n  namespace: default            # scope: this whole namespace\nspec:\n  mtls:\n    mode: STRICT                # require mTLS; reject any plaintext\n```\n\nScope options: **mesh-wide** (put it in `istio-system` named `default`), **per-namespace** (as\nabove), or **per-workload** (add a `selector`). Narrow scopes override broader ones.\n\n## AuthorizationPolicy — who may call whom\n\nOnce you know *who* the caller is (via mTLS identity), you can allow/deny. Default with no policy:\neverything is allowed. Add an **ALLOW** policy and only listed traffic is permitted to that\nworkload; add a **DENY** policy to block specific traffic.\n\n```yaml\napiVersion: security.istio.io/v1\nkind: AuthorizationPolicy\nmetadata:\n  name: reviews-viewer\n  namespace: default\nspec:\n  selector:\n    matchLabels: { app: reviews }        # this policy protects the reviews workload\n  action: ALLOW\n  rules:\n  - from:\n    - source:\n        principals: [\"cluster.local/ns/default/sa/bookinfo-productpage\"]  # only productpage's identity\n    to:\n    - operation:\n        methods: [\"GET\"]                  # may only GET\n```\n\n`principals` are SPIFFE identities (tied to Kubernetes ServiceAccounts). You can also match by\n`namespaces`, `ipBlocks`, request `paths`, `methods`, and even JWT claims. This is **identity-based**\naccess control — far stronger than IP allowlists, because identity is cryptographically proven by\nmTLS.\n\n## Lab: enforce mTLS, then lock down access\n\n### Step 1 — turn on STRICT mTLS for the namespace\n\n```bash\nkubectl apply -f - <<'EOF'\napiVersion: security.istio.io/v1\nkind: PeerAuthentication\nmetadata: { name: default, namespace: default }\nspec:\n  mtls: { mode: STRICT }\nEOF\n```\n\nBookinfo still works (all its pods are meshed, so they speak mTLS). Prove plaintext is now rejected\nby calling a service from a **non-mesh** pod:\n\n```bash\nkubectl create ns nomesh\nkubectl -n nomesh run curl --image=curlimages/curl -it --rm --restart=Never -- \\\n  curl -sS http://productpage.default:9080/productpage\n# → connection reset / failure: plaintext is refused under STRICT\nkubectl delete ns nomesh\n```\n\n### Step 2 — verify traffic is actually encrypted\n\n```bash\n# Kiali shows a padlock on mTLS edges; from the CLI, check the mode Istio computed:\nistioctl proxy-config secret \"$(kubectl get pod -l app=productpage -o jsonpath='{.items[0].metadata.name}')\" | head\n```\n\n### Step 3 — add an authorization policy\n\nDeny everything to `reviews`, then allow only `productpage`:\n\n```bash\n# 1) default-deny for reviews (empty ALLOW rules = allow nothing)\nkubectl apply -f - <<'EOF'\napiVersion: security.istio.io/v1\nkind: AuthorizationPolicy\nmetadata: { name: reviews-deny-all, namespace: default }\nspec:\n  selector: { matchLabels: { app: reviews } }\n  action: ALLOW\n  rules: []\nEOF\n```\n\nReload the page — the **reviews box now errors** (nothing is allowed to call reviews). Now permit\nproductpage:\n\n```bash\nkubectl apply -f - <<'EOF'\napiVersion: security.istio.io/v1\nkind: AuthorizationPolicy\nmetadata: { name: reviews-allow-productpage, namespace: default }\nspec:\n  selector: { matchLabels: { app: reviews } }\n  action: ALLOW\n  rules:\n  - from:\n    - source: { principals: [\"cluster.local/ns/default/sa/bookinfo-productpage\"] }\nEOF\n```\n\nReload — reviews work again, but **only** because the request comes from productpage's proven\nidentity. You've enforced least-privilege service-to-service access with no code changes.\n\n### Clean up the policies\n\n```bash\nkubectl delete authorizationpolicy reviews-deny-all reviews-allow-productpage -n default\nkubectl delete peerauthentication default -n default    # back to PERMISSIVE default\n```"}, {"id": "12-request-auth-jwt", "title": "6b · Request auth: JWTs", "group": "Fundamentals", "md": "*mTLS proved which SERVICE is calling. This module proves which USER the request is for — and locks the two together. ~11 min read.*\n\n---\n\nModule 6 gave every workload a certificate: **PeerAuthentication**, the *service* half of\nidentity. But \"the frontend called the orders service\" is only half a security story — *on whose\nbehalf?* That's the request's user, carried as a **JWT**, and Istio can verify it at the sidecar,\nbefore your code runs. If you've worked through Identity Dojo's OAuth/OIDC streams, this module\nis where that material gets enforced by infrastructure.\n\n## RequestAuthentication: teach the sidecar to check tokens\n\n```yaml\napiVersion: security.istio.io/v1\nkind: RequestAuthentication\nmetadata: { name: orders-jwt, namespace: prod }\nspec:\n  selector: { matchLabels: { app: orders } }\n  jwtRules:\n  - issuer: \"https://auth.example.com\"\n    jwksUri: \"https://auth.example.com/.well-known/jwks.json\"\n    audiences: [\"orders-api\"]\n```\n\nThe sidecar now validates any `Authorization: Bearer …` token on requests to `orders`: signature\nagainst the issuer's published keys (**JWKS** — fetched and cached automatically, so key rotation\nat the IdP just works), plus `iss`, `exp`, and `aud`. Identity Dojo taught why each check exists;\nhere they run in the proxy, identically, for every service you select — no library drift, no\nservice that forgot.\n\n**The trap everyone hits:** RequestAuthentication alone does *not* require a token. It says \"IF a\ntoken is present, it must be valid.\" A request with **no token at all sails through** — validated\ntokens produce identity, absent tokens produce nothing, and nothing isn't rejected. Requiring a\ntoken is an *authorization* decision, and that's deliberate: validation (is it real?) and policy\n(is it required, and for what?) are different questions with different owners.\n\n## Closing the gap: AuthorizationPolicy on request principals\n\n```yaml\napiVersion: security.istio.io/v1\nkind: AuthorizationPolicy\nmetadata: { name: orders-require-jwt, namespace: prod }\nspec:\n  selector: { matchLabels: { app: orders } }\n  action: ALLOW\n  rules:\n  - from:\n    - source:\n        requestPrincipals: [\"https://auth.example.com/*\"]   # a VALID token, from OUR issuer\n```\n\n`requestPrincipals` (`issuer/subject`) exists only when a token validated — so this rule is \"no\nvalid token, no entry.\" From there, real policy is claim arithmetic:\n\n```yaml\n  rules:\n  - from: [{ source: { requestPrincipals: [\"https://auth.example.com/*\"] } }]\n    to:   [{ operation: { methods: [\"DELETE\"] } }]\n    when: [{ key: request.auth.claims[scope], values: [\"orders:admin\"] }]\n```\n\nDELETEs require the `orders:admin` scope — enforced in the sidecar, before the app. And the\nmodule 6 material composes with it: a rule can require `principals` (the mTLS *service* identity)\n**and** `requestPrincipals` (the *user*) — \"only the frontend may call orders, only with a valid\nuser token, and only admins may delete.\" Service identity from certificates, user identity from\ntokens, one policy. That sentence is the whole zero-trust pitch, made concrete.\n\n## Where to enforce: gateway, service, or both\n\n- **At the ingress gateway** — reject bad and missing tokens at the front door, before they spend\n  any internal capacity. Cheap, central, and the right first line.\n- **At the service** — the zero-trust position: the orders service doesn't *trust* that the\n  gateway checked; its own sidecar re-verifies. Verification is local (signature + cached JWKS),\n  so the second check costs microseconds, not a network hop.\n- **Both** is the grown-up answer, and it's cheap precisely because JWTs verify offline.\n\nWhat the sidecar does **not** do: issue tokens, refresh them, or run login flows — that's your\nIdP's job, and your app still reads claims for fine-grained, data-dependent decisions (\"is this\n*their* order?\"). The mesh enforces the perimeter conditions; it doesn't become your authorization\nmodel.\n\n## Debugging the three famous failures\n\n| Symptom | Meaning | Look at |\n|---|---|---|\n| `401 Jwt issuer is not configured` | Token's `iss` doesn't match any jwtRule | The rule's `issuer` vs the token's claim — decode it (Identity Dojo way: locally, never a web decoder) |\n| `401 Jwt verification fails` | Signature/expiry/audience failed | `aud` vs `audiences`, token expiry, IdP keys reachable from the *sidecar* (a `REGISTRY_ONLY` mesh needs a ServiceEntry — module 5b! — for the jwksUri) |\n| `403 RBAC: access denied` | Token fine; policy said no | Which AuthorizationPolicy matched: `istioctl x authz check <pod>` |\n\nThat middle row is the cross-module bug worth remembering: strict egress silently blocks JWKS\nfetches, and every token becomes \"invalid.\" The mesh's features interact; the debugging habit is\nthe same as ever — read the response flag, find the deciding component, check its config."}, {"id": "07-observability-kiali-telemetry", "title": "7 · Observability: Kiali & telemetry", "group": "Fundamentals", "md": "*Because every request passes through a proxy, Istio can show you the whole system for free.\nConcepts + a lab using the dashboards. ~20 min. Uses the add-ons from Setup Step 8.*\n\n---\n\nIstio gives you the classic **three pillars** of observability — metrics, traces, logs — plus a\nlive **service graph**, all generated by the proxies without instrumenting your apps. The add-ons\nyou installed (Prometheus, Grafana, Kiali, Jaeger) turn that data into dashboards.\n\n## What each tool is for\n\n| Tool | Shows you | Analogy |\n|------|-----------|---------|\n| **Prometheus** | Collects/stores the metrics the proxies emit | The database of numbers |\n| **Grafana** | Graphs those metrics over time (dashboards) | The charts |\n| **Kiali** | A live **map** of services and how they call each other | The X-ray of your mesh |\n| **Jaeger** | **Distributed traces**: one request's whole journey across services | The flight recorder |\n\n## The golden signals, for free\n\nEvery sidecar emits standard metrics for the traffic it handles, so you get the **\"golden signals\"**\nper service without any code:\n\n- **Request rate** (traffic) — requests/sec, e.g. `istio_requests_total`.\n- **Errors** — the fraction returning 5xx.\n- **Duration (latency)** — p50/p90/p99 response times, `istio_request_duration_milliseconds`.\n- **Saturation** — connection/queue pressure.\n\nThese are consistent across every service in any language — the mesh measures at the proxy, so a\nGo service and a Python service report identically.\n\n## Distributed tracing (the one caveat)\n\nA **trace** stitches together every hop a single request took (productpage → reviews → ratings),\nwith timing for each, so you can see *which* hop is slow. Istio's proxies generate and report the\nspans automatically — **but** they can only link the hops if your apps **forward the tracing\nheaders** (like `traceparent`/`x-request-id`) from incoming to outgoing requests. That header\npropagation is the one small thing apps must do; Bookinfo already does it. Everything else (span\ncreation, reporting to Jaeger) is the mesh.\n\n## Lab: watch your traffic\n\nMake sure the add-ons are installed (Setup Step 8) and generate steady traffic first:\n\n```bash\n# generate load for ~1 minute so the dashboards have data\nfor i in $(seq 1 200); do curl -s http://localhost:8080/productpage >/dev/null; sleep 0.3; done &\n```\n\n### Kiali — the service graph\n\n```bash\nistioctl dashboard kiali        # opens Kiali; go to the Graph view, namespace \"default\"\n```\n\nYou'll see nodes for `productpage`, `reviews` (v1/v2/v3), `details`, `ratings`, with **arrows\nshowing live traffic**, request rates, and health colors. Padlock icons mark mTLS-encrypted edges.\nChange the reviews split (Module 4) and watch the graph's arrows re-weight in real time. This single\nview is why teams love Istio — you *see* your architecture and its health.\n\n### Grafana — the metrics dashboards\n\n```bash\nistioctl dashboard grafana      # open the \"Istio Service Dashboard\"\n```\n\nPick the `productpage` service and watch request volume, success rate, and latency percentiles —\nthe golden signals, graphed.\n\n### Jaeger — a single request's journey\n\n```bash\nistioctl dashboard jaeger       # search service \"productpage\", find a trace\n```\n\nOpen a trace to see the waterfall: productpage's call fanning out to details/reviews/ratings, each\nhop's duration. When something is slow, this tells you exactly *where*.\n\n## Tuning what's collected (Telemetry API)\n\nYou control telemetry declaratively with the **Telemetry** resource — e.g. sample 100% of traces in\ndev, add custom metric dimensions, or toggle access logging:\n\n```yaml\napiVersion: telemetry.istio.io/v1\nkind: Telemetry\nmetadata: { name: mesh-default, namespace: istio-system }\nspec:\n  tracing:\n  - randomSamplingPercentage: 100      # trace everything (dev only; lower in prod)\n  accessLogging:\n  - providers: [ { name: envoy } ]     # turn on access logs\n```"}, {"id": "08-ambient-mode", "title": "8 · Ambient mode (sidecarless)", "group": "Platform", "md": "*Istio's newer data-plane design: no sidecars. Concepts + a lab. ~25 min. Uses a **separate**\nambient install, so ideally a fresh kind cluster.*\n\n---\n\nYou met the idea in the primer; now the detail. **Ambient mode** removes the per-pod Envoy sidecar\nand splits the mesh's work into two layers so you pay for heavy L7 processing only where you need\nit.\n\n## The two layers\n\n- **ztunnel** (\"zero-trust tunnel\") — a lightweight agent (written in **Rust**) running **once per\n  node** as a DaemonSet. It handles the **secure L4 overlay**: transparent **mTLS**, identity, and\n  basic TCP-level routing/telemetry for every pod on that node. It does **not** do L7 (HTTP) logic.\n  Enabling it needs **no pod restarts**.\n- **waypoint proxy** — a full **Envoy**, deployed **only where you need L7 features** (HTTP routing,\n  traffic splitting, L7 authorization, retries). You add a waypoint per namespace or per service;\n  namespaces that only need encryption never pay for one.\n\n```\n   pod  pod  pod   ← your apps, NO sidecars\n     \\   |   /\n   [ ztunnel ]  (per node)  → mTLS + L4 for everyone, cheaply, no restarts\n        │\n   [ waypoint (Envoy) ]  (only where L7 rules are needed)\n```\n\n## Why it exists\n\nSidecars are powerful but cost a proxy's CPU/memory in **every** pod, add latency, and force a pod\nrestart on every Istio upgrade. Ambient:\n\n- **Cuts resource cost** — one ztunnel per node instead of one Envoy per pod.\n- **Adopts gradually** — label a namespace and get mTLS instantly, with no restarts; add L7 only\n  when a workload needs it.\n- **Simplifies upgrades** — updating the data plane doesn't churn your app pods.\n\nThe trade-off is a more layered architecture (two components instead of one), but for large fleets\nthe savings are substantial. It's production-ready and increasingly the default choice for new\nadoptions.\n\n## The layers map to L4 vs L7\n\nThis is the key mental model:\n\n- Need **encryption + identity + basic allow/deny at L4**? → **ztunnel alone** is enough.\n- Need **HTTP routing, weighted canaries, L7 authz, retries**? → add a **waypoint** for that\n  namespace/service.\n\nYour Istio objects (VirtualService/DestinationRule/AuthorizationPolicy) still work — L7 ones are\nenforced by the waypoint, L4 ones by ztunnel.\n\n## Lab: run a namespace in ambient mode\n\n> Best on a fresh cluster to avoid mixing with your sidecar install:\n> `kind delete cluster --name istio-lab && kind create cluster --name istio-lab`.\n\n### 1. Install Istio with the ambient profile\n\n```bash\nistioctl install --set profile=ambient -y\nkubectl get pods -n istio-system        # istiod + ztunnel (DaemonSet) + istio-cni\n```\n\nNote **ztunnel** running as a DaemonSet (one per node) — no per-pod proxies.\n\n### 2. Deploy an app and add it to the mesh with a label (no restart)\n\n```bash\nkubectl apply -f samples/bookinfo/platform/kube/bookinfo.yaml\nkubectl get pods                        # note: 1/1 — NO sidecar container!\n\n# enroll the whole namespace into ambient — instant mTLS, no restart\nkubectl label namespace default istio.io/dataplane-mode=ambient\n```\n\nPods stay **1/1** — there's no sidecar — yet traffic between them is now **encrypted by ztunn
