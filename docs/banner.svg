<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="DevDojo — master software engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a5cf5"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <!-- torii logo -->
  <g transform="translate(70,96)" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round">
    <path d="M6 34 Q64 14 122 34" stroke-width="10"/>
    <path d="M22 62 H106"/>
    <path d="M36 40 V132"/>
    <path d="M92 40 V132"/>
  </g>
  <circle cx="134" cy="150" r="7" fill="#ffffff"/>
  <!-- wordmark -->
  <text x="230" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff">DevDojo</text>
  <text x="232" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="500" fill="#eef2ff">Master software engineering — from fundamentals to senior craft</text>
  <!-- stat chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#3730a3">
    <g transform="translate(232,232)"><rect width="150" height="40" rx="20" fill="#ffffff" opacity="0.95"/><text x="75" y="26" text-anchor="middle">29 tracks</text></g>
    <g transform="translate(394,232)"><rect width="168" height="40" rx="20" fill="#ffffff" opacity="0.95"/><text x="84" y="26" text-anchor="middle">289 lessons</text></g>
    <g transform="translate(574,232)"><rect width="190" height="40" rx="20" fill="#ffffff" opacity="0.95"/><text x="95" y="26" text-anchor="middle">407 exercises</text></g>
    <g transform="translate(776,232)"><rect width="240" height="40" rx="20" fill="#ffffff" opacity="0.95"/><text x="120" y="26" text-anchor="middle">real code execution</text></g>
  </g>
  <!-- belt progression -->
  <g transform="translate(1040,96)">
    <rect x="0"  y="0"  width="26" height="18" rx="4" fill="#ffffff"/>
    <rect x="0"  y="26" width="26" height="18" rx="4" fill="#fde047"/>
    <rect x="0"  y="52" width="26" height="18" rx="4" fill="#22c55e"/>
    <rect x="0"  y="78" width="26" height="18" rx="4" fill="#3b82f6"/>
    <rect x="34" y="0"  width="26" height="18" rx="4" fill="#a855f7"/>
    <rect x="34" y="26" width="26" height="18" rx="4" fill="#92400e"/>
    <rect x="34" y="52" width="26" height="18" rx="4" fill="#111827"/>
    <rect x="34" y="78" width="26" height="18" rx="4" fill="#111827" stroke="#b8860b" stroke-width="2"/>
  </g>
</svg>
