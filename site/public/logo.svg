<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="DevDojo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a5cf5"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#g)"/>
  <!-- torii gate (dojo) -->
  <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
    <!-- top beam (kasagi), gently arced -->
    <path d="M5 10.5 Q16 8 27 10.5" stroke-width="2.8"/>
    <!-- second beam (nuki) -->
    <path d="M7.5 14.5 H24.5"/>
    <!-- posts -->
    <path d="M10 11 V25"/>
    <path d="M22 11 V25"/>
  </g>
  <!-- Java steam dot -->
  <circle cx="16" cy="19" r="1.7" fill="#fff"/>
</svg>
