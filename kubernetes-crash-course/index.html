cluster state (desired and actual). Lose etcd and you lose the cluster's memory.", "whyWrong": ["", "The runtime (containerd) runs containers on nodes; etcd just stores state.", "That's kube-proxy; etcd never touches traffic.", "Autoscalers are controllers that read state, etcd is where that state lives."]}, {"q": "What does the scheduler decide?", "options": ["Which node each new pod runs on, based on resources and rules", "When to bill you", "Which image to build", "How to route external traffic"], "answer": 0, "why": "The scheduler assigns unscheduled pods to nodes with enough resources that satisfy constraints (affinity, taints, etc.).", "whyWrong": ["", "Kubernetes has no billing concept; 'scheduling' here means pod placement.", "Images are built long before the scheduler ever sees a pod.", "Routing is kube-proxy/Ingress territory; the scheduler only picks nodes."]}, {"q": "What does the kubelet do?", "options": ["Runs on each node and ensures its assigned pods are actually running", "Stores the cluster database", "Decides which node runs each pod", "Provides the web dashboard"], "answer": 0, "why": "The kubelet is each node's agent: it talks to the API server and makes sure the containers it was assigned are running and healthy.", "whyWrong": ["", "That's etcd on the control plane; the kubelet is a per-node agent.", "That decision is the scheduler's; the kubelet executes it on its own node.", "The dashboard is a separate optional add-on."]}], "00-what-is-kubernetes": [{"q": "What do 'spec' and 'status' mean on a Kubernetes object?", "options": ["spec = your desired state; status = the actual state Kubernetes observes", "spec = the logs; status = the metrics", "They are the same field", "spec = actual; status = desired"], "answer": 0, "why": "You write spec (what you want); controllers fill status (what is) and work to drive status toward spec.", "whyWrong": ["", "Logs and metrics live in your observability stack; spec and status are fields on every object.", "If they were the same there'd be nothing to reconcile, the gap between them drives controllers.", "Backwards: spec is what you asked for, status is what actually exists."]}, {"q": "How do objects like Services find their Pods?", "options": ["Labels and selectors: Services select pods by label, not by ID or IP", "By hard-coded pod IP addresses", "By pod creation order", "By asking the scheduler"], "answer": 0, "why": "Labels (key/value tags) plus selectors (label queries) are the loose-coupling glue that connects almost everything in Kubernetes.", "whyWrong": ["", "Pod IPs change on every restart, which is exactly why selectors exist.", "Creation order carries no meaning; matching is purely by labels.", "The scheduler places pods; it plays no part in Service routing."]}, {"q": "What is a namespace?", "options": ["A virtual sub-cluster for organizing objects; names are unique within one", "A physical machine", "A type of volume", "A network policy"], "answer": 0, "why": "Namespaces partition a cluster (by team/env/app). 'default' holds your work; 'kube-system' holds Kubernetes' own components.", "whyWrong": ["", "Machines are nodes; a namespace is a logical grouping spanning all of them.", "Volumes are storage; a namespace is an organizational boundary for objects.", "NetworkPolicies are objects that live inside a namespace, not the namespace itself."]}, {"q": "Imperative vs declarative, which do real teams use?", "options": ["Declarative: YAML applied with kubectl apply, version-controlled", "Imperative, typing create/run commands for everything", "Neither, they use a GUI only", "They avoid Kubernetes entirely"], "answer": 0, "why": "Declarative manifests are reproducible, reviewable, and git-tracked, the basis of CI/CD and GitOps. Imperative is for quick exploration.", "whyWrong": ["", "Typed commands leave no reviewable record and can't be reproduced, fine for exploration only.", "GUIs exist, but no serious team manages production by clicking; files in git win.", "Plenty of teams run Kubernetes, the question is how they manage it."]}, {"q": "Describe the reconciliation loop in one sentence.", "options": ["Controllers continuously drive actual state toward the desired state, fixing any drift", "It runs once at cluster startup and stops", "It only runs when you type a command", "It builds images on a schedule"], "answer": 0, "why": "This never-ending control loop is why Kubernetes self-heals: any gap between desired and actual is continuously corrected.", "whyWrong": ["", "It never stops, controllers watch continuously, which is why drift gets fixed at 3am.", "Controllers act on state changes on their own; no human command is required.", "Image builds are outside Kubernetes; the loop reconciles cluster state."]}], "01-pods-and-kubectl": [{"q": "What is a Pod?", "options": ["The smallest Kubernetes unit, one or a few tightly-coupled containers sharing an IP, storage, and lifecycle", "A single physical server", "A cluster of nodes", "A Docker image"], "answer": 0, "why": "A Pod wraps container(s) that share a network namespace (one IP, reachable on localhost), volumes, and are scheduled together.", "whyWrong": ["", "Servers are nodes; many pods share one node.", "That's the cluster; a pod is the smallest schedulable unit inside it.", "An image is the frozen package; a pod is a running instance made from it."]}, {"q": "How many containers does a typical pod have?", "options": ["One; multiple only for sidecar patterns", "Always exactly two", "As many as the node has cores", "Zero"], "answer": 0, "why": "Usually one container per pod. Extra containers are helper sidecars (log shippers, proxies) that support the main one.", "whyWrong": ["", "There's no fixed number; two only happens when you add a sidecar.", "Cores limit CPU, not container count, and pods stay small regardless.", "A pod with zero containers can't exist; running containers is its whole purpose."]}, {"q": "Why don't you create bare Pods in production?", "options": ["They don't self-heal, use a Deployment that replaces them", "They cost extra money", "They can't use images", "They run only on the control plane"], "answer": 0, "why": "A bare Pod, once deleted or crashed, stays gone. A Deployment (via a ReplicaSet) recreates pods to maintain the desired count.", "whyWrong": ["", "A pod costs the same either way; the issue is nothing recreates it.", "Bare pods run images exactly like managed ones.", "Bare pods schedule onto workers like any pod; placement isn't the problem."]}, {"q": "Your two go-to debugging commands for an unhealthy pod?", "options": ["kubectl describe pod (read Events) and kubectl logs", "kubectl build and kubectl push", "kubectl scale and kubectl expose", "kubectl top and kubectl edit"], "answer": 0, "why": "describe shows Events explaining scheduling/pull/probe issues; logs shows what the app said. Together they solve most problems.", "whyWrong": ["", "Those aren't kubectl commands, building and pushing images happens with Docker/CI.", "scale and expose change things; they don't show why a pod is unhealthy.", "top shows resource usage and edit modifies objects, neither surfaces Events or app output."]}, {"q": "What does CrashLoopBackOff mean?", "options": ["The container keeps crashing and being restarted (check its logs)", "The image is being pulled", "The pod is scheduled but idle", "The node ran out of disk"], "answer": 0, "why": "The container starts, exits/errs, and Kubernetes restarts it with growing backoff. 'kubectl logs --previous' shows why it died.", "whyWrong": ["", "Pull problems show ImagePullBackOff or ErrImagePull, a different status.", "An idle-but-fine pod shows Running; CrashLoop means repeated deaths.", "Disk pressure causes evictions, not restart loops."]}], "02-deployments-replicasets": [{"q": "What's the chain from Deployment to Pods?", "options": ["Deployment → ReplicaSet → Pods; you edit the Deployment", "Pod → Deployment → ReplicaSet", "Deployment → Pods directly, no ReplicaSet", "ReplicaSet → Deployment → Pods"], "answer": 0, "why": "You manage the Deployment; it creates a ReplicaSet that keeps N identical pods alive. Updates create a new ReplicaSet.", "whyWrong": ["", "Ownership flows downward from the Deployment, pods are at the bottom, not the top.", "There's always a ReplicaSet in between; that's what makes rollouts and rollbacks work.", "The Deployment owns the ReplicaSet, not the other way around."]}, {"q": "What must match between a Deployment's selector and its pod template?", "options": ["Their labels", "Their images", "Their namespaces only", "Their resource limits"], "answer": 0, "why": "The selector's matchLabels must equal the template's pod labels, so the Deployment knows which pods it owns.", "whyWrong": ["", "The image can be anything; ownership is established through labels.", "Everything is in one namespace anyway; the required match is selector labels to template labels.", "Limits are unrelated to how a Deployment finds its pods."]}, {"q": "How does a rolling update avoid downtime?", "options": ["It brings up new ready pods before retiring old ones, gradually", "It stops all pods, then starts new ones", "It reboots the nodes", "It duplicates the whole cluster"], "answer": 0, "why": "The default RollingUpdate strategy adds new pods and waits for readiness before removing old ones, keeping capacity available throughout.", "whyWrong": ["", "Stop-then-start is the Recreate strategy, which does cause downtime.", "Nodes are untouched during a rollout; only pods are replaced.", "Only some pods exist twice briefly, never the cluster."]}, {"q": "Why is a rollback nearly instant?", "options": ["Old ReplicaSets are kept scaled to 0, so undo just scales one back up", "Kubernetes rebuilds the old image from scratch", "It restores from a nightly backup", "Rollbacks are actually slow"], "answer": 0, "why": "Previous ReplicaSets remain (at 0 replicas). 'kubectl rollout undo' scales the old one back up and the new one down, near-instant.", "whyWrong": ["", "No builds happen in-cluster; the old ReplicaSet still references the image sitting in the registry.", "No backups involved, the old ReplicaSet was never deleted, just scaled to 0.", "Scaling an existing ReplicaSet up takes seconds; that's the point of keeping them."]}, {"q": "In the lab, why didn't a broken image cause an outage?", "options": ["New pods never became ready, so the rollout kept the old healthy pods serving", "Kubernetes ignored the bad image", "The old pods were deleted but restarted fast", "The cluster rolled back on its own immediately"], "answer": 0, "why": "A readiness-gated rolling update won't retire old pods until new ones are ready. Bad new pods stay out of service, no downtime.", "whyWrong": ["", "Kubernetes tried the bad image, the new pods just never passed readiness.", "The old pods were never deleted; the rollout paused before retiring them.", "Rolling back took a human 'rollout undo'; Kubernetes just stopped the rollout from progressing."]}], "03-services-networking": [{"q": "Why can't you rely on a pod's IP?", "options": ["Pods are disposable and get a new IP each time they're recreated", "Pod IPs are secret", "Pods have no IPs", "IPs only work inside one node"], "answer": 0, "why": "Pods come and go and are reassigned IPs. You need a stable abstraction (a Service) in front of them.", "whyWrong": ["", "Pod IPs are plainly visible in kubectl output; the issue is they change.", "Every pod gets its own IP, it just doesn't survive recreation.", "Pod IPs are routable across the whole cluster; instability, not reach, is the problem."]}, {"q": "What does a Service provide?", "options": ["A stable name/address that load-balances across all pods matching its label selector", "A persistent disk for pods", "A build pipeline", "A container image"], "answer": 0, "why": "A Service is a durable virtual IP + DNS name that spreads traffic across the current set of matching pods, wherever they run.", "whyWrong": ["", "Disks are PersistentVolumes; a Service is a networking abstraction.", "Pipelines live in CI; a Service routes traffic inside the cluster.", "Images are what pods run; a Service is how you reach the pods."]}, {"q": "ClusterIP vs LoadBalancer?", "options": ["ClusterIP is internal-only; LoadBalancer exposes the Service externally via a cloud load balancer", "They are identical", "ClusterIP is external; LoadBalancer is internal", "LoadBalancer is only for databases"], "answer": 0, "why": "ClusterIP (default) is reachable only inside the cluster; LoadBalancer provisions an external IP on cloud providers.", "whyWrong": ["", "They differ in exposure: one is unreachable from outside, the other gets an external IP.", "Reversed: ClusterIP is the internal one.", "Any Service type can front any workload; databases usually stay internal anyway."]}, {"q": "How does an app reach a Service without knowing IPs?", "options": ["By the Service's DNS name, e.g. web or web.default.svc.cluster.local", "By scanning the network for pods", "By reading etcd directly", "By using the pod's MAC address"], "answer": 0, "why": "Every Service gets an in-cluster DNS name; apps connect to that name and Kubernetes resolves and load-balances it.", "whyWrong": ["", "No scanning needed, cluster DNS resolves the Service name for you.", "Only the API server talks to etcd; apps use ordinary DNS lookups.", "MAC addresses never enter the picture; connections use DNS name to virtual IP."]}, {"q": "What keeps a Service pointing at the right pods as they change?", "options": ["The selector + EndpointSlices, updated live; kube-proxy routes to current pod IPs", "A manual list you maintain", "The scheduler", "The container runtime"], "answer": 0, "why": "EndpointSlices track which pod IPs currently match the selector (updated as pods change); kube-proxy programs routing to them.", "whyWrong": ["", "Kubernetes maintains the endpoint list automatically; a hand-kept list would rot instantly.", "The scheduler places pods; it doesn't track Service membership.", "The runtime starts containers; it knows nothing about Services."]}], "04-configmaps-secrets": [{"q": "Why not bake configuration into the image?", "options": ["The same image should run everywhere; only config differs, and secrets would leak. Inject config at run time", "Images can't hold text", "It makes builds faster", "Kubernetes forbids it"], "answer": 0, "why": "One image, many environments: inject per-environment config at run time so you don't rebuild per env or bake in secrets.", "whyWrong": ["", "Images can hold any files, that's precisely the temptation to avoid.", "Baking config in actually forces a rebuild per environment, slowing you down.", "Nothing stops you technically; it's a bad practice, not a rule."]}, {"q": "ConfigMap vs Secret?", "options": ["Both inject config; Secrets are for sensitive data, handled separately with tighter access and encryption at rest", "ConfigMaps are encrypted; Secrets are plaintext", "They are the same object", "Secrets are for images; ConfigMaps for pods"], "answer": 0, "why": "They work the same way, but Secrets hold credentials and should get tighter RBAC and etcd encryption at rest.", "whyWrong": ["", "Neither is encrypted by default, and if either deserved it, it'd be Secrets.", "They're distinct kinds precisely so Secrets can get stricter handling and RBAC.", "Both feed config into pods; image pull credentials are just one Secret use case."]}, {"q": "Are Secret values encrypted by default?", "options": ["No, only base64-encoded; add etcd encryption + RBAC, or an external manager", "Yes, always AES-256 encrypted", "Yes, but only in production", "They are hashed, not stored"], "answer": 0, "why": "Base64 is encoding, not encryption, anyone with read access can decode it. Enable encryption at rest and restrict access.", "whyWrong": ["", "base64 is trivially reversible encoding; encryption at rest must be enabled explicitly.", "Kubernetes has no prod/dev mode; the default is the same everywhere.", "Values are stored whole and retrievable, hashing would make them unusable by pods."]}, {"q": "Two ways to consume config in a pod?", "options": ["As environment variables, or mounted as files via a volume", "Only as command-line flags", "Only baked into the image", "Via the registry"], "answer": 0, "why": "ConfigMaps/Secrets can be exposed as env vars (simple settings) or mounted as files (whole config files, certs).", "whyWrong": ["", "Args can pass values along, but the injection mechanisms are env vars and volume mounts.", "Baking config into the image defeats the entire point of ConfigMaps.", "The registry stores images; config injection happens at pod creation."]}, {"q": "Which consumption method reflects later changes without a restart?", "options": ["Mounted files update; env vars are fixed at pod start", "Env vars update live; files are fixed", "Neither ever updates", "Both update instantly"], "answer": 0, "why": "Mounted ConfigMap/Secret files update in the pod (with a delay). Env vars are set once at start, change them by restarting the pod.", "whyWrong": ["", "Exactly backwards, a process's environment can't change after start; mounted files can.", "Mounted files do refresh (after a kubelet sync delay).", "Env vars never update in place, and even file updates take up to a minute or so."]}], "05-storage-volumes-statefulsets": [{"q": "What's the difference between a PV and a PVC?", "options": ["A PV is the actual storage; a PVC is a request for storage that a pod mounts and binds to a PV", "A PV is a request; a PVC is the disk", "They are the same", "A PVC is a type of pod"], "answer": 0, "why": "PersistentVolume = real storage; PersistentVolumeClaim = a request. Pods mount the claim, decoupling apps from infrastructure.", "whyWrong": ["", "Reversed, the Claim is the request, the Volume is the storage.", "One is supply and the other demand; binding pairs them up.", "A PVC is a storage request object; pods mount it, but it isn't a workload."]}, {"q": "What does a StorageClass enable?", "options": ["Dynamic provisioning, creating a matching PV automatically when a PVC is made", "Faster networking", "Automatic backups", "Pod scheduling"], "answer": 0, "why": "A StorageClass is a template for provisioning storage on demand, so a new PVC gets a freshly created PV without manual setup.", "whyWrong": ["", "StorageClasses describe storage provisioners, nothing about the network.", "Backups need separate tooling (snapshots, Velero); a StorageClass only provisions.", "The scheduler places pods; StorageClasses exist to create PVs on demand."]}, {"q": "Why use a StatefulSet instead of a Deployment for a database?", "options": ["Stable pod identities, each with its own persistent storage, and ordered rollout", "It's cheaper", "It doesn't need images", "It scales faster"], "answer": 0, "why": "Databases need predictable names (db-0, db-1), each keeping its own PVC across restarts, and ordered start/stop, exactly what StatefulSets give.", "whyWrong": ["", "Same pods, same cost, the difference is identity and storage semantics.", "Every workload type runs container images.", "StatefulSets scale one at a time, in order, deliberately slower than a Deployment."]}, {"q": "What creates a separate PVC per StatefulSet pod?", "options": ["volumeClaimTemplates", "A single shared PVC", "The Service", "The scheduler"], "answer": 0, "why": "volumeClaimTemplates makes the StatefulSet generate a dedicated PVC (data-db-0, data-db-1...) for each pod automatically.", "whyWrong": ["", "A shared PVC is one disk for all pods, the opposite of per-pod storage, and often impossible with RWO volumes.", "The headless Service gives stable DNS names, not storage.", "The scheduler places pods; it never creates claims."]}, {"q": "What happens to PVCs when you delete a StatefulSet?", "options": ["They're retained by default, data is protected; delete them manually if intended", "They're deleted immediately with the data", "They convert to ConfigMaps", "They move to another namespace"], "answer": 0, "why": "Kubernetes keeps the PVCs (and data) when a StatefulSet is deleted, to avoid accidental data loss. You remove them explicitly.", "whyWrong": ["", "Auto-deleting would destroy data on an accidental delete, that's why retention is the default.", "PVCs and ConfigMaps are unrelated kinds; no such conversion exists.", "Objects never move between namespaces; the PVCs stay right where they were."]}], "06-health-resources": [{"q": "Liveness vs readiness, what does each do on failure?", "options": ["Liveness restarts the container; readiness removes the pod from Service traffic until it passes", "Both restart the container", "Both just log a warning", "Liveness gates traffic; readiness restarts"], "answer": 0, "why": "The key distinction: liveness = 'restart if wedged'; readiness = 'don't send traffic until ready.' They serve different purposes.", "whyWrong": ["", "Only liveness restarts; if readiness restarted too, a slow warmup would become a crash loop.", "Probes take action, restarts and endpoint removal, not just log lines.", "Reversed: readiness gates traffic, liveness triggers restarts."]}, {"q": "What is a startup probe for?", "options": ["Protecting slow-starting apps, it delays liveness/readiness until the app has booted", "Restarting the node", "Scaling the deployment", "Encrypting traffic"], "answer": 0, "why": "A startup probe gives slow initializers time before liveness kicks in, preventing premature restarts during a long boot.", "whyWrong": ["", "Probes act on containers, never on nodes.", "Scaling is the HPA's job; probes only affect one pod's lifecycle.", "TLS has nothing to do with probes."]}, {"q": "requests vs limits?", "options": ["Requests = what the scheduler guarantees/places on; limits = the max (memory over-limit → OOM-kill, CPU over-limit → throttle)", "Requests = the max; limits = the minimum", "They are the same number", "Only limits affect scheduling"], "answer": 0, "why": "The scheduler places pods by requests. Limits cap usage: exceeding memory kills the container (137); exceeding CPU throttles it.", "whyWrong": ["", "Reversed, requests are the guaranteed floor used for scheduling, limits the ceiling.", "They can be equal (that's Guaranteed QoS) but they mean different things.", "Scheduling uses requests only; limits are enforced at runtime."]}, {"q": "Which QoS class is evicted first when a node is low on resources?", "options": ["BestEffort (pods with no requests/limits set)", "Guaranteed", "Burstable", "They're evicted at random"], "answer": 0, "why": "BestEffort (no requests/limits) is evicted first, then Burstable, then Guaranteed. Never run important workloads BestEffort.", "whyWrong": ["", "Guaranteed (requests equal to limits) is protected longest, evicted last.", "Burstable goes after BestEffort; it at least declared some requests.", "Eviction follows QoS class and usage-over-request, not chance."]}, {"q": "Why do readiness probes make rollouts safe?", "options": ["New pods only receive traffic once ready, so a broken version never serves users and can't cause downtime", "They make pods start faster", "They double the replica count", "They roll back automatically"], "answer": 0, "why": "A rolling update won't retire old pods until new ones report ready. A broken new version stays out of the Service, no outage.", "whyWrong": ["", "Probes don't speed anything up, if anything they delay traffic until the app is truly ready.", "Replica count is set by the Deployment or HPA; probes only gate traffic.", "A stuck rollout stays stuck until you run rollout undo; probes just contain the damage."]}], "07-security-rbac-netpol": [{"q": "Role vs RoleBinding?", "options": ["A Role defines permissions; a RoleBinding grants them to a subject like a ServiceAccount", "A Role grants access; a RoleBinding defines it", "They are the same object", "A RoleBinding is a type of pod"], "answer": 0, "why": "Role/ClusterRole = a set of allowed verbs on resources; RoleBinding/ClusterRoleBinding attaches that to a user, group, or ServiceAccount.", "whyWrong": ["", "Reversed, the Role is the permission list; the binding attaches it to someone.", "They're separate kinds on purpose: one Role can be bound to many subjects.", "A RoleBinding is pure RBAC config; it runs nothing."]}, {"q": "Are there 'deny' rules in RBAC?", "options": ["No: RBAC is purely additive; you grant only what's needed", "Yes, deny rules override allows", "Only ClusterRoles can deny", "Deny is the default for everything"], "answer": 0, "why": "RBAC has no deny rules. Access is the union of all granted permissions, so you follow least privilege by granting narrowly.", "whyWrong": ["", "No RBAC rule can deny; anything not granted is simply refused.", "ClusterRoles are just cluster-scoped allow lists, still no deny.", "Ungranted actions are refused, but that's the absence of a grant, there are no deny rules to write."]}, {"q": "What is a ServiceAccount for?", "options": ["It's the identity a pod uses to talk to the Kubernetes API; bind RBAC to it", "It's a human user's login", "It's a billing account", "It stores container images"], "answer": 0, "why": "Pods authenticate to the API as a ServiceAccount. Give each app its own with least-privilege RBAC, not the broad default.", "whyWrong": ["", "Humans authenticate via certs/OIDC outside the cluster; ServiceAccounts are for workloads.", "Kubernetes has no billing concept; 'account' here means API identity.", "Images live in registries; a ServiceAccount is an identity, not storage."]}, {"q": "What's the default pod-to-pod network posture, and how do you restrict it?", "options": ["All pods can reach all pods; a NetworkPolicy selecting a pod switches it to deny-by-default plus explicit allows", "All traffic is denied until you allow it", "Only same-namespace traffic is allowed by default", "Pods can never talk to each other"], "answer": 0, "why": "Networking is flat/open by default. Once any NetworkPolicy selects a pod, only its explicitly-allowed traffic is permitted.", "whyWrong": ["", "Default-deny only kicks in once a NetworkPolicy selects the pod; out of the box everything is open.", "Namespaces don't isolate the network by default, cross-namespace traffic flows freely.", "Pods talk freely by default; policies are how you restrict that."]}, {"q": "One command to test whether an identity can perform an action?", "options": ["kubectl auth can-i <verb> <resource> --as=… -n …", "kubectl test-rbac", "kubectl describe role", "kubectl get permissions"], "answer": 0, "why": "kubectl auth can-i answers yes/no for a verb+resource, optionally impersonating a user/ServiceAccount, the fastest RBAC check.", "whyWrong": ["", "Not a real command, the built-in check is auth can-i.", "describe role shows the rules but makes you do the evaluation in your head.", "There's no 'permissions' resource to get."]}], "08-observability-troubleshooting": [{"q": "Your two primary debugging commands?", "options": ["kubectl describe (read Events) and kubectl logs", "kubectl build and kubectl push", "kubectl scale and kubectl expose", "kubectl top and kubectl edit"], "answer": 0, "why": "describe's Events explain scheduling/pull/probe problems in plain English; logs shows the app's output. They solve most issues.", "whyWrong": ["", "kubectl doesn't build or push, images come from Docker/CI.", "Those change the deployment; they don't reveal why something is broken.", "top shows usage and edit changes specs, neither shows Events or app output."]}, {"q": "CrashLoopBackOff, which log flag do you need and why?", "options": ["--previous (to see the crashed instance)'s logs, since the current container may have just restarted", "--follow, to stream forever", "--all-containers, always required", "No flag works for crashes"], "answer": 0, "why": "In a crash loop the current container is fresh; 'kubectl logs --previous' shows the output of the instance that actually died.", "whyWrong": ["", "Following the fresh container's stream misses what the dead one said before crashing.", "--all-containers widens to sidecars; it still shows only current instances.", "--previous exists precisely for this: logs of the last terminated instance."]}, {"q": "A Service has no endpoints. Most likely cause?", "options": ["Its selector doesn't match the pods' labels", "The cluster is out of disk", "The image is too big", "DNS is disabled"], "answer": 0, "why": "Empty endpoints = the selector matched no pods. A label/selector mismatch is the #1 reason a Service 'doesn't work.'", "whyWrong": ["", "Disk pressure would show as evictions and node conditions, not empty endpoints.", "Image size affects pull time, not Service matching.", "If DNS were broken the name wouldn't resolve; empty endpoints is a selector problem."]}, {"q": "A pod is Pending. Where do you look and for what?", "options": ["kubectl describe Events, insufficient resources, taints/affinity, or an unbound PVC", "The application logs only", "The registry", "The Dockerfile"], "answer": 0, "why": "Pending means unscheduled. describe's Events name the reason: no node with enough resources, a scheduling constraint, or storage not bound.", "whyWrong": ["", "A Pending pod has no running container, so there are no logs yet.", "Registry issues appear after scheduling, as ImagePull errors: Pending happens before that.", "The Dockerfile matters at build time; scheduling failures are about resources and constraints."]}, {"q": "What does 'kubectl top pods' need to work?", "options": ["The metrics-server installed in the cluster", "A cloud account", "Helm", "An Ingress controller"], "answer": 0, "why": "kubectl top reads live CPU/memory from the metrics-server. Without it (or on a fresh kind cluster) top returns an error.", "whyWrong": ["", "top works on any cluster, local kind included, it just needs metrics-server.", "Helm could install metrics-server but isn't itself required.", "Ingress routes HTTP traffic; it has nothing to do with metrics."]}], "09-helm": [{"q": "What is a Helm chart?", "options": ["A reusable, templated package of Kubernetes manifests plus default values", "A single YAML file", "A running pod", "A container registry"], "answer": 0, "why": "A chart bundles templated manifests and default values so a whole app can be installed, upgraded, and rolled back as one unit.", "whyWrong": ["", "A chart is a directory of many templates plus values, far more than one file.", "Charts are packages on disk; installing one is what creates pods.", "Charts can be stored in registries, but the chart is the package, not the store."]}, {"q": "Chart vs values vs release?", "options": ["Chart = the package; values = parameters that fill templates; release = an installed instance with revision history", "They all mean the same thing", "A release is the package; a chart is installed", "Values are the pods"], "answer": 0, "why": "Like apt/brew: the chart is the package, values customize it, and each install is a named release you can upgrade or roll back.", "whyWrong": ["", "Three distinct concepts, conflating them makes helm's commands confusing.", "Reversed: the chart is the package; the release is the installed instance.", "Values are just configuration parameters; pods come from the rendered manifests."]}, {"q": "What do 'helm upgrade' and 'helm rollback' give you?", "options": ["Versioned deploys, upgrade to new values/versions and instantly revert to a prior revision", "Faster image builds", "Automatic scaling", "A new cluster"], "answer": 0, "why": "Helm tracks release revisions, so upgrades are recorded and rollback restores a previous revision's manifests instantly.", "whyWrong": ["", "Helm never touches image builds; it manages manifests.", "Scaling is HPA/replicas territory; Helm versions your deploys.", "Helm operates inside an existing cluster; it can't create one."]}, {"q": "How do you deploy the same chart differently per environment?", "options": ["Separate values files (-f values-prod.yaml) or --set overrides", "Copy the chart and edit each copy", "You can't, charts are fixed", "Rebuild the image per environment"], "answer": 0, "why": "One chart, many values files (dev/staging/prod) or --set flags override defaults for each environment.", "whyWrong": ["", "Copies drift apart and multiply your maintenance; values files exist to avoid this.", "Parameterization is the whole point of charts, values override defaults freely.", "Same image everywhere; only injected config should differ per environment."]}, {"q": "What does 'helm template' do?", "options": ["Renders the chart's templates into final manifests locally, without installing", "Installs the chart", "Deletes a release", "Pushes the chart to a registry"], "answer": 0, "why": "helm template performs the value substitution and prints the resulting YAML so you can inspect exactly what would be applied.", "whyWrong": ["", "That's helm install; template renders locally and touches nothing.", "That's helm uninstall.", "That's helm push; template only prints YAML."]}], "10-kustomize": [{"q": "How does Kustomize differ from Helm mechanically?", "options": ["Overlays/patches on plain valid YAML vs templates with placeholders and logic", "Kustomize uses a scripting language; Helm uses YAML", "They are identical", "Kustomize builds images"], "answer": 0, "why": "Kustomize keeps manifests as plain YAML and layers patches; Helm uses Go templates with {{ }} placeholders and logic.", "whyWrong": ["", "Neither uses a scripting language: Kustomize is pure YAML patching; Helm is the one adding template logic.", "Their approaches differ fundamentally: patching valid YAML vs rendering templates.", "No config tool builds images; that's Docker/CI."]}, {"q": "What is a base vs an overlay?", "options": ["The base is the complete common manifests; an overlay layers environment-specific patches on top", "The base is a patch; the overlay is complete", "They are the same directory", "A base is a running cluster"], "answer": 0, "why": "You maintain one valid base and small overlays (dev/prod) that reference it and apply only their differences, no duplication.", "whyWrong": ["", "Reversed, the base must be complete valid YAML; overlays hold just the diffs.", "They're separate directories; the overlay references the base.", "Both are just directories of YAML on disk, not clusters."]}, {"q": "How do you apply a Kustomize overlay?", "options": ["kubectl apply -k <overlay-dir> (it)'s built into kubectl", "helm install -k", "kustomize deploy", "docker compose up"], "answer": 0, "why": "Kustomize is built into kubectl: 'apply -k' builds the overlay and applies the result in one step.", "whyWrong": ["", "Helm has no Kustomize mode; they're separate tools.", "The standalone binary uses 'kustomize build' piped to kubectl, 'deploy' isn't a subcommand.", "Compose is Docker's single-machine tool; it doesn't talk to Kubernetes."]}, {"q": "Name a purpose-built Kustomize field.", "options": ["namePrefix, commonLabels, images, replicas, configMapGenerator, or secretGenerator", "template, values, release", "apiVersion only", "Dockerfile"], "answer": 0, "why": "Kustomize offers structured transformers (namePrefix, images, replicas, generators...) plus free-form patches for anything else.", "whyWrong": ["", "Those are Helm concepts; Kustomize deliberately avoids templating.", "kustomization.yaml has a rich set of transformer fields beyond apiVersion.", "Dockerfiles build images; Kustomize only transforms manifests."]}, {"q": "When would you prefer Helm over Kustomize?", "options": ["For packaging/distributing apps and when you need templating logic like conditionals or loops", "For any simple label change", "Whenever you use kubectl", "Never: Kustomize replaces Helm"], "answer": 0, "why": "Helm shines at packaging/sharing versioned charts and expressing logic. Kustomize shines at simple, template-free per-env customization.", "whyWrong": ["", "A simple label change is exactly where Kustomize's commonLabels shines, no chart needed.", "kubectl works with both (apply -k included); tool choice doesn't hinge on it.", "They coexist: Helm for packaging and logic, Kustomize for overlay-style tweaks."]}], "11-cicd-gitops": [{"q": "What are the CI and CD halves?", "options": ["CI builds/tests/pushes the image; CD updates the cluster to the new image and rolls it out", "CI deploys; CD builds", "Both just run tests", "CI is manual; CD is manual"], "answer": 0, "why": "Continuous Integration produces a tested, pushed image; Continuous Delivery/Deployment updates Kubernetes and completes the rollout.", "whyWrong": ["", "Reversed, integration builds and tests; delivery deploys.", "Tests are one CI step; the pipeline also produces the image and rolls it out.", "The whole point of both is automation triggered by commits."]}, {"q": "Why tag images with the git SHA?", "options": ["Traceability to exact source and precise rollbacks (never use latest)", "SHAs are shorter to type", "It makes images smaller", "Registries require it"], "answer": 0, "why": "A SHA tag ties a running image to the exact commit, so you know what's deployed and can roll back precisely. 'latest' is ambiguous.", "whyWrong": ["", "Nobody types them: CI does; the win is knowing exactly which commit is running.", "The tag is just a label; image contents and size are unchanged.", "Registries accept any tag, including the dangerous 'latest'."]}, {"q": "Push-based vs pull-based (GitOps) CD?", "options": ["Push: the pipeline runs kubectl into the cluster. Pull: a controller in the cluster syncs it to git", "They are the same", "Push is GitOps; pull is manual", "Pull-based needs no git"], "answer": 0, "why": "Push-based CD sends changes to the cluster from CI. GitOps (Argo CD/Flux) runs inside the cluster and pulls desired state from git.", "whyWrong": ["", "They differ in who initiates: CI pushing changes in, or an in-cluster agent pulling from git.", "Backwards: GitOps is the pull model, and it's fully automated.", "Git is exactly what a pull-based controller syncs from, it's the source of truth."]}, {"q": "In GitOps, what is the source of truth and how do you roll back?", "options": ["Git; roll back with a git revert, which the controller reconciles", "etcd; roll back by editing it", "The registry; delete the image", "There is no rollback"], "answer": 0, "why": "Git holds the desired state; a revert commit changes desired state and the GitOps controller reconciles the cluster back.", "whyWrong": ["", "etcd reflects current state; in GitOps git defines desired state, and you never hand-edit etcd.", "Deleting images breaks anything still using them; rollback means reverting the manifest in git.", "git revert is the rollback, clean, audited, and reconciled automatically."]}, {"q": "What makes an automated deploy safe against a bad image?", "options": ["Gating on kubectl rollout status, a readiness-gated rollout fails and triggers a rollback", "Deploying only on Fridays", "Skipping tests to go faster", "Using the latest tag"], "answer": 0, "why": "If new pods never become ready, 'rollout status' fails; the pipeline stops and can auto-undo, so a bad release doesn't take traffic.", "whyWrong": ["", "The day you deploy catches nothing; readiness gating does.", "Skipping tests removes a safety net, it makes bad images more likely.", "'latest' makes it unclear what's deployed and impossible to roll back precisely."]}], "12-ingress-tls": [{"q": "What two things must exist for Ingress to work?", "options": ["An Ingress controller (the proxy) AND Ingress resources (the rules)", "Just an Ingress resource", "Two LoadBalancer Services", "A StatefulSet and a PVC"], "answer": 0, "why": "The controller is the actual proxy doing the routing; the Ingress resource is the rules it reads. You need both.", "whyWrong": ["", "A resource with no controller is inert YAML, nothing reads the rules.", "One LoadBalancer per app is what Ingress avoids; a single controller fronts everything.", "Storage objects have nothing to do with HTTP routing."]}, {"q": "Why don't you get Ingress functionality out of the box?", "options": ["Kubernetes ships no default controller (you install one, e.g. ingress-nginx)", "Ingress is deprecated", "It requires a paid license", "Only cloud clusters have it"], "answer": 0, "why": "Ingress resources do nothing without a controller. You choose and install one (ingress-nginx, Traefik, a cloud controller...).", "whyWrong": ["", "Ingress is fully supported; the missing piece is a controller, not the API.", "Common controllers like ingress-nginx are free and open source.", "Local clusters run controllers fine, you just install one yourself."]}, {"q": "What do the backing Services look like behind an Ingress?", "options": ["Simple ClusterIP (only the Ingress is exposed externally)", "Each is a LoadBalancer with its own IP", "They must be NodePort", "They don't need Services"], "answer": 0, "why": "The Ingress is the single external entry point; the apps behind it stay internal ClusterIP Services.", "whyWrong": ["", "One external IP per app is exactly what Ingress eliminates.", "NodePort isn't required; the controller reaches ClusterIP Services from inside the cluster.", "The Ingress routes to Services, which track the ready pods; you still need them."]}, {"q": "How does an Ingress route to different apps?", "options": ["By host and path rules to backend Services", "By pod IP", "By image name", "By namespace only"], "answer": 0, "why": "Ingress rules match on hostname and URL path and forward to the corresponding backend Service, many apps behind one entry point.", "whyWrong": ["", "Pod IPs churn constantly; Ingress targets Services by name.", "The image is invisible to HTTP routing; rules match host and path.", "Requests are matched on host and path, the namespace only scopes which Services rules can reference."]}, {"q": "What does cert-manager do?", "options": ["Automatically obtains and renews TLS certs into the Secret the Ingress uses", "Builds container images", "Scales pods", "Stores application logs"], "answer": 0, "why": "cert-manager is an add-on that issues and auto-renews certificates (e.g. from Let's Encrypt) so you don't manage TLS by hand.", "whyWrong": ["", "cert-manager only handles certificates; builds happen in CI.", "Scaling is the HPA's job.", "Logs go to your logging stack; cert-manager writes certs into Secrets."]}], "13-autoscaling": [{"q": "What does the HPA scale, and on what?", "options": ["The number of pods, based on CPU/memory or custom metrics", "Each pod's memory limit, based on time of day", "The number of nodes, based on cost", "The image size"], "answer": 0, "why": "The Horizontal Pod Autoscaler adds/removes pod replicas to keep a metric (like average CPU) near a target.", "whyWrong": ["", "Resizing pods is the VPA's territory, and the HPA reacts to metrics, not the clock.", "Node count is the Cluster Autoscaler; the HPA only changes replicas.", "Image size is fixed at build time; nothing scales it."]}, {"q": "HPA vs VPA vs Cluster Autoscaler?", "options": ["HPA = pod count; VPA = each pod's requests/limits; Cluster Autoscaler = node count", "They all scale pods", "HPA = nodes; Cluster Autoscaler = pods", "They are three names for one thing"], "answer": 0, "why": "Three levels: horizontal (more pods), vertical (bigger pods), and cluster (more machines when pods can't fit).", "whyWrong": ["", "Only two touch pods; the Cluster Autoscaler adds and removes machines.", "Swapped, the HPA changes pod replicas; the Cluster Autoscaler changes nodes.", "Three separate components at three different layers, often used together."]}, {"q": "Why must a Deployment have CPU requests for CPU-based HPA?", "options": ["Utilization is measured relative to the request; without it, no percentage can be computed", "Requests make pods start faster", "The HPA reads requests as the max", "It doesn't, requests are optional"], "answer": 0, "why": "averageUtilization is a percentage of the CPU request. No request means the HPA can't compute utilization and won't scale.", "whyWrong": ["", "Startup speed is unaffected; requests exist for scheduling and the utilization math.", "The request is the denominator of the percentage, not a ceiling, usage can exceed it.", "For CPU-percentage targets the request is mandatory; without it the HPA shows <unknown>."]}, {"q": "What component must be installed for CPU/memory HPA?", "options": ["The metrics-server", "An Ingress controller", "cert-manager", "Helm"], "answer": 0, "why": "The HPA reads pod CPU/memory from the metrics-server. Without it, the HPA can't get metrics and shows <unknown>.", "whyWrong": ["", "Ingress handles HTTP routing, not metrics.", "cert-manager issues TLS certs; it has no metrics role.", "Helm is a package manager, it could install metrics-server, but isn't the dependency."]}, {"q": "Why is scale-down slower than scale-up?", "options": ["A stabilization window prevents flapping when load fluctuates", "Deleting pods is technically slow", "Kubernetes bills per scale-down", "It isn't, both are instant"], "answer": 0, "why": "The HPA waits (a stabilization window) before scaling down so brief dips don't cause it to remove pods it soon needs again.", "whyWrong": ["", "Pod deletion takes seconds; the delay is deliberate policy, not mechanics.", "There's no billing in Kubernetes; the wait exists to prevent flapping.", "Scale-up is immediate, but scale-down deliberately waits out brief dips."]}], "14-operators-crds": [{"q": "What does a CRD do?", "options": ["Registers a new custom resource type with the API server, usable like any built-in kind", "Runs a container", "Builds an image", "Creates a namespace"], "answer": 0, "why": "A CustomResourceDefinition teaches the API server a new kind, after which kubectl, RBAC, and apply all work on it like built-ins.", "whyWrong": ["", "A CRD defines a type; nothing runs until a controller acts on instances of it.", "No Kubernetes object builds images.", "Namespaces are created directly; a CRD adds a new kind, not a namespace."]}, {"q": "Does creating a custom object do anything by itself?", "options": ["No, a CRD is just data storage until a controller/operator acts on it", "Yes, it automatically provisions infrastructure", "Yes, it starts a pod", "Only if it's in kube-system"], "answer": 0, "why": "A CRD only stores structured data. Something must watch and reconcile those objects for anything to happen, that's the operator.", "whyWrong": ["", "Provisioning happens only if an operator watches that type and acts on it.", "The API server just stores the object; no pod appears without a controller.", "Namespace placement changes nothing, the data is inert without a watcher."]}, {"q": "What is an Operator?", "options": ["A controller that watches custom resources and reconciles them (automating operational tasks)", "A human sysadmin", "A type of Service", "A cloud billing tool"], "answer": 0, "why": "An operator runs the same reconciliation loop as built-in controllers, encoding expert operational knowledge for a custom resource.", "whyWrong": ["", "The name nods to human operators, but it's software encoding their playbook.", "Services route traffic; an operator is a controller process.", "No relation to billing, it automates operations."]}, {"q": "State the Operator pattern.", "options": ["CRD (new noun) + controller (automation) = Operator", "Deployment + Service = Operator", "Helm + Kustomize = Operator", "Pod + Volume = Operator"], "answer": 0, "why": "An operator is a custom resource type plus a controller that acts on it, the whole ecosystem extends Kubernetes this way.", "whyWrong": ["", "That's just a running app; the pattern needs a custom type plus a controller.", "Those are packaging tools; an operator is live reconciliation logic.", "Workload primitives alone don't extend the API."]}, {"q": "Name a real operator and what it manages.", "options": ["cert-manager → TLS certificates (or Prometheus Operator → monitoring)", "kubectl → the cluster", "etcd → networking", "kind → nodes"], "answer": 0, "why": "Real operators like cert-manager (certs) and the Prometheus Operator (monitoring) manage complex systems via custom resources.", "whyWrong": ["", "kubectl is a client tool, not a controller watching resources.", "etcd is the datastore, and it has nothing to do with networking.", "kind creates local clusters; it doesn't reconcile anything inside them."]}], "15-capstone": [{"q": "Which object type did the database use, and why?", "options": ["StatefulSet, stable identity plus its own persistent storage", "Deployment, because databases are stateless", "DaemonSet, one per node", "Job, it runs once"], "answer": 0, "why": "Databases need a stable identity and dedicated persistent storage per replica, which StatefulSets provide via volumeClaimTemplates.", "whyWrong": ["", "Databases are the classic stateful case; Deployment pods are interchangeable and lose their storage identity.", "One-per-node is for node agents; a database wants stable identity, not node coverage.", "A database must run continuously; Jobs exist to finish and exit."]}, {"q": "How did the API get its config and its DB password?", "options": ["A ConfigMap via envFrom; the password from a Secret via secretKeyRef", "Both baked into the image", "From command-line flags only", "From the Ingress"], "answer": 0, "why": "Non-secret settings came from a ConfigMap (envFrom); the sensitive password came from a Secret referenced by secretKeyRef.", "whyWrong": ["", "Baked-in config forces rebuilds per environment and leaves the password extractable from the image.", "Flags would still need a source; Kubernetes injects config via env vars and mounts.", "Ingress routes HTTP traffic; it doesn't deliver configuration."]}, {"q": "How is the whole app exposed with one entry point?", "options": ["An Ingress routing by path to the frontend and api ClusterIP Services", "Three LoadBalancers", "By publishing pod ports directly", "It isn't exposed"], "answer": 0, "why": "A single Ingress routes /api to the api Service and / to the frontend Service, keeping both apps as internal ClusterIP Services.", "whyWrong": ["", "Three external IPs to manage, the single-Ingress design avoids exactly that.", "Pod ports aren't reachable from outside the cluster, and pod IPs churn.", "The frontend was reachable, through the Ingress entry point."]}, {"q": "What proved self-healing in the capstone?", "options": ["Deleting an api pod; the Deployment created a replacement automatically", "Restarting the whole cluster", "Editing the image tag", "Scaling to zero"], "answer": 0, "why": "The Deployment's ReplicaSet maintains the desired replica count, so a deleted pod is immediately replaced, self-healing.", "whyWrong": ["", "A cluster restart tests recovery, not the controller's automatic pod replacement.", "Changing the tag triggers a rollout, an update feature, not healing.", "Scaling to zero is intentional; healing is replacing what you didn't mean to lose."]}, {"q": "Which piece would make a bad rollout safe?", "options": ["Readiness probes, new pods only get traffic once ready, so a broken version can't cause an outage", "A bigger memory limit", "More namespaces", "Deleting the Service"], "answer": 0, "why": "Readiness-gated rolling updates keep old pods serving until new ones are ready, so a broken new version never takes traffic.", "whyWrong": ["", "Limits address OOM kills, not broken releases reaching users.", "Namespaces organize objects; they can't gate a rollout.", "Deleting the Service is the outage, not the safeguard."]}], "16-cka-ckad-prep": [{"q": "What kind of exams are the CKA/CKAD?", "options": ["Hands-on, performance-based, you perform tasks on a live cluster, open-book against kubernetes.io", "Multiple-choice, closed-book", "Oral interviews", "Written essays"], "answer": 0, "why": "Both give you a real cluster and terminal; you complete tasks under time pressure, allowed only the official docs.", "whyWrong": ["", "There are no answer choices, you're graded on the state of a real cluster, with kubernetes.io open.", "No interviewer involved; it's you and a terminal.", "You write YAML and commands, not prose."]}, {"q": "Which CKA domain is largest, and which course module targets it?", "options": ["Troubleshooting, 30% (Module 8)", "Storage, 10%: Module 5", "Helm, 25%: Module 9", "Scheduling, 15%: Module 2"], "answer": 0, "why": "Troubleshooting is the biggest CKA slice at 30%. Module 8's debugging method is your highest-value review.", "whyWrong": ["", "Storage is a real domain but a small one at 10%, troubleshooting dwarfs it at 30%.", "Helm isn't a standalone 25% domain on the CKA.", "Scheduling matters, but the heaviest weight sits on troubleshooting."]}, {"q": "The single most important exam-speed command pattern?", "options": ["kubectl ... --dry-run=client -o yaml to generate manifests, then edit and apply", "kubectl delete --all", "kubectl get pods -w", "helm install everything"], "answer": 0, "why": "Generating YAML with --dry-run=client -o yaml turns slow hand-writing into fast edit-and-apply, the top time-saver.", "whyWrong": ["", "Deleting everything destroys graded work, catastrophic in an exam.", "Watching pods is passive; it creates nothing for the grader.", "Helm isn't the exam workflow; generating YAML with dry-run is."]}, {"q": "Why set the namespace for each exam question?", "options": ["A correct object in the wrong namespace scores zero", "It makes kubectl faster", "Namespaces are required to log in", "It doesn't matter"], "answer": 0, "why": "Tasks specify a namespace; the grader checks there. Set the context per question so a right answer lands in the right place.", "whyWrong": ["", "Speed is unchanged; correctness of placement is what's graded.", "Login is handled by contexts and credentials; namespaces just scope objects.", "It matters enormously, graders look in the specified namespace only."]}, {"q": "Which command explains a resource's fields offline?", "options": ["kubectl const KEY = "k8s-course-progress-v1";
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ done = {}; }
let current = 0;

function save(){ try { localStorage.setItem(KEY, JSON.stringify(done)); } catch(e){} }

// plain-text index for search (strip markdown to readable text)
function stripMd(md){
  return md
    .replace(/```[\s\S]*?```/g, " ")     // code fences
    .replace(/`[^`]+`/g, " ")            // inline code
    .replace(/^\s*\|.*$/gm, " ")         // table rows
    .replace(/[#>*_\-]+/g, " ")          // md symbols
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1") // links -> text
    .replace(/\s+/g, " ").trim();
}
const INDEX = DATA.pages.map((p,idx) => ({idx, id:p.id, title:p.title, text:stripMd(p.md)}));

function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function escHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function snippet(text, q){
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i === -1) return "";
  const start = Math.max(0, i - 45), end = Math.min(text.length, i + q.length + 55);
  let s = (start>0?"…":"") + text.slice(start, end) + (end<text.length?"…":"");
  const re = new RegExp(escRe(q), "ig");
  return escHtml(s).replace(re, m => "<mark>"+escHtml(m)+"</mark>");
}

function doSearch(q){
  const nav = document.getElementById("nav");
  const box = document.getElementById("results");
  q = q.trim();
  if (!q){ box.innerHTML = ""; nav.style.display = ""; return; }
  nav.style.display = "none";
  const ql = q.toLowerCase();
  const hits = INDEX.map(p => {
    const inTitle = p.title.toLowerCase().includes(ql);
    const inText = p.text.toLowerCase().includes(ql);
    return (inTitle||inText) ? {p, inTitle, snip: snippet(p.text, q)} : null;
  }).filter(Boolean);
  if (!hits.length){ box.innerHTML = '<div class="noresult">No matches for “'+escHtml(q)+'”.</div>'; return; }
  box.innerHTML = '<div class="searchinfo">'+hits.length+' module'+(hits.length>1?'s':'')+' match</div>';
  hits.forEach(h => {
    const d = document.createElement("div");
    d.className = "result";
    d.innerHTML = '<div class="rt"></div><div class="rs">'+(h.snip||"(title match)")+'</div>';
    d.querySelector(".rt").textContent = h.p.title;
    d.onclick = () => {
      document.getElementById("search").value = "";
      doSearch("");
      go(h.p.idx);
      document.getElementById('sidebar').classList.remove('open');
    };
    box.appendChild(d);
  });
}

function buildNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  let lastGroup = null;
  DATA.pages.forEach((p, idx) => {
    if (p.group !== lastGroup){
      const g = document.createElement("div");
      g.className = "navgroup"; g.textContent = p.group;
      nav.appendChild(g); lastGroup = p.group;
    }
    const it = document.createElement("div");
    it.className = "navitem" + (idx===current?" active":"") + (done[p.id]?" done":"");
    it.innerHTML = '<span class="dot">'+(done[p.id]?"✓":"")+'</span><span class="t"></span>';
    it.querySelector(".t").textContent = p.title;
    it.onclick = () => { go(idx); document.getElementById('sidebar').classList.remove('open'); };
    nav.appendChild(it);
  });
}

function updateProgress(){
  const total = DATA.pages.length;
  const n = DATA.pages.filter(p => done[p.id]).length;
  const pct = Math.round(100*n/total);
  document.getElementById("progfill").style.width = pct + "%";
  document.getElementById("progtxt").textContent = pct + "% complete · " + n + "/" + total + " modules";
}

function attachCopy(root){
  root.querySelectorAll("pre.code .copy").forEach(btn => {
    btn.onclick = () => {
      const code = btn.parentElement.querySelector("code").innerText;
      navigator.clipboard.writeText(code).then(()=>{
        btn.textContent = "Copied!"; setTimeout(()=>btn.textContent="Copy", 1200);
      });
    };
  });
}

function renderQuiz(pid){
  const qs = DATA.quizzes[pid];
  if (!qs || !qs.length) return "";
  const wrap = document.createElement("div");
  wrap.className = "quiz";
  wrap.innerHTML = '<h3>Test your knowledge</h3><div class="qmeta">'+qs.length+
    ' questions · answer all to mark this module complete.</div>';
  const state = {answered: new Array(qs.length).fill(false), correct: 0};
  qs.forEach((q, qi) => {
    const card = document.createElement("div");
    card.className = "qcard";
    const qt = document.createElement("div");
    qt.className = "qtext"; qt.textContent = (qi+1)+". "+q.q;
    card.appendChild(qt);
    const why = document.createElement("div");
    why.className = "why";
    q.options.forEach((opt, oi) => {
      const b = document.createElement("button");
      b.className = "opt"; b.textContent = opt;
      b.onclick = () => {
        if (state.answered[qi]) return;
        state.answered[qi] = true;
        const ok = oi === q.answer;
        if (ok) state.correct++;
        card.querySelectorAll(".opt").forEach((x, xi) => {
          x.classList.add("disabled");
          if (xi === q.answer) x.classList.add("correct");
          if (xi === oi && !ok) x.classList.add("wrong");
        });
        why.textContent = ok ? ("✓ Correct. " + q.why)
          : ("✗ Not quite. " + ((q.whyWrong && q.whyWrong[oi]) ? q.whyWrong[oi] + " " : "") + q.why);
        why.className = "why show " + (ok ? "ok":"no");
        maybeComplete();
      };
      card.appendChild(b);
    });
    card.appendChild(why);
    wrap.appendChild(card);
  });
  const score = document.createElement("div");
  score.className = "qscore";
  wrap.appendChild(score);
  function maybeComplete(){
    const n = state.answered.filter(Boolean).length;
    score.textContent = "Answered "+n+"/"+qs.length+" · "+state.correct+" correct";
    if (n === qs.length){
      if (!done[pid]){ done[pid] = true; save(); buildNav(); updateProgress(); }
      score.textContent += "  —  module complete ✓";
    }
  }
  return wrap;
}

function go(idx){
  current = idx;
  const p = DATA.pages[idx];
  const c = document.getElementById("content");
  c.innerHTML = '<div class="pagehdr">'+p.group+'</div><h2></h2>';
  c.querySelector("h2").textContent = p.title;
  const body = document.createElement("div");
  body.innerHTML = mdToHtml(p.md);
  c.appendChild(body);
  attachCopy(c);
  const quiz = renderQuiz(p.id);
  if (quiz) c.appendChild(quiz);
  // prev/next
  const nb = document.createElement("div");
  nb.className = "navbtns";
  const prev = document.createElement("button");
  prev.textContent = "← Previous"; prev.disabled = idx===0;
  prev.onclick = ()=>go(idx-1);
  const next = document.createElement("button");
  next.className = "next";
  next.textContent = idx===DATA.pages.length-1 ? "Finish ✓" : "Next →";
  next.disabled = idx===DATA.pages.length-1 && !!done[p.id];
  next.onclick = ()=>{ if(idx<DATA.pages.length-1) go(idx+1); else { done[p.id]=true; save(); buildNav(); updateProgress(); } };
  nb.appendChild(prev); nb.appendChild(next);
  c.appendChild(nb);
  buildNav();
  updateProgress();
  window.scrollTo(0,0);
  document.getElementById("main").scrollTo && document.getElementById("main").scrollTo(0,0);
}

document.getElementById("search").addEventListener("input", e => doSearch(e.target.value));

buildNav();
updateProgress();
go(0);
</script>
