 drain node-3 --ignore-daemonsets\n```\n\nIf that's boring (pods reshuffle, dashboards stay green), this module is done its job."}, {"id": "07-security-rbac-netpol", "title": "7 · Security: RBAC & NetworkPolicy", "group": "Production & security", "md": "*Locking down who can do what, and which pods may talk. Concepts + a lab. ~30 min. Needs your kind\ncluster. Heavily tested on CKA/CKAD.*\n\n---\n\nKubernetes security has layers. This module covers the three you'll use constantly: **RBAC** (who\ncan run which commands), **ServiceAccounts + SecurityContext** (pod identity and privilege), and\n**NetworkPolicy** (which pods may reach which). The theme is **least privilege**: grant the minimum\nneeded.\n\n## RBAC, who can do what\n\n**Role-Based Access Control** decides whether a user or app may perform an action (get pods, create\ndeployments, read secrets…). Four object types, in two pairs:\n\n| Object | Scope | Says |\n|--------|-------|------|\n| **Role** | one namespace | \"these verbs on these resources\" (e.g. get/list pods) |\n| **ClusterRole** | whole cluster | same, but cluster-wide (or for cluster-scoped resources) |\n| **RoleBinding** | one namespace | \"grant this Role to these subjects\" |\n| **ClusterRoleBinding** | whole cluster | \"grant this ClusterRole cluster-wide\" |\n\nA **Role/ClusterRole** defines *permissions*; a **Binding** attaches them to a *subject* (a user,\ngroup, or ServiceAccount). Permissions are **purely additive**: there are no \"deny\" rules; you grant\nonly what's needed.\n\n```yaml\n# a Role: read-only access to pods in the \"dev\" namespace\napiVersion: rbac.authorization.k8s.io/v1\nkind: Role\nmetadata: { namespace: dev, name: pod-reader }\nrules:\n- apiGroups: [\"\"]\n  resources: [\"pods\"]\n  verbs: [\"get\", \"list\", \"watch\"]\n---\napiVersion: rbac.authorization.k8s.io/v1\nkind: RoleBinding\nmetadata: { namespace: dev, name: read-pods }\nsubjects:\n- kind: ServiceAccount\n  name: myapp\n  namespace: dev\nroleRef:\n  kind: Role\n  name: pod-reader\n  apiGroup: rbac.authorization.k8s.io\n```\n\n**Test permissions** with the invaluable `kubectl auth can-i`:\n\n```bash\nkubectl auth can-i list pods --namespace dev\nkubectl auth can-i create deployments --as=system:serviceaccount:dev:myapp -n dev\n```\n\n## ServiceAccounts, identity for pods\n\nA **ServiceAccount** is the identity a *pod* uses to talk to the Kubernetes API. Every pod gets one\n(`default` if unspecified). You bind RBAC to ServiceAccounts to control what an app may do. Best\npractice: give each app its **own** ServiceAccount with the **minimum** permissions; never rely on\nthe `default` account with broad access.\n\n```yaml\nspec:\n  serviceAccountName: myapp        # the pod runs as this identity\n```\n\n## SecurityContext, how privileged the container runs\n\nConstrain what the container itself can do on the node:\n\n```yaml\n    securityContext:\n      runAsNonRoot: true           # refuse to run as root\n      runAsUser: 1000\n      allowPrivilegeEscalation: false\n      readOnlyRootFilesystem: true # container can't write its own filesystem\n      capabilities:\n        drop: [\"ALL\"]              # drop Linux capabilities\n```\n\nThese mirror the Docker security lessons (non-root, least privilege), now enforced by the platform.\nProduction clusters often require them via **Pod Security Standards** (the `restricted` profile).\n\n## NetworkPolicy, which pods may talk\n\nBy default, **every pod can reach every other pod**: flat and open. A **NetworkPolicy** restricts\nthat, per label selector. The critical gotcha: policies are **allow-lists that only take effect once\none selects a pod**, and the moment a pod is selected by *any* policy, everything not explicitly\nallowed is **denied**.\n\n```yaml\n# default-deny all ingress in the namespace, then allow only from app=frontend\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: { name: deny-all-ingress, namespace: dev }\nspec:\n  podSelector: {}                  # selects ALL pods in the namespace\n  policyTypes: [\"Ingress\"]         # with no ingress rules = deny all inbound\n---\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata: { name: allow-frontend, namespace: dev }\nspec:\n  podSelector: { matchLabels: { app: backend } }\n  policyTypes: [\"Ingress\"]\n  ingress:\n  - from:\n    - podSelector: { matchLabels: { app: frontend } }\n    ports:\n    - { protocol: TCP, port: 8080 }\n```\n\n> **kind caveat:** NetworkPolicies require a CNI that enforces them. kind's default CNI does **not**,\n> so policies won't actually block traffic on a vanilla kind cluster (install Calico to test for\n> real). The *concepts and YAML* below are exactly what you'll use and what the exam tests.\n\n## Lab: RBAC you can verify locally\n\n```bash\nkubectl create namespace dev\nkubectl create serviceaccount myapp -n dev\n\n# without permission:\nkubectl auth can-i list pods --as=system:serviceaccount:dev:myapp -n dev     # → no\n\n# grant read-only pods via a Role + RoleBinding\nkubectl create role pod-reader --verb=get,list,watch --resource=pods -n dev\nkubectl create rolebinding read-pods --role=pod-reader --serviceaccount=dev:myapp -n dev\n\n# now:\nkubectl auth can-i list pods   --as=system:serviceaccount:dev:myapp -n dev    # → yes\nkubectl auth can-i delete pods --as=system:serviceaccount:dev:myapp -n dev    # → no (not granted)\nkubectl delete namespace dev\n```\n\n`kubectl auth can-i` is your fastest RBAC debugging and exam tool.\n\n## Practitioner rules\n\n- **Least privilege everywhere**: narrow Roles, per-app ServiceAccounts, drop capabilities, non-root.\n- **RBAC is additive**: grant, never rely on \"deny.\" Audit with `kubectl auth can-i --list`.\n- **Default-deny NetworkPolicies** then allow specific flows: the secure baseline.\n- **Never mount the default ServiceAccount token** into pods that don't need API access\n  (`automountServiceAccountToken: false`)."}, {"id": "08-observability-troubleshooting", "title": "8 · Observability & troubleshooting", "group": "Production & security", "md": "*The highest-weighted CKA topic (30%) and the skill that defines a practitioner: diagnosing a broken\ncluster fast. Concepts + a lab. ~30 min. Needs your kind cluster.*\n\n---\n\nThings break. The practitioner difference is a **method**: read the signals in order, form a\nhypothesis, confirm it. This module gives you the toolkit and a repeatable process.\n\n## The four signals\n\n| Signal | Command | Tells you |\n|--------|---------|-----------|\n| **State** | `kubectl get <res> -o wide` | What's running/pending/failing, on which node |\n| **Details + Events** | `kubectl describe <res> <name>` | *Why*: Events explain scheduling, pulls, probe failures |\n| **Logs** | `kubectl logs <pod> [-c c] [--previous]` | What the app said (and `--previous` = the crashed instance) |\n| **Cluster events** | `kubectl get events --sort-by=.lastTimestamp` | A timeline of what happened recently |\n\n**`kubectl describe` (read the Events section) and `kubectl logs` resolve the large majority of\nissues.** Learn to read Events: they're written in plain English and usually name the problem.\n\n## Decode the common pod statuses\n\n| Status | Meaning | First move |\n|--------|---------|-----------|\n| `Pending` | Not scheduled | `describe`, insufficient CPU/memory? node selector/taint? PVC unbound? |\n| `ContainerCreating` (stuck) | Setup not finishing | `describe`, image pull, volume mount, or Secret/ConfigMap missing |\n| `ImagePullBackOff` / `ErrImagePull` | Can't pull image | Check image name/tag; registry auth (imagePullSecrets) |\n| `CrashLoopBackOff` | Container keeps crashing | `logs --previous`, the app is erroring on start |\n| `OOMKilled` (in describe) | Hit memory limit | Raise the limit or fix the leak |\n| `Running` but `0/1` READY | Readiness probe failing | `describe` probe events; `logs`; is the app actually up? |\n| `Terminating` (stuck) | Finalizer / graceful shutdown hanging | Check finalizers, PodDisruptionBudgets |\n\nMemorize this table: it maps a symptom directly to a cause. It's also exam gold.\n\n## The debugging method (apply every time)\n\n1. **`kubectl get pods -o wide`**: what's wrong and where?\n2. **`kubectl describe pod <name>`**: read the **Events** (bottom). Usually the answer.\n3. **`kubectl logs <name>` (add `--previous` if it restarted)**: the app's own words.\n4. **Narrow the layer:** pod? → Service/Endpoints? → Ingress? Check each in turn.\n5. **Reproduce/inspect live:** `kubectl exec -it <pod> -- sh` to test from inside; `kubectl run\n   tmp --rm -it --image=busybox -- sh` to test networking/DNS from a scratch pod.\n\n## Troubleshooting networking\n\nWhen \"service A can't reach service B\":\n\n```bash\nkubectl get svc,endpointslices              # does the Service have endpoints? (empty = selector/labels wrong)\nkubectl run net --rm -it --image=busybox --restart=Never -- sh\n#   inside:  nslookup <service>        (DNS resolving?)\n#            wget -qO- <service>:<port> (reachable?)\n```\n\nEmpty endpoints is the #1 Service bug: the Service's `selector` doesn't match the pods' labels.\n\n## Metrics (resource usage)\n\nInstall the **metrics-server** and you get live CPU/memory:\n\n```bash\nkubectl top nodes                # per-node usage (needs metrics-server)\nkubectl top pods -A              # per-pod usage\n```\n\n(`kubectl top` powers autoscaling too; see Module 13. On kind, install metrics-server to enable it.)\n\n## Lab: diagnose three broken things\n\n```bash\n# A) a Pending pod (impossible resource request)\nkubectl run toobig --image=nginx --overrides='{\"spec\":{\"containers\":[{\"name\":\"toobig\",\"image\":\"nginx\",\"resources\":{\"requests\":{\"memory\":\"900Gi\"}}}]}}'\nkubectl get pod toobig                     # Pending\nkubectl describe pod toobig | sed -n '/Events/,$p'   # \"Insufficient memory\", the cause\nkubectl delete pod toobig --force 2>/dev/null\n\n# B) a CrashLoopBackOff\nkubectl run crash --image=busybox --restart=Always -- sh -c \"echo boom; exit 1\"\nsleep 8; kubectl get pod crash              # CrashLoopBackOff\nkubectl logs crash --previous               # → boom\nkubectl delete pod crash\n\n# C) a Service with no endpoints (label mismatch)\nkubectl create deployment app --image=nginx        # pods labelled app=app\nkubectl expose deployment app --port=80 --selector=app=WRONG   # selector doesn't match!\nkubectl get endpointslices -l kubernetes.io/service-name=app    # no endpoints\nkubectl describe svc app                             # Selector: app=WRONG, the bug\nkubectl delete deploy app; kubectl delete svc app\n```\n\nEach follows the same method: get → describe/Events → logs → confirm cause.\n\n## Practitioner rules\n\n- **Events first.** `describe` before guessing. The cluster usually tells you what's wrong.\n- **`--previous` for crash loops**: the current container may be too young to have logs.\n- **Empty endpoints = label/selector mismatch.** Check it whenever a Service \"doesn't work.\"\n- **Test from a scratch pod** to isolate DNS/network issues from app issues."}, {"id": "18-reading-kubectl-output", "title": "8b · Reading kubectl output", "group": "Production & security", "md": "*A practitioner reference. For each command you'll actually run, here's what **healthy** output\nlooks like, what a common **broken** output looks like, and exactly how to read it. Bookmark this;\nit's the fastest way to turn \"I ran a command\" into \"I know what it's telling me.\" ~25 min.*\n\n---\n\nKubernetes rarely says \"error.\" Instead it shows you *state*, and you have to read it. Below, each\ncommand shows a **good** result, a **bad** result, and the column-by-column interpretation. `#`\ncomments point at what to notice.\n\n---\n\n## `kubectl get pods`\n\n**Healthy:**\n```\nNAME                   READY   STATUS    RESTARTS   AGE\nweb-6d4c...-abcde      1/1     Running   0          2m      # READY 1/1 = all containers up; 0 restarts = stable\nweb-6d4c...-fghij      1/1     Running   0          2m\n```\n\nRead the columns: **READY** is `ready/total` containers (want them equal, e.g. `1/1`, `2/2`).\n**STATUS** should be `Running` (or `Completed` for Jobs). **RESTARTS** climbing means the container\nkeeps dying. **AGE** is how long it's existed.\n\n**Broken (crash loop):**\n```\nNAME              READY   STATUS             RESTARTS      AGE\napi-77...-x2k9     0/1     CrashLoopBackOff   5 (20s ago)   3m   # 0/1 not ready; 5 restarts; app keeps crashing\n```\n`CrashLoopBackOff` + rising `RESTARTS` = the app starts then exits. **Next step:** `kubectl logs\napi-77...-x2k9 --previous` to see why the last run died.\n\n**Broken (bad image):**\n```\nNAME              READY   STATUS             RESTARTS   AGE\napi-77...-x2k9     0/1     ImagePullBackOff   0          90s   # can't fetch the image at all\n```\n`ImagePullBackOff` / `ErrImagePull` = wrong image name/tag or missing registry credentials. **Next\nstep:** `kubectl describe pod` and read Events for the exact pull error.\n\n**Broken (can't schedule):**\n```\nNAME              READY   STATUS    RESTARTS   AGE\napi-77...-x2k9     0/1     Pending   0          4m    # never placed on a node\n```\n`Pending` = the scheduler hasn't placed it. **Next step:** `kubectl describe pod`. Usually\n\"Insufficient cpu/memory,\" a taint/affinity mismatch, or an unbound PVC.\n\n> **Rule:** the STATUS word tells you *which* problem; `describe` (Events) and `logs` tell you *why*.\n\n---\n\n## `kubectl describe pod <name>`\n\nThe gold is the **Events** section at the bottom (most recent last):\n\n**Healthy:**\n```\nEvents:\n  Type    Reason     Age   Message\n  Normal  Scheduled  30s   Successfully assigned default/web to worker-1\n  Normal  Pulled     29s   Container image \"nginx:1.27\" already present on machine\n  Normal  Created    29s   Created container web\n  Normal  Started    29s   Started container web       # a clean Scheduled→Pulled→Created→Started\n```\nAll `Normal`, ending in `Started` = healthy startup.\n\n**Broken:**\n```\nEvents:\n  Type     Reason     Age                Message\n  Normal   Scheduled  2m                 Successfully assigned default/api to worker-1\n  Warning  Failed     70s (x4 over 2m)   Failed to pull image \"myapp:nope\": not found   # the real cause\n  Warning  Failed     70s (x4 over 2m)   Error: ErrImagePull\n```\nRead the **`Warning`** lines: they name the problem in plain English (\"image not found\"). The\n`(x4 over 2m)` means it's repeating. Fix the image tag and it clears.\n\n---\n\n## `kubectl logs <pod>`\n\n**Healthy:** your app's normal startup output:\n```\nListening on :8080\nConnected to database\n```\n\n**Broken:**\n```\nError: connect ECONNREFUSED db:5432        # app can't reach its database\n```\nThe app's *own* error. For a crash loop, add **`--previous`** (the current container may be too\nnew): `kubectl logs api-77...-x2k9 --previous`. If you see nothing, the container may not have\nstarted; check `describe` instead.\n\n---\n\n## `kubectl get deployment`\n\n**Healthy:**\n```\nNAME   READY   UP-TO-DATE   AVAILABLE   AGE\nweb    3/3     3            3           5m     # READY 3/3, all up-to-date and available\n```\n**READY** = ready/desired replicas (want them equal). **UP-TO-DATE** = replicas on the newest\nversion. **AVAILABLE** = replicas actually serving.\n\n**Broken (stuck rollout):**\n```\nNAME   READY   UP-TO-DATE   AVAILABLE   AGE\nweb    2/3     1            2           5m     # only 2 of 3 ready; 1 up-to-date = new version not coming up\n```\n`READY 2/3` with `UP-TO-DATE 1` means the new version's pod isn't becoming ready: a bad image or a\nfailing readiness probe. The 2 old pods still serve (no outage). **Next:** `kubectl rollout status\ndeployment/web` and `kubectl get pods` to find the unhealthy new pod.\n\n---\n\n## `kubectl rollout status deployment/<name>`\n\n**Healthy:**\n```\ndeployment \"web\" successfully rolled out      # done, exit code 0\n```\n**Broken (stuck):**\n```\nWaiting for deployment \"web\" rollout to finish: 1 out of 3 new replicas have been updated...\n# ...and it hangs here. It never completes because new pods aren't ready.\n```\nIn a script/CI, this command **blocks and eventually fails** (non-zero exit) on a bad rollout,\nwhich is exactly what makes automated deploys safe (Module 11). Ctrl-C, then investigate the new\npod.\n\n---\n\n## `kubectl get service` and `kubectl get endpoints`\n\nA Service is only useful if it has **endpoints** (matching pod IPs). This is the #1 networking check.\n\n**Healthy:**\n```\n$ kubectl get svc web\nNAME   TYPE        CLUSTER-IP     EXTERNAL-IP   PORT(S)   AGE\nweb    ClusterIP   10.96.12.34    <none>        80/TCP    3m\n\n$ kubectl get endpoints web\nNAME   ENDPOINTS                             AGE\nweb    10.244.1.5:80,10.244.2.6:80           3m     # has pod IPs = it will route traffic\n```\n\n**Broken (no endpoints):**\n```\n$ kubectl get endpoints web\nNAME   ENDPOINTS   AGE\nweb    <none>      3m     # EMPTY = Service matches no pods; traffic goes nowhere\n```\n`<none>` endpoints = the Service's **selector doesn't match any pod labels** (or the pods aren't\nready). **Next:** compare `kubectl get svc web -o yaml` (its `selector`) with `kubectl get pods\n--show-labels`. Mismatched labels is the classic cause.\n\nFor `LoadBalancer` on a local cluster you'll also see `EXTERNAL-IP: <pending>` forever; that's expected,\nbecause kind has no cloud load balancer.\n\n---\n\n## `kubectl get nodes`\n\n**Healthy:**\n```\nNAME                STATUS   ROLES           AGE   VERSION\nk8s-lab-control...  Ready    control-plane   10m   v1.36.0\nk8s-lab-worker      Ready    <none>          10m   v1.36.0    # Ready = usable\n```\n**Broken:**\n```\nNAME             STATUS     ROLES    AGE   VERSION\nk8s-lab-worker   NotReady   <none>   10m   v1.36.0    # node down / kubelet or network issue\n```\n`NotReady` = the node can't run pods (kubelet stopped, no network, out of resources). Pods on it get\nrescheduled. **Next:** `kubectl describe node <name>`; look at Conditions (e.g.\n`MemoryPressure`, `DiskPressure`) and Events.\n\n---\n\n## `kubectl get pvc`\n\n**Healthy:**\n```\nNAME   STATUS   VOLUME        CAPACITY   ACCESS MODES   STORAGECLASS   AGE\ndata   Bound    pvc-8f3...    1Gi        RWO            standard       2m   # Bound = storage attached\n```\n**Broken:**\n```\nNAME   STATUS    VOLUME   CAPACITY   ACCESS MODES   STORAGECLASS   AGE\ndata   Pending                                      standard       2m   # no PV to bind to\n```\n`Pending` = no matching PersistentVolume / no default StorageClass to provision one. Any pod using\nit will also stay `Pending`. **Next:** `kubectl describe pvc data` for the reason.\n\n---\n\n## `kubectl top pods` / `kubectl top nodes`\n\n**Healthy:**\n```\nNAME              CPU(cores)   MEMORY(bytes)\nweb-6d4c...       2m           18Mi\n```\n**Broken:**\n```\nerror: Metrics API not available        # metrics-server isn't installed (or not ready)\n```\n`kubectl top` needs the **metrics-server**. This error (and an HPA showing `<unknown>`) both point\nto it being missing. Install it, then retry.\n\n---\n\n## `kubectl auth can-i <verb> <resource>`\n\nReturns a plain **`yes`** or **`no`**:\n```\n$ kubectl auth can-i create deployments -n dev\nyes\n$ kubectl auth can-i delete pods --as=system:serviceaccount:dev:myapp -n dev\nno        # this identity lacks that permission, grant it via Role + RoleBinding\n```\n`--as=` impersonates a user/ServiceAccount so you can test *their* permissions. `no` means the RBAC\ngrant is missing (RBAC is additive; you must add it).\n\n---\n\n## `kubectl get events --sort-by=.lastTimestamp`\n\nA recent timeline for the namespace. Scan for **`Warning`** lines:\n```\nLAST SEEN   TYPE      REASON              OBJECT             MESSAGE\n2m          Normal    Scheduled           pod/web-...        Successfully assigned...\n30s         Warning   BackOff             pod/api-...        Back-off restarting failed container   # trouble\n15s         Warning   FailedScheduling    pod/api-...        0/3 nodes available: insufficient cpu  # why Pending\n```\n`Warning` + the `REASON` (BackOff, FailedScheduling, Unhealthy, FailedMount…) usually names the\nproblem directly.\n\n---\n\n## The universal way to read any of it\n\n1. **STATUS word** → *which* category of problem (Pending, CrashLoopBackOff, ImagePullBackOff,\n   NotReady, `<none>` endpoints…).\n2. **`describe` Events / `logs`** → *why* (the plain-English cause).\n3. **Fix, then re-read the same command** → confirm the column flipped back to healthy\n   (`Running`, `1/1`, `Bound`, endpoints populated).\n\nOnce you can glance at a column and know \"that's wrong,\" you debug in seconds instead of guessing."}, {"id": "09-helm", "title": "9 · Packaging with Helm", "group": "Packaging & delivery", "md": "*Kubernetes' package manager: install complex apps in one command, template your own. Concepts + a\nlab. ~30 min. Needs your kind cluster + Helm installed.*\n\n---\n\nReal apps are *many* manifests (Deployment, Service, ConfigMap, Ingress, and more), and you need\ndifferent values per environment. Copy-pasting YAML doesn't scale. **Helm** is the package manager\nfor Kubernetes: it bundles manifests into a reusable, parameterized **chart** you install, upgrade,\nand roll back as a unit.\n\n## The vocabulary\n\n- **Chart**: a package of templated Kubernetes manifests + default values. Like an installable app.\n- **Values**: the parameters that fill in the templates (image tag, replicas, hostnames…). Override\n  per environment.\n- **Release**: an installed instance of a chart in your cluster (with a name and revision history).\n- **Repository**: a place charts are hosted (many are OCI registries now).\n\nThink of it like `apt`/`brew` for Kubernetes: a chart is the package, values customize it, a release\nis what's installed.\n\n## Using an existing chart\n\n```bash\n# add a repo and install an app, one command for a whole stack\nhelm install mydb oci://registry-1.docker.io/bitnamicharts/postgresql \\\n  --set auth.password=secret\n\nhelm list                          # your releases\nhelm status mydb                   # what got deployed\nhelm upgrade mydb oci://registry-1.docker.io/bitnamicharts/postgresql --set auth.password=newpass\nhelm rollback mydb 1               # revert to revision 1\nhelm uninstall mydb                # remove the whole release\n```\n\nOne command deploys/updates/rolls back a complete app; that's the Helm payoff.\n\n## Anatomy of a chart\n\n```\nmychart/\n├── Chart.yaml          # name, version, description\n├── values.yaml         # default parameter values\n├── templates/          # manifests with {{ }} placeholders\n│   ├── deployment.yaml\n│   ├── service.yaml\n│   └── _helpers.tpl    # reusable template snippets\n└── charts/             # dependency charts (subcharts)\n```\n\nTemplates are ordinary manifests with **Go template** placeholders that pull from values:\n\n```yaml\n# templates/deployment.yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: {{ .Release.Name }}-web\nspec:\n  replicas: {{ .Values.replicaCount }}\n  template:\n    spec:\n      containers:\n      - name: web\n        image: \"{{ .Values.image.repository }}:{{ .Values.image.tag }}\"\n```\n\n```yaml\n# values.yaml (defaults, overridable at install time)\nreplicaCount: 3\nimage:\n  repository: nginx\n  tag: \"1.27\"\n```\n\nAt install, Helm renders the templates with the values into real manifests and applies them.\n\n## Lab: create and install your own chart\n\n```bash\nhelm create demo               # scaffolds a working chart in ./demo\n# it ships a runnable nginx-based app. inspect the rendered manifests WITHOUT installing:\nhelm template demo | head -40  # see the YAML Helm would apply\n\n# install it, overriding a value\nhelm install web ./demo --set replicaCount=2\nkubectl get deploy,svc -l app.kubernetes.io/instance=web\nhelm list\n\n# change values and upgrade (creates revision 2)\nhelm upgrade web ./demo --set replicaCount=4\nkubectl get deploy -l app.kubernetes.io/instance=web    # now 4\nhelm history web                                          # revisions 1 and 2\n\n# roll back and clean up\nhelm rollback web 1\nhelm uninstall web\n```\n\n### Experiment: environment values files\n\nCreate `values-prod.yaml` with `replicaCount: 6`, then\n`helm upgrade web ./demo -f values-prod.yaml`. Separate values files per environment (dev/staging/\nprod) over one chart is the standard pattern.\n\n## When to use Helm\n\n- **Installing third-party apps** (databases, ingress controllers, monitoring): the ecosystem ships\n  Helm charts; it's the fastest path.\n- **Packaging *your* app** for repeatable, parameterized deploys across environments and clusters.\n- **When you need templating/logic** (conditionals, loops, computed values): Helm's Go templates\n  handle complex cases Kustomize can't.\n\nHelm and Kustomize (next module) solve overlapping problems differently; many teams use both."}, {"id": "10-kustomize", "title": "10 · Kustomize", "group": "Packaging & delivery", "md": "*Template-free customization built into kubectl: per-environment configs without duplication.\nConcepts + a lab. ~25 min. Needs your kind cluster.*\n\n---\n\n**Kustomize** is the other way to manage per-environment manifests. Where Helm uses *templates with\nplaceholders*, Kustomize uses **overlays**: you keep plain, valid YAML as a **base**, then layer\nsmall **patches** on top for each environment. No templating language: it's built right into\n`kubectl` (`kubectl apply -k`).\n\n## The idea: base + overlays\n\n```\n   base/                       ← plain, complete manifests (valid on their own)\n     deployment.yaml\n     service.yaml\n     kustomization.yaml\n   overlays/\n     dev/     kustomization.yaml  (patch: replicas=1, dev image tag)\n     prod/    kustomization.yaml  (patch: replicas=6, prod tag, extra labels)\n```\n\nEach environment references the base and applies only its *differences*. No copy-paste, no template\nsyntax, just YAML patching YAML.\n\n## The base\n\n```yaml\n# base/kustomization.yaml\nresources:\n  - deployment.yaml\n  - service.yaml\n```\n\n```yaml\n# base/deployment.yaml, ordinary, valid manifest\napiVersion: apps/v1\nkind: Deployment\nmetadata: { name: web }\nspec:\n  replicas: 1\n  selector: { matchLabels: { app: web } }\n  template:\n    metadata: { labels: { app: web } }\n    spec:\n      containers:\n      - name: web\n        image: nginx:1.27\n```\n\n## An overlay\n\n```yaml\n# overlays/prod/kustomization.yaml\nresources:\n  - ../../base\nnamePrefix: prod-              # names become prod-web\ncommonLabels:\n  env: prod\nimages:\n  - name: nginx               # swap the image tag cluster-wide\n    newTag: \"1.28\"\nreplicas:\n  - name: web\n    count: 6                  # prod runs 6\npatches:\n  - target: { kind: Deployment, name: web }\n    patch: |-                 # a strategic-merge/JSON6902 patch for anything else\n      - op: add\n        path: /spec/template/spec/containers/0/env\n        value: [{ name: ENV, value: prod }]\n```\n\nKustomize has purpose-built fields (`namePrefix`, `commonLabels`, `images`, `replicas`,\n`configMapGenerator`, `secretGenerator`) plus free-form `patches` for anything else.\n\n## Using it\n\n```bash\nkubectl kustomize overlays/prod        # render the final YAML (like helm template)\nkubectl apply -k overlays/prod         # build AND apply in one step\nkubectl apply -k overlays/dev          # the dev variant\n```\n\n`configMapGenerator`/`secretGenerator` even hash config content into the name, so changing config\ntriggers a rollout automatically, a neat built-in.\n\n## Lab: two environments from one base\n\n```bash\nmkdir -p base overlays/dev overlays/prod\n\ncat > base/deployment.yaml <<'EOF'\napiVersion: apps/v1\nkind: Deployment\nmetadata: { name: web }\nspec:\n  replicas: 1\n  selector: { matchLabels: { app: web } }\n  template:\n    metadata: { labels: { app: web } }\n    spec:\n      containers: [{ name: web, image: nginx:1.27 }]\nEOF\ncat > base/kustomization.yaml <<'EOF'\nresources: [deployment.yaml]\nEOF\n\ncat > overlays/dev/kustomization.yaml <<'EOF'\nresources: [../../base]\nnamePrefix: dev-\nreplicas: [{ name: web, count: 1 }]\nEOF\ncat > overlays/prod/kustomization.yaml <<'EOF'\nresources: [../../base]\nnamePrefix: prod-\nreplicas: [{ name: web, count: 4 }]\nimages: [{ name: nginx, newTag: \"1.28\" }]\nEOF\n\n# render each, see the differences without applying\nkubectl kustomize overlays/dev  | grep -E \"name:|replicas:|image:\"\nkubectl kustomize overlays/prod | grep -E \"name:|replicas:|image:\"\n\n# apply prod, confirm, clean up\nkubectl apply -k overlays/prod\nkubectl get deploy prod-web\nkubectl delete -k overlays/prod\n```\n\nOne base, two environments, zero duplication or templating.\n\n## Helm vs Kustomize (how to choose)\n\n| | Helm | Kustomize |\n|--|------|-----------|\n| Mechanism | Templates with `{{ }}` placeholders + logic | Overlays/patches on plain YAML |\n| Packaging/sharing | Strong, versioned charts, repos | Weaker, it's a customization tool, not a package registry |\n| Logic (conditionals/loops) | Yes | No (patches only) |\n| Learning curve | Templating language | Just YAML |\n| Built into kubectl | No (separate tool) | **Yes** (`-k`) |\n\n**Rule of thumb:** Helm to *package and distribute* apps (especially third-party); Kustomize to\n*customize* your own manifests per environment simply. Many teams use **both**, e.g. render a Helm\nchart, then Kustomize-patch it. Both are on the CKA."}, {"id": "11-cicd-gitops", "title": "11 · CI/CD & GitOps", "group": "Packaging & delivery", "md": "*How real teams ship to Kubernetes: automated build → push → deploy, and Git as the source of truth.\nConcepts + a lab-style walkthrough. ~25 min.*\n\n---\n\nYou now know how to deploy by hand. In production, deploys are **automated**: a pipeline builds your\nimage, pushes it, and updates the cluster, triggered by a git push, with no human running `kubectl`.\nThis module covers the pipeline and the modern **GitOps** approach.\n\n## The pipeline: build → push → deploy\n\nEvery code change flows through the same stages:\n\n```\n   git push\n      │\n      ▼\n   CI: build image  →  test  →  push to registry (tagged with the git SHA)\n      │\n      ▼\n   CD: update the Kubernetes manifests to the new image  →  apply to cluster  →  verify rollout\n```\n\n- **CI (Continuous Integration)**: build the Docker image, run tests, push to a registry. Tag with\n  the **git commit SHA** so every image traces to exact source (the tagging discipline from the\n  Docker course).\n- **CD (Continuous Delivery/Deployment)**: update the Deployment to the new image tag and roll it\n  out (Module 2's rolling update + readiness probes = zero downtime).\n\n## A concrete CI pipeline (GitHub Actions)\n\n```yaml\n# .github/workflows/deploy.yaml\nname: build-and-deploy\non: { push: { branches: [main] } }\njobs:\n  ship:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Build & push image\n        run: |\n          IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}\n          echo \"${{ secrets.GHCR_TOKEN }}\" | docker login ghcr.io -u ${{ github.actor }} --password-stdin\n          docker build -t \"$IMAGE\" .\n          docker push \"$IMAGE\"\n      - name: Deploy\n        run: |\n          kubectl set image deployment/web web=ghcr.io/${{ github.repository }}:${{ github.sha }}\n          kubectl rollout status deployment/web --timeout=120s\n```\n\nThe essence: build → push a SHA-tagged image → update the deployment → wait for the rollout to\nsucceed (and it auto-fails if the new pods never become ready).\n\n## Two deployment models: push vs pull (GitOps)\n\n- **Push-based CD** (above): the pipeline has cluster credentials and runs `kubectl`/`helm` *to* the\n  cluster. Simple, but the CI system holds cluster-admin-grade credentials and the cluster can drift from git.\n- **Pull-based CD = GitOps**: a controller *inside* the cluster (**Argo CD** or **Flux**)\n  continuously **pulls** the desired manifests from a git repo and reconciles the cluster to match.\n  Git becomes the single source of truth.\n\n### GitOps, the big idea\n\n```\n   Git repo (manifests / Helm / Kustomize)  ← the DESIRED state, reviewed via pull requests\n        │  Argo CD / Flux watches it\n        ▼\n   Cluster continuously reconciled to match git\n```\n\nBenefits: **git is the source of truth** (every change is a reviewed, audited commit); **rollback = git\nrevert**; the cluster **self-corrects drift**; and no external system needs cluster credentials. It's\nliterally Kubernetes' reconciliation idea (Module 0) applied to *deployment*: declare desired state\nin git, a controller makes reality match.\n\n## Lab: simulate the deploy step locally\n\nYou can't run a full CI system in kind, but you can do the CD action a pipeline performs:\n\n```bash\n# stand up an app at v1\nkubectl create deployment web --image=nginx:1.27\nkubectl set resources deployment web --requests=cpu=50m,memory=64Mi\nkubectl rollout status deployment/web\n\n# the \"deploy new version\" step a pipeline runs on each push:\nkubectl set image deployment/web nginx=nginx:1.28\nkubectl rollout status deployment/web            # succeeds → pipeline goes green\n\n# a bad image → the pipeline step FAILS (rollout never completes) and you'd auto-rollback\nkubectl set image deployment/web nginx=nginx:nope\nkubectl rollout status deployment/web --timeout=20s || kubectl rollout undo deployment/web\nkubectl rollout status deployment/web\nkubectl delete deployment web\n```\n\nThat `rollout status` gate is what makes automated deploys safe: a broken image fails the pipeline\nand triggers a rollback, all without a human.\n\n## Practitioner rules\n\n- **Tag images by git SHA** (never `latest`) so deploys are traceable and rollbacks precise.\n- **Gate deploys on `rollout status`**: fail fast, auto-rollback on bad releases.\n- **Keep manifests in git** (Helm/Kustomize): reviewed, versioned, auditable.\n- **Prefer GitOps (Argo CD/Flux)** for production: git as truth, drift auto-corrected, no CI holding\n  cluster keys.\n- **Store credentials as CI secrets**, never in the repo."}, {"id": "12-ingress-tls", "title": "12 · Ingress & TLS", "group": "Advanced platform", "md": "*HTTP routing from the outside world into your Services, with TLS. Concepts + a lab. ~30 min. Needs\nyour kind cluster.*\n\n---\n\nA `LoadBalancer` Service works but gives each app its own external IP/load balancer, which is expensive and\ncrude. **Ingress** is the smart HTTP(S) front door: **one** entry point that routes to many Services\nby **hostname and path**, terminates **TLS**, and centralizes edge concerns. It's how real clusters\nexpose web apps.\n\n## Two pieces: the controller and the resource\n\nThis trips people up. Ingress needs **both**:\n\n- **Ingress controller**: the actual proxy that runs in the cluster and does the routing (e.g.\n  **ingress-nginx**, Traefik, HAProxy, or a cloud one). *You must install one*; Kubernetes doesn't\n  ship a default.\n- **Ingress resource**: the YAML *rules* (\"host `shop.example.com` path `/api` → the `api`\n  Service\"). The controller reads these and configures itself.\n\n```\n   internet ──► Ingress controller (a proxy) ──reads──► Ingress resources (rules)\n                          │\n             ┌────────────┼─────────────┐\n             ▼            ▼              ▼\n         api Service   web Service   admin Service   (ClusterIP, internal)\n```\n\nBehind the Ingress, your Services stay simple **ClusterIP**; the Ingress is the only thing exposed.\n\n## An Ingress resource\n\n```yaml\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: shop\n  annotations:\n    nginx.ingress.kubernetes.io/rewrite-target: /   # controller-specific tuning via annotations\nspec:\n  ingressClassName: nginx\n  rules:\n  - host: shop.local\n    http:\n      paths:\n      - path: /api\n        pathType: Prefix\n        backend:\n          service: { name: api, port: { number: 80 } }\n      - path: /\n        pathType: Prefix\n        backend:\n          service: { name: web, port: { number: 80 } }\n  tls:\n  - hosts: [\"shop.local\"]\n    secretName: shop-tls        # a TLS Secret holding the cert+key\n```\n\n- **`rules`** route by **host** and **path** to backend Services.\n- **`tls`** terminates HTTPS using a cert stored in a **Secret**.\n- **annotations** configure controller-specific behavior (rewrites, timeouts, auth).\n\n## TLS and cert-manager\n\nYou put a cert+key in a `kubernetes.io/tls` Secret and reference it. Managing certs by hand is\npainful, so production clusters run **cert-manager**, an add-on that **automatically obtains and\nrenews** certificates (e.g. free from Let's Encrypt) and writes them into the Secret the Ingress\nuses. You annotate the Ingress and cert-manager does the rest.\n\n## Lab: install a controller and route two apps\n\nkind needs the ingress-nginx controller (and a small setup to expose it):\n\n```bash\n# 1. install the ingress-nginx controller (kind-specific manifest)\nkubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml\nkubectl wait --namespace ingress-nginx --for=condition=ready pod \\\n  --selector=app.kubernetes.io/component=controller --timeout=120s\n\n# 2. two apps behind ClusterIP Services\nkubectl create deployment web --image=nginxdemos/hello\nkubectl create deployment api --image=hashicorp/http-echo -- /http-echo -text=\"hello from api\" -listen=:80\nkubectl expose deployment web --port=80\nkubectl expose deployment api --port=80\n\n# 3. one Ingress routing by path\ncat <<'EOF' | kubectl apply -f -\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: demo\n  annotations: { nginx.ingress.kubernetes.io/rewrite-target: / }\nspec:\n  ingressClassName: nginx\n  rules:\n  - http:\n      paths:\n      - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { number: 80 } } } }\n      - { path: /,    pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }\nEOF\n\n# 4. test both paths through the SAME entry point\ncurl -s localhost/          | grep -o \"Server.*\" | head -1     # → web (hello demo)\ncurl -s localhost/api                                          # → hello from api\n```\n\nOne front door, path-based routing to two Services: the Ingress pattern.\n\nClean up:\n\n```bash\nkubectl delete ingress demo; kubectl delete deploy web api; kubectl delete svc web api\n```\n\n## Ingress vs the Gateway API (heads-up)\n\nIngress is ubiquitous but limited (HTTP-centric, lots of controller-specific annotations). The newer\n**Gateway API** (a standard set of resources: GatewayClass, Gateway, HTTPRoute) is its successor: more\nexpressive, role-oriented, and on the current CKA. Many controllers support both. Learn Ingress first\n(everywhere today); know the Gateway API is where things are heading."}, {"id": "13-autoscaling", "title": "13 · Autoscaling", "group": "Advanced platform", "md": "*Let the cluster add and remove capacity on its own. Concepts + a lab. ~25 min. Needs your kind\ncluster + metrics-server.*\n\n---\n\nYou set a replica count in Module 2. But load changes: busy at noon, quiet at night. **Autoscaling**\nmakes Kubernetes adjust capacity automatically. There are three kinds, at three levels; know what\neach does.\n\n## The three autoscalers\n\n| Autoscaler | Scales | Based on |\n|-----------|--------|----------|\n| **HPA** (Horizontal Pod Autoscaler) | **number of pods** (out/in) | CPU/memory or custom metrics |\n| **VPA** (Vertical Pod Autoscaler) | **each pod's requests/limits** (up/down) | observed usage |\n| **Cluster Autoscaler** | **number of nodes** | pending pods that don't fit |\n\nThe one you'll use most, and the one on the exam, is the **HPA**: more traffic → more pods; less\ntraffic → fewer. VPA right-sizes a pod's resources; the Cluster Autoscaler adds machines when pods\ncan't be scheduled (cloud clusters).\n\n## How the HPA works\n\nThe HPA runs a control loop: it reads a metric (say average CPU across the pods), compares it to a\n**target**, and computes the replica count needed to hit that target, then scales the Deployment.\n\n```\n   desiredReplicas = ceil( currentReplicas × (currentMetric / targetMetric) )\n```\n\nExample: 3 pods averaging 90% CPU, target 50% → `ceil(3 × 90/50) = ceil(5.4) = 6` pods. As load\nfalls, it scales back down (with a stabilization delay to avoid flapping). The HPA needs the\n**metrics-server** to read CPU/memory.\n\n## An HPA (declarative)\n\n```yaml\napiVersion: autoscaling/v2\nkind: HorizontalPodAutoscaler\nmetadata: { name: web }\nspec:\n  scaleTargetRef:\n    apiVersion: apps/v1\n    kind: Deployment\n    name: web\n  minReplicas: 2\n  maxReplicas: 10\n  metrics:\n  - type: Resource\n    resource:\n      name: cpu\n      target:\n        type: Utilization\n        averageUtilization: 50     # aim to keep average CPU at 50% of the pods' requests\n```\n\n> **HPA requires resource *requests*.** Utilization is measured *relative to the CPU request*\n> (Module 6). No request → the HPA can't compute a percentage. This is a classic gotcha.\n\n## Lab: watch pods scale under load\n\n```bash\n# 0. metrics-server (kind needs the insecure-kubelet flag)\nkubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml\nkubectl -n kube-system patch deployment metrics-server --type=json \\\n  -p='[{\"op\":\"add\",\"path\":\"/spec/template/spec/containers/0/args/-\",\"value\":\"--kubelet-insecure-tls\"}]'\nkubectl -n kube-system rollout status deployment/metrics-server\n\n# 1. a CPU-burnable app WITH a request (required for HPA)\nkubectl create deployment php --image=registry.k8s.io/hpa-example\nkubectl set resources deployment php --requests=cpu=100m\nkubectl expose deployment php --port=80\n\n# 2. an HPA: keep CPU ~50%, 1–10 replicas\nkubectl autoscale deployment php --cpu-percent=50 --min=1 --max=10\nkubectl get hpa php               # shows current vs target and replica count\n\n# 3. generate load and WATCH it scale up\nkubectl run load --image=busybox --restart=Never -- /bin/sh -c \\\n  \"while true; do wget -q -O- http://php; done\"\nkubectl get hpa php -w            # TARGETS climbs, REPLICAS grows toward 10 (give it a minute; Ctrl-C)\n\n# 4. stop the load and watch it scale back down (takes a few minutes)\nkubectl delete pod load\nkubectl get hpa php -w            # REPLICAS shrinks back toward 1\n\nkubectl delete hpa php; kubectl delete deploy php load 2>/dev/null; kubectl delete svc php\n```\n\nSeeing REPLICAS rise and fall on its own is the payoff: the cluster right-sizes itself to demand.\n\n## Practitioner notes\n\n- **HPA needs requests + metrics-server.** Set CPU requests on anything you autoscale.\n- **min/max are guardrails**: set a sane `minReplicas` (availability) and `maxReplicas` (cost cap).\n- **Don't combine HPA and VPA on the same CPU/memory metric**: they fight. Use VPA for\n  right-sizing requests, HPA for replica count (often on different signals).\n- **Scale-down is deliberately slow** (stabilization window) to avoid thrashing; expect a delay.\n- **Cluster Autoscaler** is a cloud concern (kind has fixed nodes) but conceptually: pending pods →\n  add nodes."}, {"id": "14-operators-crds", "title": "14 · Operators & CRDs", "group": "Advanced platform", "md": "*How Kubernetes is extended: adding your own object types and automation. Concepts + a lab. ~25 min.\nNeeds your kind cluster. On the current CKA.*\n\n---\n\nEverything you've done uses **built-in** object kinds (Pod, Deployment, Service…). Kubernetes' real\nsuperpower is that it's **extensible**: you can teach the API server *new* kinds of objects\n(**CRDs**) and write controllers (**Operators**) that reconcile them, using the exact same\ndeclarative model. This is how tools like cert-manager, Prometheus, and databases integrate so\ncleanly.\n\n## CRDs, your own object kinds\n\nA **CustomResourceDefinition** registers a brand-new resource type with the API server. Once\ninstalled, `kubectl get`, RBAC, labels, and `apply` all work on it like any built-in.\n\n```yaml\napiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata:\n  name: backups.example.com          # <plural>.<group>\nspec:\n  group: example.com\n  names:\n    kind: Backup\n    plural: backups\n    singular: backup\n    shortNames: [\"bk\"]\n  scope: Namespaced\n  versions:\n  - name: v1\n    served: true\n    storage: true\n    schema:\n      openAPIV3Schema:\n        type: object\n        properties:\n          spec:\n            type: object\n            properties:\n              schedule: { type: string }\n              database: { type: string }\n```\n\nNow you can create `Backup` objects:\n\n```yaml\napiVersion: example.com/v1\nkind: Backup\nmetadata: { name: nightly }\nspec:\n  schedule: \"0 2 * * *\"\n  database: orders\n```\n\nBut a CRD by itself is just **data storage**: creating a `Backup` object does nothing until\nsomething *acts* on it. That something is an Operator.\n\n## Operators, controllers for custom resources\n\nAn **Operator** is a controller that watches your custom resources and does the work, encoding the\noperational knowledge a human expert would apply. It runs the same **reconciliation loop** as\nbuilt-in controllers: observe the custom object's `spec`, compare to reality, act to close the gap.\n\n```\n   You create/edit a Backup object   ─watch─►   Operator (a controller pod)\n                                                   │ reconciles:\n                                                   ▼\n                                    creates CronJobs, runs dumps, updates status…\n```\n\nExamples you'll meet in the wild:\n\n- **cert-manager**: CRDs `Certificate`, `Issuer`; the operator obtains/renews TLS certs (Module 12).\n- **Prometheus Operator**: CRDs `Prometheus`, `ServiceMonitor`; manages monitoring.\n- **Database operators** (Postgres, etc.): a `PostgresCluster` object → the operator provisions,\n  backs up, fails over a real HA database.\n\nThe **Operator pattern** = **CRD (the new noun) + controller (the automation)**. It turns \"run this\ncomplex system\" into \"declare a simple object and let the operator handle the details.\"\n\n## Lab: create a CRD and use it\n\n```bash\n# 1. install the CRD above\ncat <<'EOF' | kubectl apply -f -\napiVersion: apiextensions.k8s.io/v1\nkind: CustomResourceDefinition\nmetadata: { name: backups.example.com }\nspec:\n  group: example.com\n  names: { kind: Backup, plural: backups, singular: backup, shortNames: [\"bk\"] }\n  scope: Namespaced\n  versions:\n  - name: v1\n    served: true\n    storage: true\n    schema:\n      openAPIV3Schema:\n        type: object\n        properties:\n          spec:\n            type: object\n            properties:\n              schedule: { type: string }\n              database: { type: string }\nEOF\n\n# 2. the new kind is now first-class in the API\nkubectl api-resources | grep backups\nkubectl get crds | grep example.com\n\n# 3. create and query custom objects like anything else\ncat <<'EOF' | kubectl apply -f -\napiVersion: example.com/v1\nkind: Backup\nmetadata: { name: nightly }\nspec: { schedule: \"0 2 * * *\", database: orders }\nEOF\nkubectl get backups            # or: kubectl get bk\nkubectl describe backup nightly\n\n# note: nothing \"happens\", there's no operator watching. That's the point.\nkubectl delete backup nightly\nkubectl delete crd backups.example.com\n```\n\nYou extended the Kubernetes API with your own type. Add an operator (a controller pod) and those\n`Backup` objects would trigger real work. That's how the ecosystem builds on Kubernetes.\n\n## How operators are built (awareness)\n\nYou usually **install** operators (via Helm or a manifest), not write them. If you do build one,\ncommon tools are the **Operator SDK** and **Kubebuilder** (Go), which scaffold the CRD + controller.\nThe key insight to carry: **the whole ecosystem extends Kubernetes with the same CRD + controller\npattern you just saw**: nothing magic, just more of the reconciliation model."}, {"id": "15-capstone", "title": "15 · Capstone: multi-service app", "group": "Capstone & cert", "md": "*Put it all together. You'll deploy a real multi-tier app (frontend, API, database) with config,\nsecrets, storage, health, autoscaling, and ingress. ~45 min. Needs your kind cluster (with\ningress-nginx + metrics-server from Modules 12–13).*\n\n---\n\nThis is the module that turns knowledge into skill. You'll assemble almost every concept from the\ncourse into one working system, the way a practitioner actually builds it. Read each piece, apply\nit, verify it.\n\n## What we're building\n\n```\n   internet ──► Ingress ──► frontend (Deployment + Service, HPA)\n                            └─► api (Deployment + Service, HPA)\n                                  └─► db (StatefulSet + PVC)\n                                        ▲\n             config (ConfigMap) + secrets (Secret) feed api & db\n```\n\nA classic three-tier app: a web frontend, an API, and a database, each with the production\ntrimmings you learned.\n\n## Step 1, namespace and config\n\n```bash\nkubectl create namespace shop\nkubectl config set-context --current --namespace=shop     # work in 'shop' by default\n\n# non-secret config for the api\nkubectl create configmap api-config --from-literal=LOG_LEVEL=info --from-literal=GREETING=\"Shop API\"\n# secret DB credentials\nkubectl create secret generic db-secret \\\n  --from-literal=POSTGRES_PASSWORD=s3cret --from-literal=POSTGRES_DB=shop\n```\n\n## Step 2, the database (StatefulSet + storage)\n\n```bash\ncat <<'EOF' | kubectl apply -f -\napiVersion: apps/v1\nkind: StatefulSet\nmetadata: { name: db }\nspec:\n  serviceName: db\n  replicas: 1\n  selector: { matchLabels: { app: db } }\n  template:\n    metadata: { labels: { app: db } }\n    spec:\n      containers:\n      - name: postgres\n        image: postgres:16\n        envFrom: [{ secretRef: { name: db-secret } }]\n        ports: [{ containerPort: 5432 }]\n        readinessProbe: { exec: { command: [\"pg_isready\",\"-U\",\"postgres\"] }, periodSeconds: 5 }\n        resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { memory: 256Mi } }\n        volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]\n  volumeClaimTemplates:\n  - metadata: { name: data }\n    spec: { accessModes: [\"ReadWriteOnce\"], resources: { requests: { storage: 1Gi } } }\n---\napiVersion: v1\nkind: Service\nmetadata: { name: db }\nspec:\n  clusterIP: None                 # headless, for the StatefulSet's stable DNS\n  selector: { app: db }\n  ports: [{ port: 5432 }]\nEOF\nkubectl rollout status statefulset/db\n```\n\n*(Concepts used: StatefulSet, PVC via volumeClaimTemplates, Secret via envFrom, readiness probe,\nresources, headless Service.)*\n\n## Step 3, the API (Deployment + Service + probes + HPA)\n\n```bash\ncat <<'EOF' | kubectl apply -f -\napiVersion: apps/v1\nkind: Deployment\nmetadata: { name: api }\nspec:\n  replicas: 2\n  selector: { matchLabels: { app: api } }\n  template:\n    metadata: { labels: { app: api } }\n    spec:\n      containers:\n      - name: api\n        image: hashicorp/http-echo\n        args: [\"-text=hello from the shop api\", \"-listen=:80\"]\n        ports: [{ containerPort: 80 }]\n        envFrom: [{ configMapRef: { name: api-config } }]\n        env:\n        - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: db-secret, key: POSTGRES_PASSWORD } } }\n        readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 3 }\n        livenessProbe:  { httpGet: { path: /, port: 80 }, periodSeconds: 10 }\n        resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { memory: 128Mi } }\n---\napiVersion: v1\nkind: Service\nmetadata: { name: api }\nspec: { selector: { app: api }, ports: [{ port: 80 }] }\nEOF\nkubectl autoscale deployment api --cpu-percent=60 --min=2 --max=8\nkubectl rollout status deployment/api\n```\n\n## Step 4, the frontend (Deployment + Service)\n\n```bash\nkubectl create deployment frontend --image=nginxdemos/hello --replicas=2\nkubectl set resources deployment frontend --requests=cpu=50m,memory=32Mi\nkubectl expose deployment frontend --port=80\n```\n\n## Step 5, the Ingress (one front door, path routing)\n\n```bash\ncat <<'EOF' | kubectl apply -f -\napiVersion: networking.k8s.io/v1\nkind: Ingress\nmetadata:\n  name: shop\n  annotations: { nginx.ingress.kubernetes.io/rewrite-target: / }\nspec:\n  ingressClassName: nginx\n  rules:\n  - http:\n      paths:\n      - { path: /api, pathType: Prefix, backend: { service: { name: api, port: { number: 80 } } } }\n      - { path: /,    pathType: Prefix, backend: { service: { name: frontend, port: { number: 80 } } } }\nEOF\n```\n\n## Step 6, verify the whole system\n\n```bash\nkubectl get all                                  # everything: pods, deploys, statefulset, services, hpa\ncurl -s localhost/api                            # → hello from the shop api  (through Ingress → api)\ncurl -s localhost/ | grep -o \"Server.*\" | head -1  # → frontend\n\n# self-healing: kill an api pod, watch it return, service uninterrupted\nkubectl delete pod -l app=api --grace-period=1 | head -1\nkubectl get pods -l app=api                      # replacement scheduled\n\n# the db kept its identity + storage\nkubectl get statefulset db; kubectl get pvc\n```\n\nIf all three tiers respond and the killed pod self-heals, **you've deployed a production-shaped app**\nwith config/secrets externalized, data persisted, health-checked, autoscaled, and fronted by a single\ningress.\n\n## Step 7, challenge tasks (do these yourself)\n\nTo cement mastery, extend it without step-by-step help:\n\n1. **Roll out a new API version** and watch zero-downtime; then break it and roll back.\n2. **Add a NetworkPolicy** so only the api may reach the db (default-deny others).\n3. **Package it as a Helm chart or Kustomize base+overlays** for dev vs prod (different replicas/tags).\n4. **Add a second frontend host** and route by `Host:` header in the Ingress.\n5. **Generate load** on the api and watch the HPA scale it.\n6. **Build and deploy your own image (full loop).** Using `docker buildx` (Docker course, module 8),\n   build a **multi-arch** image of a tiny app of your own, push it to a registry, then point the api\n   Deployment at it with `kubectl set image` and watch the readiness-gated rollout: the complete\n   build → push → deploy loop spanning both courses.\n\n## Clean up\n\n```bash\nkubectl config set-context --current --namespace=default\nkubectl delete namespace shop          # removes everything in one shot\n```"}, {"id": "16-cka-ckad-prep", "title": "16 · CKA / CKAD exam prep", "group": "Capstone & cert", "md": "*Turn this course into a certification. What the exams test, how they map to what you've learned, and\nthe speed techniques that decide pass/fail. ~25 min read.*\n\n---\n\nThe **CKA** (Certified Kubernetes Administrator) and **CKAD** (Certified Kubernetes Application\nDeveloper) are the industry-standard, **hands-on** certifications. They're not multiple-choice: you\nget a live cluster and a terminal and must **perform tasks** under time pressure. Everything in this\ncourse maps to them.\n\n## The two exams\n\n| | CKA | CKAD |\n|--|-----|------|\n| Audience | Cluster **operators/admins** | App **developers** deploying to K8s |\n| Style | Performance-based, live cluster | Performance-based, live cluster |\n| Emphasis | Cluster ops, networking, storage, **troubleshooting** | Building/deploying/configuring apps |\n| Duration | 2 hours | 2 hours |\n\nBoth are open-book against the **official docs only** (kubernetes.io), so speed navigating docs and\n`kubectl` matters more than memorization.\n\n## CKA domains (v1.x, current) and where you learned them\n\n| Domain | Weight | Course modules |\n|--------|--------|----------------|\n| Cluster Architecture, Installation & Configuration (RBAC, Helm, Kustomize, CRDs) | **25%** | 1(primer), 7, 9, 10, 14 |\n| Workloads & Scheduling (Deployments, ConfigMaps/Secrets, HPA) | **15%** | 2, 4, 6, 13 |\n| Services & Networking (Services, Ingress, NetworkPolicy, Gateway API, DNS) | **20%** | 3, 12, 7 |\n| Storage (StorageClasses, PV/PVC) | **10%** | 5 |\n| **Troubleshooting** | **30%** | 8 (and everywhere) |\n\nNote troubleshooting is the **biggest** slice: Module 8 is your highest-value review.\n\n## CKAD domains (current) and where you learned them\n\n| Domain | Weight | Course modules |\n|--------|--------|----------------|\n| Application Design & Build (images, Jobs, multi-container pods) | **20%** | Docker course, 1, 2 |\n| Application Deployment (Deployments, rolling updates, Helm/Kustomize) | **20%** | 2, 9, 10, 11 |\n| Application Observability & Maintenance (probes, logging, debugging) | **15%** | 6, 8 |\n| Application Environment, Config & Security (ConfigMaps, Secrets, SecurityContext, ServiceAccounts) | **25%** | 4, 7 |\n| Services & Networking (Services, NetworkPolicy) | **20%** | 3, 7, 12 |\n\n## The #1 exam skill: generate YAML fast with `--dry-run`\n\nYou do **not** hand-write YAML from scratch in the exam: you generate it and edit. Master this:\n\n```bash\n# generate a Deployment manifest without creating it\nkubectl create deployment web --image=nginx --replicas=3 \\\n  --dry-run=client -o yaml > web.yaml\n# then edit web.yaml and: kubectl apply -f web.yaml\n\n# a pod\nkubectl run nginx --image=nginx --dry-run=client -o yaml > pod.yaml\n\n# a service for a deployment\nkubectl expose deployment web --port=80 --dry-run=client -o yaml > svc.yaml\n\n# a configmap / secret\nkubectl create configmap cfg --from-literal=k=v --dry-run=client -o yaml\nkubectl create secret generic s --from-literal=k=v --dry-run=client -o yaml\n```\n\n`--dry-run=client -o yaml` is the single most important exam habit. It turns a 5-minute typing task\ninto 30 seconds.\n\n## Speed setup (do this first in the exam)\n\n```bash\nalias k=kubectl                        # (often pre-aliased)\nexport do=\"--dry-run=client -o yaml\"   # so: k create deploy web --image=nginx $do\nexport now=\"--force --grace-period=0\"  # fast pod deletes\nkubectl config set-context --current --namespace=<the-task-namespace>   # per question!\n```\n\nEnable `kubectl` completion, and **always set the namespace the question specifies**; a right answer\nin the wrong namespace scores zero.\n\n## Time-savers to memorize\n\n- **Explain fields fast:** `kubectl explain deployment.spec.strategy` (offline, no docs needed).\n- **Edit live objects:** `kubectl edit deploy web` for quick changes.\n- **Scale/rollout imperatively:** `kubectl scale`, `kubectl set image`, `kubectl rollout undo`.\n- **Label/annotate imperatively:** `kubectl label pod x env=prod`.\n- **Find docs by search** on kubernetes.io: bookmark the tasks pages for NetworkPolicy, probes,\n  volumes (you copy-paste and adapt these).\n- **Don't polish**: get it working, verify, move on. Flag hard questions and return.\n\n## A practice regimen\n\n1. **Redo every lab in this course from memory**, generating YAML with `--dry-run`.\n2. **Time yourself**: aim for a few minutes per task.\n3. **Drill troubleshooting** (Module 8): have a friend break something, you fix it. It's 30% of CKA.\n4. **Take a timed mock exam** (killer.sh comes with the exam registration) before the real thing.\n5. **Practice the capstone (Module 15)** end-to-end until it's fluent.\n\n## What to review the night before\n\n- Generating manifests with `--dry-run=client -o yaml`.\n- Probes (liveness vs readiness), requests/limits (Module 6).\n- RBAC (`kubectl auth can-i`), ServiceAccounts (Module 7).\n- Services & DNS, Ingress, NetworkPolicy (Modules 3, 12, 7).\n- PV/PVC/StorageClass (Module 5).\n- **Troubleshooting method** (Module 8): describe → logs → fix."}, {"id": "17-debugging-next-steps", "title": "17 · Debugging & next steps", "group": "Capstone & cert", "md": "*The field guide you'll come back to. Concept-only. ~15 min.*\n\n---\n\nYou've gone from \"what is a container\" to deploying a self-healing, autoscaled, ingress-fronted,\nmulti-service app, and mapped it all to the CKA/CKAD. This closing module consolidates the\ngotchas and points the way forward.\n\n## The universal debugging method (one more time)\n\nFor *any* Kubernetes problem:\n\n1. **`kubectl get <res> -o wide`**: what's the state, and where?\n2. **`kubectl describe <res> <name>`**: read the **Events**. Usually the answer.\n3. **`kubectl logs <pod> [--previous]`**: the app's own words.\n4. **Narrow the layer:** pod → Service/endpoints → Ingress → external. Test each hop.\n5. **Probe live:** `kubectl exec`/a scratch `kubectl run` pod to test DNS and connectivity.\n\n`describe` (Events) + `logs` resolve the large majority of issues. Internalize this loop.\n\n## The gotchas that bite everyone\n\n- **Service has no endpoints.** The Service `selector` doesn't match the pods' `labels`. The #1\n  networking bug; check `kubectl get endpointslices`.\n- **Pod Pending forever.** Insufficient CPU/memory (requests too high), an unschedulable node\n  selector/taint, or an unbound PVC. `describe` says which.\n- **CrashLoopBackOff.** The app errors on start: `kubectl logs --previous`.\n- **ImagePullBackOff.** Wrong image name/tag, or a private registry with no `imagePullSecret`.\n- **Config change didn't apply.** ConfigMap/Secret consumed as **env vars** doesn't update running\n  pods: `kubectl rollout restart deployment/<x>`.\n- **HPA shows `<unknown>` / doesn't scale.** No metrics-server, or the Deployment has no CPU\n  **requests**.\n- **NetworkPolicy \"doesn't work.\"** Your CNI doesn't enforce policies (vanilla kind), or you forgot a\n  default-deny so everything is still allowed. Also: policies are deny-by-default *only for pods they\n  select*.\n- **`latest` tag surprises.** A pod may keep an old cached image; use specific tags and\n  `imagePullPolicy: Always` when needed.\n- **Wrong namespace.** `kubectl get pods` shows nothing because your object is in another namespace;\n  add `-n <ns>` or `-A`.\n- **Readiness vs liveness confusion.** Liveness restarts (use for \"wedged\"); readiness gates traffic\n  (use for \"not ready yet\"). A too-aggressive liveness probe causes restart loops.\n- **PVC stuck Pending.** No default StorageClass or no matching PV: `describe pvc`.\n\nMemorize this list: it's most of your on-call and exam pain, pre-solved.\n\n## Production readiness checklist\n\nBefore calling a workload production-ready:\n\n- **Health:** readiness + liveness probes on every container.\n- **Resources:** requests + memory limits set; not BestEffort.\n- **Config:** externalized to ConfigMaps/Secrets; secrets encrypted at rest + tight RBAC.\n- **Security:** non-root, dropped capabilities, per-app ServiceAccount with least privilege,\n  default-deny NetworkPolicies.\n- **Availability:** multiple replicas, a PodDisruptionBudget, anti-affinity across nodes.\n- **Scaling:** HPA with sane min/max where load varies.\n- **Rollouts:** readiness-gated rolling updates; a tested rollback path.\n- **Observability:** logs to stdout, metrics scraped, alerts on the golden signals; ideally traces.\n- **Delivery:** manifests in git (Helm/Kustomize), deployed via CI/CD or GitOps.\n\n## What you didn't cover (know these exist)\n\nThe ecosystem is huge; you now have the foundation to learn any of it:\n\n- **Service mesh** (Istio/Linkerd): mTLS, traffic management, observability across services. *(See\n  the Istio and Envoy courses; they build directly on this.)*\n- **Advanced scheduling**: affinity/anti-affinity, taints/tolerations, topology spread.\n- **Multi-tenancy & policy**: ResourceQuotas, LimitRanges, Pod Security Standards, OPA/Kyverno.\n- **Stateful ecosystems**: operators for databases, Kafka, etc. (Module 14's pattern).\n- **Backup/DR** (Velero), **secrets managers** (External Secrets, Vault), **progressive delivery**\n  (Argo Rollouts, Flagger).\n\n## Where to go next\n\n- **Official docs & tasks**: <https://kubernetes.io/docs/> (the *Tasks* section is the exam's\n  open-book source; get fast at navigating it).\n- **Get certified**: Module 16 maps this course to the CKA/CKAD; drill the labs and take a mock.\n- **The service-mesh courses**: Envoy (the data plane) and Istio (the control plane) extend what you\n  learned here into advanced networking.\n- **Run something real**: deploy a personal project to a managed cluster (GKE/EKS/AKS free tiers);\n  the concepts transfer directly from kind.\n\n## Course recap, the one-paragraph mental model\n\n**Kubernetes** runs your **container images** across a cluster of nodes by **declarative desired\nstate**: you submit objects (Pods via **Deployments**/**StatefulSets**, exposed by **Services** and\n**Ingress**, configured by **ConfigMaps**/**Secrets**, backed by **PV/PVCs**) to the control plane,\nand controllers **continuously reconcile** reality to match: self-healing, scaling (**HPA**), and\nrolling out updates with zero downtime via **probes**. You secure it with **RBAC** and\n**NetworkPolicies**, package it with **Helm**/**Kustomize**, ship it with **CI/CD or GitOps**, and\nextend it with **CRDs and operators**: the same reconciliation idea, all the way down."}], "quizzes": {"primer-core-concepts": [{"q": "What is a 'node' in Kubernetes?", "options": ["One machine in the cluster that runs your containers", "A single container", "A YAML file", "The command-line tool"], "answer": 0, "why": "A node is one machine (usually a VM) in the cluster. The control plane decides which node runs each of your pods.", "whyWrong": ["", "A container runs inside a pod on a node; the node is the machine hosting it.", "YAML files describe objects; a node is actual hardware (or a VM) running workloads.", "The command-line tool is kubectl; nodes are the machines it manages."]}, {"q": "What is a 'cluster'?", "options": ["A group of nodes managed together by Kubernetes (control plane plus worker nodes)", "A single powerful server", "A container image", "A network port"], "answer": 0, "why": "You deploy to the cluster as a whole; Kubernetes (the control plane) schedules your work across its worker nodes.", "whyWrong": ["", "A cluster is many machines pooled together; one big server is exactly what it replaces.", "Images are packaged app code stored in a registry; a cluster is the machines that run them.", "Ports belong to networking; a cluster is the whole set of nodes plus the control plane."]}, {"q": "What is a Pod?", "options": ["The smallest thing Kubernetes runs, a wrapper around one or a few containers; roughly one running instance of your app", "A physical machine", "A storage disk", "A cluster of nodes"], "answer": 0, "why": "You don't run containers directly in Kubernetes, you run Pods, which wrap the container(s) and give them an identity and networking.", "whyWrong": ["", "That's a node; a pod is the small unit of work scheduled onto a node.", "Disks are volumes/PersistentVolumes; a pod is one or more running containers.", "That's the cluster itself; a pod is the smallest thing running inside it."]}, {"q": "What does 'declarative' mean in Kubernetes?", "options": ["You describe the desired end state and Kubernetes keeps reality matching it, rather than giving step-by-step commands", "You run each command manually in order", "You write code in a special language", "You declare variables before using them"], "answer": 0, "why": "You state intent ('5 healthy replicas') and controllers continuously reconcile the cluster to match, the defining idea of Kubernetes.", "whyWrong": ["", "Step-by-step commands are the imperative style, the opposite of declarative.", "You write plain YAML describing objects, not code in a programming language.", "That's variable declaration in programming; here it means declaring desired cluster state."]}, {"q": "What is kubectl?", "options": ["The command-line tool you use to talk to the cluster's API server", "The database that stores cluster state", "A container runtime", "The scheduler"], "answer": 0, "why": "kubectl sends your requests (get, apply, describe...) to the API server. It's your main way to interact with any cluster.", "whyWrong": ["", "That's etcd; kubectl is the client tool you type commands into.", "Runtimes like containerd run containers on nodes; kubectl just sends requests to the API server.", "The scheduler places pods on nodes; kubectl is your CLI to the cluster."]}], "18-reading-kubectl-output": [{"q": "In 'kubectl get pods', what does READY 0/1 with a rising RESTARTS count tell you?", "options": ["The container keeps crashing (a crash loop; check logs --previous)", "The pod is healthy and serving", "The image finished pulling", "The node is out of disk"], "answer": 0, "why": "0/1 means not ready; climbing RESTARTS means it starts then dies (CrashLoopBackOff). 'kubectl logs --previous' shows the crash reason.", "whyWrong": ["", "Healthy would show READY 1/1 with a stable restart count.", "A pull in progress shows ContainerCreating or ImagePullBackOff; rising restarts means the app starts then dies.", "Disk pressure shows up as evictions and node conditions, not a climbing RESTARTS counter."]}, {"q": "A Service's 'kubectl get endpoints' shows <none>. What does that mean?", "options": ["The Service matches no pods, usually a selector/label mismatch; traffic has nowhere to go", "The Service is working perfectly", "The cluster is out of memory", "DNS is disabled"], "answer": 0, "why": "Empty endpoints mean the selector matched no (ready) pods. Compare the Service's selector to the pods' labels, the #1 Service bug.", "whyWrong": ["", "A working Service lists pod IPs in its endpoints; <none> means nothing is behind it.", "Memory pressure affects pods and nodes; endpoints only reflect selector/label matching.", "DNS is separate, even with DNS fine, <none> endpoints means no matching ready pods."]}, {"q": "Where in 'kubectl describe pod' is the most useful debugging information?", "options": ["The Events section at the bottom (Warning lines name the cause)", "The Labels section", "The IP address field", "The Age column"], "answer": 0, "why": "Events are a plain-English timeline; the Warning lines (image pull failed, insufficient cpu, probe failed) usually state the problem directly.", "whyWrong": ["", "Labels tell you how the pod is selected, not why it's failing.", "The IP rarely explains a failure; Events name the actual error.", "Age just says how old the pod is: Events tell you what went wrong."]}, {"q": "'kubectl top pods' returns 'Metrics API not available.' Why?", "options": ["The metrics-server isn't installed or ready", "The pods are all healthy", "You lack RBAC to list pods", "The node is NotReady"], "answer": 0, "why": "kubectl top (and HPAs) read from the metrics-server. If it's missing, top errors and HPAs show <unknown>.", "whyWrong": ["", "Pod health doesn't matter, the error means the Metrics API itself has no backend.", "An RBAC denial would say Forbidden, not that the API is unavailable.", "A NotReady node doesn't remove the Metrics API; a missing metrics-server does."]}, {"q": "A PVC shows STATUS: Pending. What's wrong?", "options": ["No PersistentVolume to bind to / no default StorageClass to provision one (and pods using it will also stay Pending)", "The volume is full", "The pod crashed", "The image is missing"], "answer": 0, "why": "A Pending PVC hasn't bound to storage. Without a matching PV or a default StorageClass to create one, any pod mounting it also stays Pending.", "whyWrong": ["", "A full volume errors inside the pod at write time; Pending means the claim never bound at all.", "Crashes show in pod status; a Pending PVC has no storage bound yet.", "Images affect container start, not PVC binding."]}], "setup-local-k8s": [{"q": "What does kind do?", "options": ["Runs a real Kubernetes cluster locally, using Docker containers as the nodes", "Installs Kubernetes on a cloud provider", "Is a text editor for YAML", "Replaces kubectl"], "answer": 0, "why": "kind = Kubernetes IN Docker. It runs the control plane and workers as Docker containers so you get a full cluster on your laptop.", "whyWrong": ["", "kind is local-only, its nodes are Docker containers on your machine, not cloud VMs.", "kind creates clusters; it has nothing to do with editing files.", "You still use kubectl to talk to a kind cluster; kind just creates it."]}, {"q": "What is kubectl?", "options": ["The command-line tool you use to talk to any Kubernetes cluster", "The Kubernetes scheduler", "A container runtime", "A registry for images"], "answer": 0, "why": "kubectl sends your commands (get, apply, describe...) to the cluster's API server. It's your primary interface to Kubernetes.", "whyWrong": ["", "The scheduler is a control-plane component; kubectl is the client tool on your machine.", "Runtimes like containerd run containers on nodes; kubectl only sends API requests.", "Registries (like Docker Hub) store images; kubectl doesn't hold any."]}, {"q": "What did 'kubectl create deployment web --replicas=3' produce?", "options": ["Three nginx pods, scheduled across the worker nodes", "One pod on the control plane", "A registry with three images", "Three separate clusters"], "answer": 0, "why": "A Deployment declaring 3 replicas creates 3 pods, which the scheduler places across available worker nodes.", "whyWrong": ["", "replicas=3 means three pods, and the scheduler places them on workers, not the control plane.", "Replicas are running pods from one image, not copies of the image.", "A Deployment lives inside one cluster; it never creates clusters."]}, {"q": "What happened when you deleted one of the pods?", "options": ["Kubernetes created a replacement to keep the desired 3 (self-healing)", "The deployment dropped to 2 permanently", "The whole cluster restarted", "Nothing, the pod stayed deleted"], "answer": 0, "why": "You declared 3 replicas; the controller continuously reconciles to keep 3 healthy, so it replaced the deleted pod automatically.", "whyWrong": ["", "The ReplicaSet notices 2 < 3 and immediately creates a replacement.", "Deleting one pod touches nothing else; only that pod gets replaced.", "True for bare pods, but Deployment-owned pods are recreated to match the count."]}, {"q": "How do you delete the whole local environment?", "options": ["kind delete cluster --name k8s-lab", "kubectl delete everything", "docker stop kubernetes", "helm uninstall cluster"], "answer": 0, "why": "kind delete cluster removes the entire cluster (all nodes/containers) in one command. Recreate anytime.", "whyWrong": ["", "'everything' isn't a kubectl resource, and deleting objects still leaves the cluster running.", "The nodes are containers, but that's not their name, and stopping isn't deleting.", "Helm uninstalls releases inside a cluster; it can't remove the cluster itself."]}], "primer-why-kubernetes": [{"q": "What problem does Kubernetes solve?", "options": ["Running and managing many containers across many machines, scheduling, healing, scaling, discovery (automatically)", "Building container images faster", "Writing application code for you", "Replacing the need for servers"], "answer": 0, "why": "Kubernetes is a container orchestrator: it schedules, heals, scales, and connects containers across a fleet of machines automatically.", "whyWrong": ["", "Image building is Docker/CI territory; Kubernetes starts after the image exists.", "Kubernetes runs your code; it has no idea what's inside the containers.", "Kubernetes needs servers (nodes), it manages them, it doesn't eliminate them."]}, {"q": "What is the 'declarative desired state' idea?", "options": ["You declare the end state you want; Kubernetes continuously makes reality match it", "You run each command by hand, one at a time", "Kubernetes guesses what you want", "You describe the past, not the future"], "answer": 0, "why": "Instead of imperative steps, you declare intent ('5 healthy replicas') and Kubernetes works forever to keep reality matching it.", "whyWrong": ["", "Hand-run commands are the imperative approach this idea replaces.", "Nothing is guessed, you state desired state explicitly in specs.", "Desired state is the future you want; Kubernetes drives reality toward it."]}, {"q": "What is reconciliation?", "options": ["The never-ending control loop that checks actual vs desired state and fixes the difference", "A one-time setup script", "The process of building an image", "A billing report"], "answer": 0, "why": "Controllers continuously compare spec (desired) to status (actual) and act to close the gap, the heartbeat of Kubernetes.", "whyWrong": ["", "It never runs once and stops, the loop watches and corrects forever.", "Image builds happen outside the cluster; reconciliation is about running state.", "Reconciliation here means converging state, not accounting."]}, {"q": "Does Kubernetes build your container images?", "options": ["No, you build and push them; Kubernetes pulls and runs them", "Yes, it builds from your Dockerfile on each node", "Only for public images", "Only if you use Helm"], "answer": 0, "why": "Kubernetes runs prebuilt images from a registry. Building is a separate step (Docker/CI); Kubernetes orchestrates the running.", "whyWrong": ["", "Nodes pull ready-made images from a registry; no Dockerfile ever reaches the cluster.", "Public vs private only changes pull credentials, not who builds.", "Helm packages manifests; it doesn't build images either."]}, {"q": "When is Kubernetes worth its complexity?", "options": ["When you have multiple services needing availability, scale, and frequent deploys", "For a single small app on one server", "Only for companies with 10,000 employees", "Never: Docker is always enough"], "answer": 0, "why": "A mesh of features earns its cost at scale. For one small app, simpler tools suffice; Kubernetes shines with many services and high availability needs.", "whyWrong": ["", "For one small app the orchestration overhead outweighs the benefit, a single server or PaaS is simpler.", "Team size isn't the trigger; service count, uptime needs, and deploy frequency are.", "Docker runs containers on one machine; it doesn't heal, scale, or schedule across a fleet."]}], "primer-cluster-architecture": [{"q": "What are the two kinds of nodes and their roles?", "options": ["Control plane = the brain (decisions); worker nodes = the muscle (run containers)", "Primary and backup, both running containers", "Frontend and backend nodes", "Public and private nodes"], "answer": 0, "why": "The control plane makes scheduling/reconciliation decisions; worker nodes actually run your pods.", "whyWrong": ["", "It's a division of roles, not redundancy, the control plane usually doesn't run your app pods at all.", "Frontend/backend describes your app tiers, not cluster machinery.", "Network exposure isn't the split; decision-making vs running workloads is."]}, {"q": "What does the API server do?", "options": ["It's the front door, everything talks to it; you submit desired state there", "It runs your containers", "It stores container images", "It load-balances user traffic"], "answer": 0, "why": "Every component and kubectl talks to the API server. It validates and stores desired state (in etcd) and is the hub of the cluster.", "whyWrong": ["", "Containers run on worker nodes via the kubelet; the API server only handles requests and state.", "Images live in a registry; the API server stores object definitions in etcd.", "User traffic goes through Services/Ingress; the API server carries cluster control traffic."]}, {"q": "What is etcd?", "options": ["The cluster's database, the single source of truth for all state", "The container runtime", "The networking proxy", "The autoscaler"], "answer": 0, "why": "etcd is a key-value store holding the entire
