<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kubernetes Crash Course</title>
<style>
  :root{
    /* Aligned with the site and the dojo engine. Raw hues are for fills and
       borders; the darker values are the ones safe to put text in. The night
       palette lives on #sidebar below, so the shell reads as one system with
       roniam.dev: dark rail, light page. */
    --bg:#f6f6fa; --panel:#ffffff; --panel2:#f5f3ff; --ink:#191530; --muted:#5b5872;
    --teal:#115e59; --teal-dim:#99f6e4; --line:#e4e4f0; --code:#0f172a;
    --good:#166534; --good-bg:#f0fdf4; --bad:#9f1239; --bad-bg:#fff1f2; --accent:#6d28d9;
    --night:#130f26; --night2:#221a44;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  }
  /* The rail keeps the night palette by re-declaring the tokens on itself, so
     every descendant inherits the dark variants without a second stylesheet. */
  #sidebar{
    --panel:#130f26; --panel2:#2a2150; --ink:#ffffff; --muted:#c9c2e8;
    --line:#2c2350; --teal:#c4b5fd; --teal-dim:#4c1d95; --code:#0b1017;
    background:linear-gradient(180deg,#130f26,#221a44) !important; color:#fff;
  }
  #sidebar .brand h1{font-family:var(--serif);font-weight:600;font-size:18px}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--teal);text-decoration:none} a:hover{text-decoration:underline}
  #app{display:flex;min-height:100vh}
  /* sidebar */
  #sidebar{width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 0}
  .brand{padding:0 20px 14px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .brand h1{font-size:17px;margin:0;color:#fff;letter-spacing:.2px}
  .brand .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .progwrap{padding:12px 20px}
  .progbar{height:7px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .progfill{height:100%;width:0;background:linear-gradient(90deg,var(--teal-dim),var(--teal));transition:width .4s}
  .progtxt{font-size:11px;color:var(--muted);margin-top:6px}
  .searchwrap{padding:6px 20px 4px}
  #search{width:100%;background:var(--code);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:9px 11px;font-size:13.5px;outline:none}
  #search:focus{border-color:var(--teal)}
  .searchinfo{font-size:11px;color:var(--muted);padding:4px 20px 0}
  .result{padding:9px 20px;cursor:pointer;border-left:3px solid transparent}
  .result:hover{background:var(--panel2);border-left-color:var(--teal)}
  .result .rt{font-size:13.5px;color:#fff;font-weight:600}
  .result .rs{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
  .result .rs mark{background:var(--teal-dim);color:#d7fff6;border-radius:3px;padding:0 2px}
  .noresult{padding:12px 20px;font-size:13px;color:var(--muted)}
  .pathlinks{padding:14px 20px 4px;border-top:1px solid var(--line);margin-top:12px;
    font-size:12px;color:var(--muted);line-height:1.9}
  .pathlinks a{color:var(--muted)} .pathlinks a:hover{color:var(--teal)}
  .pathlinks .pl-here{color:var(--teal);font-weight:700}
  .pathlinks .pl-head{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;
    font-weight:800;color:var(--muted);margin-bottom:2px}
  .navgroup{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);
    padding:14px 20px 6px;font-weight:700}
  .navitem{display:flex;align-items:center;gap:9px;padding:8px 20px;cursor:pointer;
    font-size:14px;color:var(--ink);border-left:3px solid transparent}
  .navitem:hover{background:var(--panel2)}
  .navitem.active{background:var(--panel2);border-left-color:var(--teal);color:#fff}
  .navitem .dot{width:16px;height:16px;flex:0 0 16px;border-radius:50%;border:2px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;font-size:10px}
  .navitem.done .dot{background:var(--teal);border-color:var(--teal);color:#04211f}
  .navitem .t{flex:1}
  /* main */
  #main{flex:1;min-width:0;display:flex;justify-content:center;padding:38px 40px 90px}
  #content{max-width:820px;width:100%}
  #content h2{font-size:26px;margin:.2em 0 .5em;color:var(--ink);font-family:var(--serif);font-weight:600}
  #content h3{font-size:19px;margin:1.5em 0 .4em;color:var(--teal)}
  #content h4{font-size:16px;margin:1.2em 0 .3em;color:var(--ink)}
  #content p{margin:.7em 0}
  #content p.dd{margin:.2em 0 .8em 1.2em;color:var(--muted)}
  #content ul,#content ol{margin:.6em 0;padding-left:1.4em}
  #content li{margin:.3em 0}
  #content strong{color:var(--ink)}
  #content code{background:var(--code);border:1px solid var(--line);border-radius:5px;
    padding:.08em .38em;font:13.5px/1.4 "SF Mono",Menlo,Consolas,monospace;color:#8be9c9}
  #content hr{border:0;border-top:1px solid var(--line);margin:1.8em 0}
  blockquote{margin:1em 0;padding:.5em 1em;background:var(--panel);border-left:3px solid var(--accent);
    border-radius:0 6px 6px 0;color:var(--ink)}
  blockquote p{margin:.3em 0}
  pre.code{position:relative;background:var(--code);border:1px solid var(--line);border-radius:9px;
    padding:14px 16px;overflow-x:auto;margin:1em 0}
  pre.code code{background:none;border:0;padding:0;color:#d7e2ea;
    font:13px/1.55 "SF Mono",Menlo,Consolas,monospace;white-space:pre}
  pre.code .copy{position:absolute;top:8px;right:8px;background:var(--panel2);color:var(--muted);
    border:1px solid var(--line);border-radius:6px;font-size:11px;padding:3px 9px;cursor:pointer}
  pre.code .copy:hover{color:var(--teal);border-color:var(--teal)}
  .tablewrap{overflow-x:auto;margin:1em 0}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{border:1px solid var(--line);padding:8px 11px;text-align:left;vertical-align:top}
  th{background:var(--panel2);color:var(--ink)}
  tr:nth-child(even) td{background:rgba(255,255,255,.02)}
  .pagehdr{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:2px}
  /* quiz */
  .quiz{margin:34px 0 10px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
  .quiz h3{margin-top:0;color:var(--ink)}
  .quiz .qmeta{font-size:13px;color:var(--muted);margin-bottom:14px}
  .qcard{margin:16px 0;padding:16px;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
  .qtext{font-weight:600;margin-bottom:12px}
  .opt{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    color:var(--ink);border-radius:8px;padding:11px 13px;margin:8px 0;cursor:pointer;font-size:14.5px;
    transition:border-color .15s,background .15s}
  .opt:hover{border-color:var(--accent);background:#ede9fe}
  .opt.correct{border-color:var(--good);background:var(--good-bg)}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
  .opt.disabled{cursor:default;opacity:.85}
  .why{margin-top:10px;font-size:13.5px;color:var(--ink);background:var(--code);
    border-left:3px solid var(--teal);border-radius:0 6px 6px 0;padding:9px 12px;display:none}
  .why.show{display:block}
  .why.ok{border-left-color:var(--good)} .why.no{border-left-color:var(--bad)}
  .qscore{margin-top:16px;font-size:14px;color:var(--muted)}
  .navbtns{display:flex;justify-content:space-between;margin-top:40px;gap:12px}
  .navbtns button{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:11px 18px;font-size:14px;cursor:pointer}
  .navbtns button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
  .navbtns button:disabled{opacity:.35;cursor:default}
  .navbtns .next{background:var(--teal-dim);border-color:var(--teal)}
  .mobtog{display:none}
  @media(max-width:860px){
    #sidebar{position:fixed;left:0;top:0;z-index:30;transform:translateX(-100%);transition:transform .25s}
    #sidebar.open{transform:none}
    #main{padding:64px 18px 80px}
    .mobtog{display:inline-flex;position:fixed;top:12px;left:12px;z-index:40;background:var(--panel);
      border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
  }
</style>

<script>
/* Minimal, dependency-free Markdown -> HTML renderer.
   Supports the subset used by the course: headings, bold, inline code, links,
   fenced code blocks, tables, blockquotes, ordered/unordered lists, hr,
   definition-style ": " lines, and paragraphs. Works in Node and the browser. */
(function (global) {
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(text) {
    // protect inline code spans
    var codes = [];
    text = text.replace(/`([^`]+)`/g, function (_, c) {
      codes.push("<code>" + escapeHtml(c) + "</code>");
      return "␀" + (codes.length - 1) + "␀";
    });
    text = escapeHtml(text);
    // bold (non-greedy so it can span inner single-* italics)
    text = text.replace(/\*\*([\s\S]+?)\*\*/g, "<strong>$1</strong>");
    // italics (remaining single *)
    text = text.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    // links [text](url)
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, t, u) {
      var safe = u.replace(/"/g, "%22");
      var ext = /^https?:\/\//.test(u) ? ' target="_blank" rel="noopener"' : "";
      return '<a href="' + safe + '"' + ext + ">" + t + "</a>";
    });
    // restore code spans
    text = text.replace(/␀(\d+)␀/g, function (_, i) {
      return codes[+i];
    });
    return text;
  }

  function renderTable(rows) {
    // rows: array of raw '| a | b |' lines (header, sep, ...body)
    function cells(line) {
      var t = line.trim().replace(/^\|/, "").replace(/\|$/, "");
      return t.split("|").map(function (c) { return c.trim(); });
    }
    var header = cells(rows[0]);
    var body = rows.slice(2).map(cells);
    var html = '<div class="tablewrap"><table><thead><tr>';
    header.forEach(function (h) { html += "<th>" + inline(h) + "</th>"; });
    html += "</tr></thead><tbody>";
    body.forEach(function (r) {
      html += "<tr>";
      r.forEach(function (c) { html += "<td>" + inline(c) + "</td>"; });
      html += "</tr>";
    });
    html += "</tbody></table></div>";
    return html;
  }

  function mdToHtml(md) {
    md = md.replace(/\r\n/g, "\n");
    var lines = md.split("\n");
    var out = [];
    var i = 0;

    function isTableSep(line) {
      return /^\s*\|?[\s:-]*-[\s:|-]*\|?\s*$/.test(line) && line.indexOf("-") !== -1;
    }

    while (i < lines.length) {
      var line = lines[i];

      // fenced code block
      var fence = line.match(/^```(\w*)\s*$/);
      if (fence) {
        var lang = fence[1] || "";
        var buf = [];
        i++;
        while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++; // skip closing fence
        out.push('<pre class="code" data-lang="' + lang + '"><button class="copy" type="button">Copy</button><code>' +
          escapeHtml(buf.join("\n")) + "</code></pre>");
        continue;
      }

      // horizontal rule
      if (/^\s*---\s*$/.test(line)) { out.push("<hr>"); i++; continue; }

      // heading
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        var lvl = h[1].length;
        out.push("<h" + lvl + ">" + inline(h[2].trim()) + "</h" + lvl + ">");
        i++;
        continue;
      }

      // blockquote (may span lines)
      if (/^\s*>\s?/.test(line)) {
        var q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        out.push('<blockquote>' + mdToHtml(q.join("\n")) + "</blockquote>");
        continue;
      }

      // table
      if (line.indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
        var trows = [];
        while (i < lines.length && lines[i].indexOf("|") !== -1 && lines[i].trim() !== "") {
          trows.push(lines[i]);
          i++;
        }
        out.push(renderTable(trows));
        continue;
      }

      // unordered list
      if (/^\s*[-*]\s+/.test(line)) {
        var items = [];
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          var item = lines[i].replace(/^\s*[-*]\s+/, "");
          i++;
          // continuation lines (indented, not a new list item / block)
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*[-*]\s+/.test(lines[i]) && lines[i].trim() !== "") {
            item += " " + lines[i].trim();
            i++;
          }
          items.push("<li>" + inline(item) + "</li>");
        }
        out.push("<ul>" + items.join("") + "</ul>");
        continue;
      }

      // ordered list
      if (/^\s*\d+\.\s+/.test(line)) {
        var oitems = [];
        while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
          var oitem = lines[i].replace(/^\s*\d+\.\s+/, "");
          i++;
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*\d+\.\s+/.test(lines[i]) && lines[i].trim() !== "") {
            oitem += " " + lines[i].trim();
            i++;
          }
          oitems.push("<li>" + inline(oitem) + "</li>");
        }
        out.push("<ol>" + oitems.join("") + "</ol>");
        continue;
      }

      // definition-style ": " line -> indented note paragraph
      if (/^:\s+/.test(line)) {
        out.push('<p class="dd">' + inline(line.replace(/^:\s+/, "")) + "</p>");
        i++;
        continue;
      }

      // blank line
      if (line.trim() === "") { i++; continue; }

      // paragraph (gather until blank / block start)
      var para = [line];
      i++;
      while (i < lines.length && lines[i].trim() !== "" &&
             !/^(#{1,6})\s/.test(lines[i]) &&
             !/^```/.test(lines[i]) &&
             !/^\s*>\s?/.test(lines[i]) &&
             !/^\s*[-*]\s+/.test(lines[i]) &&
             !/^\s*\d+\.\s+/.test(lines[i]) &&
             !/^:\s+/.test(lines[i]) &&
             !/^\s*---\s*$/.test(lines[i]) &&
             !(lines[i].indexOf("|") !== -1 && i + 1 < lines.length && isTableSep(lines[i + 1]))) {
        para.push(lines[i]);
        i++;
      }
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }

    return out.join("\n");
  }

  if (typeof module !== "undefined" && module.exports) module.exports = mdToHtml;
  else global.mdToHtml = mdToHtml;
})(typeof window !== "undefined" ? window : this);

</script>
<script>
const DATA = {"pages": [{"id": "setup-local-k8s", "title": "Setup, a local cluster", "group": "Get started", "md": "*Do this once. In ~15 minutes you'll have a real multi-node Kubernetes cluster on your laptop,\n`kubectl` talking to it, Helm installed, and your first app deployed. Every step spelled out.\nAssumes you finished the Docker course (or know Docker basics).*\n\n> **This course is hands-on, on your own machine.** The site you're reading gives you the lessons\n> and quizzes, but the real work happens in your own terminal: installing tools, running\n> containers, and breaking things you can then fix. This setup page gets your machine ready; do it\n> before the first lab.\n\nKubernetes normally runs across many servers, but you can run a full cluster locally inside Docker\nwith **kind** (Kubernetes-IN-Docker): free, fast, and disposable. You'll install four tools.\n\n---\n\n## Step 1: Prerequisites\n\n**Docker**: already installed if you did the Docker course. Verify: `docker run --rm hello-world`.\n\n**kubectl** (the Kubernetes command-line tool: how you talk to any cluster)\n: <https://kubernetes.io/docs/tasks/tools/>. macOS: `brew install kubectl`. Verify:\n`kubectl version --client`.\n\n**kind** (runs Kubernetes nodes as Docker containers)\n: <https://kind.sigs.k8s.io/docs/user/quick-start/>. macOS: `brew install kind`. Verify:\n`kind version` (0.32.x current).\n\n**Helm** (the Kubernetes package manager, used later)\n: <https://helm.sh/docs/intro/install/>. macOS: `brew install helm`. Verify: `helm version`\n(v4.x current).\n\n> **Version note.** Kubernetes 1.36 is current as of this writing; kind pulls a matching node image.\n> `kubectl` works within one minor version of the cluster. Commands here are stable across recent\n> versions.\n\n## Step 2: Create a multi-node cluster\n\nA one-node cluster works, but a **multi-node** one lets you see real scheduling. Save this as\n`kind-config.yaml`:\n\n```yaml\nkind: Cluster\napiVersion: kind.x-k8s.io/v1alpha4\nnodes:\n- role: control-plane\n- role: worker\n- role: worker\n```\n\nCreate it:\n\n```bash\nkind create cluster --name k8s-lab --config kind-config.yaml\nkubectl cluster-info --context kind-k8s-lab\nkubectl get nodes -o wide          # one control-plane + two workers, all Ready\n```\n\nYou now have a real Kubernetes cluster: one **control plane** node (the brain) and two **worker**\nnodes (where your containers run). Module 1 explains each.\n\n## Step 3: Meet `kubectl`\n\n`kubectl` (\"cube-cuttle\" or \"cube-control\") is how you interact with the cluster. The pattern is\n`kubectl <verb> <resource>`:\n\n```bash\nkubectl get nodes                  # list nodes\nkubectl get pods -A                # all pods in all namespaces (-A), the system pods running K8s\nkubectl get namespaces             # the cluster's namespaces\nkubectl api-resources | head       # the kinds of objects the cluster understands\n```\n\n## Step 4: Deploy your first app\n\nTwo ways: a quick imperative command, or a declarative file. Start imperative to see something run:\n\n```bash\nkubectl create deployment web --image=nginx --replicas=3\nkubectl get pods -o wide           # 3 nginx pods, spread across your worker nodes\nkubectl get deployment web         # 3/3 ready\n```\n\nThree containers, scheduled across nodes, from one command. Expose it so you can reach it:\n\n```bash\nkubectl expose deployment web --port=80 --type=NodePort\nkubectl get service web            # note the assigned NodePort\n```\n\nReach it via a port-forward (simplest on kind):\n\n```bash\nkubectl port-forward deployment/web 8080:80\n# in another terminal:\ncurl localhost:8080 | grep -o \"<title>.*</title>\"    # → nginx welcome\n```\n\n## Step 5: See the self-healing (the \"wow\" moment)\n\nKubernetes constantly keeps reality matching your desired state. Delete a pod and watch it come\nback:\n\n```bash\nkubectl get pods\nkubectl delete pod <one-of-the-web-pods>\nkubectl get pods                   # a replacement is already being created, 3 desired, 3 kept\n```\n\nYou asked for 3 replicas; Kubernetes maintains 3 forever, healing failures automatically. That's the\ncore idea of the whole system.\n\n## Step 6: Clean up\n\n```bash\nkind delete cluster --name k8s-lab    # removes the entire cluster\n```\n\nOne command wipes everything. Recreate anytime from Step 2.\n\n---\n\n## Troubleshooting\n\n**Nodes never reach Ready / pods Pending**\n: kind needs memory. Give Docker Desktop ≥ 6–8 GB (Settings → Resources) and recreate the cluster.\n\n**`kubectl` can't connect (\"connection refused\")**\n: The cluster isn't running or the context is wrong. `kind get clusters`, then\n`kubectl config use-context kind-k8s-lab`.\n\n**`port-forward` exits / \"unable to listen\"**\n: The pod isn't ready yet (`kubectl get pods`), or the local port is taken; pick another\n(`8090:80`).\n\n**Image pull errors**\n: Check the image name/tag and your internet. `kubectl describe pod <pod>` shows pull errors under\nEvents."}, {"id": "primer-why-kubernetes", "title": "Primer: Why Kubernetes?", "group": "Get started", "md": "*Start here. Assumes you know what a container is (from the Docker course). ~10 min. If you finish\nthinking \"I need something to babysit thousands of containers across many machines\", that's\nKubernetes.*\n\n---\n\n## The problem, told as a story\n\nYou containerized your app (great: that's the Docker course). Now reality hits:\n\n- One container isn't enough: you need **many copies** to handle traffic, on **many servers**.\n- Servers **crash**. Containers **die**. Someone has to notice and **restart** the work, at 3am,\n  automatically.\n- Traffic **spikes** Friday night and **drops** Monday; you want to **scale up and down** without a\n  human watching.\n- You ship a new version and it's broken; you need to **roll back instantly** with no downtime.\n- With hundreds of containers moving between servers, how does anything **find** anything? IPs change\n  constantly.\n\nDoing this by hand across a fleet is impossible. **Kubernetes is the system that does it for you**:\nan automatic operator for containerized apps across many machines. It's often called a **container\norchestrator**.\n\n## The orchestra analogy\n\nAn orchestra has many musicians (containers) who could play independently, but you get chaos without\na **conductor** coordinating who plays what, when, and how loud, and replacing anyone who falters.\nKubernetes is the conductor for your containers: it decides where each runs, keeps the right number\nplaying, adjusts to the moment, and covers for failures. You hand it the sheet music (your desired\nstate); it makes the performance happen and keeps it going.\n\n## The one big idea: declarative desired state\n\nThis is the mental shift that makes Kubernetes click. You don't give step-by-step commands. You\n**declare the desired end state**: \"I want 5 healthy copies of this image, reachable at this name,\"\nand Kubernetes **continuously works to make reality match**, forever.\n\n```\n   You declare:  \"5 replicas of myapp:1.2, always healthy\"\n                              │\n                              ▼\n   Kubernetes constantly checks:  are there 5 healthy? \n        4 running (one crashed)  → start 1 more\n        6 running (you scaled down) → stop 1\n        a node died → reschedule its pods elsewhere\n```\n\nThis never-ending \"make reality match the goal\" loop is called **reconciliation**, and it's the\nheartbeat of the whole system. Compare it to Docker's `docker run` (a one-time imperative command\nthat does nothing if the container later dies). Kubernetes is a **control loop**, not a command.\n\n## What Kubernetes gives you\n\n- **Scheduling**: decides which server each container runs on, packing them efficiently.\n- **Self-healing**: restarts crashed containers, replaces dead ones, reschedules off failed nodes.\n- **Scaling**: add/remove replicas by hand or automatically based on load.\n- **Service discovery & load balancing**: stable names for services, traffic spread across replicas\n  wherever they are.\n- **Rollouts & rollbacks**: ship new versions gradually, revert instantly if bad.\n- **Config & secrets**: inject configuration and credentials without rebuilding images.\n- **Storage orchestration**: attach persistent storage to containers that need it.\n\nAll declared as YAML, all reconciled automatically.\n\n## What Kubernetes is NOT\n\nClearing up common confusion:\n\n- **It doesn't build images.** You still build with Docker (or similar) and push to a registry;\n  Kubernetes pulls and runs them.\n- **It's not a PaaS like Heroku.** It's lower-level and more flexible: a platform *for building*\n  platforms.\n- **It's not magic sizing.** You tell it how much CPU/memory apps need; it schedules accordingly.\n- **It's not only for huge companies.** It's heavier than Docker alone, but managed Kubernetes and\n  local tools make it accessible, and its concepts are now industry-standard.\n\n## Is it overkill?\n\nSometimes. For one small app on one server, Kubernetes is more than you need; Docker or a simple\nhost is fine. Kubernetes earns its complexity when you have **multiple services, need high\navailability, scale, and frequent deploys**. But because it's become the *lingua franca* of modern\ninfrastructure, learning it is high-value regardless, and that's what this course is for.\n\n## How the course is built\n\nYou'll learn in layers, each building on the last:\n\n- **Fundamentals**: the core objects: Pods, Deployments, Services, config, storage.\n- **Production & security**: health probes, resource limits, RBAC, network policy, troubleshooting.\n- **Packaging & delivery**: Helm, Kustomize, and CI/CD pipelines.\n- **Advanced platform**: ingress, autoscaling, operators/CRDs.\n- **Capstone + cert prep**: deploy a full multi-service app, and map everything to the CKA/CKAD\n  exams.\n\nBy the end you'll be a genuine practitioner, not just someone who's heard the words."}, {"id": "primer-cluster-architecture", "title": "Primer: The cluster at a glance", "group": "Get started", "md": "*A gentle map of what's inside a Kubernetes cluster before we start using it. ~8 min. You don't need\nto memorize this; just recognize the pieces when they come up.*\n\n---\n\nA Kubernetes **cluster** is a set of machines (**nodes**) working as one. The nodes split into two\nkinds, matching the data-plane/control-plane idea you may know from the service-mesh world:\n\n- **The control plane**: the **brain**. Makes decisions: what should run where, and keeps reality\n  matching your desired state.\n- **The worker nodes**: the **muscle**. Actually run your containers.\n\n```\n   ┌──────────────── CONTROL PLANE (the brain) ────────────────┐\n   │  API server   ·  etcd   ·  Scheduler  ·  Controller mgr    │\n   └───────────────────────────┬───────────────────────────────┘\n                                │  (instructs the nodes)\n        ┌───────────────────────┼────────────────────────┐\n        ▼                        ▼                         ▼\n   ┌── Worker node ──┐    ┌── Worker node ──┐       ┌── Worker node ──┐\n   │ kubelet          │    │ kubelet          │       │ kubelet          │\n   │ kube-proxy       │    │ kube-proxy       │       │ kube-proxy       │\n   │ [ your pods ]    │    │ [ your pods ]    │       │ [ your pods ]    │\n   └──────────────────┘    └──────────────────┘       └──────────────────┘\n```\n\n## Control-plane pieces (the brain)\n\n| Component | Plain-English job |\n|-----------|-------------------|\n| **API server** | The front door. *Everything* talks to it, `kubectl`, the nodes, every component. You submit desired state here. |\n| **etcd** | The cluster's database. Stores the entire desired + actual state (the single source of truth). |\n| **Scheduler** | Decides *which node* each new pod should run on, based on resources and rules. |\n| **Controller manager** | Runs the control loops (reconciliation), e.g. \"keep 3 replicas alive.\" |\n\nWhen you `kubectl apply` a file, it goes to the **API server**, which saves it in **etcd**. The\n**scheduler** picks nodes for new pods; **controllers** keep everything matching your spec.\n\n## Worker-node pieces (the muscle)\n\n| Component | Plain-English job |\n|-----------|-------------------|\n| **kubelet** | The node's agent. Talks to the API server and makes sure the pods it's told to run are actually running. |\n| **kube-proxy** | Handles networking on the node so Services route traffic to the right pods. |\n| **container runtime** | Actually runs containers (containerd/CRI-O). Runs the OCI images you built with Docker. |\n\n## How a request to run something flows\n\nYou want to run an app. Roughly:\n\n1. You `kubectl apply` a **Deployment** → the **API server** stores it in **etcd**.\n2. A **controller** notices \"desired 3 pods, actual 0\" and creates 3 Pod objects.\n3. The **scheduler** assigns each Pod to a node.\n4. Each node's **kubelet** sees \"you own this Pod,\" tells the **container runtime** to pull the image\n   and start the container.\n5. **kube-proxy** wires up networking so a **Service** can reach those pods.\n6. Controllers keep watching: if a pod dies, back to step 2. Forever.\n\nThat loop (submit desired state, controllers reconcile, kubelets execute) *is* Kubernetes. Every\nmodule adds a new kind of object you submit to the API server.\n\n## The good news for learning\n\nYou rarely touch these components directly (managed Kubernetes and kind run them for you). But\nknowing the map means error messages and behaviors make sense: \"pod Pending\" → the scheduler can't\nplace it; \"ImagePullBackOff\" → the kubelet/runtime can't pull the image; \"the API server is\nunreachable\" → you can't submit anything. You'll meet these in the troubleshooting module."}, {"id": "primer-core-concepts", "title": "Primer: Core concepts & glossary", "group": "Get started", "md": "*Read this if any word feels assumed. It defines the background terms (node, cluster, instance,\ncontrol plane, API, and friends) in plain English, so nothing later leaves you lost. ~10 min. Skim\nnow; come back whenever a term trips you up.*\n\n---\n\nKubernetes tutorials throw around a lot of vocabulary. This page assumes **nothing** and defines it\nall simply. (If you did the Docker course, some of this is recap, but Kubernetes adds important new\nterms like *node* and *cluster*.)\n\n## Machines and groups of machines\n\n- **Machine / computer / server**: a computer that runs software. In the cloud, usually a rented\n  virtual computer.\n- **Virtual machine (VM)**: a software-simulated computer with its own operating system, running on\n  real hardware. Most cloud servers are VMs.\n- **Node**: **one machine in a Kubernetes cluster.** This is the word Kubernetes uses for \"a\n  server that runs your containers.\" A node can be a physical machine or (usually) a VM. Your local\n  `kind` cluster fakes nodes as Docker containers.\n- **Cluster**: **a group of nodes working together as one system**, managed by Kubernetes. You\n  deploy to \"the cluster,\" and Kubernetes decides which node runs what. A cluster = the control\n  plane (brain) + worker nodes (muscle).\n- **Instance**: one running copy of something. Three copies of your app = three instances. In\n  Kubernetes these copies are usually **Pods** (see below), and the word for \"how many copies\" is\n  **replicas**.\n\n## The two halves of a cluster\n\n- **Control plane**: the **brain** of the cluster: the components that make decisions (what runs\n  where) and store the cluster's state. You submit your wishes here.\n- **Worker node**: a **muscle** machine that actually runs your application containers, taking\n  orders from the control plane.\n- **API server**: the control plane's **front door**. *Everything* talks to it. When you run a\n  command or a component needs something, it goes through the API server.\n- **etcd**: the cluster's **database**, storing all of its state (what you asked for, and what's\n  actually running).\n\n## Containers, images, and Pods\n\n- **Container**: a lightweight, isolated package running one app, sharing the host's OS kernel.\n  (The Docker course covers these in depth.)\n- **Image**: the read-only blueprint a container is started from, stored in a **registry**.\n  Kubernetes runs images; it doesn't build them.\n- **Pod**: **the smallest thing Kubernetes runs: a wrapper around one (or a few) containers.** You\n  don't run containers directly in Kubernetes; you run Pods. Think \"a Pod ≈ one running instance of\n  your app.\"\n- **Registry**: an online store of images (Docker Hub, etc.) that Kubernetes pulls from.\n\n## How you tell Kubernetes what you want\n\n- **kubectl**: the **command-line tool** you use to talk to a cluster (it sends requests to the API\n  server). Pronounced \"cube-cuttle\" / \"cube-control.\" Nearly every command is `kubectl <verb>\n  <thing>`.\n- **YAML**: a human-readable text format for configuration. Kubernetes objects are written in YAML.\n  Indentation matters; it's just structured key/value data.\n- **Manifest**: a YAML file describing a Kubernetes object (a Pod, a Deployment…). You \"apply\" a\n  manifest to create or update that object.\n- **Object / resource**: a thing Kubernetes stores and manages (Pod, Service, Deployment,\n  ConfigMap…). Everything you create is an object.\n- **API / API group**: the set of object types the cluster understands. \"The Kubernetes API\" is\n  just all the kinds of objects you can create.\n\n## The core mindset words\n\n- **Declarative**: you describe the **desired end state** (\"I want 5 healthy copies\") and\n  Kubernetes continuously makes reality match. The opposite is **imperative** (step-by-step\n  commands). Kubernetes is declarative; this is its defining idea.\n- **Desired state vs actual state**: what you *asked for* (the `spec`) versus what's *really\n  running* (the `status`). Kubernetes works to close the gap.\n- **Reconciliation**: the never-ending loop where Kubernetes compares desired vs actual and fixes\n  any difference. This is why it \"self-heals.\"\n- **Controller**: a control-plane program that runs a reconciliation loop for one kind of object\n  (e.g. keeps the right number of Pods alive).\n- **Namespace**: a virtual folder that partitions a cluster to organize objects (by team, app, or\n  environment). `default` is where your work goes unless you say otherwise.\n\n## Networking words\n\n- **IP address**: a machine's or Pod's numeric network address. Pods get their own, but they change\n  as Pods come and go.\n- **Port**: a numbered \"door\" for a specific service on a machine (web = 80, Postgres = 5432).\n- **Service**: a stable name/address in Kubernetes that load-balances across a changing set of\n  Pods, so you never chase Pod IPs. (Module 3.)\n- **DNS**: turns names into IP addresses; inside a cluster, Services get names you can call.\n- **Label / selector**: labels are key/value tags on objects; selectors are queries over them. This\n  is how Kubernetes objects find each other (e.g. a Service selects the Pods it routes to).\n\n## Reliability & scaling words\n\n- **Replica**: one copy of a Pod. \"3 replicas\" = 3 identical Pods.\n- **Self-healing**: Kubernetes automatically replaces failed Pods/reschedules off dead nodes to\n  keep your desired state true.\n- **Scaling**: changing how many replicas run (manually or automatically) as load changes.\n- **Stateless vs stateful**: stateless apps keep no important local data (easy to scale/replace);\n  stateful apps (databases) need preserved storage and stable identity.\n\n## How to use this page\n\nDon't memorize it; skim once so the words feel familiar, and return whenever a term in a later\nmodule is fuzzy. Every concept here appears, in context, in the modules that follow."}, {"id": "00-what-is-kubernetes", "title": "0 · What Kubernetes is", "group": "Fundamentals", "md": "*No lab: the mental model that anchors everything. ~12 min read.*\n\n---\n\n## Recap and sharpen\n\n**Kubernetes runs and manages containers across many machines, automatically, from declarative\ndesired state.** You submit \"what you want\" (as YAML objects) to the control plane; controllers work\nforever to make the cluster match. This module frames the whole system so the hands-on modules have\na skeleton to hang on.\n\n## Everything is an object\n\nKubernetes is, at heart, a **database of objects** (in etcd) plus **controllers** that make the\nworld match those objects. You work by creating/updating objects. Every object has the same shape:\n\n```yaml\napiVersion: apps/v1        # which API group/version defines this kind\nkind: Deployment           # what kind of object\nmetadata:\n  name: web                # its name (and labels, namespace…)\nspec:                      # DESIRED state, what YOU want\n  replicas: 3\nstatus:                    # ACTUAL state, what Kubernetes observes (it fills this in)\n  readyReplicas: 3\n```\n\n**`spec` = your desired state; `status` = reality.** A controller's whole job is to drive `status`\ntoward `spec`. Learn this shape once and every object (Pod, Service, ConfigMap, Ingress) reads the\nsame way.\n\n## The objects you'll learn (the map)\n\n| Object | One-line job | Module |\n|--------|-------------|--------|\n| **Pod** | The smallest unit, one (or a few) containers running together | 1 |\n| **Deployment** | Keeps N replicas of a Pod healthy; handles rollouts/rollbacks | 2 |\n| **Service** | A stable name + load balancing across a set of Pods | 3 |\n| **ConfigMap / Secret** | Inject configuration / credentials into Pods | 4 |\n| **PersistentVolume / PVC / StatefulSet** | Storage and stateful apps | 5 |\n| **Probes, requests/limits** | Health checks and resource guarantees | 6 |\n| **RBAC, NetworkPolicy** | Who can do what; which pods may talk | 7 |\n| **Ingress** | HTTP routing from outside into Services | 12 |\n| **HPA** | Autoscale replicas by load | 13 |\n| **CRD / Operator** | Extend Kubernetes with your own object kinds | 14 |\n\nEvery one is just a `spec` you submit and a controller that reconciles it.\n\n## Labels and selectors, the glue\n\nKubernetes objects find each other with **labels** (key/value tags) and **selectors** (queries over\nlabels), not hard IDs. A Deployment labels its pods `app: web`; a Service selects `app: web` to know\nwhich pods to send traffic to. This loose coupling is everywhere:\n\n```\n   Service (selector: app=web)  ─────►  any Pod labelled app=web\n```\n\nAdd a pod with that label and the Service instantly includes it; no wiring. **Labels + selectors**\nare how almost everything connects. Internalize this early.\n\n## Namespaces, dividing the cluster\n\nA **namespace** is a virtual sub-cluster for organizing objects (by team, environment, or app).\n`default` is where your stuff goes unless you say otherwise; `kube-system` holds Kubernetes' own\ncomponents. Names must be unique *within* a namespace. RBAC and quotas are often scoped per\nnamespace.\n\n## Imperative vs declarative (two ways to work)\n\n- **Imperative**: direct commands like `kubectl create deployment web --image=nginx`. Fast for\n  learning and one-offs.\n- **Declarative**: write YAML and `kubectl apply -f file.yaml`. Reproducible, version-controlled,\n  reviewable. **This is how real teams work** (and how GitOps/CI-CD deploy).\n\nThe course uses imperative to explore quickly, then declarative for anything real. Both submit to the\nsame API server.\n\n## The reconciliation loop (say it again, it matters)\n\nThe single most important behavior: controllers **continuously** compare `spec` to `status` and act\nto close the gap. Delete a pod → the Deployment makes a new one. A node dies → its pods are\nrescheduled. You don't script recovery; you declare intent and the loop maintains it. This is why\nKubernetes is *resilient by design*.\n\n## The mental checklist for any K8s task\n\n1. **What workload?** (Pod via Deployment/StatefulSet/Job)\n2. **How is it reached?** (Service, and Ingress for HTTP)\n3. **What config/secrets/storage does it need?** (ConfigMap, Secret, PVC)\n4. **What are its health checks and resource limits?** (probes, requests/limits)\n5. **Who/what may access it?** (RBAC, NetworkPolicy)\n\nEvery module answers one of these."}, {"id": "01-pods-and-kubectl", "title": "1 · Pods & kubectl", "group": "Fundamentals", "md": "*Hands-on. The atom of Kubernetes and the tool you'll live in. ~25 min. Needs your kind cluster.*\n\n---\n\n## What a Pod is\n\nA **Pod** is the smallest thing Kubernetes runs: **one container** (usually), or a few tightly\ncoupled containers that share the same network and storage. A pod's containers share:\n\n- **One IP address**: they reach each other on `localhost`.\n- **Storage volumes**: they can share mounted data.\n- **A lifecycle**: they're scheduled, started, and stopped together, on one node.\n\nIf a Docker container is \"a running app,\" a Pod is Kubernetes' **wrapper** around it that adds an\nidentity, networking, and scheduling. Usually **one container per pod**; multiple only for helper\n\"sidecar\" patterns: a log shipper, or a proxy (remember Istio?).\n\n> **Pods are disposable.** You almost never create bare Pods in production: they don't self-heal.\n> Instead a **Deployment** (Module 2) creates and replaces them for you. But understanding the Pod\n> first makes everything else clear.\n\n## A Pod manifest\n\n```yaml\napiVersion: v1\nkind: Pod\nmetadata:\n  name: hello\n  labels:\n    app: hello\nspec:\n  containers:\n  - name: web\n    image: nginx:1.27\n    ports:\n    - containerPort: 80\n```\n\n`spec.containers` lists the image(s) to run; this is where your Docker images plug in.\n\n## kubectl, the verbs you'll use constantly\n\n`kubectl <verb> <resource> [name] [flags]`:\n\n| Command | What it does |\n|---------|-------------|\n| `kubectl get <res>` | List objects (add `-o wide`, `-o yaml`, `-A` for all namespaces) |\n| `kubectl describe <res> <name>` | Detailed human-readable status + **Events** (great for debugging) |\n| `kubectl logs <pod>` | Container logs (`-f` follow, `-c <container>` pick one) |\n| `kubectl exec -it <pod> -- sh` | Run a command / shell inside a pod |\n| `kubectl apply -f file.yaml` | Create/update from a manifest (declarative) |\n| `kubectl delete <res> <name>` | Remove an object |\n| `kubectl get <res> -o yaml` | Dump full object YAML (includes status) |\n\n`kubectl describe` and `kubectl logs` are your two primary debugging tools; reach for them first.\n\n## Lab: run and inspect a Pod\n\n```bash\n# create the pod from the manifest above (save it as hello.yaml), or imperatively:\nkubectl run hello --image=nginx:1.27 --labels=app=hello\nkubectl get pods -o wide            # status, node, IP\nkubectl describe pod hello          # events: scheduled, pulled, started\nkubectl logs hello                  # nginx startup logs\n```\n\nReach it and look inside:\n\n```bash\nkubectl port-forward pod/hello 8080:80   # forward local :8080 → pod :80\ncurl localhost:8080 | grep -o \"<title>.*</title>\"   # (Ctrl-C the forward after)\n\nkubectl exec -it hello -- bash\n#   inside: curl localhost   (containers in a pod share localhost)  ->  exit\n```\n\n## Prove pods don't self-heal (the key lesson)\n\n```bash\nkubectl delete pod hello\nkubectl get pods            # it's gone, nothing recreated it\n```\n\nA bare Pod, once deleted or crashed, stays gone. That's why you use a **Deployment**: it watches\nand replaces pods to maintain your desired count. You'll see that next module.\n\n## Reading a pod's state\n\n`kubectl get pods` shows a **STATUS** and **READY** column. Common statuses:\n\n- `Running`: containers are up (READY `1/1` means all containers ready).\n- `Pending`: not scheduled yet (no room, or waiting on resources). `describe` shows why.\n- `ContainerCreating`: pulling image / setting up.\n- `CrashLoopBackOff`: the container keeps crashing and restarting. `logs` shows why.\n- `ImagePullBackOff` / `ErrImagePull`: can't pull the image (bad name/tag/registry auth).\n\n**When a pod is unhealthy, `kubectl describe pod <name>` (read the Events) and `kubectl logs <name>`\ntell you why 90% of the time.**\n\n## Lab: read the signals\n\n```bash\n# a pod with a bad image name, watch it fail\nkubectl run broken --image=nginx:doesnotexist\nkubectl get pods                    # broken: ImagePullBackOff\nkubectl describe pod broken | sed -n '/Events/,$p'   # the pull error, spelled out\nkubectl delete pod broken\n\n# a pod that crashes: CrashLoopBackOff\nkubectl run crasher --image=busybox --restart=Never -- sh -c \"echo booting; exit 1\"\nkubectl get pod crasher             # Error/CrashLoop depending on restart\nkubectl logs crasher                # → booting  (your clue)\nkubectl delete pod crasher\n```"}, {"id": "02-deployments-replicasets", "title": "2 · Deployments & ReplicaSets", "group": "Fundamentals", "md": "*How you actually run apps: self-healing, scaling, and zero-downtime updates. Concepts + a lab. ~30\nmin. Needs your kind cluster.*\n\n---\n\nA bare Pod is fragile. A **Deployment** is what you use for real: you declare \"I want N replicas of\nthis image,\" and Kubernetes creates them, replaces any that die, scales on command, and rolls out\nnew versions without downtime. It's the workhorse object.\n\n## The hierarchy\n\n```\n   Deployment  ──manages──►  ReplicaSet  ──manages──►  Pods\n   (you edit this)           (keeps N copies)          (run your containers)\n```\n\n- **You** create/edit the **Deployment** (desired image + replica count).\n- The Deployment creates a **ReplicaSet**, whose only job is \"keep exactly N identical pods alive.\"\n- The ReplicaSet creates and watches the **Pods**.\n\nWhen you update the image, the Deployment creates a *new* ReplicaSet and shifts pods from old to new\ngradually (the rollout). You almost always interact with the **Deployment**; the ReplicaSet is\nmanaged for you.\n\n## A Deployment manifest\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: web\nspec:\n  replicas: 3                      # desired number of pods\n  selector:\n    matchLabels: { app: web }      # which pods this Deployment owns\n  template:                        # the Pod blueprint to stamp out\n    metadata:\n      labels: { app: web }         # must match the selector\n    spec:\n      containers:\n      - name: web\n        image: nginx:1.27\n        ports:\n        - containerPort: 80\n```\n\nThe `template` is a Pod spec: everything from Module 1, embedded. `selector` + `template.labels`\nmust agree; that's how the Deployment knows which pods are \"its.\"\n\n## Lab: create, scale, self-heal\n\n```bash\nkubectl apply -f web-deploy.yaml     # (the manifest above)\nkubectl get deploy,rs,pods           # a Deployment, one ReplicaSet, 3 Pods\n\n# scale up\nkubectl scale deployment web --replicas=5\nkubectl get pods                     # now 5\n\n# self-heal: delete a pod, watch a replacement appear\nkubectl delete pod <one-web-pod>\nkubectl get pods                     # still 5, the ReplicaSet replaced it\n```\n\nYou declared 5; Kubernetes maintains 5 forever. That's the reconciliation loop doing its job.\n\n## Rolling updates, zero-downtime deploys\n\nChange the image and Kubernetes rolls it out gradually: spin up new pods, wait for them ready, then\nretire old ones, so the app never fully goes down.\n\n```bash\n# update the image (imperative), or edit the YAML and re-apply\nkubectl set image deployment/web web=nginx:1.28\nkubectl rollout status deployment/web        # watch it progress to complete\nkubectl get rs                               # old ReplicaSet scaled to 0, new one to 5\n```\n\nThe behavior is controlled by the Deployment's **strategy** (`RollingUpdate` by default) with\n`maxSurge` (how many extra pods during rollout) and `maxUnavailable` (how many can be down). Defaults\nare safe.\n\n## Rollbacks, undo instantly\n\nShipped something broken? Roll back to the previous revision:\n\n```bash\nkubectl rollout history deployment/web       # list revisions\nkubectl rollout undo deployment/web          # back to the previous one\nkubectl rollout undo deployment/web --to-revision=2\n```\n\nBecause old ReplicaSets are kept (scaled to 0), rollback is near-instant, a huge operational safety\nnet.\n\n## Lab: a full rollout + rollback + failure\n\n```bash\n# 1. deploy, then roll to a new version\nkubectl set image deployment/web web=nginx:1.28 && kubectl rollout status deployment/web\n\n# 2. roll to a BROKEN image and watch the rollout stall (new pods never become ready)\nkubectl set image deployment/web web=nginx:nope\nkubectl rollout status deployment/web --timeout=30s      # times out, rollout stuck\nkubectl get pods                                          # new pod ImagePullBackOff; OLD pods still serving!\n\n# 3. rescue: undo\nkubectl rollout undo deployment/web\nkubectl get pods                                          # healthy again\n```\n\nNotice step 2's safety property: because new pods never became **ready**, the rollout didn't\nkill the old healthy ones: **no downtime from a bad deploy**. This is why readiness probes (Module\n6) matter so much.\n\n## Other workload controllers (brief)\n\nDeployments are for **stateless** apps. Know the siblings for later:\n\n- **StatefulSet**: stable identities/storage for stateful apps (databases); see Module 5.\n- **DaemonSet**: one pod on *every* node (log/metrics agents).\n- **Job / CronJob**: run-to-completion tasks and scheduled jobs.\n\nAll share the same declarative, self-healing model."}, {"id": "19-workloads-beyond-deployments", "title": "2b · DaemonSets, Jobs & CronJobs", "group": "Fundamentals", "md": "*A Deployment answers \"keep N copies running forever.\" This module is for every workload where that's the wrong sentence. ~11 min read.*\n\n---\n\nModule 2 gave you the Deployment, and it's the right tool for services: things that should run\nforever, in N interchangeable copies, behind a Service. But three common kinds of work don't fit\nthat sentence, and Kubernetes has a purpose-built object for each.\n\n## DaemonSet: one per node\n\n**Sentence:** \"run exactly one copy on *every node* (or every matching node).\"\n\nThat's not a replica count: if the cluster grows from 5 nodes to 8, you want 8 copies, no edit.\nDaemonSets are how per-node infrastructure runs: log collectors reading every node's container\nlogs, monitoring agents exporting node metrics, CNI network plugins, storage drivers.\n\n```yaml\napiVersion: apps/v1\nkind: DaemonSet\nmetadata: { name: log-collector }\nspec:\n  selector: { matchLabels: { app: log-collector } }\n  template:\n    metadata: { labels: { app: log-collector } }\n    spec:\n      containers:\n      - name: collector\n        image: fluent-bit:3\n        volumeMounts: [{ name: varlog, mountPath: /var/log, readOnly: true }]\n      volumes: [{ name: varlog, hostPath: { path: /var/log } }]\n```\n\nNotice what's *missing*: no `replicas`. The node list is the replica count. A `nodeSelector` (or\ntolerations, module 6b) narrows \"every node\" to \"every GPU node\", \"every edge node\". If you find\nyourself writing a Deployment whose replica count you mentally tie to the node count, you wanted a\nDaemonSet.\n\n## Job: run to completion\n\n**Sentence:** \"run this until it *succeeds*, then stop.\"\n\nA Deployment treats exit as failure and restarts the pod forever, the famous foot-gun of running\na migration script under a Deployment is that Kubernetes will happily re-run your migration in a\nloop. A **Job** inverts the logic: success (exit 0) is the goal state.\n\n```yaml\napiVersion: batch/v1\nkind: Job\nmetadata: { name: db-migrate }\nspec:\n  backoffLimit: 3            # retry a FAILING pod at most 3 times\n  activeDeadlineSeconds: 600 # kill the whole attempt after 10 minutes\n  template:\n    spec:\n      restartPolicy: Never   # Jobs require Never or OnFailure\n      containers:\n      - name: migrate\n        image: myapp:2.4\n        command: [\"python\", \"manage.py\", \"migrate\"]\n```\n\nThe two knobs to always set: `backoffLimit` (how hard to retry) and `activeDeadlineSeconds` (when\nto give up entirely); without them a broken migration retries with exponential backoff while\nyour deploy pipeline waits forever. For batch fan-out, `completions` and `parallelism` turn one\nJob into \"process these 500 items, 10 at a time\", and because the *pods* retry, the work must be\nidempotent, the same rule queues taught in the fundamentals course.\n\n## CronJob: Jobs on a schedule\n\n**Sentence:** \"create that Job every night at 02:00.\"\n\n```yaml\napiVersion: batch/v1\nkind: CronJob\nmetadata: { name: nightly-report }\nspec:\n  schedule: \"0 2 * * *\"            # standard cron syntax, in the cluster's timezone\n  concurrencyPolicy: Forbid        # if last night's run is STILL going, skip tonight's\n  startingDeadlineSeconds: 3600\n  jobTemplate:\n    spec:\n      template: ...                # exactly a Job spec from here down\n```\n\nA CronJob is just a Job factory. The knob people learn the hard way is `concurrencyPolicy`: the\ndefault `Allow` means a slow run and its successor execute *simultaneously*: twice the load,\npossibly corrupting shared output. `Forbid` (skip) or `Replace` (kill and restart) are almost\nalways what you meant. And schedule *misses* (cluster down at 02:00) are only retried within\n`startingDeadlineSeconds`; a nightly report that absolutely must run needs monitoring on the Job,\nnot faith in the schedule.\n\n## Init containers: setup steps inside any pod\n\nNot a separate object but the same family of need: work that runs *before* the main container.\n`initContainers` run **in order, each to completion**, before the app starts: wait-for-database,\nfetch config, fix volume permissions:\n\n```yaml\nspec:\n  initContainers:\n  - name: wait-for-db\n    image: busybox\n    command: [\"sh\", \"-c\", \"until nc -z db 5432; do sleep 2; done\"]\n  containers:\n  - name: app\n    ...\n```\n\nA pod stuck in `Init:0/1` is telling you precisely where startup is blocked; check\n`kubectl logs <pod> -c wait-for-db`. (Module 8b's reading list now has one more status decoded.)\n\n## Choosing, in one table\n\n| Work | Object |\n|---|---|\n| A service, N copies, forever | **Deployment** |\n| One copy per node | **DaemonSet** |\n| Run until it succeeds once | **Job** |\n| That, on a schedule | **CronJob** |\n| Setup before the app starts | **initContainers** |\n| Stateful service with identity | **StatefulSet** (module 5) |\n\nThe interview-grade insight: these all reuse the same machinery: the pod template. Every one of\nthese objects is \"a controller with an opinion about *when* and *where* pod templates become\npods.\" Learn the opinions, and the objects stop being a list to memorize."}, {"id": "03-services-networking", "title": "3 · Services & networking", "group": "Fundamentals", "md": "*How pods get stable names and how traffic reaches them. Concepts + a lab. ~30 min. Needs your kind\ncluster.*\n\n---\n\nPods are disposable: they come and go, and each gets a **new IP** every time. So you can never rely\non a pod's IP. A **Service** solves this: it's a **stable name and address** that automatically load\n-balances across a changing set of pods.\n\n## The problem a Service solves\n\n```\n   Pods come and go, IPs change:   10.1.2.3 → dies → 10.1.7.9 → scaled → 10.1.7.9, 10.1.8.1 …\n   A Service gives ONE stable front:   \"web\"  ──load-balances──►  whatever pods match app=web\n```\n\nA Service selects pods by **label** (Module 0's glue) and spreads traffic across all of them,\nwherever they run, however many there are. Callers use the Service's name; they never track pods.\n\n## Service types\n\n| Type | Reachable from | Use for |\n|------|---------------|---------|\n| **ClusterIP** (default) | *Inside* the cluster only | Service-to-service calls (most Services) |\n| **NodePort** | A port on every node's IP | Simple external access, dev/testing |\n| **LoadBalancer** | A cloud load balancer with an external IP | Production external access (on cloud) |\n| **ExternalName** | Maps to an external DNS name | Pointing at an off-cluster service |\n\nMost Services are **ClusterIP** (internal). For real external HTTP traffic you usually use an\n**Ingress** (Module 12) in front of ClusterIP Services, rather than many NodePorts/LoadBalancers.\n\n## A Service manifest\n\n```yaml\napiVersion: v1\nkind: Service\nmetadata:\n  name: web\nspec:\n  selector:\n    app: web                 # send traffic to pods labelled app=web\n  ports:\n  - port: 80                 # the Service's port\n    targetPort: 80           # the pods' containerPort\n  type: ClusterIP\n```\n\n## Service DNS, talk by name\n\nEvery Service gets an in-cluster DNS name. From any pod, you can reach it as:\n\n```\n   web                                 (same namespace)\n   web.default                         (namespace-qualified)\n   web.default.svc.cluster.local       (fully-qualified)\n```\n\nSo an app connects to `http://web` or `web:80`. No IPs, ever. This is exactly the \"talk by name\"\nmodel from Docker Compose, scaled to a cluster. **Service discovery = labels + DNS.**\n\n## Lab: expose a Deployment and load-balance\n\n```bash\n# a deployment of 3 pods that each report their hostname\nkubectl create deployment hello --image=nginxdemos/hello --replicas=3\nkubectl expose deployment hello --port=80        # creates a ClusterIP Service \"hello\"\nkubectl get svc hello                             # its ClusterIP + port\n```\n\nReach it from *inside* the cluster and watch load balancing:\n\n```bash\n# run a throwaway client pod and hit the Service by NAME several times\nkubectl run tester --image=busybox -it --rm --restart=Never -- \\\n  sh -c \"for i in $(seq 1 6); do wget -qO- hello | grep -o 'Server.*'; done\"\n# → responses come from different pod hostnames, the Service is load-balancing\n```\n\nProve DNS resolves the name:\n\n```bash\nkubectl run dnstest --image=busybox -it --rm --restart=Never -- nslookup hello\n# → resolves hello.default.svc.cluster.local to the Service's ClusterIP\n```\n\n## Reaching it from your laptop (local dev)\n\nkind has no cloud load balancer, so use one of:\n\n```bash\nkubectl port-forward svc/hello 8080:80     # simplest: local :8080 → Service\ncurl localhost:8080\n```\n\n(or make the Service `NodePort` and use the node port; on cloud you'd use `LoadBalancer` or an\nIngress.)\n\n## How it works under the hood (brief)\n\n- The Service has a stable virtual IP (**ClusterIP**).\n- **kube-proxy** on each node programs rules so traffic to that IP is spread across the current\n  matching pod IPs.\n- An **EndpointSlice** object tracks which pod IPs currently match the selector, updated live as\n  pods come and go. That's how the Service always points at healthy, current pods.\n\nYou don't manage any of this; you just create the Service.\n\n## Lab: prove the stable-name magic\n\n```bash\n# scale the deployment and confirm the SAME Service name now spans more pods\nkubectl scale deployment hello --replicas=5\nkubectl get endpointslices -l kubernetes.io/service-name=hello   # 5 endpoints now\n# delete a pod; the Service keeps working, endpoints update automatically\nkubectl delete pod -l app=hello --field-selector=status.phase=Running --grace-period=1 | head -1\nkubectl get pods -l app=hello        # replacements appear; Service unaffected\nkubectl delete deployment hello && kubectl delete svc hello\n```"}, {"id": "04-configmaps-secrets", "title": "4 · ConfigMaps & Secrets", "group": "Fundamentals", "md": "*Separate configuration from images, the right way. Concepts + a lab. ~25 min. Needs your kind\ncluster.*\n\n---\n\nThe same image should run in dev, staging, and prod; only the **configuration** differs (database\nURLs, feature flags, credentials). Baking config into the image is wrong (you'd rebuild per\nenvironment, and secrets would leak). Kubernetes injects config at run time via **ConfigMaps** (non\n-secret) and **Secrets** (sensitive).\n\nThis is the direct successor to Docker's `-e` env vars and mounted config files, now as first-class,\nreusable cluster objects.\n\n## ConfigMap, non-secret configuration\n\n```yaml\napiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: app-config\ndata:\n  LOG_LEVEL: \"info\"\n  GREETING: \"hello from config\"\n  app.properties: |            # can hold whole files too\n    timeout=30\n    retries=3\n```\n\n## Secret, sensitive data\n\nSecrets look like ConfigMaps but are for credentials. Create one easily:\n\n```bash\nkubectl create secret generic db-secret \\\n  --from-literal=DB_USER=app \\\n  --from-literal=DB_PASSWORD=s3cret\n```\n\n> **Reality check on \"Secret.\"** By default, Secret values are only **base64-encoded, not\n> encrypted**: anyone with read access can decode them. Treat Secrets as \"handled separately from\n> ConfigMaps,\" and in real clusters add **encryption at rest** (etcd encryption) and tight **RBAC**\n> (Module 7), or use an external secrets manager. Never commit real Secret YAML to git.\n\n## Two ways to consume config: env vars vs files\n\n**As environment variables:**\n\n```yaml\nspec:\n  containers:\n  - name: app\n    image: myapp\n    env:\n    - name: LOG_LEVEL\n      valueFrom:\n        configMapKeyRef: { name: app-config, key: LOG_LEVEL }\n    - name: DB_PASSWORD\n      valueFrom:\n        secretKeyRef: { name: db-secret, key: DB_PASSWORD }\n    envFrom:                       # or pull ALL keys at once\n    - configMapRef: { name: app-config }\n```\n\n**As mounted files (a volume):**\n\n```yaml\n    volumeMounts:\n    - name: cfg\n      mountPath: /etc/config       # each key becomes a file here\n  volumes:\n  - name: cfg\n    configMap: { name: app-config }\n```\n\n- **Env vars**: simplest, great for individual settings. *Note: env vars are set at pod start;\n  changing the ConfigMap does **not** update running env vars; you must restart the pod.*\n- **Mounted files**: better for whole config files, and mounted ConfigMap/Secret values **do**\n  update in the pod over time (with a short delay). Use files for config you want to hot-reload and\n  for TLS certs.\n\n## Lab: inject config both ways\n\n```bash\n# 1. create a ConfigMap and a Secret\nkubectl create configmap app-config --from-literal=GREETING=\"Hi from ConfigMap\" --from-literal=LOG_LEVEL=debug\nkubectl create secret generic app-secret --from-literal=TOKEN=abc123\n\n# 2. run a pod that reads them as env vars\nkubectl run cfgtest --image=busybox --restart=Never --command -- sh -c \"echo GREETING=\\$GREETING TOKEN=\\$TOKEN; sleep 3600\" \\\n  --overrides='\n{ \"spec\": { \"containers\": [ { \"name\":\"cfgtest\",\"image\":\"busybox\",\n    \"command\":[\"sh\",\"-c\",\"echo GREETING=$GREETING TOKEN=$TOKEN LOG=$LOG_LEVEL; sleep 3600\"],\n    \"envFrom\":[{\"configMapRef\":{\"name\":\"app-config\"}}],\n    \"env\":[{\"name\":\"TOKEN\",\"valueFrom\":{\"secretKeyRef\":{\"name\":\"app-secret\",\"key\":\"TOKEN\"}}}] } ] } }'\nkubectl logs cfgtest          # → GREETING=Hi from ConfigMap TOKEN=abc123 LOG=debug\nkubectl delete pod cfgtest\n```\n\nInspect and decode:\n\n```bash\nkubectl get configmap app-config -o yaml\nkubectl get secret app-secret -o jsonpath='{.data.TOKEN}' | base64 -d ; echo   # decodes to abc123\n```\n\nThat last command demonstrates the base64 point: Secrets are encoded, not encrypted.\n\n### Experiment: mounted file that updates\n\nMount the ConfigMap as files, then edit the ConfigMap (`kubectl edit configmap app-config`) and watch\n`/etc/config/GREETING` inside the pod change after a delay, something env vars won't do.\n\n## Practitioner rules\n\n- **Config out of images**: one image, many environments, config injected per environment.\n- **Secrets ≠ ConfigMaps**: different object, tighter RBAC, encryption at rest, never in git.\n- **Prefer files for things that rotate** (certs, config you hot-reload); env for simple flags.\n- **Changed a ConfigMap used as env vars?** Restart the Deployment (`kubectl rollout restart`) to\n  pick it up."}, {"id": "05-storage-volumes-statefulsets", "title": "5 · Storage & StatefulSets", "group": "Fundamentals", "md": "*Where persistent data lives in a world of disposable pods. Concepts + a lab. ~30 min. Needs your\nkind cluster.*\n\n---\n\nPods are ephemeral: delete one and its container filesystem is gone (same lesson as Docker). For\ndatabases and any data that must **survive** pod restarts and rescheduling, Kubernetes has a storage\nsystem: **PersistentVolumes**, **PersistentVolumeClaims**, and **StorageClasses**, plus\n**StatefulSets** for stateful apps.\n\n## The core idea: claims, not disks\n\nKubernetes separates \"**I need storage**\" from \"**here is the actual disk**,\" so app authors don't\nworry about infrastructure:\n\n- **PersistentVolume (PV)**: a piece of *actual* storage in the cluster (a cloud disk, an NFS share,\n  a local path). Usually provisioned automatically.\n- **PersistentVolumeClaim (PVC)**: a *request* for storage (\"I need 5Gi, read-write\"). A pod mounts\n  the **claim**, not a specific disk.\n- **StorageClass**: a *template* describing **how** to provision storage on demand (which disk type,\n  parameters). This enables **dynamic provisioning**: create a PVC and a matching PV is created for\n  you automatically.\n\n```\n   Pod  ──mounts──►  PVC (a request)  ──bound to──►  PV (real storage)\n                         ▲                                ▲\n                         └── StorageClass dynamically provisions the PV on demand\n```\n\nYou mostly write **PVCs**; the StorageClass and PV are handled for you (kind ships a default\nStorageClass).\n\n## A PVC and a pod that uses it\n\n```yaml\napiVersion: v1\nkind: PersistentVolumeClaim\nmetadata:\n  name: data\nspec:\n  accessModes: [\"ReadWriteOnce\"]      # one node mounts it read-write\n  resources:\n    requests:\n      storage: 1Gi\n---\napiVersion: v1\nkind: Pod\nmetadata:\n  name: writer\nspec:\n  containers:\n  - name: app\n    image: busybox\n    command: [\"sh\",\"-c\",\"echo persisted > /data/note.txt && sleep 3600\"]\n    volumeMounts:\n    - name: vol\n      mountPath: /data\n  volumes:\n  - name: vol\n    persistentVolumeClaim:\n      claimName: data\n```\n\n**Access modes** to know: `ReadWriteOnce` (one node RW; most block storage), `ReadOnlyMany`,\n`ReadWriteMany` (many nodes RW; needs shared storage like NFS).\n\n## Lab: prove persistence across pod deletion\n\n```bash\nkubectl apply -f pvc-and-writer.yaml       # the manifests above\nkubectl get pvc                            # 'data' Bound to an auto-provisioned PV\nkubectl exec writer -- cat /data/note.txt  # → persisted\n\n# delete the pod, recreate it, data is still there\nkubectl delete pod writer\nkubectl apply -f pvc-and-writer.yaml       # recreate just the pod (PVC stays)\nkubectl exec writer -- cat /data/note.txt  # → persisted   (survived!)\nkubectl delete pod writer; kubectl delete pvc data\n```\n\nThe data lived in the PV (via the PVC), not the pod, so it outlived the pod.\n\n## StatefulSets, for stateful apps\n\nA Deployment's pods are interchangeable and share nothing. But a database cluster needs each replica\nto have a **stable identity** and its **own persistent storage**. That's a **StatefulSet**:\n\n- **Stable network identity**: pods are named predictably: `db-0`, `db-1`, `db-2` (not random).\n- **Stable per-pod storage**: each replica gets its **own** PVC (`data-db-0`, `data-db-1`…) that\n  sticks with that identity across restarts.\n- **Ordered, graceful** rollout/scaling: pods start/stop in order (0,1,2…), which databases often\n  require.\n\n```yaml\napiVersion: apps/v1\nkind: StatefulSet\nmetadata: { name: db }\nspec:\n  serviceName: db                 # a headless Service for stable DNS per pod\n  replicas: 3\n  selector: { matchLabels: { app: db } }\n  template:\n    metadata: { labels: { app: db } }\n    spec:\n      containers:\n      - name: db\n        image: postgres:16\n        env: [{ name: POSTGRES_PASSWORD, value: secret }]\n        volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]\n  volumeClaimTemplates:           # each pod gets its OWN PVC from this template\n  - metadata: { name: data }\n    spec:\n      accessModes: [\"ReadWriteOnce\"]\n      resources: { requests: { storage: 1Gi } }\n```\n\n`volumeClaimTemplates` is the magic: the StatefulSet creates a dedicated PVC per pod automatically.\n\n## Lab: watch stable identities\n\n```bash\nkubectl apply -f statefulset.yaml\nkubectl get pods -l app=db -w         # db-0, then db-1, then db-2, in order (Ctrl-C to stop)\nkubectl get pvc                        # data-db-0, data-db-1, data-db-2, one each\nkubectl delete pod db-1                # it comes back as db-1 with the SAME PVC\nkubectl get pvc                        # data-db-1 still there, re-attached\nkubectl delete statefulset db          # note: PVCs are retained by default (data is precious)\nkubectl get pvc                        # still there, delete manually if you truly want them gone\n```\n\nNotice deleting the StatefulSet **keeps the PVCs**: Kubernetes protects data by default.\n\n## When to use what\n\n- **Deployment**: stateless apps (web servers, APIs). Pods are cattle.\n- **StatefulSet**: databases, queues, anything needing stable identity + own storage.\n- **emptyDir volume** (not shown): scratch space that lives only as long as the pod (caches, temp)."}, {"id": "06-health-resources", "title": "6 · Health checks & resources", "group": "Production & security", "md": "*Production essentials: teach Kubernetes when a pod is healthy and how much it may consume. Concepts\n+ a lab. ~30 min. Needs your kind cluster.*\n\n---\n\nTwo things separate a toy deployment from a production-ready one: **probes** (so Kubernetes knows\nwhether your app is actually working) and **resource requests/limits** (so the scheduler places pods\nwell and no pod starves the node). These are heavily tested on the CKA/CKAD, and they're daily\npractitioner work.\n\n## Probes, is the app really OK?\n\nA container can be \"running\" while the app inside is broken. **Probes** let the kubelet test the app\nand act. Three kinds:\n\n| Probe | Question | If it fails |\n|-------|----------|-------------|\n| **liveness** | \"Is the app alive, or wedged?\" | Kubernetes **restarts** the container |\n| **readiness** | \"Is the app ready to serve traffic *right now*?\" | Pod is removed from Service endpoints (no traffic) until it passes |\n| **startup** | \"Has a slow-starting app finished booting?\" | Delays liveness/readiness until it passes (protects slow starters) |\n\nThe distinction that trips everyone up: **liveness restarts; readiness gates traffic.** A pod that's\nalive but still warming up should be *ready=false* (no traffic) but *live=true* (don't restart it).\n\n## Probe definition\n\n```yaml\nspec:\n  containers:\n  - name: app\n    image: myapp\n    readinessProbe:\n      httpGet: { path: /healthz, port: 8080 }\n      initialDelaySeconds: 5\n      periodSeconds: 10\n    livenessProbe:\n      httpGet: { path: /healthz, port: 8080 }\n      periodSeconds: 10\n      failureThreshold: 3\n    startupProbe:\n      httpGet: { path: /healthz, port: 8080 }\n      failureThreshold: 30\n      periodSeconds: 2          # allow up to 60s to start before liveness kicks in\n```\n\nProbe mechanisms: `httpGet` (2xx/3xx = pass), `tcpSocket` (port open = pass), `exec` (command exit 0\n= pass). This is the direct evolution of Docker's `HEALTHCHECK`, now with the readiness concept that\nenables zero-downtime rollouts (Module 2).\n\n## Resource requests & limits\n\nEvery container should declare:\n\n- **requests**: the amount of CPU/memory it *needs*. The **scheduler** uses requests to decide which\n  node has room. Guaranteed to the pod.\n- **limits**: the *maximum* it may use. Exceed the **memory** limit → the container is **OOM-killed**\n  (137). Exceed the **CPU** limit → it's **throttled** (slowed), not killed.\n\n```yaml\n    resources:\n      requests:\n        cpu: \"100m\"           # 0.1 CPU core\n        memory: \"128Mi\"\n      limits:\n        cpu: \"500m\"           # 0.5 core max\n        memory: \"256Mi\"\n```\n\n`m` = millicores (1000m = 1 CPU). Memory in `Mi`/`Gi`.\n\n## QoS classes (consequence of your requests/limits)\n\nKubernetes assigns each pod a **Quality of Service** class, which decides who gets evicted first when\na node runs low:\n\n- **Guaranteed**: requests == limits for all resources. Last to be evicted.\n- **Burstable**: has requests < limits. Evicted after BestEffort.\n- **BestEffort**: no requests/limits set. **Evicted first.** (Never run important workloads\n  BestEffort.)\n\nSetting sensible requests/limits is thus both a scheduling and a reliability decision.\n\n## Lab: probes and limits in action\n\n```bash\n# 1. a deployment with a readiness probe that fails at first\ncat <<'EOF' | kubectl apply -f -\napiVersion: apps/v1\nkind: Deployment\nmetadata: { name: probed }\nspec:\n  replicas: 1\n  selector: { matchLabels: { app: probed } }\n  template:\n    metadata: { labels: { app: probed } }\n    spec:\n      containers:\n      - name: app\n        image: nginx:1.27\n        readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 3, periodSeconds: 3 }\n        resources:\n          requests: { cpu: \"50m\", memory: \"64Mi\" }\n          limits:   { cpu: \"200m\", memory: \"128Mi\" }\nEOF\nkubectl get pod -l app=probed -w      # READY goes 0/1 → 1/1 once the probe passes (Ctrl-C)\n```\n\nWatch a memory limit enforce itself:\n\n```bash\nkubectl run hog --image=polinux/stress --restart=Never --limits=memory=64Mi -- \\\n  stress --vm 1 --vm-bytes 150M --vm-hang 1\nkubectl get pod hog -w                 # OOMKilled, the limit stopped it (Ctrl-C)\nkubectl delete pod hog\nkubectl describe pod hog 2>/dev/null | grep -i oom || true\nkubectl delete deploy probed\n```\n\n### Experiment: liveness restart\n\nAdd a liveness probe hitting a path that returns 500, and watch `kubectl get pod` show the\nRESTARTS counter climb as Kubernetes restarts the \"wedged\" container, while a readiness-only failure\nwould just remove it from Service traffic without restarting.\n\n## Practitioner rules\n\n- **Always set readiness probes**: they make rollouts safe (bad pods never receive traffic) and are\n  why a broken deploy doesn't cause an outage.\n- **Set liveness probes carefully**: too aggressive and you restart healthy-but-busy pods. Point\n  them at a cheap health endpoint.\n- **Always set requests** (for scheduling) and **memory limits** (to contain leaks). Be cautious with\n  CPU limits (throttling can hurt latency).\n- **Never run production pods BestEffort.**"}, {"id": "20-scheduling-disruptions", "title": "6b · Scheduling & disruptions", "group": "Production & security", "md": "*Where pods land, which pods die first, and how to make node maintenance boring. ~12 min read.*\n\n---\n\nModule 6 taught requests and limits: *how much* a pod needs. This module is the other half of the\nscheduler's job: *where* pods may run, what happens when nodes drain, and the objects that decide\nwhich pods survive pressure. It's the difference between a cluster that tolerates a node upgrade\nand one where every upgrade is an incident.\n\n## Steering pods: selectors, affinity, taints\n\nThree mechanisms, in increasing sophistication, and note the direction of each:\n\n**nodeSelector**: the blunt instrument. Pod says: only nodes with this label.\n\n```yaml\nspec:\n  nodeSelector: { disktype: ssd }\n```\n\n**Affinity**: the expressive version. Pod says: I *require* (or merely *prefer*) nodes matching\nthese rules, including rules about *other pods*:\n\n```yaml\naffinity:\n  podAntiAffinity:                      # spread MY replicas away from each other\n    requiredDuringSchedulingIgnoredDuringExecution:\n    - labelSelector: { matchLabels: { app: api } }\n      topologyKey: kubernetes.io/hostname\n```\n\nThat anti-affinity example is the one that matters in production: without it, nothing stops all 3\nreplicas of your API landing on one node, a \"highly available\" deployment with a single point of\nfailure. (`topologySpreadConstraints` is the modern, gentler way to say \"spread evenly across\nnodes/zones\"; reach for it when strict anti-affinity is too rigid to schedule.)\n\n**Taints & tolerations**: the reverse direction. Pods *ask for* nodes with selectors/affinity;\n**nodes repel** pods with taints, and only pods carrying a matching toleration may land:\n\n```bash\nkubectl taint nodes gpu-node-1 gpu=true:NoSchedule\n```\n\n```yaml\ntolerations:\n- { key: gpu, operator: Equal, value: \"true\", effect: NoSchedule }\n```\n\nSelector = pod chooses node. Taint = node refuses pods. Reserving expensive hardware needs *both*:\nthe taint keeps everyone else off; the selector makes GPU pods actually go there. Taints are also\nhow Kubernetes itself works: a `NotReady` node gets tainted automatically, which is what evicts\npods from a dead node.\n\n## Priority: who dies first\n\nWhen a cluster runs out of room, the scheduler can **preempt**: evict lower-priority pods to\nmake space for higher-priority ones. A **PriorityClass** is a named number:\n\n```yaml\napiVersion: scheduling.k8s.io/v1\nkind: PriorityClass\nmetadata: { name: critical-service }\nvalue: 100000\n```\n\nReference it with `priorityClassName` in the pod spec. Two rules that hold up in practice: define a *small* set\n(critical / normal / batch, three is plenty), because a proliferation of priorities is an\nun-debuggable pecking order; and give batch work a *low* priority explicitly, so the 2 a.m.\nreport job is what dies when the API needs room, not the other way round. Combined with module\n6's QoS classes, this is the full answer to \"under pressure, who goes first?\": priority decides\npreemption; QoS breaks ties at the node's OOM level.\n\n## PodDisruptionBudgets: surviving voluntary disruption\n\nNode maintenance, cluster upgrades, autoscaler scale-down: all of these **drain** nodes, evicting\npods on purpose. A **PodDisruptionBudget** (PDB) is your service's floor during such *voluntary*\ndisruptions:\n\n```yaml\napiVersion: policy/v1\nkind: PodDisruptionBudget\nmetadata: { name: api-pdb }\nspec:\n  minAvailable: 2\n  selector: { matchLabels: { app: api } }\n```\n\nWith 3 replicas and `minAvailable: 2`, a drain evicts one pod, waits for its replacement to become\nReady elsewhere, then continues; an upgrade rolls through the cluster without ever dropping you\nbelow quorum. Two sharp edges: a PDB does **nothing** for *involuntary* disruption (a node\ncatching fire consults no budgets; that's what anti-affinity and replicas are for), and an\nimpossible budget (`minAvailable: 3` with 3 replicas) blocks drains *forever*, which is how \"the\nupgrade is stuck at node 4\" tickets are born. Every service with more than one replica should\nhave a PDB; every PDB must leave the drain some room to work.\n\n## Admission: the cluster's rule book\n\nOne more gate runs before any of the above: **admission controllers** intercept every write to\nthe API server and can mutate or reject it. This is where cluster-wide policy lives: \"every\nnamespace gets default resource limits\" (`LimitRange`, mutating), \"no images from unknown\nregistries\", \"every pod must have a PDB\" (policy engines like Kyverno/Gatekeeper, validating).\nPod Security Admission (module 7's `restricted` profile) is exactly this mechanism. When a\nperfectly valid manifest bounces with a policy error, you're not fighting the scheduler; you're\nmeeting the rule book. `kubectl get validatingwebhookconfigurations` shows who wrote it.\n\n## The maintenance-day test\n\nPut it together: replicas spread by **anti-affinity**, floors held by **PDBs**, sacrifice order\ndeclared by **PriorityClass**, hardware reserved by **taints**, and the rules enforced by\n**admission**. The test of all five is one command on a busy afternoon:\n\n```bash\nkubectl
